plugins { id 'com.android.application' }

android {
    namespace 'com.kingplus.social'
    compileSdk 35
    defaultConfig { applicationId 'com.kingplus.social'; minSdk 24; targetSdk 35; versionCode 32; versionName '2.7.2' }
    signingConfigs {
        debug {
            storeFile file('kingplus-ci-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { signingConfig signingConfigs.debug; buildConfigField 'boolean', 'FREE_TEST_MODE', 'true' }
        release { buildConfigField 'boolean', 'FREE_TEST_MODE', 'false' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}

// Apply only when the Firebase config file is present. This keeps the source project buildable before credentials are added.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
