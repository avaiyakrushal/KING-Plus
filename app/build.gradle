plugins { id 'com.android.application' }

android {
    namespace 'com.kingplus.social'
    compileSdk 35

    signingConfigs {
        debug {
            // Stable CI debug key so Firebase/Google SHA-1 does not change on every GitHub build.
            storeFile file('kingplus-ci-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig { applicationId 'com.kingplus.social'; minSdk 24; targetSdk 35; versionCode 29; versionName '2.5.4' }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    // Firebase Phone Auth calls the four-argument ContextCompat.registerReceiver.
    // Declare Core explicitly so an old transitive version cannot cause NoSuchMethodError.
    implementation 'androidx.core:core:1.15.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
