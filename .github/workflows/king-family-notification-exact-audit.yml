name: KING Family and Push Exact Code Audit
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-family-notification-exact-audit.yml'
      - 'ci/final_five/audit_notification_family_exact.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - name: Restore full staged project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/kingfeature /tmp/kingfeaturezip
          gh run download 38130689781 -n KING-Plus-Integrated-Five-Sections-In-Progress-Source -D /tmp/kingfeaturezip
          unzip -q /tmp/kingfeaturezip/KING-Plus-Five-Sections-IN-PROGRESS-source.zip -d /tmp/kingfeature
      - name: Show actual code for compatibility work
        run: python3 ci/final_five/audit_notification_family_exact.py
