name: KING v9.9.58 Verified Werewolf Spy Draw Live Party Gameplay TEST
on:
  push:
    branches: [work/king-social-live-rounds-v9958]
    paths: ['tools/social-live-v9958/**','.github/workflows/king-social-live-party-v9958.yml']
  pull_request:
    paths: ['tools/social-live-v9958/**','.github/workflows/king-social-live-party-v9958.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  compile-and-verify-real-party:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore complete signed v9.9.57 Party Voice Games and Gifts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9958prev /tmp/king9958
          gh run download 38361594710 -n KING-v9957-Real-Voice-Rejoin-TEST-APK-and-Source -D /tmp/king9958prev
          test -s /tmp/king9958prev/KING-Plus-v9.9.57-Party-Voice-Rejoin-TEST.apk
          unzip -q /tmp/king9958prev/KING-Plus-v9.9.57-Party-Voice-Rejoin-Source.zip -d /tmp/king9958
          grep -q 'versionCode 236' /tmp/king9958/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9958/app/kingplus-ci-debug.keystore
      - name: Atomically start Werewolf Spy Draw from current Party Ready and Members
        run: |
          set -euo pipefail
          python3 tools/social-live-v9958/apply.py /tmp/king9958
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9958')
          src=root/'app/src/main/java/com/kingplus/social'
          social=(src/'RoomGameActivity.java').read_text()
          start=social[social.index('    private void startSocialRound866('):social.index('    private void startRound(String game){')]
          assert 'Source.SERVER' in start
          assert 'db.runTransaction(tx->' in start
          assert 'KingPartySocialRoster9958.isLive' in start
          assert 'game_ready").document(uid9958)' in start
          assert 'members").document(uid9958)' in start
          assert start.index('members").document(uid9958)')<start.index('tx.set(state(),st9958)')
          assert 'tx.set(room().collection("room_invites")' in start
          assert 'participantUids' in start
          assert 'Another Party game started' in start
          party=(src/'PartyActivity.java').read_text()
          assert 'KingPartyVoiceReconnect9957' in party
          assert 'KingPartyMicConsent9956' in party
          assert 'KingGiftReceiptRetry9955' in party
          assert 'KingRoomSettleRetry9954' in social
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          assert 'versionCode 237' in (root/'app/build.gradle').read_text()
          print('PASS real Party social start uses SERVER verified players, atomic roles and round; Games/Gifts/Voice retained')
          PY
      - name: Verify real Werewolf Spy Draw participant size, duplicate and ghost rejection
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9958classes
          javac -d /tmp/king9958classes \
            /tmp/king9958/app/src/main/java/com/kingplus/social/KingPartySocialRoster9958.java \
            tools/social-live-v9958/KingPartySocialRoster9958Test.java
          java -cp /tmp/king9958classes com.kingplus.social.KingPartySocialRoster9958Test
      - name: Install Firestore emulator test dependencies
        working-directory: /tmp/king9958/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Verify four-user Werewolf roles, ghost Ready and conflicting Host
        working-directory: /tmp/king9958
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-live-v9958/social-party-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/social-party-firestore.test.mjs"
      - name: Keep four-account real Party Mic owner consent security intact
        working-directory: /tmp/king9958
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/mic-consent-v9956/mic-consent-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-mic-consent-9958 --config firebase-emulator.json \
            "node tests/firestore/mic-consent-firestore.test.mjs"
      - name: Verify ghost Ready excluded and real-player RPS still playable
        working-directory: /tmp/king9958
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/real-game-roster-v9952/live-roster-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-live-roster-9958 --config firebase-emulator.json \
            "node tests/firestore/live-roster-firestore.test.mjs"
      - name: Confirm real multiplayer Party/Host Cancel unchanged
        working-directory: /tmp/king9958
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-frozen-roster-9946 --config firebase-emulator.json \
            "node tests/firestore/frozen-ready-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-immutable-games-9943 --config firebase-emulator.json \
            "node tests/firestore/immutable-rounds-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-cancel-9947 --config firebase-emulator.json \
            "node tests/firestore/cancel-round-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-9938-live --config firebase-emulator.json \
            "node tests/firestore/room-game-gift.test.mjs"
      - name: Test recipient-only Gift receipt persistence and anti-impersonation
        working-directory: /tmp/king9958
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-gift-receipts-9941 --config firebase-emulator.json \
            "node tests/firestore/gift-delivery-firestore.test.mjs"
      - name: Compile full Android app
        working-directory: /tmp/king9958
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify signed upgrade identity and exact version
        run: |
          set -euo pipefail
          old=/tmp/king9958prev/KING-Plus-v9.9.57-Party-Voice-Rejoin-TEST.apk
          new=/tmp/king9958/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='236'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='237'"
          "$signer" verify --print-certs "$old" >/tmp/oldcert
          "$signer" verify --print-certs "$new" >/tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package signed TEST APK and complete Android source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9958out
          cp /tmp/king9958/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9958out/KING-Plus-v9.9.58-Real-Social-Games-TEST.apk
          rm -f /tmp/king9958/app/kingplus-ci-debug.keystore
          cd /tmp/king9958
          zip -q -r /tmp/king9958out/KING-Plus-v9.9.58-Real-Social-Games-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
            './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9958out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9958-Real-Social-Games-TEST-APK-and-Source
          path: /tmp/king9958out/*
          retention-days: 14
          if-no-files-found: error
