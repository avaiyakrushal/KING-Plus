          assert 'generation9996!=roomListenerGeneration982' in party
          print("PASS v9.9.96 Me Gallery paging, issued Home IDs, old Party music disposal")
          PY
      - name: Shared Follow and Fan Club transaction policy Java test
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10002-follow-tests
          javac -d /tmp/king10002-follow-tests /tmp/king10002/app/src/main/java/com/kingplus/social/KingFollowPolicy9997.java tools/me-home-party-v9997/KingFollowPolicy9997Test.java
          java -cp /tmp/king10002-follow-tests com.kingplus.social.KingFollowPolicy9997Test
      - name: Two-phone cross-account Follow Firestore acceptance
        working-directory: /tmp/king10002
        env: {CI: 'true'}
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v9997/follow-sync-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-follow-9997 --config firebase-emulator.json "node tests/firestore/follow-sync-firestore.test.mjs"
      - name: Me Home Party follow integration assertions
        working-directory: /tmp/king10002
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/kingplus/social")
          home=(root/"CommunityHubActivity.java").read_text()
          party=(root/"PartyActivity.java").read_text()
          helper=(root/"KingFollowLive9997.java").read_text()
          me=(root/"MainActivity.java").read_text()
          assert "KingFollowLive9997.toggle(db,me,uid,displayName" in home
          assert "KingFollowLive9997.toggle(db,user,ownerUid,safeName()" in party
          assert "KingFollowLive9997.toggle(db,user,uid,safeName()" in party
          assert "KingFollowLive9997.ensureFollowing(db,user,uid,safeName()" in party
          assert "followListener9997[0].remove()" in party
          assert "db.runTransaction(tx->" in helper
          assert "tx.delete(ref)" in helper and "tx.set(ref,record)" in helper
          assert "startProfileFollowUpdates965(uid)" in me
          print("PASS live Follow shared across Home, Me counters, profile and Party Fan Club")
          PY
      - name: Fan Club with 121 members, exact membership and count test
        working-directory: /tmp/king10002
        env: {CI: 'true'}
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v9998/fanclub-over-100-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-fanclub-9998 --config firebase-emulator.json "node tests/firestore/fanclub-over-100-firestore.test.mjs"
      - name: Me Home Public Profile Party functional regression gates
        working-directory: /tmp/king10002
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/kingplus/social')
          main=(root/'MainActivity.java').read_text()
          profile=(root/'KingPublicProfileActivity.java').read_text()
          party=(root/'PartyActivity.java').read_text()
          assert 'shareMyIssuedKingId9998' in main
          assert 'KingPublicId9996.verified(p.getString("publicId"))' in main
          assert 'KingFollowLive9997.toggle(db,me,target,displayName()' in profile
          assert 'KING ID  "+(issued9998==null?"Not issued":issued9998)' in profile
          assert 'This profile has no issued KING ID' in profile
          assert 'final String relation=KingFollowPolicy9997.key(account,hostUid)' in party
          assert 'fans.count().get(com.google.firebase.firestore.AggregateSource.SERVER)' in party
          assert 'total>100?' in party
          print('PASS v9.9.98 account ID, transaction Follow, 100+ Fan Club')
          PY
      - name: Real Party Room Vote (all live members, no forgery, no stale rounds)
        working-directory: /tmp/king10002
        env: {CI: 'true'}
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v9999/party-room-vote-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-room-vote-9999 --config firebase-emulator.json "node tests/firestore/party-room-vote-firestore.test.mjs"
      - name: Existing Werewolf and Spy game voting security regression
        working-directory: /tmp/king10002
        env: {CI: 'true'}
        run: |
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-vote-integrity-9964 --config firebase-emulator.json "node tests/firestore/social-vote-security-firestore.test.mjs"
      - name: No generated account IDs or dummy Me profiles
        working-directory: /tmp/king10002
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path('app/src/main/java/com/kingplus/social')
          p=(d/'PartyActivity.java').read_text()
          m=(d/'MainActivity.java').read_text()
          h=(d/'KingParityHubActivity.java').read_text()
          assert 'm.put("publicId",publicId(user.getUid()))' not in p
          assert 'KingPublicId9996.verified(profile.getString("publicId"))' in p
          assert 'x.put("participantUids",new ArrayList<String>())' in p
          assert 'String id=KingPublicId9996.verified(profile.getString("publicId"))' in p
          assert 'Math.abs(who.hashCode()%900000+100000)' not in m
          assert 'safe(p.getString("publicId"),publicId(uid))' not in h
          assert 'safe(d.getString("publicId"),publicId(uid))' not in h
          print('PASS No fake IDs, no local Follow for unverified seats, real room member vote')
          PY
      - name: Live Me and Home Moments source acceptance
        working-directory: /tmp/king10002
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path('app/src/main/java/com/kingplus/social')
          home=(d/'CommunityHubActivity.java').read_text()
          me=(d/'MainActivity.java').read_text()
          assert 'momentsQueryLimit10000=80' in home
          assert 'momentsDisplayLimit10000=40' in home
          assert 'Search older Moments' in home and 'Show more Moments' in home
          assert 'momentsQueryLimit10000=Math.min(320,momentsQueryLimit10000+80)' in home
          assert 'momentLikes10000.add(' in home and 'stopMomentLikes10000();' in home
          assert 'addSnapshotListener((liked,error)' in home
          assert 'getBytes(10L*1024*1024)' in home and 'getBytes(10L*1024*1024)' in me
          assert 'versionCode 281;' in Path('app/build.gradle').read_text()
          print('PASS v10.0.0 live Likes, older Moments pagination and complete photo rendering sizes')
          PY
      - name: 125 Moments and two-phone realtime Like Firestore acceptance
        working-directory: /tmp/king10002
        env: {CI: 'true'}
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10000/moments-cross-device-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-moments-v10000 --config firebase-emulator.json "node tests/firestore/moments-cross-device-firestore.test.mjs"
      - name: v10.0.1 Me Home Party source regression checks
        working-directory: /tmp/king10002
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          a=Path('app/src/main/java/com/kingplus/social')
          me=(a/'MainActivity.java').read_text()
          home=(a/'CommunityHubActivity.java').read_text()
          party=(a/'PartyActivity.java').read_text()
          assert 'autoPreview10001=images++<6' in me
          assert 'if(autoPreview10001)loadPhoto10001.run();' in me
          assert 'Tap to load this photo' in me
          assert 'autoMomentPhotos10001=3' in home
          assert 'if(loadAutomatically10001)load.run()' in home
          assert 'photoLoading10001[0]' in home
          assert 'currentVoteRoom10001(expectedRoom10001,expectedUid10001,binding10001)' in party
          assert 'liveRoom10001.collection("game_votes").document(expectedUid10001).set(vote)' in party
          assert 'versionCode 281;' in Path('app/build.gradle').read_text()
          print('PASS all-photo Me Gallery, bounded Home photo load, room-bound vote callback guards')
          PYTEST
      - name: v10.0.2 issued Me ID Home and Room Vote correctness
        working-directory: /tmp/king10002
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          p=Path("app/src/main/java/com/kingplus/social")
          me=(p/"MainActivity.java").read_text()
          home=(p/"CommunityHubActivity.java").read_text()
          party=(p/"PartyActivity.java").read_text()
          assert 'loadVerifiedMeId10002(id,"profile",equippedFrame730)' in me
          assert 'loadVerifiedMeId10002(verifiedAboutId10002,"profile_about",null)' in me
          assert 'String verifiedRecommendedId10002=KingPublicId9996.verified(d.getString("publicId"))' in me
          assert 'shareMyIssuedKingId9998();' in me
          assert 'topicGeneration10002=searchGeneration9994' in home
          assert 'body!=topicHost10002||searchGeneration9994!=topicGeneration10002' in home
          assert 'final String startedInRoom10002=roomId;' in party
          assert 'final DocumentReference resultsRef10002=db.collection("live_rooms").document(resultsRoom10002);' in party
          assert 'latestRound10002==null||latestRound10002!=round' in party
          assert 'versionCode 281;' in Path('app/build.gradle').read_text()
          print("PASS v10.0.2 verified Me ID, Home async lifecycle, room + round voting guards")
          PYTEST
      - name: Full Android compile and APK
        working-directory: /tmp/king10002
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package version and same APK signer
        run: |
          set -euo pipefail
          old=/tmp/king10002prev/KING-Plus-v10.0.1-Me-Home-Party-TEST.apk
          new=/tmp/king10002/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='281'"
          "$signer" verify --print-certs "$old" > /tmp/old9993cert
          "$signer" verify --print-certs "$new" > /tmp/new9993cert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/old9993cert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/new9993cert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package updated APK and full source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10002out /tmp/king10002/tools/me-home-party-v10002
          cp tools/me-home-party-v10002/* /tmp/king10002/tools/me-home-party-v10002/
          cp .github/workflows/king-me-home-party-v10002.yml /tmp/king10002/.github/workflows/
          cp /tmp/king10002/app/build/outputs/apk/debug/app-debug.apk /tmp/king10002out/KING-Plus-v10.0.2-Me-Home-Party-TEST.apk
