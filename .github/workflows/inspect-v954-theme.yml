name: Inspect KING Plus v9.5.4 theme targets

on:
  push:
    branches: ['build/v9.5.3-parity-batch4']
    paths: ['.github/workflows/inspect-v954-theme.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v9.5.3-parity-batch4
      - name: Recover and apply current parity source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/base /tmp/src
          mkdir -p /tmp/base /tmp/src
          gh run download 37708708041 -n KING-Plus-v9.5.0-parity-batch1-source -D /tmp/base
          unzip -q /tmp/base/KING-Plus-v9.5.0-parity-batch1-source.zip -d /tmp/src
          python3 ci/v951/patch_v951.py /tmp/src
          python3 ci/v952/patch_v952.py /tmp/src
          python3 ci/v953/patch_v953.py /tmp/src
      - name: Print theme and room detail methods
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java')
          t=p.read_text(errors='ignore')
          names=['renderParty','themeBackground','atmospherePanel','roomSettingsPanel','partyDataPanel','renderLobby']
          def method(name):
              starts=[]
              for sig in ['private void '+name+'(','private int '+name+'(','private View '+name+'(']:
                  k=t.find(sig)
                  if k>=0:starts.append(k)
              if not starts:return None
              s=min(starts);b=t.find('{',s);depth=0;state='code';quote='';esc=False;i=b
              while i<len(t):
                  ch=t[i];nx=t[i+1] if i+1<len(t) else ''
                  if state=='str':
                      if esc:esc=False
                      elif ch=='\\':esc=True
                      elif ch==quote:state='code'
                  elif state=='line':
                      if ch=='\n':state='code'
                  elif state=='block':
                      if ch=='*' and nx=='/':state='code';i+=1
                  else:
                      if ch=='/' and nx=='/':state='line';i+=1
                      elif ch=='/' and nx=='*':state='block';i+=1
                      elif ch in ('"',"'"):state='str';quote=ch
                      elif ch=='{':depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:return t[s:i+1]
                  i+=1
              return t[s:]
          for n in names:
              print('\n===== METHOD '+n+' =====')
              print((method(n) or 'NOT FOUND')[:40000])
          PY
