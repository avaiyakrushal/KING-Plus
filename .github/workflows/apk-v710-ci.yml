name: Build KING Plus v7.1.0 Native Engine APK

on:
  push:
    branches: [ 'build/v7.1.0-native-engine' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare proven v5.3.2 base
        run: bash tools/build_v530.sh

      - name: Apply v5.7.0 patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v570/patch.part00a ci/v570/patch.part00b ci/v570/patch.part00c ci/v570/patch.part01 \
            | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/v570.patch
          patch -p1 < /tmp/v570.patch
          rm -rf app/build

      - name: Apply v6.0.0 patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v600/patch.part00 ci/v600/patch.part01 ci/v600/patch.part02 \
            | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/v600.patch
          patch -p1 < /tmp/v600.patch
          rm -rf app/build

      - name: Apply v6.1.0 patch
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < ci/v610/patch.b64 | base64 -d | gzip -dc > /tmp/v610.patch
          patch -p1 < /tmp/v610.patch
          rm -rf app/build

      - name: Apply v6.2.0 patch
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < ci/v620/patch.b64 | base64 -d | gzip -dc > /tmp/v620.patch
          patch -p1 < /tmp/v620.patch
          rm -rf app/build

      - name: Apply v7.0.0 full social patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v700/patch.part00 ci/v700/patch.part01 ci/v700/patch.part02 ci/v700/patch.part03 \
              ci/v700/patch.part04 ci/v700/patch.part05 ci/v700/patch.part06 ci/v700/patch.part07 \
            | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/v700.patch
          patch -p1 < /tmp/v700.patch
          grep -q "versionName '7.0.0'" app/build.gradle
          rm -rf app/build

      - name: Apply v7.1.0 native engine + assets patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v710/patch.part00 ci/v710/patch.part01 | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/v710.patch
          patch -p1 < /tmp/v710.patch
          grep -q "versionName '7.1.0'" app/build.gradle
          grep -q "versionCode 101" app/build.gradle
          grep -q "jitsi-meet-sdk:13.1.1" app/build.gradle
          grep -q "jitsi-maven-repository" settings.gradle
          test -f app/src/main/java/com/kingplus/social/NativeMeetBridge.java
          test -f app/src/main/java/com/kingplus/social/KingSoundFx.java
          test -f app/src/main/java/com/kingplus/social/AssetPackActivity.java
          grep -q 'showMemory' app/src/main/java/com/kingplus/social/GamePlayActivity.java
          grep -q 'showReactionTap' app/src/main/java/com/kingplus/social/GamePlayActivity.java
          grep -q 'showHighLow' app/src/main/java/com/kingplus/social/GamePlayActivity.java
          grep -q 'showWheel' app/src/main/java/com/kingplus/social/GamePlayActivity.java
          rm -rf app/build

      - name: Generate original KING Plus sound pack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import math, wave, struct
          raw=Path('app/src/main/res/raw'); raw.mkdir(parents=True,exist_ok=True)
          def make(name,freqs):
              rate=22050; dur=.36; data=[]
              for i in range(int(rate*dur)):
                  t=i/rate; a=sum(math.sin(2*math.pi*f*t) for f in freqs)/len(freqs)
                  fade=max(0,min(1,t/.03,(dur-t)/.08)); data.append(struct.pack('<h',int(8000*a*fade)))
              with wave.open(str(raw/name),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(b''.join(data))
          make('king_gift.wav',[660,990]); make('king_join.wav',[440,660]); make('king_level.wav',[523,659,784]); make('king_win.wav',[784,988,1175])
          PY

      - name: Build v7.1.0 debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_v710
          cp app/build/outputs/apk/debug/app-debug.apk release_v710/KING-Plus-v7.1.0-native-engine-assets-no-billing-test-otp.apk
          sha256sum release_v710/KING-Plus-v7.1.0-native-engine-assets-no-billing-test-otp.apk > release_v710/SHA256.txt
          zip -qr release_v710/KING-Plus-v7.1.0-native-engine-assets-source.zip . -x '.git/*' 'release_v710/*' 'app/build/*' '.gradle/*'

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v7.1.0-Native-Engine
          path: release_v710/*
          if-no-files-found: error
