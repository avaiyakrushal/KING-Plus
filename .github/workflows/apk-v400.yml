name: Build KING Plus v4.0.0 Party Complete

on:
  push:
    branches: [real-social-v390-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v4.0.0 Party Complete
        run: bash tools/build_v400.sh

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v4.0.0-party-complete
          path: |
            release/KING-Plus-v4.0.0-party-complete-no-billing-test-otp.apk
            release/KING-Plus-v4.0.0-party-complete-source.zip
          if-no-files-found: error
