name: KING v9.9.81 Me Profile Full Nested Navigation and Party/Gift Regression TEST
on:
  push:
    branches: [work/king-me-page-full-navigation-v9981]
    paths: ['tools/me-page-v9981/**', '.github/workflows/king-me-page-v9981.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  full-genuine-multiplayer:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover signed KING v9.9.79 Party Games and Gifting APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9981 /tmp/king9981prev
          gh run download 38418909642 -n KING-v9980-Real-Live-Bingo-APK-and-Source-TEST -D /tmp/king9981prev
          test -s /tmp/king9981prev/KING-Plus-v9.9.80-Real-Live-Bingo-TEST.apk
          unzip -q /tmp/king9981prev/KING-Plus-v9.9.80-Real-Live-Bingo-TEST-Source.zip -d /tmp/king9981
          grep -q 'versionCode 259' /tmp/king9981/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9981/app/kingplus-ci-debug.keystore
      - name: 'Integrate real Me Page all nested navigation and Firebase-owned Party records'
        run: |
          set -euo pipefail
          python3 tools/me-page-v9981/apply.py /tmp/king9981
          python3 - <<'PY'
          from pathlib import Path
          game=Path('/tmp/king9981/app/src/main/java/com/kingplus/social/RoomGameActivity.java').read_text()
          listen=game[game.index('    private void listenMoves()'):game.index('    private void updatePhase950()')]
          finish=game[game.index('    private void finishRound(boolean automatic9954)'):game.index('    private String resultFor(')]
          assert 'observingRound9977=roundId' in listen
          assert 'whereEqualTo("roundId",observingRound9977)' in listen
          assert 'observingRound9977!=roundId' in listen
          assert 'whereEqualTo("roundId",expected)' in finish
          assert 'get(com.google.firebase.firestore.Source.SERVER)' in finish
          assert 'KingPartyAllPlayed9973.complete' in finish
          assert 'KingPartyLiveRoster9975.member' in finish
          assert 'room().collection("game_moves").get()' not in listen+finish
          assert 'KingPartyMoveCleanup9976.roster' in game
          assert 'versionCode 260' in Path('/tmp/king9981/app/build.gradle').read_text()
          assert "request.resource.data.type != 'wheel'" in Path('/tmp/king9981/firestore.rules').read_text()
          assert "request.resource.data.type != 'slot'" in Path('/tmp/king9981/firestore.rules').read_text()
          print('PASS 5x5 server-verified live Bingo integrates with existing Party voice and Gifts')
          PY
      - name: Java round participant, ghost, departed-player regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9981classes
          javac -d /tmp/king9981classes \
            /tmp/king9981/app/src/main/java/com/kingplus/social/KingPartyMoveCleanup9976.java \
            /tmp/king9981/app/src/main/java/com/kingplus/social/KingPartyAllPlayed9973.java \
            /tmp/king9981/app/src/main/java/com/kingplus/social/KingPartyRoundRoster9972.java \
            /tmp/king9981/app/src/main/java/com/kingplus/social/KingRoomRoster9946.java \
            /tmp/king9981/app/src/main/java/com/kingplus/social/KingPartyLiveRoster9975.java \
            tools/atomic-rematch-v9976/KingPartyMoveCleanup9976Test.java \
            tools/all-played-v9973/KingPartyAllPlayed9973Test.java \
            tools/no-departed-winner-v9975/KingPartyLiveRoster9975Test.java
          for test in KingPartyMoveCleanup9976Test KingPartyAllPlayed9973Test KingPartyLiveRoster9975Test; do
            java -cp /tmp/king9981classes com.kingplus.social."$test"
          done
      - name: Pure Java tests live game stream continuity across Firestore state updates
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9981cycle
          javac -d /tmp/king9981cycle \
            /tmp/king9981/app/src/main/java/com/kingplus/social/KingPartyMoveSubscription9979.java \
            tools/integrated-runtime-v9979/KingPartyMoveSubscription9979Test.java
          java -cp /tmp/king9981cycle com.kingplus.social.KingPartyMoveSubscription9979Test
      - name: Test all 16 final gates cannot be falsely declared successful
        run: |
          set -euo pipefail
          python3 tools/integrated-release/check_release.py --mode test
          python3 tools/integrated-release/test_check_release.py
      - name: Verify existing genuine Bingo remains available from Me's navigation
        run: |
          grep -q 'KingLiveBingo9980Activity' /tmp/king9981/app/src/main/AndroidManifest.xml
          test -s /tmp/king9981/app/src/main/java/com/kingplus/social/KingBingoRules9980.java
      - name: Real 5x5 Bingo BINGO rules must permit rows columns diagonals and 250 real cards
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9981bingo
          javac -d /tmp/king9981bingo \
            /tmp/king9981/app/src/main/java/com/kingplus/social/KingBingoRules9980.java \
            tools/real-bingo-v9980/KingBingoRules9980Test.java
          java -cp /tmp/king9981bingo com.kingplus.social.KingBingoRules9980Test
          grep -q 'KingLiveBingo9980Activity' /tmp/king9981/app/src/main/AndroidManifest.xml
          grep -q '5×5' /tmp/king9981/app/src/main/java/com/kingplus/social/RoomGameActivity.java
          grep -q 'match /live_bingo9980/{bingoId}' /tmp/king9981/firestore.rules
      - name: Verify Me Favorites Recent Rooms and nested options without fake data
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9981me
          javac -d /tmp/king9981me \
            /tmp/king9981/app/src/main/java/com/kingplus/social/KingMeRoomHistory9981.java \
            tools/me-page-v9981/KingMeRoomHistory9981Test.java
          java -cp /tmp/king9981me com.kingplus.social.KingMeRoomHistory9981Test
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9981/app/src/main/java/com/kingplus/social')
          main=(root/'MainActivity.java').read_text()
          deep=(root/'KingDeepFlowActivity.java').read_text()
          for requirement in ('showMeRoomHistory9981("favorites")',
                              'showMeRoomHistory9981("recent")',
                              'whereEqualTo("ownerUid",currentUid9981)',
                              'get(com.google.firebase.firestore.Source.SERVER)',
                              'case "edit_profile":editProfile()',
                              'case "account_delete":profile();requestAccountDeletionFlow()',
                              'openDeepFlow810("profile_menu")'):
              assert requirement in main,requirement
          for requirement in ('case "detail_edit_profile":openMeAction9981("edit_profile")',
                              'case "detail_delete_account":openMeAction9981("account_delete")',
                              'case "detail_blocked":','case "detail_about":about9981()',
                              'case "detail_storage":storage9981()'):
              assert requirement in deep,requirement
          assert 'toggle("Enabled","detail_"+r,true)' not in deep
          print('PASS Me page favorites, actual hosted rooms, 12+ nested menus, safe account actions; no fake Enabled')
          PY
      - name: Install Firestore emulator test dependencies
        working-directory: /tmp/king9981/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Firebase genuine 5x5 Bingo across two live accounts and complete winning rows
        working-directory: /tmp/king9981
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/real-bingo-v9980/bingo-two-clients-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-bingo-9980 --config firebase-emulator.json \
            "node tests/firestore/bingo-two-clients-firestore.test.mjs"
      - name: Firebase five game modes reject valid-range lies and protect other player result
        working-directory: /tmp/king9981
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/integrated-runtime-v9979/score-pairing-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-paired-scores-9979 --config firebase-emulator.json \
            "node tests/firestore/score-pairing-firestore.test.mjs"
      - name: Firebase 7 real Party game score types reject forged winners, spectator and accept honest players
        working-directory: /tmp/king9981
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/score-validation-v9978/forged-score-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-scores-9978 --config firebase-emulator.json \
            "node tests/firestore/forged-score-firestore.test.mjs"
      - name: Firebase two-account live round query with 640 historical scores and genuine winner
        working-directory: /tmp/king9981
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/round-scoped-v9977/real-round-query-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-round-query-9977 --config firebase-emulator.json \
            "node tests/firestore/real-round-query-firestore.test.mjs"
      - name: Firebase 612 historic ghost scores cannot block real rematch
        working-directory: /tmp/king9981
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/atomic-rematch-v9976/stale-history-rematch-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-rematch-9976 --config firebase-emulator.json \
            "node tests/firestore/stale-history-rematch-firestore.test.mjs"
      - name: Firebase departed scorer must not crown false winner
        working-directory: /tmp/king9981
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/no-departed-winner-v9975/departed-player-no-winner-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-departure-9975 --config firebase-emulator.json \
            "node tests/firestore/departed-player-no-winner-firestore.test.mjs"
      - name: Firebase 4-of-4 all valid moves required for results
        working-directory: /tmp/king9981
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/all-played-v9973/all-players-finish-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-all-played-9973 --config firebase-emulator.json \
            "node tests/firestore/all-players-finish-firestore.test.mjs"
      - name: Regression genuine Gift recipient ACK and reconnect
        working-directory: /tmp/king9981
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/gift-reconnect-v9968/party-gift-after-network-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-gift-rejoin-9968 --config firebase-emulator.json \
            "node tests/firestore/party-gift-after-network-firestore.test.mjs"
      - name: Build full Android Party Room, Games and Gifting APK
        working-directory: /tmp/king9981
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify Android package vCode257 and same original APK signer
        run: |
          set -euo pipefail
          old=/tmp/king9981prev/KING-Plus-v9.9.80-Real-Live-Bingo-TEST.apk
          new=/tmp/king9981/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='260'"
          "$signer" verify --print-certs "$old" >/tmp/old9977cert
          "$signer" verify --print-certs "$new" >/tmp/new9977cert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/old9977cert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/new9977cert | head -1)"
          test -n "$a" && test "$a" = "$b"
          unzip -tq "$new" | tail -1
      - name: Preserve integrated 16 functional gates with full Android source
        run: |
          mkdir -p /tmp/king9981/release /tmp/king9981/tools/integrated-release
          cp docs/KING-INTEGRATED-FINAL-16-FUNCTIONAL-GATES.md /tmp/king9981/docs/
          cp release/final-release-evidence.json /tmp/king9981/release/
          cp tools/integrated-release/*.py /tmp/king9981/tools/integrated-release/
          cp tools/integrated-runtime-v9979/apply.py /tmp/king9981/tools/
      - name: Preserve Me nested navigation source code and test suite
        run: |
          mkdir -p /tmp/king9981/tools/me-page-v9981
          cp tools/me-page-v9981/* /tmp/king9981/tools/me-page-v9981/
      - name: Preserve original independently implemented Bingo feature source and tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9981/tools/real-bingo-v9980
          cp tools/real-bingo-v9980/* /tmp/king9981/tools/real-bingo-v9980/
      - name: Package signed TEST APK plus full current source, no signing secrets
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9981out
          cp /tmp/king9981/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9981out/KING-Plus-v9.9.81-Me-Page-Functional-TEST.apk
          rm -f /tmp/king9981/app/kingplus-ci-debug.keystore
          cd /tmp/king9981
          zip -q -r /tmp/king9981out/KING-Plus-v9.9.81-Me-Page-Functional-TEST-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9981out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9981-Me-Page-Full-Navigation-TEST-APK-and-Source
          path: /tmp/king9981out/*
          retention-days: 14
          if-no-files-found: error
