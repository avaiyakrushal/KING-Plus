name: KING v9.9.33 Real XML UI Foundation TEST
on:
  push:
    branches: [work/king-xml-ui-foundation-v9933]
    paths: ['tools/xml-ui-v9933/**', '.github/workflows/king-owned-layouts-9933.yml']
  pull_request:
    paths: ['tools/xml-ui-v9933/**', '.github/workflows/king-owned-layouts-9933.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  layouts-and-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore verified v9.9.32 APK and complete source
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9933 /tmp/king9933prev
          gh run download 38284565592 -n KING-v9932-Party-3D-Gifts-TEST-APK-and-Source -D /tmp/king9933prev
          echo '51577537ebac768d7e7399244d56823428b3bea0942c310ad934605ec5f6d13a  /tmp/king9933prev/KING-Plus-v9.9.32-Party-3D-Gifts-Source.zip' | sha256sum -c -
          echo '79cf5efeeeea8feafdfa48d624227970788fbb222b4491c47bb7ea7dcb69e8bb  /tmp/king9933prev/KING-Plus-v9.9.32-Party-3D-Gifts-TEST.apk' | sha256sum -c -
          unzip -q /tmp/king9933prev/KING-Plus-v9.9.32-Party-3D-Gifts-Source.zip -d /tmp/king9933
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9933/app/kingplus-ci-debug.keystore
      - name: Integrate nine functional owned XML resources
        run: |
          set -euo pipefail
          python3 tools/xml-ui-v9933/apply.py /tmp/king9933
          node --check /tmp/king9933/functions/v3.js
          node --test /tmp/king9933/functions/play-purchase-service.test.js
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('/tmp/king9933')
          layout=root/'app/src/main/res/layout'
          expected=['king_deepflow_header','king_deepflow_row','king_deepflow_hero','king_deepflow_section',
          'king_deepflow_chip','king_gift_header','king_gift_hero','king_gift_row','king_gift_history']
          code=''.join(p.read_text() for p in (root/'app/src/main/java/com/kingplus/social').glob('*.java'))
          for n in expected:
            ET.parse(layout/(n+'.xml'))
            assert ('R.layout.'+n) in code, 'Unused XML layout: '+n
          assert len(list(layout.glob('*.xml')))==9
          assert 'versionCode 212' in (root/'app/build.gradle').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (root/'app/src/main/java/com/kingplus/social/KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (root/'app/src/main/java/com/kingplus/social/KingRecharge974Activity.java').read_text()
          print('PASS nine real XML layouts all inflated by user-visible screens; billing still OFF')
          PY
      - name: Build complete KING Android APK, validate compiled AAPT resources
        working-directory: /tmp/king9933
        run: gradle :app:assembleDebug --no-daemon
      - name: Prove upgrade signer, version and true layout resource count
        run: |
          set -euo pipefail
          old=/tmp/king9933prev/KING-Plus-v9.9.32-Party-3D-Gifts-TEST.apk
          new=/tmp/king9933/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='211'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='212'"
          "$signer" verify --print-certs "$old" > /tmp/oldcert
          "$signer" verify --print-certs "$new" > /tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
          python3 - <<'PY'
          from zipfile import ZipFile
          p='/tmp/king9933/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(p) as z:
            names=set(z.namelist())
          own=[n for n in names if n.startswith('res/layout/king_') and n.endswith('.xml')]
          total=len([n for n in names if n.startswith('res/layout') and n.endswith('.xml')])
          print('FULL_APK_XML_LAYOUT_TOTAL='+str(total),'ACTUAL_KING_OWN_XML='+str(len(own)))
          assert len(own)==9 and total>=177
          PY
      - name: Package TEST APK and clean full source ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9933out
          cp /tmp/king9933/app/build/outputs/apk/debug/app-debug.apk /tmp/king9933out/KING-Plus-v9.9.33-Real-XML-Layouts-TEST.apk
          rm -f /tmp/king9933/app/kingplus-ci-debug.keystore
          cd /tmp/king9933
          zip -q -r /tmp/king9933out/KING-Plus-v9.9.33-Real-XML-Layouts-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
              './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9933out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9933-Real-XML-Layouts-TEST-APK-and-Source
          path: /tmp/king9933out/*
          retention-days: 14
          if-no-files-found: error
