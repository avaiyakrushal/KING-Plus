name: Build KING Plus v8.8.1 Chat Gift IME Fix
on:
  push:
    branches: ['build/v8.8.1-chat-gift-ime-fix']
    paths:
      - '.github/workflows/apk-v881-chat-gift-ime.yml'
      - 'ci/v881/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v8.8.1-chat-gift-ime-fix
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recover v8.8.0 and apply chat/gift/IME fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/base /tmp/src /tmp/release
          mkdir -p /tmp/base /tmp/src
          gh run download 37402215652 -n KING-Plus-v8.8.0-APK-and-source -D /tmp/base
          unzip -q /tmp/base/KING-Plus-v8.8.0-source.zip -d /tmp/src
          python3 ci/v881/patch_v881.py /tmp/src
          cp ci/v881/RELEASE-NOTES.md /tmp/src/RELEASE-NOTES-v8.8.1.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/app/build.gradle')
          s=p.read_text()
          old="versionCode 129; versionName '8.8.0'"
          if old not in s:
              raise SystemExit('Expected v8.8.0 version line was not found')
          p.write_text(s.replace(old,"versionCode 130; versionName '8.8.1'",1))
          PY
      - name: Verify v8.8.1 markers
        run: |
          set -euo pipefail
          P=/tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'Insets ime=insets.getInsets(WindowInsetsCompat.Type.ime())' "$P"
          grep -F 'keepRoomKeyboard881' "$P"
          grep -F 'int bubbleWidth=Math.min(dp(280)' "$P"
          grep -F 'Keep incomplete rows at four equal columns' "$P"
          grep -F 'android:windowSoftInputMode="adjustResize"' /tmp/src/app/src/main/AndroidManifest.xml
          grep -F "versionName '8.8.1'" /tmp/src/app/build.gradle
      - name: Build Android APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon
      - name: Package APK and source
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil,zipfile,hashlib
          out=Path('/tmp/release');out.mkdir(parents=True,exist_ok=True)
          apk=out/'KING-Plus-v8.8.1-chat-gift-ime-fix.apk'
          shutil.copy2('app/build/outputs/apk/debug/app-debug.apk',apk)
          (out/'SHA256.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          with zipfile.ZipFile(out/'KING-Plus-v8.8.1-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('.').rglob('*'):
                  if not p.is_file() or any(v in p.parts for v in ['.git','.gradle','build','node_modules']): continue
                  if p.suffix in ['.apk','.zip','.log']: continue
                  z.write(p,p)
          shutil.copy2('RELEASE-NOTES-v8.8.1.md',out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v8.8.1-APK-and-source
          path: /tmp/release/*
          if-no-files-found: error
