name: KING v9.9.30 Video VIP Parity TEST
on:
  push:
    branches: [work/king-video-vip-level-parity]
    paths:
      - 'tools/video-parity/**'
      - 'tools/recharge-integrity/**'
      - 'functions/**'
      - '.github/workflows/king-video-vip-parity.yml'
  pull_request:
    paths:
      - 'tools/video-parity/**'
      - 'tools/recharge-integrity/**'
      - 'functions/**'
      - '.github/workflows/king-video-vip-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run prior receipt security regressions
        run: |
          set -euo pipefail
          node --check functions/v3.js
          node --test functions/*.test.js
      - name: Recover checksum-pinned full v9.9.29 source and signed prior APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9930 /tmp/king9930prev
          gh release download v9.9.29-live-3d-motion -p 'KING-Plus-v9.9.29-Live-3D-Motion-Source.zip' -D /tmp/king9930prev
          gh release download v9.9.29-live-3d-motion -p 'KING-Plus-v9.9.29-Live-3D-Motion-TEST.apk' -D /tmp/king9930prev
          echo 'b5705a516ffa054ab9a2c771d5e5f905799a2aee95e077c564404afe4b1613dc  /tmp/king9930prev/KING-Plus-v9.9.29-Live-3D-Motion-Source.zip' | sha256sum -c -
          unzip -q /tmp/king9930prev/KING-Plus-v9.9.29-Live-3D-Motion-Source.zip -d /tmp/king9930
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9930/app/kingplus-ci-debug.keystore
          test -s /tmp/king9930/app/src/main/java/com/kingplus/social/KingVipVisualActivity.java
      - name: Apply PR30 purchase integrity and video-inspired VIP previews to full app
        run: |
          set -euo pipefail
          python3 tools/recharge-integrity/apply.py /tmp/king9930
          python3 tools/video-parity/upgrade_video_vip.py /tmp/king9930
          node --check /tmp/king9930/functions/v3.js
          cp functions/play-purchase-service.test.js /tmp/king9930/functions/
          node --test /tmp/king9930/functions/play-purchase-service.test.js
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king9930'); j=r/'app/src/main/java/com/kingplus/social'
          vip=(j/'KingVipVisualActivity.java').read_text()
          task=(j/'KingDeepFlowActivity.java').read_text()
          assert 'selectedTier9930=t;build()' in vip
          assert 'verifiedWallet972?verifiedLevel972:0' in vip
          assert 'Preview only' in vip
          assert 'LevelSystem.add(this,xp,0)' not in task[task.index('private void dailyTask'):task.index('private void eventCenter')]
          assert 'versionCode 209' in (r/'app/build.gradle').read_text()
          assert 'LIVE_RECHARGE = false' in (j/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (j/'KingPremiumAccess981.java').read_text()
          assert 'play-purchase-service' in (r/'functions/v3.js').read_text()
          assert 'motionDance' in (j/'KingNative3DRoom.java').read_text()
          print('PASS verified VIP never replaced by preview; level XP tap abuse closed; no paid billing')
          PY
      - name: Compile complete Android app
        working-directory: /tmp/king9930
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify package, signer and version upgrade
        run: |
          set -euo pipefail
          OLD=/tmp/king9930prev/KING-Plus-v9.9.29-Live-3D-Motion-TEST.apk
          NEW=/tmp/king9930/app/build/outputs/apk/debug/app-debug.apk
          test -s "$OLD" && test -s "$NEW"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='208'"
          "$AAPT" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='209'"
          "$SIGNER" verify --print-certs "$OLD" > /tmp/king9930old
          "$SIGNER" verify --print-certs "$NEW" > /tmp/king9930new
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9930old | head -1 || true)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9930new | head -1 || true)"
          test -n "$a" && test "$a" = "$b"
          echo 'PASS upgraded v9.9.29 signer/package; v9.9.30 TEST only'
      - name: Assemble test artifact and clean source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9930out
          cp /tmp/king9930/app/build/outputs/apk/debug/app-debug.apk /tmp/king9930out/KING-Plus-v9.9.30-Video-Parity-TEST.apk
          rm -f /tmp/king9930/app/kingplus-ci-debug.keystore
          cd /tmp/king9930
          zip -q -r /tmp/king9930out/KING-Plus-v9.9.30-Video-Parity-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' './.gradle/*' '*/.gradle/*' \
               '*.apk' '*.aab' '*.jks' '*.keystore' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9930out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9930-Video-Parity-TEST-APK-and-Source
          path: /tmp/king9930out/*
          retention-days: 14
          if-no-files-found: error
