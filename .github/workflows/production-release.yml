name: Production signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KINGPLUS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KINGPLUS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KINGPLUS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KINGPLUS_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing KINGPLUS_RELEASE_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing KINGPLUS_RELEASE_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KINGPLUS_RELEASE_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KINGPLUS_RELEASE_KEY_PASSWORD" && exit 1)

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.KINGPLUS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kingplus-upload.jks"
          echo "KINGPLUS_RELEASE_STORE_FILE=$RUNNER_TEMP/kingplus-upload.jks" >> "$GITHUB_ENV"

      - name: Configure signing environment
        env:
          STORE_PASSWORD: ${{ secrets.KINGPLUS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KINGPLUS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KINGPLUS_RELEASE_KEY_PASSWORD }}
        run: |
          echo "KINGPLUS_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KINGPLUS_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KINGPLUS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Prepare production release source
        run: |
          python3 tools/prepare_v28_build.py
          python3 tools/prepare_v29_build.py
          python3 tools/prepare_v30_build.py
          python3 tools/configure_production_signing.py

      - name: Production backend and configuration checks
        run: |
          MAIN_FILE=$(node -p "require('./functions/package.json').main || 'index.js'")
          node --check "functions/$MAIN_FILE"
          python3 tools/production_smoke_check.py

      - name: Build signed release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify APK signing certificate
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APK_SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare production artifacts
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/KING-Plus-production.apk
          cp app/build/outputs/bundle/release/app-release.aab release/KING-Plus-production.aab

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-production-APK
          path: release/KING-Plus-production.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-production-AAB
          path: release/KING-Plus-production.aab
          if-no-files-found: error

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kingplus-upload.jks"
