name: KING Plus Chat Complete No Billing Build

on:
  push:
    branches: [feature/remaining-social-v31]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-chat-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Integrate real cloud inbox into Messages tab
        run: python3 tools/finish_chat_integration.py

      - name: Persist Messages tab integration
        run: |
          if ! git diff --quiet -- app/src/main/java/com/kingplus/social/MainActivity.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/kingplus/social/MainActivity.java
            git commit -m "Connect Messages tab to real cloud chat inbox"
            git push origin HEAD:feature/remaining-social-v31
          fi

      - name: Validate backend JavaScript
        run: node --check functions/index.js

      - name: Build no-billing debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare chat-complete APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/KING-Plus-chat-complete-no-billing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-chat-complete-no-billing-APK
          path: release/KING-Plus-chat-complete-no-billing.apk
          if-no-files-found: error
