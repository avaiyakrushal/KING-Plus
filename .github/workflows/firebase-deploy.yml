name: Firebase production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Firebase deploy secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON" && exit 1)

      - name: Install Firebase CLI and function dependencies
        run: |
          npm install --global firebase-tools
          npm install --prefix functions

      - name: Prepare Google service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Apply v3.0.1 production backend hardening
        run: python3 tools/prepare_v301_hardening.py

      - name: Validate backend syntax and production checks
        run: |
          MAIN_FILE=$(node -p "require('./functions/package.json').main || 'index.js'")
          node --check "functions/$MAIN_FILE"
          python3 tools/production_smoke_check.py

      - name: Deploy Firestore rules and Cloud Functions
        run: firebase deploy --project king-plus-2f365 --only firestore:rules,functions --non-interactive

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
