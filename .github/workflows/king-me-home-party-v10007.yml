name: KING v10.0.7 Me Home Party State Consistency Test APK
on:
  push:
    branches: [work/king-me-home-party-v10007]
    paths:
      - 'tools/me-home-party-v10007/**'
      - '.github/workflows/king-me-home-party-v10007.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover exact successfully built v10.0.6 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10007prev /tmp/king10007
          gh run download 38533058888 -n KING-v10006-Me-Home-Party-TEST-APK-and-Source -D /tmp/king10007prev
          unzip -q /tmp/king10007prev/KING-Plus-v10.0.6-Me-Home-Party-TEST-Source.zip -d /tmp/king10007
          cp app/kingplus-ci-debug.keystore /tmp/king10007/app/
          python3 tools/me-home-party-v10007/apply.py /tmp/king10007
      - name: Me, Home and Party source regression checks
        run: |
          set -euo pipefail
          python3 tools/me-home-party-v10007/source_checks.py /tmp/king10007
      - name: Banner and room-bound async callback tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10007tests
          javac -d /tmp/king10007tests /tmp/king10007/app/src/main/java/com/kingplus/social/KingRoomLifecycle10007.java tools/me-home-party-v10007/KingRoomLifecycle10007Test.java
          java -cp /tmp/king10007tests com.kingplus.social.KingRoomLifecycle10007Test
      - name: Full Android APK compile
        working-directory: /tmp/king10007
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify v10.0.7 app ID and unchanged signing certificate
        run: |
          set -euo pipefail
          old=/tmp/king10007prev/KING-Plus-v10.0.6-Me-Home-Party-TEST.apk
          new=/tmp/king10007/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='286'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and full updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10007out /tmp/king10007/tools/me-home-party-v10007
          cp tools/me-home-party-v10007/* /tmp/king10007/tools/me-home-party-v10007/
          cp .github/workflows/king-me-home-party-v10007.yml /tmp/king10007/.github/workflows/
          cp /tmp/king10007/app/build/outputs/apk/debug/app-debug.apk /tmp/king10007out/KING-Plus-v10.0.7-Me-Home-Party-TEST.apk
          rm -f /tmp/king10007/app/kingplus-ci-debug.keystore
          cd /tmp/king10007
          zip -qr /tmp/king10007out/KING-Plus-v10.0.7-Me-Home-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10007out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10007-Me-Home-Party-TEST-APK-and-Source
          path: /tmp/king10007out/*
          retention-days: 14
          if-no-files-found: error
