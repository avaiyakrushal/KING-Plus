name: KING Plus Production Firebase Readiness (Read Only)
on:
  push:
    branches: [work/king-v9929-live-avatar-motion]
    paths:
      - '.github/workflows/king-production-readiness-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-readiness-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact current verified source for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9929prod
          gh release download v9.9.29-live-3d-motion \
            -p 'KING-Plus-v9.9.29-Live-3D-Motion-Source.zip' -D /tmp
          unzip -q /tmp/KING-Plus-v9.9.29-Live-3D-Motion-Source.zip -d /tmp/king9929prod
          grep -q 'match /avatar_motion/{motionUid}' /tmp/king9929prod/firestore.rules
          echo 'Verified current v9.9.29 backend security rules for read-only comparison'
      - name: Preflight Firebase credential presence and exact target project
        id: credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'BLOCKED: GitHub production Firebase service-account secret is missing.'
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/king-fire-auth.json"
          chmod 600 "$RUNNER_TEMP/king-fire-auth.json"
          if ! jq -e '.type=="service_account" and .project_id=="king-plus-2f365" and (.private_key|type=="string")' "$RUNNER_TEMP/king-fire-auth.json" >/dev/null; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'BLOCKED: Firebase secret is not a valid service-account for the KING Plus production project.'
            exit 0
          fi
          echo 'exists=true' >> "$GITHUB_OUTPUT"
          echo 'Firebase credential available for read-only production check.'
      - name: Install known Firebase Admin dependencies
        if: steps.credential.outputs.exists == 'true'
        working-directory: /tmp/king9929prod/functions
        run: npm ci --no-audit --no-fund
      - name: Inspect deployed Firestore rules and Identity Toolkit status (NO DEPLOY)
        if: steps.credential.outputs.exists == 'true'
        working-directory: /tmp/king9929prod/functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/king-fire-auth.json
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const {GoogleAuth}=require('google-auth-library');
          const project='king-plus-2f365';
          const required=fs.readFileSync('../firestore.rules','utf8');
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          const auth=new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']});
          (async()=>{
            const client=await auth.getClient();
            const api=async u=>(await client.request({url:u})).data;
            const release=await api('https://firebaserules.googleapis.com/v1/projects/'+project+'/releases/cloud.firestore');
            const ruleset=await api('https://firebaserules.googleapis.com/v1/'+release.rulesetName);
            const source=(ruleset.source?.files||[]).map(x=>x.content||'').join('\n');
            const same=source.trim()===required.trim();
            console.log('Project identity:',project);
            console.log('Current released Firestore ruleset:',release.rulesetName);
            console.log('KING v9.9.29 avatar-motion marker deployed:',source.includes('match /avatar_motion/{motionUid}'));
            console.log('KING v9.9.29 Firestore rules exact match:',same);
            console.log('Local Firestore rules SHA256:',sha(required));
            console.log('Deployed Firestore rules SHA256:',sha(source));
            if(!same)console.log('BLOCKED: live Firestore rules differ. Review, backup and explicitly authorize deployment before calling this production-ready.');
            try{
              const cfg=await api('https://identitytoolkit.googleapis.com/admin/v2/projects/'+project+'/config');
              console.log('Production Identity Toolkit config accessible: true');
              console.log('Phone-number provider enabled:',cfg.signIn?.phoneNumber?.enabled===true);
              const json=JSON.stringify(cfg);
              console.log('Third-party providers require independent OAuth console verification; admin access alone is not proof Facebook works.');
            }catch(e){
              console.log('Production Identity Toolkit config accessible: false; status',e.response?.status||'unknown');
            }
            console.log('This is read-only; no Firestore, Auth or payment settings were changed.');
          })().catch(e=>{console.error('READ_ONLY_PRODUCTION_PREFLIGHT_FAILED:',e.response?.status||e.code||e.message);process.exitCode=1});
          NODE
      - name: Always destroy temporary service-account credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/king-fire-auth.json"
