name: KING v9.9.63 Real Opt-in Party Games and Durable Gift Burst Delivery TEST
on:
  push:
    branches: [work/king-real-games-gift-backpressure-v9963]
    paths: ['tools/live-party-v9963/**', '.github/workflows/king-real-games-gift-backpressure-v9963.yml']
  pull_request:
    paths: ['tools/live-party-v9963/**', '.github/workflows/king-real-games-gift-backpressure-v9963.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore complete signed v9.9.59 Party Games Gift runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9963 /tmp/king9963prev
          gh run download 38375336890 -n KING-v9962-Durable-Gift-Delivery-TEST-APK-and-Source -D /tmp/king9963prev
          test -s /tmp/king9963prev/KING-Plus-v9.9.62-Durable-Gift-Delivery-TEST.apk
          unzip -q /tmp/king9963prev/KING-Plus-v9.9.62-Durable-Gift-Delivery-Source.zip -d /tmp/king9963
          grep -q 'versionCode 241' /tmp/king9963/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9963/app/kingplus-ci-debug.keystore
      - name: Apply actual Party Ready-only games and gift overflow fix
        run: |
          set -euo pipefail
          python3 tools/live-party-v9963/apply.py /tmp/king9963
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9963')
          src=root/'app/src/main/java/com/kingplus/social'
          party=(src/'PartyActivity.java').read_text()
          room=(src/'RoomGameActivity.java').read_text()
          for k in ('boolean journaled9962=storeGiftReceipt9962',
                    'KingGiftBurstBackpressure9963.canSendNow',
                    'recoverDurableGiftReceipts9962()',
                    'removeGiftReceipt9962(job.room.getId()',
                    'room9962.collection("members")',
                    'room9962.collection("events")',
                    'Source.SERVER','KingPartyMicConsent9956',
                    'KingPartyVoiceReconnect9957'):
            assert k in party,k
          block=party[party.index('private void confirmGiftReceived9941('):
                      party.index('private boolean receiptContext9955(',party.index('private void confirmGiftReceived9941('))]
          assert block.index('storeGiftReceipt9962')<block.index('canSendNow(')
          for begin,end in [('    private void startSocialRound866(','    private void startRound(String game){'),
                            ('    private void startTtt864(){','    private void submitTtt864(int idx){')]:
            segment=room[room.index(begin):room.index(end,room.index(begin))]
            assert '.whereEqualTo("ready",true)' in segment,begin
            assert 'Source.SERVER' in segment,begin
            assert 'db.runTransaction(tx->' in segment,begin
            assert 'participantUids' in segment,begin
          assert 'KingPartySocialRoster9959.isEligible' in room
          assert 'KingTttFairRoster9960.pickPair' in room
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          assert 'versionCode 242' in (root/'app/build.gradle').read_text()
          print('PASS genuine completed Gift ACK is durable on 65th display; Opt-in Ready only transaction games')
          PY
      - name: Pure Java gift queue overflow and existing receipt journal tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9963classes
          javac -d /tmp/king9963classes \
            /tmp/king9963/app/src/main/java/com/kingplus/social/KingGiftBurstBackpressure9963.java \
            /tmp/king9963/app/src/main/java/com/kingplus/social/KingGiftReceiptDurable9962.java \
            /tmp/king9963/app/src/main/java/com/kingplus/social/KingGiftReceiptRetry9955.java \
            tools/live-party-v9963/KingRealGamesGiftBackpressure9963Test.java \
            tools/gift-durable-v9962/KingGiftReceiptDurable9962Test.java \
            tools/gift-receipt-retry-v9955/KingGiftReceiptRetry9955Test.java
          java -cp /tmp/king9963classes com.kingplus.social.KingRealGamesGiftBackpressure9963Test
          java -cp /tmp/king9963classes com.kingplus.social.KingGiftReceiptDurable9962Test
          java -cp /tmp/king9963classes com.kingplus.social.KingGiftReceiptRetry9955Test
      - name: Install real Firestore emulator dependencies
        working-directory: /tmp/king9963/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Firestore Party Ready true query with more than 50 stale unready
        working-directory: /tmp/king9963
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/live-party-v9963/ready-query-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-ready-filter-9963 --config firebase-emulator.json \
            "node tests/firestore/ready-query-firestore.test.mjs"
      - name: Firebase real Tic Tac Toe Ready off ghost and live pairing
        working-directory: /tmp/king9963
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/ttt-live-v9960/ttt-ready-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-ttt-9960 --config firebase-emulator.json \
            "node tests/firestore/ttt-ready-firestore.test.mjs"
      - name: Firestore emulator Host recipient-only private role and race protection
        working-directory: /tmp/king9963
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-host-role-v9961/host-role-private-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/host-role-private-firestore.test.mjs"
      - name: Regression real social game roles, privacy and simultaneous Host
        working-directory: /tmp/king9963
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-live-v9958/social-party-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/social-party-firestore.test.mjs"
      - name: Regression real Party Gift receipts and immutable game turns
        working-directory: /tmp/king9963
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          for test in gift-delivery-firestore.test.mjs immutable-rounds-firestore.test.mjs; do
            tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
              --project demo-king-live-ready-9959 --config firebase-emulator.json \
              "node tests/firestore/$test"
          done
      - name: Compile complete Android Party Games Gifting APK
        working-directory: /tmp/king9963
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify signed APK upgrade and zip integrity
        run: |
          set -euo pipefail
          old=/tmp/king9963prev/KING-Plus-v9.9.62-Durable-Gift-Delivery-TEST.apk
          new=/tmp/king9963/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='242'"
          "$signer" verify --print-certs "$old" >/tmp/cert-old
          "$signer" verify --print-certs "$new" >/tmp/cert-new
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-old | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-new | head -1)"
          test -n "$a" && test "$a" = "$b"
          unzip -tq "$new" | tail -1
      - name: Package TEST APK and complete source, with no private signing key
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9963out
          cp /tmp/king9963/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9963out/KING-Plus-v9.9.63-Live-Games-Gift-Queue-TEST.apk
          rm -f /tmp/king9963/app/kingplus-ci-debug.keystore
          cd /tmp/king9963
          zip -q -r /tmp/king9963out/KING-Plus-v9.9.63-Live-Games-Gift-Queue-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
            './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9963out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9963-Live-Games-Gift-Queue-TEST-APK-and-Source
          path: /tmp/king9963out/*
          retention-days: 14
          if-no-files-found: error
