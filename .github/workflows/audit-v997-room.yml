name: KING Plus v9.9.7 Room Roles Profile Games Audit
on:
  push:
    branches: [work/reference-completion]
    paths:
      - 'ci/v997_room/**'
      - '.github/workflows/audit-v997-room.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - name: Restore tested KING Plus source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v997 /tmp/source-v997
          gh run download 38123768020 -n KING-Plus-v9.9.6-Friends-Party-Gift-Sounds-Source -D /tmp/source-v997
          unzip -q /tmp/source-v997/KING-Plus-v9.9.6-Friends-Party-Gift-Sounds-source.zip 'app/src/main/java/com/kingplus/social/*.java' 'firestore.rules' -d /tmp/v997
      - name: Audit role security, profiles and games
        run: |
          python3 ci/v997_room/inspect.py
          python3 ci/v997_room/inspect_detail.py
          python3 ci/v997_room/inspect_methods.py
