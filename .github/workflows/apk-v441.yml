name: Build KING Plus v4.4.1 Party Profile Fit

on:
  push:
    branches: [real-social-v390-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build v4.4.1 Party Profile Fit
        run: bash tools/build_v441.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v4.4.1-party-profile-fit
          path: |
            release_v441/KING-Plus-v4.4.1-party-profile-fit-no-billing-test-otp.apk
            release_v441/KING-Plus-v4.4.1-party-profile-fit-source.zip
          if-no-files-found: error
