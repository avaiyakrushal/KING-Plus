name: KING Plus v10.0.75 Android 16 Media URI Crash Fix TEST

on:
  push:
    branches: [work/king-v10070-nongame-audit]
    paths:
      - 'app/**'
      - '.github/workflows/king-v10070-live-completion.yml'
      - '.rollback-v10069/READY4'

permissions:
  contents: write

jobs:
  restore-source:
    if: contains(github.event.head_commit.message, 'RUN v10.0.69 restore')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Restore the attached source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-v10069
          cat .rollback-v10069/chunk-* | base64 -d | tar -xzf - -C /tmp/king-v10069
          grep -q "versionCode 348" /tmp/king-v10069/app/build.gradle
          grep -q "versionName '10.0.69-server-game-rules'" /tmp/king-v10069/app/build.gradle
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/king-v10069/ "$GITHUB_WORKSPACE/"
          test ! -e .rollback-v10069
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Restore exact KING Plus v10.0.69 source snapshot"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

  build-and-package:
    if: "!contains(github.event.head_commit.message, 'RUN v10.0.69 restore')"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check live feature wiring and release identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('app/build.gradle').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          main=Path('app/src/main/java/com/kingplus/social/MainActivity.java').read_text()
          party=Path('app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          social=Path('app/src/main/java/com/kingplus/social/SocialActivity.java').read_text()
          gradle=Path('app/build.gradle').read_text()
          bridge=Path('app/src/main/java/com/kingplus/social/NativeMeetBridge.java').read_text()
          assert "versionCode 354" in g and "versionName '10.0.75'" in g
          for dependency in ('firebase-firestore','firebase-functions','firebase-messaging','billing:8.0.0'):
              assert dependency in g, f'missing dependency: {dependency}'
          assert 'KingMessagingService' in manifest and 'POST_NOTIFICATIONS' in manifest
          assert 'collection("live_rooms")' in main and 'addSnapshotListener' in main
          assert 'setImageURI(' not in main and 'showImageUri10075(' in main
          assert 'openInputStream(uri)' in main and 'catch (Exception | OutOfMemoryError error)' in main
          assert '28+Math.abs(name.hashCode()%220)' not in main, 'legacy fake room count is not allowed'
          assert 'runTransaction(transaction' in party and 'sendQuickEmoji' in party
          assert 'selectGiftRecipient' in party and 'cleanupPresence' in party
          assert 'NativeMeetBridge.launch' in party
          assert 'minSdk 26' in gradle and 'jitsi-meet-sdk:13.1.1' in gradle
          assert "abiFilters 'arm64-v8a', 'armeabi-v7a'" in gradle
          assert 'Source.SERVER' in bridge and 'JitsiMeetActivity.launch' in bridge
          game=(Path('app/src/main/java/com/kingplus/social/GamePlayActivity.java').read_text())
          assert 'Practice games • live player counts' not in main
          assert 'private void openGame(String game)' in main and 'new Intent(this,GamePlayActivity.class)' in main
          assert 'private void openLudoModes()' in main
          assert all(x in game for x in ('showTicTacToe','showMemory','showDice','showReactionTap','showBingo','showDrawGuess','showDomino'))
          assert 'KingOfflineLudoActivity' in main and 'OnlineLudoActivity' in main
          for activity in ('GamePlayActivity','OnlineLudoActivity','KingOfflineLudoActivity'):
              assert f'android:name=".{activity}"' in manifest
          assert 'Source.SERVER' in main and 'wallet_ledger' in main and 'notificationListener' in main
          assert 'Weekly Stars' not in main and '15.2K coins' not in main
          assert 'CloudSync.submitReport' in main
          assert 'Live community feed' in main and 'toggleMomentLike' in main and 'momentListener' in main
          assert 'collection("public_profiles")' in social and 'pendingFollowActions' in social
          assert '18,791 players' not in main and 'Lily ✨' not in social
          print('PASS: live Home/Discover/Messages/Party wiring, restored playable games, online/offline Ludo routes, server wallet/history/notifications and TEST release identity')
          PY
      - name: Build signed Android TEST APK
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify APK signature, package and version
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$apk" | grep '^package:' | grep "name='com.kingplus.social'" | grep "versionCode='354'"
          "$signer" verify --print-certs "$apk"
          test "$(stat -c%s "$apk")" -gt 60000000 || { echo 'APK is unexpectedly small; full Jitsi/React Native runtime is missing'; exit 1; }
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/libjingle_peerconnection_so.so$' || { echo 'Jitsi WebRTC native library missing'; exit 1; }
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/libreactnative.so$' || { echo 'React Native runtime missing'; exit 1; }
          echo "Verified full RTC APK size: $(stat -c%s "$apk") bytes"
      - name: Package APK and source ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-v10075-out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/king-v10075-out/KING-Plus-v10.0.75-Android16-Crash-Fix-TEST.apk
          zip -qr /tmp/king-v10075-out/KING-Plus-v10.0.75-Android16-Crash-Fix-TEST-Source.zip . \
            -x '.git/*' '*/.git/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*/node_modules/*' \
            '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king-v10075-out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v10.0.75-Android16-Crash-Fix-TEST-APK-and-Source
          path: /tmp/king-v10075-out/*
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct APK and source downloads
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          gh release create v10.0.75-android16-uri-crash-fix-test \
            /tmp/king-v10075-out/KING-Plus-v10.0.75-Android16-Crash-Fix-TEST.apk \
            /tmp/king-v10075-out/KING-Plus-v10.0.75-Android16-Crash-Fix-TEST-Source.zip \
            --target "$GITHUB_SHA" \
            --title "KING Plus v10.0.75 Android 16 Media URI Crash Fix TEST" \
            --notes "TEST APK with the Android 16 MediaDocumentsProvider photo crash fix. Local document URIs are eagerly decoded with a bounded image size; unusable grants show a fallback. This is source/build verification, not a physical-device crash-free claim. Other live-service and two-device gates remain open." \
            --prerelease
