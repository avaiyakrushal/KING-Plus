name: KING Plus v10.0.70 Live Completion TEST

on:
  push:
    branches: [work/king-v10070-nongame-audit]
    paths:
      - 'app/**'
      - '.github/workflows/king-v10070-live-completion.yml'

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check live feature wiring and release identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('app/build.gradle').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          main=Path('app/src/main/java/com/kingplus/social/MainActivity.java').read_text()
          party=Path('app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          social=Path('app/src/main/java/com/kingplus/social/SocialActivity.java').read_text()
          assert "versionCode 349" in g and "versionName '10.0.70'" in g
          for dependency in ('firebase-firestore','firebase-functions','firebase-messaging','billing:7.1.1'):
              assert dependency in g, f'missing dependency: {dependency}'
          assert 'KingMessagingService' in manifest and 'POST_NOTIFICATIONS' in manifest
          assert 'collection("live_rooms")' in main and 'addSnapshotListener' in main
          assert 'runTransaction(transaction' in party and 'sendQuickEmoji' in party
          assert 'collection("public_profiles")' in social and 'pendingFollowActions' in social
          assert '18,791 players' not in main and 'Lily ✨' not in social
          print('PASS: live Home/Discover/Messages/Party wiring, real room state, push service and TEST release identity')
          PY
      - name: Build signed Android TEST APK
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify APK signature, package and version
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$apk" | grep '^package:' | grep "name='com.kingplus.social'" | grep "versionCode='349'"
          "$signer" verify --print-certs "$apk"
      - name: Package APK and source ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-v10070-out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/king-v10070-out/KING-Plus-v10.0.70-Live-Completion-TEST.apk
          zip -qr /tmp/king-v10070-out/KING-Plus-v10.0.70-Live-Completion-TEST-Source.zip . \
            -x '.git/*' '*/.git/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*/node_modules/*' \
            '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king-v10070-out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v10.0.70-Live-Completion-TEST-APK-and-Source
          path: /tmp/king-v10070-out/*
          retention-days: 30
          if-no-files-found: error
