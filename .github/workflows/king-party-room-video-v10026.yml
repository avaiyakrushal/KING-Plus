name: KING v10.0.26 Party Room Video Report - Clean Exit Chat Cover Bottom TEST APK
on:
  push:
    branches: [work/king-party-room-video-v10026]
    paths:
      - 'tools/party-video-v10026/**'
      - '.github/workflows/king-party-room-video-v10026.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.25 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10026prev /tmp/king10026
          gh run download 38619199771 -n KING-v10025-Six-Pages-TEST-APK-and-Source -D /tmp/king10026prev
          unzip -q /tmp/king10026prev/KING-Plus-v10.0.25-Six-Pages-TEST-Source.zip -d /tmp/king10026
          cp app/kingplus-ci-debug.keystore /tmp/king10026/app/
          python3 tools/party-video-v10026/apply.py /tmp/king10026
      - name: Video-specific Party Room regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king10026')
          p=(r/'app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          cover=(r/'app/src/main/java/com/kingplus/social/KingRoomCoverView.java').read_text()
          gradle=(r/'app/build.gradle').read_text()
          assert "versionCode 305;" in gradle
          assert "10.0.26-party-room-session-fixes-test" in gradle
          assert "roomVisitStarted10026=System.currentTimeMillis()" in p
          assert "if(!currentVisitDocument10026(d))continue;" in p
          assert "currentVisitDocument10026(docV530)" in p
          assert 'unregisterMember(); // Capture old room + session for guarded server release first.' in p
          assert "seatNames.clear();seatUids.clear();seatMics.clear();" in p
          assert "memberNames.clear();memberUids.clear();memberPhotos540.clear();" in p
          assert "roomRootLp.bottomMargin = dp(84)" in p
          assert "new FrameLayout.LayoutParams(-1,dp(82))" in p
          assert "int bottom=bars.bottom;" in p
          assert "localCoverUri10026=pendingCreateCoverUri" in p
          assert "img.setImageURI(localCoverUri10026)" in p
          assert '"♛"' in cover
          print("PASS Room join/leave UI isolation, short chat, emoji guard, bottom controls, cover preview")
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10026tests
          javac -d /tmp/king10026tests /tmp/king10026/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10026tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10026/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10026
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10013/role-safety.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs && node tests/firestore/role-safety.test.mjs"
      - name: Combined Me/Home/Party 12 real-data security scenarios
        working-directory: /tmp/king10026
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10019/rtc-membership-current-rules.test.mjs" tests/firestore/rtc-membership-firestore.test.mjs
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10020/mute-all-contract.test.mjs" tests/firestore/mute-all-contract.test.mjs
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-10020-combined --config firebase-emulator.json "node tests/firestore/visitor-pages-firestore.test.mjs && node tests/firestore/me-gallery-live-firestore.test.mjs && node tests/firestore/moments-cross-device-firestore.test.mjs && node tests/firestore/mic-consent-firestore.test.mjs && node tests/firestore/rtc-membership-firestore.test.mjs && node tests/firestore/room-game-gift.test.mjs && node tests/firestore/host-role-private-firestore.test.mjs && node tests/firestore/party-room-vote-firestore.test.mjs && node tests/firestore/mute-all-contract.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10026
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10026prev/KING-Plus-v10.0.25-Six-Pages-TEST.apk
          new=/tmp/king10026/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='305'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10026out /tmp/king10026/tools/party-video-v10026
          cp tools/party-video-v10026/* /tmp/king10026/tools/party-video-v10026/
          cp .github/workflows/king-party-room-video-v10026.yml /tmp/king10026/.github/workflows/
          cp /tmp/king10026/app/build/outputs/apk/debug/app-debug.apk /tmp/king10026out/KING-Plus-v10.0.26-Party-Room-TEST.apk
          rm -f /tmp/king10026/app/kingplus-ci-debug.keystore
          cd /tmp/king10026
          zip -qr /tmp/king10026out/KING-Plus-v10.0.26-Party-Room-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10026out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10026-Party-Room-TEST-APK-and-Source
          path: /tmp/king10026out/*
          retention-days: 14
          if-no-files-found: error
