name: KING Plus v9.9.19 - Room Exit Seat Sync TEST
on:
  push:
    branches: [work/king-v9919-seat-exit-fix]
    paths:
      - 'tools/v9919/**'
      - '.github/workflows/king-v9919-room-exit.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: king-v9919-exit
  cancel-in-progress: false
jobs:
  two-account-and-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch exact verified v9.9.18 complete source and matching APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9919 /tmp/king9919old
          gh release download v9.9.18-room-stability \
            -p 'KING-Plus-v9.9.18-Room-Stability-Source.zip' -D /tmp/king9919old
          gh release download v9.9.18-room-stability \
            -p 'KING-Plus-v9.9.18-Room-Stability-TEST.apk' -D /tmp/king9919old
          unzip -q /tmp/king9919old/KING-Plus-v9.9.18-Room-Stability-Source.zip -d /tmp/king9919
          test -s /tmp/king9919/app/src/main/java/com/kingplus/social/PartyActivity.java
          test -s /tmp/king9919/app/src/main/java/com/kingplus/social/KingChessRules.java
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9919/app/kingplus-ci-debug.keystore
      - name: Apply room exit cleanup, preserving full KING Party and Chess
        run: |
          set -euo pipefail
          python3 tools/v9919/king_room_exit_cleanup.py /tmp/king9919
          mkdir -p /tmp/king9919/tests/firestore
          cp tools/v9919/room_exit_firestore.test.mjs /tmp/king9919/tests/firestore/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/king9919/app/src/main/java/com/kingplus/social')
          party=(p/'PartyActivity.java').read_text()
          assert party.count('whereEqualTo("uid",leavingUid9919)')==1
          assert party.count('KingRoomPresence967.canRemove(')>=2
          assert 'approveOrMoveMemberSeat9913' in party
          assert 'openLiveChess9917' in party
          assert 'chatRoom9918' in party
          assert 'responsiveWorld9915' in (p/'KingNative3DRoom.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (p/'KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (p/'KingRecharge974Activity.java').read_text()
          print('PASS source integrity and room-exit session safety')
          PY
      - name: Install Firebase Rules emulator tools
        working-directory: /tmp/king9919/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Test actual two-account Firestore seat and member cleanup
        working-directory: /tmp/king9919
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec \
             --only firestore --project demo-kingplus-exit-9919 --config firebase-emulator.json \
             "node tests/firestore/room_exit_firestore.test.mjs"
      - name: Compile full KING Android app with safe Room Leave
        working-directory: /tmp/king9919
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify Android package, signer and safe in-place upgrade
        run: |
          set -euo pipefail
          OLD=/tmp/king9919old/KING-Plus-v9.9.18-Room-Stability-TEST.apk
          NEW=/tmp/king9919/app/build/outputs/apk/debug/app-debug.apk
          test -s "$OLD" && test -s "$NEW"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='197'"
          "$AAPT" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='198'"
          "$SIGNER" verify --print-certs "$OLD" > /tmp/king9919-oldkey
          "$SIGNER" verify --print-certs "$NEW" > /tmp/king9919-newkey
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9919-oldkey | head -1 || true)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9919-newkey | head -1 || true)"
          test -n "$a" && test "$a" = "$b"
          echo 'PASS: same package, higher versionCode, identical APK certificate'
      - name: Package APK and clean complete source ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9919out
          cp /tmp/king9919/app/build/outputs/apk/debug/app-debug.apk \
             /tmp/king9919out/KING-Plus-v9.9.19-Room-Seat-Sync-TEST.apk
          rm -f /tmp/king9919/app/kingplus-ci-debug.keystore
          cd /tmp/king9919
          zip -q -r /tmp/king9919out/KING-Plus-v9.9.19-Room-Seat-Sync-Source.zip . \
            -x 'app/build/*' './app/build/*' '.gradle/*' './.gradle/*' \
               'build/*' './build/*' '*/build/*' '*/.gradle/*' \
               '*.apk' '*.aab' '*.jks' '*.keystore' '*local.properties' '*.zip'
          sha256sum /tmp/king9919out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9919-Exit-Sync-Test-APK-and-Source
          path: /tmp/king9919out/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish verified TEST, never claim incomplete app is Final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v9.9.19-room-seat-sync /tmp/king9919out/* \
            --target "$GITHUB_SHA" --prerelease \
            --title 'KING Plus v9.9.19 — Room Seat Exit Sync TEST' \
            --notes 'Fixes ghost occupied Mic Seats after explicit live Party room leave/switch/activity destroy. A server-scoped Firestore transaction now deletes only seats owned by the authenticated leaving UID and its matching member session, protecting the other phone / newer concurrent same-account session. Verified with independent two-account Firestore emulator tests, Android APK compilation and matching v9.9.18 signing certificate. Prior KING Plus Chess, Party, Gift, Profile and Voice source retained. Offline/force-killed phones can still need host stale-presence cleanup. This is NOT complete Bolo Hi design, all games, all 3D avatars, production RTC, payment or cross-phone final acceptance. Marked TEST honestly; billing remains disabled.'
