name: KING Stage14 Real Quick Actions and Back Navigation Audit
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-stage14-deep-route-audit.yml'
      - 'ci/final_five/stage14_deep_quick_router_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - name: Restore newest Stage13 complete source, not earlier APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-stage14 /tmp/king-stage14zip
          gh run download 38136398831 -n KING-Plus-Stage13-Room-Lock-Integrated-Source-Only -D /tmp/king-stage14zip
          unzip -q /tmp/king-stage14zip/KING-Plus-Stage13-Room-Lock-Fix-IN-PROGRESS-source.zip -d /tmp/king-stage14
      - name: Audit actual Party quick and Back handlers
        run: python3 ci/final_five/stage14_deep_quick_router_audit.py
