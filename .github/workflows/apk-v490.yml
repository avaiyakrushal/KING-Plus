name: Build KING Plus v4.9.0 Party Room Full Feature

on:
  push:
    branches: [ real-social-v390-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build v4.9.0 Party Room Full Feature
        run: bash tools/build_v490.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v4.9.0-party-room-full-feature
          path: release_v490/*
          if-no-files-found: error
