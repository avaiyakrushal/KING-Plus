name: Inspect KING Plus VIP Family Chat Baseline
on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/inspect-v972-vip-family-chat.yml'
      - 'ci/v972/inspect_family_source_v972.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - name: Recover last successful v9.7.0 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/src
          gh run download 37949379736 -n KING-Plus-v9.7.0-realtime-social-room-id-source -D /tmp/a
          unzip -q /tmp/a/KING-Plus-v9.7.0-realtime-social-room-id-source.zip -d /tmp/src
      - name: Inspect UI and Firestore lifecycle
        run: |
          python3 ci/v972/inspect_family_source_v972.py /tmp/src > /tmp/vip-family-audit.txt
          head -c 102000 /tmp/vip-family-audit.txt
