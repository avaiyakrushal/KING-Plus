name: Build KING Plus v9.4.5 Social Profile Runtime

on:
  push:
    branches: ['build/v9.4.5-social-profile-runtime']
    paths:
      - '.github/workflows/apk-v945-social.yml'
      - 'ci/v945/patch_v945.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: king-plus-v945-social
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v9.4.5-social-profile-runtime

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recover verified v9.4.1 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v941 /tmp/src
          mkdir -p /tmp/v941 /tmp/src
          gh run download 37657265816 -n KING-Plus-v9.4.1-stability-source -D /tmp/v941
          unzip -q /tmp/v941/KING-Plus-v9.4.1-stability-source.zip -d /tmp/src

      - name: Apply parity/runtime patches
        run: |
          python3 ci/v942/patch_v942.py /tmp/src
          python3 ci/v943/patch_v943.py /tmp/src
          python3 ci/v944/patch_v944.py /tmp/src
          python3 ci/v945/patch_v945.py /tmp/src

      - name: v9.4.5 feature gates
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          grep -F "versionCode 144; versionName '9.4.5-social-profile-runtime'" app/build.gradle
          grep -F 'Offline • People will reconnect automatically' app/src/main/java/com/kingplus/social/SocialActivity.java
          grep -F '↻ Retry Profile' app/src/main/java/com/kingplus/social/KingPublicProfileActivity.java
          grep -F 'communityRetry945' app/src/main/java/com/kingplus/social/CommunityHubActivity.java
          grep -F 'KingWardrobeActivity.class' app/src/main/java/com/kingplus/social/KingVipVisualActivity.java
          grep -F 'Offline • Party room will reconnect automatically' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'Offline • Multi Video seats will reconnect automatically' app/src/main/java/com/kingplus/social/KingMultiVideoActivity.java
          grep -F '↻ Reconnect Room' app/src/main/java/com/kingplus/social/OnlineLudoActivity.java

      - name: Compile v9.4.5 APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon

      - name: Static runtime audit
        working-directory: /tmp/src
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('app/src/main')
          manifest=(root/'AndroidManifest.xml').read_text(errors='ignore')
          declared=set(re.findall(r'<activity[^>]+android:name="\.([^"]+)"',manifest))
          intents=set()
          for p in (root/'java/com/kingplus/social').glob('*.java'):
              t=p.read_text(errors='ignore')
              intents.update(re.findall(r'new (?:android\.content\.)?Intent\(this,\s*([A-Za-z0-9_]+)\.class\)',t))
          missing=sorted(x for x in intents if x not in declared and x!='MainActivity')
          print('Missing manifest targets:',missing)
          if missing: raise SystemExit(1)
          social=(root/'java/com/kingplus/social/SocialActivity.java').read_text()
          if 'socialNetworkCallback945' not in social or 'showRetry945' not in social:
              raise SystemExit('Social retry/reconnect stage missing')
          pp=(root/'java/com/kingplus/social/KingPublicProfileActivity.java').read_text()
          if 'profileRetry945' not in pp: raise SystemExit('Profile retry stage missing')
          vip=(root/'java/com/kingplus/social/KingVipVisualActivity.java').read_text()
          if 'See More' not in vip or 'KingWardrobeActivity.class' not in vip:
              raise SystemExit('VIP actionable navigation missing')
          print('v9.4.5 static runtime audit passed')
          PY

      - name: Android lint
        working-directory: /tmp/src
        continue-on-error: true
        run: gradle :app:lintDebug --no-daemon

      - name: Package APK and source
        run: |
          set -euo pipefail
          cp /tmp/src/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.4.5-social-profile-runtime.apk
          cd /tmp/src
          zip -qr /tmp/KING-Plus-v9.4.5-social-profile-runtime-source.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.4.5-social-profile-runtime-APK
          path: /tmp/KING-Plus-v9.4.5-social-profile-runtime.apk
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.4.5-social-profile-runtime-source
          path: /tmp/KING-Plus-v9.4.5-social-profile-runtime-source.zip
          retention-days: 7
          if-no-files-found: error
