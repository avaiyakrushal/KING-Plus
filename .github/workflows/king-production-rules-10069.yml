name: KING validate and synchronize production Firestore rules
on:
  pull_request:
    paths: ['tools/ludo-production-v10069/**', 'tools/backend-readiness-10069/run-rules.cjs', 'tools/backend-readiness-10069/deploy-rules.cjs', '.github/workflows/king-production-rules-10069.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Restore exact validated v10.0.68 source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-live-artifact /tmp/king-live-source
          gh run download 39059846060 -n KING-v10068-Live-Profiles-History-TEST-APK-and-Source -D /tmp/king-live-artifact
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          p=Path('/tmp/king-live-artifact/KING-Plus-v10.0.68-Live-Profiles-History-TEST-Source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='ac7e66bff83e4bf4cef8928ca4f43e24f6c896931f312de94a621f8cb8d1c251'
          with zipfile.ZipFile(p) as z:z.extractall('/tmp/king-live-source')
          PY
      - name: Apply checksummed Ludo state machine and current-schema fixtures
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import base64,gzip,hashlib
          patch=gzip.decompress(base64.b64decode(Path('tools/ludo-production-v10069/changes.patch.gz.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest()=='0a756de1a6ae9fdedc2ec8bc68354e137c4c1c0f01f37751ff6d26d976a5a971'
          Path('/tmp/king-v10069.patch').write_bytes(patch)
          PY2
          cd /tmp/king-live-source
          patch --batch --fuzz=0 -p1 -i /tmp/king-v10069.patch
          cp "$GITHUB_WORKSPACE/app/kingplus-ci-debug.keystore" app/
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Install backend test dependencies
        working-directory: /tmp/king-live-source
        run: |
          npm ci --prefix tests/firestore --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Verify every existing Firestore suite before any production write
        working-directory: /tmp/king-live-source
        env: {CI: 'true'}
        run: tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-10069 --config firebase-emulator.json "node $GITHUB_WORKSPACE/tools/backend-readiness-10069/run-rules.cjs"
      - name: Java die vectors, backend regressions and full Android compilation
        working-directory: /tmp/king-live-source
        run: |
          mkdir -p /tmp/king-dice-java
          javac -d /tmp/king-dice-java app/src/main/java/com/kingplus/social/KingLudoDiceEntropy999.java tools/ludo-production-v10069/KingLudoServerDice10069Test.java
          java -cp /tmp/king-dice-java com.kingplus.social.KingLudoServerDice10069Test
          node --test functions/*.test.js tools/cloudflare-v10066/client.test.js
          gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify version and signing then package exact APK and source
        run: |
          set -euo pipefail
          old=/tmp/king-live-artifact/KING-Plus-v10.0.68-Live-Profiles-History-TEST.apk
          new=/tmp/king-live-source/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep '^package:' | grep "versionCode='348'" | grep com.kingplus.social
          "$signer" verify --print-certs "$old" >/tmp/king-old-cert
          "$signer" verify --print-certs "$new" >/tmp/king-new-cert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king-old-cert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king-new-cert | head -1)"
          test -n "$a" && test "$a" = "$b"
          mkdir -p /tmp/king-v10069-out
          cp "$new" /tmp/king-v10069-out/KING-Plus-v10.0.69-Server-Game-Rules-TEST.apk
          rm -f /tmp/king-live-source/app/kingplus-ci-debug.keystore
          cd /tmp/king-live-source
          zip -qr /tmp/king-v10069-out/KING-Plus-v10.0.69-Server-Game-Rules-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king-v10069-out/*
      - name: Deploy tested Firestore rules with production source lease and backup
        working-directory: /tmp/king-live-source
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          NODE_PATH: /tmp/king-live-source/functions/node_modules
        run: node "$GITHUB_WORKSPACE/tools/backend-readiness-10069/deploy-rules.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KING-production-rules-validation-10069
          path: /tmp/king-production-validation/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KING-v10069-Server-Game-Rules-TEST-APK-and-Source
          path: /tmp/king-v10069-out/*
          retention-days: 30
