name: KING validate and synchronize production Firestore rules
on:
  pull_request:
    paths: ['tools/backend-readiness-10069/**', '.github/workflows/king-production-rules-10069.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Restore exact validated v10.0.68 source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-live-artifact /tmp/king-live-source
          gh run download 39059846060 -n KING-v10068-Live-Profiles-History-TEST-APK-and-Source -D /tmp/king-live-artifact
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          p=Path('/tmp/king-live-artifact/KING-Plus-v10.0.68-Live-Profiles-History-TEST-Source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='ac7e66bff83e4bf4cef8928ca4f43e24f6c896931f312de94a621f8cb8d1c251'
          with zipfile.ZipFile(p) as z:z.extractall('/tmp/king-live-source')
          PY
      - name: Install backend test dependencies
        working-directory: /tmp/king-live-source
        run: |
          npm ci --prefix tests/firestore --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Verify every existing Firestore suite before any production write
        working-directory: /tmp/king-live-source
        env: {CI: 'true'}
        run: tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-10069 --config firebase-emulator.json "node $GITHUB_WORKSPACE/tools/backend-readiness-10069/run-rules.cjs"
      - name: Deploy tested Firestore rules with production source lease and backup
        working-directory: /tmp/king-live-source
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          NODE_PATH: /tmp/king-live-source/functions/node_modules
        run: node "$GITHUB_WORKSPACE/tools/backend-readiness-10069/deploy-rules.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KING-production-rules-validation-10069
          path: /tmp/king-production-validation/*
          retention-days: 14
