name: KING v9.9.89 Me Home Party regression and APK
on:
  push:
    branches: [work/king-me-home-party-v9989]
    paths: ['tools/me-home-party-v9989/**', '.github/workflows/king-me-home-party-v9989.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover exact v9.9.88 tested source and signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9989prev /tmp/king9989
          gh run download 38446166189 -n KING-v9988-Me-Verified-VIP-Noble-TEST-APK-and-Source -D /tmp/king9989prev
          unzip -q /tmp/king9989prev/KING-Plus-v9.9.88-Me-Verified-Prestige-TEST-Source.zip -d /tmp/king9989
          cp app/kingplus-ci-debug.keystore /tmp/king9989/app/
          python3 tools/me-home-party-v9989/apply.py /tmp/king9989
      - name: Me and Party history account and sorting regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9989tests
          javac -d /tmp/king9989tests /tmp/king9989/app/src/main/java/com/kingplus/social/KingMeRoomHistory9981.java /tmp/king9989/app/src/main/java/com/kingplus/social/KingAccountRoomHistory9989.java tools/me-home-party-v9989/KingRoomHistory9989Test.java /tmp/king9989/tools/me-page-v9981/KingMeRoomHistory9981Test.java
          java -cp /tmp/king9989tests com.kingplus.social.KingRoomHistory9989Test
          java -cp /tmp/king9989tests com.kingplus.social.KingMeRoomHistory9981Test
      - name: Full Android compile and APK
        working-directory: /tmp/king9989
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package version and same APK signer
        run: |
          set -euo pipefail
          old=/tmp/king9989prev/KING-Plus-v9.9.88-Me-Verified-Prestige-TEST.apk
          new=/tmp/king9989/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='268'"
          "$signer" verify --print-certs "$old" > /tmp/old9989cert
          "$signer" verify --print-certs "$new" > /tmp/new9989cert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/old9989cert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/new9989cert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package updated APK and full source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9989out /tmp/king9989/tools/me-home-party-v9989
          cp tools/me-home-party-v9989/* /tmp/king9989/tools/me-home-party-v9989/
          cp .github/workflows/king-me-home-party-v9989.yml /tmp/king9989/.github/workflows/
          cp /tmp/king9989/app/build/outputs/apk/debug/app-debug.apk /tmp/king9989out/KING-Plus-v9.9.89-Me-Home-Party-TEST.apk
          rm /tmp/king9989/app/kingplus-ci-debug.keystore
          cd /tmp/king9989
          zip -qr /tmp/king9989out/KING-Plus-v9.9.89-Me-Home-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9989out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9989-Me-Home-Party-TEST-APK-and-Source
          path: /tmp/king9989out/*
          retention-days: 14
          if-no-files-found: error
