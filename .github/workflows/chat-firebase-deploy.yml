name: Deploy KING Plus Chat Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-chat-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON" && exit 1)

      - name: Install Firebase tools
        run: |
          npm install --global firebase-tools
          npm install --prefix functions

      - name: Prepare credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Validate chat function syntax
        run: |
          node --check functions/index.js
          node --check functions/v3.js

      - name: Deploy chat rules and direct-message trigger only
        run: firebase deploy --project king-plus-2f365 --only firestore:rules,functions:onDirectMessageCreated --non-interactive

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
