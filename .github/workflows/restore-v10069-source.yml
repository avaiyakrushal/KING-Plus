name: Restore KING Plus v10.0.69 source snapshot
on:
  push:
    branches:
      - work/king-v10070-nongame-audit
    paths:
      - '.rollback-v10069/READY'
      - '.rollback-v10069/READY2'
permissions:
  contents: write
  workflows: write
jobs:
  restore-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Restore exact attached source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-v10069
          cat .rollback-v10069/chunk-* | base64 -d | tar -xzf - -C /tmp/king-v10069
          grep -q "versionCode 348" /tmp/king-v10069/app/build.gradle
          grep -q "versionName '10.0.69-server-game-rules'" /tmp/king-v10069/app/build.gradle
          rsync -a --delete --exclude='.git' /tmp/king-v10069/ "$GITHUB_WORKSPACE/"
          test ! -e .rollback-v10069
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Restore exact KING Plus v10.0.69 source snapshot"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
