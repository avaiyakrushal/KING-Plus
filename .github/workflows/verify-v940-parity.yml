name: Verify KING Plus v9.4.0 Full Parity Overhaul
on:
  push:
    branches: ['build/v9.4.0-full-parity-overhaul']
    paths:
      - '.github/workflows/verify-v940-parity.yml'
      - 'ci/v940/TRIGGER'
      - 'ci/v940/patch_v940.py'
      - 'ci/v940/PARITY-GATES.md'
      - 'firestore.rules'
      - 'storage.rules'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v9.4.0-full-parity-overhaul
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recover verified v9.3.1 source with retry and apply parity batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/base /tmp/src
          mkdir -p /tmp/base /tmp/src
          ok=0
          for attempt in 1 2 3 4; do
            rm -rf /tmp/base/* /tmp/src/*
            if gh run download 37492062823 -n KING-Plus-v9.3.1-APK-and-source -D /tmp/base; then
              ok=1
              break
            fi
            echo "v9.3.1 artifact download attempt $attempt failed; waiting before retry"
            sleep $((attempt*30))
          done
          if [ "$ok" != "1" ]; then
            echo "gh run download failed; trying direct GitHub artifact API fallback"
            rm -rf /tmp/base/* /tmp/src/*
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/37492062823/artifacts" --jq '.artifacts[] | select(.name=="KING-Plus-v9.3.1-APK-and-source") | .id' | head -n1)"
            test -n "$artifact_id" || (echo "Verified v9.3.1 artifact id not found" && exit 1)
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/base/v931-artifact.zip
            unzip -q /tmp/base/v931-artifact.zip -d /tmp/base
            test -f /tmp/base/KING-Plus-v9.3.1-source.zip || (echo "v9.3.1 source zip missing inside artifact" && exit 1)
          fi
          unzip -q /tmp/base/KING-Plus-v9.3.1-source.zip -d /tmp/src
          python3 ci/v940/patch_v940.py /tmp/src
          cp ci/v940/PARITY-MATRIX.md /tmp/src/PARITY-MATRIX-v9.4.0.md
          cp ci/v940/PARITY-GATES.md /tmp/src/PARITY-GATES-v9.4.0.md
          cp firestore.rules /tmp/src/firestore.rules
          cp storage.rules /tmp/src/storage.rules
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/app/build.gradle');s=p.read_text()
          old="versionCode 138; versionName '9.3.1'"
          if old not in s: raise SystemExit('Expected v9.3.1 version line not found')
          p.write_text(s.replace(old,"versionCode 139; versionName '9.4.0-dev'",1))
          PY
      - name: Verify parity markers
        run: |
          grep -F 'KingLudoLobbyActivity' /tmp/src/app/src/main/AndroidManifest.xml
          grep -F 'KingVipVisualActivity' /tmp/src/app/src/main/AndroidManifest.xml
          ! grep -F 'com.android.billingclient:billing' /tmp/src/app/build.gradle
          test ! -f /tmp/src/app/src/main/java/com/kingplus/social/BillingManager.java
          ! grep -F 'Open Play Recharge' /tmp/src/app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'phoneResendToken940' /tmp/src/app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'setForceResendingToken(phoneResendToken940)' /tmp/src/app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'publicFollowers940' /tmp/src/app/src/main/java/com/kingplus/social/KingPublicProfileActivity.java
          grep -F 'profileVisitorsChip940' /tmp/src/app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'logProfileVisit940' /tmp/src/app/src/main/java/com/kingplus/social/KingPublicProfileActivity.java
          grep -F 'WACKO ITEM MODE' /tmp/src/app/src/main/java/com/kingplus/social/KingLudoLobbyActivity.java
          grep -F 'First VIP Reward Pack' /tmp/src/app/src/main/java/com/kingplus/social/KingVipVisualActivity.java
          grep -F 'String[] items={"Square","Privilege Pack"' /tmp/src/app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'JitsiMeetView inRoomVoiceView940' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'buildSetAudioMutedIntent' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'ludo_matches' /tmp/src/app/src/main/java/com/kingplus/social/OnlineLudoActivity.java
          grep -F 'partyRoomMode' /tmp/src/app/src/main/java/com/kingplus/social/OnlineLudoActivity.java
          grep -F 'showLiveEmojiPanelV530' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'giftShopPanel' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'audioPkPanel700' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'document("audio_pk")' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'Start 3 min PK' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'ktvQueuePanel' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'document("ktv")' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'Host/co-host selects the next singer' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'Mic ON • live inside Party room' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'slug.equals(inRoomVoiceSlug940)' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'Offline • checking cached Party rooms' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'Loading KING profiles…' /tmp/src/app/src/main/java/com/kingplus/social/DiscoverActivity.java
          grep -F 'Offline • showing local fallback' /tmp/src/app/src/main/java/com/kingplus/social/ChatActivity.java
          grep -F 'Offline / sync unavailable • showing recent local conversations' /tmp/src/app/src/main/java/com/kingplus/social/InboxActivity.java
          grep -F 'showCloudNotifications940' /tmp/src/app/src/main/java/com/kingplus/social/InboxActivity.java
          grep -F 'n.getReference().update("read",true)' /tmp/src/app/src/main/java/com/kingplus/social/InboxActivity.java
          grep -F "affectedKeys().hasOnly(['read'])" /tmp/src/firestore.rules
          grep -F 'collection("notifications")' /tmp/src/app/src/main/java/com/kingplus/social/InboxActivity.java
          grep -F 'match /notifications/{uid}/items/{itemId}' /tmp/src/firestore.rules
          grep -F 'addDiscoverEntrances940' /tmp/src/app/src/main/java/com/kingplus/social/DiscoverActivity.java
          grep -F 'loadSocialPhoto940' /tmp/src/app/src/main/java/com/kingplus/social/SocialActivity.java
          grep -F 'memberPhotos540.get(uid)' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'loadPeerHeader940' /tmp/src/app/src/main/java/com/kingplus/social/ChatActivity.java
          grep -F 'lobbyMemberCountListeners940' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          ! grep -F 'CloudBackend.sendDirectMessageNotification' /tmp/src/app/src/main/java/com/kingplus/social/ChatActivity.java
          ! grep -F 'CloudBackend.sendFollowNotification' /tmp/src/app/src/main/java/com/kingplus/social/SocialActivity.java
          ! grep -F 'CloudBackend.sendFollowNotification' /tmp/src/app/src/main/java/com/kingplus/social/DiscoverActivity.java
          ! grep -F 'CloudBackend.sendFollowNotification' /tmp/src/app/src/main/java/com/kingplus/social/KingPublicProfileActivity.java
          grep -F 'addProfileStat(counts,"…","Followers"' /tmp/src/app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'putExtra("requestedGame",code)' /tmp/src/app/src/main/java/com/kingplus/social/KingDeepFlowActivity.java
          grep -F 'seenLiveEmojiEventsV530.size()>80' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'openRoomGames740()' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'normalizeRoomGame940' /tmp/src/app/src/main/java/com/kingplus/social/RoomGameActivity.java
          grep -F 'KingRoomCoverView createCover940' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'rows940=(pendingCreateSeats+3)/4' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'openCommunityHub700("Family")' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'safeLocalName.isEmpty()?googleName:safeLocalName' /tmp/src/app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'safeLocalPhoto.isEmpty()?googlePhoto:safeLocalPhoto' /tmp/src/app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'kickUser' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'banUser' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'coHostDialog' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'game_votes' /tmp/src/app/src/main/java/com/kingplus/social/RoomGameActivity.java
          grep -F 'match /ludo_matches/{matchCode}' /tmp/src/firestore.rules
          grep -F 'match /game_state/{stateId}' /tmp/src/firestore.rules
          grep -F 'match /music_state/{stateId}' /tmp/src/firestore.rules
          grep -F 'match /public_profiles/{uid}' /tmp/src/firestore.rules
          grep -F 'match /families/{familyCode}' /tmp/src/firestore.rules
          grep -F 'match /relationships/{relationshipId}' /tmp/src/firestore.rules
          grep -F 'match /moments/{momentId}' /tmp/src/firestore.rules
          grep -F 'match /chat_media/{ownerUid}/{threadId}/{fileName}' /tmp/src/storage.rules
      - name: Compile parity development build
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle compile attempt $attempt/3"
            if gradle :app:assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Compile/dependency resolution failed; retrying after transient repository cooldown"
              sleep $((attempt*25))
            fi
          done
          exit 1
      - name: Prepare current test APK
        run: |
          cp /tmp/src/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.4.0-current-test.apk
      - name: Upload current test APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.4.0-current-test
          path: /tmp/KING-Plus-v9.4.0-current-test.apk
          if-no-files-found: error
          retention-days: 7
