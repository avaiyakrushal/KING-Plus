name: Verify KING Plus v9.4.0 Full Parity Overhaul
on:
  push:
    branches: ['build/v9.4.0-full-parity-overhaul']
    paths:
      - '.github/workflows/verify-v940-parity.yml'
      - 'ci/v940/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v9.4.0-full-parity-overhaul
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy branch source and apply parity batch
        run: |
          set -euo pipefail
          rm -rf /tmp/src
          mkdir -p /tmp/src
          rsync -a --delete --exclude '.git' ./ /tmp/src/
          python3 ci/v940/patch_v940.py /tmp/src
          cp ci/v940/PARITY-MATRIX.md /tmp/src/PARITY-MATRIX-v9.4.0.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/app/build.gradle');s=p.read_text()
          old="versionCode 138; versionName '9.3.1'"
          if old not in s: raise SystemExit('Expected v9.3.1 version line not found')
          p.write_text(s.replace(old,"versionCode 139; versionName '9.4.0-dev'",1))
          PY
      - name: Verify parity markers
        run: |
          grep -F 'KingLudoLobbyActivity' /tmp/src/app/src/main/AndroidManifest.xml
          grep -F 'KingVipVisualActivity' /tmp/src/app/src/main/AndroidManifest.xml
          grep -F 'WACKO ITEM MODE' /tmp/src/app/src/main/java/com/kingplus/social/KingLudoLobbyActivity.java
          grep -F 'First VIP Reward Pack' /tmp/src/app/src/main/java/com/kingplus/social/KingVipVisualActivity.java
          grep -F 'String[] items={"Square","Privilege Pack"' /tmp/src/app/src/main/java/com/kingplus/social/MainActivity.java
      - name: Compile parity development build
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon
