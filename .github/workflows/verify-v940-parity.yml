name: Verify KING Plus v9.4.0 Full Parity Overhaul
on:
  push:
    branches: ['build/v9.4.0-full-parity-overhaul']
    paths:
      - '.github/workflows/verify-v940-parity.yml'
      - 'ci/v940/TRIGGER'
      - 'ci/v940/patch_v940.py'
      - 'ci/v940/PARITY-GATES.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v9.4.0-full-parity-overhaul
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recover verified v9.3.1 source with retry and apply parity batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/base /tmp/src
          mkdir -p /tmp/base /tmp/src
          ok=0
          for attempt in 1 2 3 4; do
            rm -rf /tmp/base/* /tmp/src/*
            if gh run download 37492062823 -n KING-Plus-v9.3.1-APK-and-source -D /tmp/base; then
              ok=1
              break
            fi
            echo "v9.3.1 artifact download attempt $attempt failed; waiting before retry"
            sleep $((attempt*30))
          done
          if [ "$ok" != "1" ]; then
            echo "gh run download failed; trying direct GitHub artifact API fallback"
            rm -rf /tmp/base/* /tmp/src/*
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/37492062823/artifacts" --jq '.artifacts[] | select(.name=="KING-Plus-v9.3.1-APK-and-source") | .id' | head -n1)"
            test -n "$artifact_id" || (echo "Verified v9.3.1 artifact id not found" && exit 1)
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/base/v931-artifact.zip
            unzip -q /tmp/base/v931-artifact.zip -d /tmp/base
            test -f /tmp/base/KING-Plus-v9.3.1-source.zip || (echo "v9.3.1 source zip missing inside artifact" && exit 1)
          fi
          unzip -q /tmp/base/KING-Plus-v9.3.1-source.zip -d /tmp/src
          python3 ci/v940/patch_v940.py /tmp/src
          cp ci/v940/PARITY-MATRIX.md /tmp/src/PARITY-MATRIX-v9.4.0.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/app/build.gradle');s=p.read_text()
          old="versionCode 138; versionName '9.3.1'"
          if old not in s: raise SystemExit('Expected v9.3.1 version line not found')
          p.write_text(s.replace(old,"versionCode 139; versionName '9.4.0-dev'",1))
          PY
      - name: Verify parity markers
        run: |
          grep -F 'KingLudoLobbyActivity' /tmp/src/app/src/main/AndroidManifest.xml
          grep -F 'KingVipVisualActivity' /tmp/src/app/src/main/AndroidManifest.xml
          grep -F 'WACKO ITEM MODE' /tmp/src/app/src/main/java/com/kingplus/social/KingLudoLobbyActivity.java
          grep -F 'First VIP Reward Pack' /tmp/src/app/src/main/java/com/kingplus/social/KingVipVisualActivity.java
          grep -F 'String[] items={"Square","Privilege Pack"' /tmp/src/app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'JitsiMeetView inRoomVoiceView940' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'buildSetAudioMutedIntent' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'ludo_matches' /tmp/src/app/src/main/java/com/kingplus/social/OnlineLudoActivity.java
          grep -F 'partyRoomMode' /tmp/src/app/src/main/java/com/kingplus/social/OnlineLudoActivity.java
          grep -F 'showLiveEmojiPanelV530' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'giftShopPanel' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'audioPkPanel700' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'ktvQueuePanel' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'kickUser' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'banUser' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'coHostDialog' /tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'game_votes' /tmp/src/app/src/main/java/com/kingplus/social/RoomGameActivity.java
      - name: Compile parity development build
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle compile attempt $attempt/3"
            if gradle :app:assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Compile/dependency resolution failed; retrying after transient repository cooldown"
              sleep $((attempt*25))
            fi
          done
          exit 1
