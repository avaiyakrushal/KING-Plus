name: Build KING Plus v4.1.2 Google Login

on:
  push:
    branches: [real-social-v390-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build v4.1.2 Google Login
        run: bash tools/build_v412.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v4.1.2-google-login
          path: |
            release_v412/KING-Plus-v4.1.2-google-login-no-billing-test-otp.apk
            release_v412/KING-Plus-v4.1.2-google-login-source.zip
          if-no-files-found: error
