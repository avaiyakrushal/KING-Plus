name: Build KING Plus v3.9.2 Game Messages

on:
  push:
    branches: [real-social-v390-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v3.9.2
        run: bash tools/build_v392.sh

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v3.9.2-bolohi-game-messages
          path: |
            release/KING-Plus-v3.9.2-bolohi-game-messages-no-billing-test-otp.apk
            release/KING-Plus-v3.9.2-bolohi-game-messages-source.zip
          if-no-files-found: error
