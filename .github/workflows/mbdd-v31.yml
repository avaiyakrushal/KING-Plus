name: Build MB Diamond Diary v3.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
    paths:
      - 'mbdd_build/**'
      - '.github/workflows/mbdd-v31.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct v3.1.1 source
        run: |
          set -euxo pipefail
          rm -rf /tmp/mbdd-src /tmp/mbdd-source.zip
          mkdir -p /tmp/mbdd-src
          base64 -d mbdd_build/source-v311.b64 > /tmp/mbdd-source.zip
          unzip -t /tmp/mbdd-source.zip
          unzip -q /tmp/mbdd-source.zip -d /tmp/mbdd-src
          test -f /tmp/mbdd-src/app/build.gradle
          test -f /tmp/mbdd-src/app/src/main/AndroidManifest.xml
          test -f /tmp/mbdd-src/app/src/main/assets/app.html
          test -f /tmp/mbdd-src/app/src/main/assets/app.js

      - name: Apply latest Firebase config
        run: |
          set -euxo pipefail
          cp mbdd_build/google-services.json /tmp/mbdd-src/app/google-services.json

      - name: Verify login and report routing source
        run: |
          set -euxo pipefail
          grep -q 'શેઠ તરીકે Google સાથે લોગીન કરો' /tmp/mbdd-src/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'ઓફિસ / કલાકનું કામ' /tmp/mbdd-src/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'હીરાનું કામ' /tmp/mbdd-src/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'hoursReport' /tmp/mbdd-src/app/src/main/assets/app.html
          grep -q 'expenseReport' /tmp/mbdd-src/app/src/main/assets/app.html
          grep -q 'diamonds' /tmp/mbdd-src/app/src/main/assets/app.html

      - name: Build debug APK
        run: |
          set -euxo pipefail
          gradle -p /tmp/mbdd-src :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          set -euxo pipefail
          test -f /tmp/mbdd-src/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp /tmp/mbdd-src/app/build/outputs/apk/debug/app-debug.apk release/MB-Diamond-Diary-v3.1.1-new-login-report-routing.apk
          cd /tmp/mbdd-src && zip -qr /tmp/MB-Diamond-Diary-v3.1.1-new-login-report-routing-source.zip .
          cd "$GITHUB_WORKSPACE"
          cp /tmp/MB-Diamond-Diary-v3.1.1-new-login-report-routing-source.zip release/

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.1.1-new-login-report-routing
          path: |
            release/MB-Diamond-Diary-v3.1.1-new-login-report-routing.apk
            release/MB-Diamond-Diary-v3.1.1-new-login-report-routing-source.zip
          if-no-files-found: error
