name: Build MB Diamond Diary v3.1.1 New

on:
  workflow_dispatch:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
    paths:
      - 'mbdd_build/**'
      - '.github/workflows/mbdd-v31.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct clean v3.1.1 source
        run: |
          set -euxo pipefail
          rm -rf /tmp/mbdd-src /tmp/mbdd-source.zip
          mkdir -p /tmp/mbdd-src
          cat \
            mbdd_build/source2.part00 \
            mbdd_build/source2.part01 \
            mbdd_build/fix02.0 \
            mbdd_build/fix02.1 \
            mbdd_build/fix02.2 \
            mbdd_build/fix02.3 \
            mbdd_build/source2.part03 \
            mbdd_build/fix04.0 \
            mbdd_build/fix04.1 \
            | tr -cd 'A-Za-z0-9+/=' \
            | base64 -d > /tmp/mbdd-source.zip
          unzip -t /tmp/mbdd-source.zip
          unzip -q /tmp/mbdd-source.zip -d /tmp/mbdd-src
          test -f /tmp/mbdd-src/app/build.gradle
          test -f /tmp/mbdd-src/app/src/main/AndroidManifest.xml
          test -f /tmp/mbdd-src/app/src/main/assets/app.html
          test -f /tmp/mbdd-src/app/src/main/assets/app.js
          test -f /tmp/mbdd-src/app/src/main/java/com/example/diamonddiary/MainActivity.java

      - name: Apply latest Firebase config and version
        run: |
          set -euxo pipefail
          cp mbdd_build/google-services.json /tmp/mbdd-src/app/google-services.json
          sed -i "s/versionCode 48/versionCode 49/" /tmp/mbdd-src/app/build.gradle
          sed -i "s/versionName '3.1.0'/versionName '3.1.1'/" /tmp/mbdd-src/app/build.gradle

      - name: Verify new login and report routing
        run: |
          set -euxo pipefail
          MAIN=/tmp/mbdd-src/app/src/main/java/com/example/diamonddiary/MainActivity.java
          HTML=/tmp/mbdd-src/app/src/main/assets/app.html
          grep -q 'શેઠ તરીકે Google સાથે લોગીન કરો' "$MAIN"
          grep -q 'beginRoleLogin("worker", "hour")' "$MAIN"
          grep -q 'beginRoleLogin("worker", "diamond")' "$MAIN"
          grep -q "diamonds: !worker || workMode === 'both' || workMode === 'diamond'" "$HTML"
          grep -q "hoursReport: !worker || workMode === 'both' || workMode === 'hour'" "$HTML"
          grep -q 'expenseReport: true' "$HTML"
          grep -q 'withdrawalReport: !worker' "$HTML"
          grep -q 'data-report-department="ચોડી"' "$HTML"
          grep -q 'data-report-department="પાન માર્કિસ"' "$HTML"
          grep -q 'data-report-department="કોરપી"' "$HTML"
          grep -q 'data-report-department="સરીન"' "$HTML"

      - name: Build new debug APK
        run: |
          set -euxo pipefail
          gradle -p /tmp/mbdd-src :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK and signer info
        run: |
          set -euxo pipefail
          APK=/tmp/mbdd-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p release
          cp "$APK" release/MB-Diamond-Diary-v3.1.1-new-login-report-routing.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee release/MB-Diamond-Diary-v3.1.1-signer.txt
          cd /tmp/mbdd-src && zip -qr /tmp/MB-Diamond-Diary-v3.1.1-new-login-report-routing-source.zip .
          cd "$GITHUB_WORKSPACE"
          cp /tmp/MB-Diamond-Diary-v3.1.1-new-login-report-routing-source.zip release/

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.1.1-new-login-report-routing
          path: |
            release/MB-Diamond-Diary-v3.1.1-new-login-report-routing.apk
            release/MB-Diamond-Diary-v3.1.1-new-login-report-routing-source.zip
            release/MB-Diamond-Diary-v3.1.1-signer.txt
          if-no-files-found: error
