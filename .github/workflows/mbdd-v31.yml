name: Build MB Diamond Diary v3.1

on:
  workflow_dispatch:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
    paths:
      - 'mbdd_build/**'
      - '.github/workflows/mbdd-v31.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct MB Diamond Diary source
        run: |
          set -euxo pipefail
          rm -rf /tmp/mbdd-src /tmp/mbdd-source.zip
          mkdir -p /tmp/mbdd-src
          : > /tmp/mbdd-source.zip
          for f in $(find mbdd_build -maxdepth 1 -type f -name 'source.part*' | sort); do
            echo "Decoding $f"
            tr -cd 'A-Za-z0-9+/=' < "$f" | base64 -d >> /tmp/mbdd-source.zip
          done
          unzip -t /tmp/mbdd-source.zip
          unzip -q /tmp/mbdd-source.zip -d /tmp/mbdd-src
          test -f /tmp/mbdd-src/app/build.gradle
          test -f /tmp/mbdd-src/app/src/main/AndroidManifest.xml

      - name: Apply login role and Firebase fixes
        run: |
          set -euxo pipefail
          cp mbdd_build/google-services.json /tmp/mbdd-src/app/google-services.json
          python3 mbdd_build/patch_login_role.py

      - name: Build debug APK
        run: |
          set -euxo pipefail
          gradle -p /tmp/mbdd-src :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          set -euxo pipefail
          test -f /tmp/mbdd-src/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp /tmp/mbdd-src/app/build/outputs/apk/debug/app-debug.apk release/MB-Diamond-Diary-v3.1.1-login-role-fix.apk
          cd /tmp/mbdd-src && zip -qr /tmp/MB-Diamond-Diary-v3.1.1-login-role-fix-source.zip .
          cd "$GITHUB_WORKSPACE"
          cp /tmp/MB-Diamond-Diary-v3.1.1-login-role-fix-source.zip release/

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.1.1-login-role-fix
          path: |
            release/MB-Diamond-Diary-v3.1.1-login-role-fix.apk
            release/MB-Diamond-Diary-v3.1.1-login-role-fix-source.zip
          if-no-files-found: error
