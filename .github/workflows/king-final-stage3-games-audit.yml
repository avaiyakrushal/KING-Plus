name: KING Final Five Sections - Stage 3 Games Audit
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-final-stage3-games-audit.yml'
      - 'ci/final_five/stage3_games_inspect.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - name: Download last full verified project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/finalgames /tmp/finalgameszip
          gh run download 38128027011 -n KING-Plus-v9.9.8-Real-Friends-Source -D /tmp/finalgameszip
          unzip -q /tmp/finalgameszip/KING-Plus-v9.9.8-Real-Friends-Server-Sync-source.zip 'app/src/main/java/com/kingplus/social/*.java' 'firestore.rules' -d /tmp/finalgames
      - name: Audit actual multiplayer rules, scoring and winner transitions
        run: python3 ci/final_five/stage3_games_inspect.py
