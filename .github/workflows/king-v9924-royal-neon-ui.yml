name: KING Plus v9.9.24 - Royal Neon Visual UI TEST
on:
  push:
    branches: [work/king-v9924-royal-neon-ui]
    paths:
      - 'tools/v9924/royal_neon_patch.py.gz.b64'
      - '.github/workflows/king-v9924-royal-neon-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: king-v9924-royal-neon
  cancel-in-progress: false
jobs:
  build-and-verify-royal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore exact v9.9.23 signed KING Plus APK and full source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9924 /tmp/king9924old
          gh release download v9.9.23-flying-knife -p 'KING-Plus-v9.9.23-Live-Knife-Game-Source.zip' -D /tmp/king9924old
          gh release download v9.9.23-flying-knife -p 'KING-Plus-v9.9.23-Live-Knife-Game-TEST.apk' -D /tmp/king9924old
          unzip -q /tmp/king9924old/KING-Plus-v9.9.23-Live-Knife-Game-Source.zip -d /tmp/king9924
          test -s /tmp/king9924/app/src/main/java/com/kingplus/social/MainActivity.java
          test -s /tmp/king9924/app/src/main/java/com/kingplus/social/PartyActivity.java
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9924/app/kingplus-ci-debug.keystore
      - name: Apply original Royal Neon Theme and verify all UI anchors
        run: |
          set -euo pipefail
          base64 -d tools/v9924/royal_neon_patch.py.gz.b64 | gzip -d > /tmp/king_royal9924.py
          echo '389b3243c3625cff67db1d5890fe989ce8bc94516926c0554a34d5f0050b5661  /tmp/king_royal9924.py' | sha256sum -c -
          python3 /tmp/king_royal9924.py /tmp/king9924
          python3 - <<'PY'
          from pathlib import Path
          base=Path('/tmp/king9924')
          s=(base/'app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          m=(base/'app/src/main/java/com/kingplus/social/MainActivity.java').read_text()
          assert 'addRoyalHero9924(page)' in s
          assert 'royalNeon9924(0xff48245c,0xff18142e' in s
          assert 'composerBox.setTextColor(Color.WHITE)' in s
          assert 'KING Plus' in m and '👑 KING Plus' in m
          assert 'Join by link / Room ID' in s
          assert 'openLiveChess9917' in s and 'openLiveKnife9923' in s
          assert 'approveOrMoveMemberSeat9913' in s
          assert 'whereEqualTo("uid",leavingUid9919)' in s
          assert 'muteOwnedSeat9920' in s
          assert 'videoMatchIncoming9922' in (base/'app/src/main/java/com/kingplus/social/KingMultiVideoActivity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (base/'app/src/main/java/com/kingplus/social/KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (base/'app/src/main/java/com/kingplus/social/KingRecharge974Activity.java').read_text()
          assert 'versionCode 203' in (base/'app/build.gradle').read_text()
          print('PASS Royal Neon home, room cards, login, Party chat, Create Room and functional compatibility')
          PY
      - name: Compile complete KING Plus Android Royal UI v9.9.24
        working-directory: /tmp/king9924
        run: gradle :app:assembleDebug --no-daemon
      - name: Confirm Android signing, brand, package and upgrade version
        run: |
          set -euo pipefail
          OLD=/tmp/king9924old/KING-Plus-v9.9.23-Live-Knife-Game-TEST.apk
          NEW=/tmp/king9924/app/build/outputs/apk/debug/app-debug.apk
          test -s "$OLD" && test -s "$NEW"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='202'"
          "$AAPT" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='203'"
          "$SIGNER" verify --print-certs "$OLD" > /tmp/king9924-oldkey
          "$SIGNER" verify --print-certs "$NEW" > /tmp/king9924-newkey
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9924-oldkey | head -1 || true)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9924-newkey | head -1 || true)"
          test -n "$a" && test "$a" = "$b"
          echo 'PASS Royal UI APK with same signer, same app ID, higher versionCode'
      - name: Create verified APK and clean original KING Plus source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9924out
          cp /tmp/king9924/app/build/outputs/apk/debug/app-debug.apk /tmp/king9924out/KING-Plus-v9.9.24-Royal-Neon-UI-TEST.apk
          rm -f /tmp/king9924/app/kingplus-ci-debug.keystore
          cd /tmp/king9924
          zip -q -r /tmp/king9924out/KING-Plus-v9.9.24-Royal-Neon-UI-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' '*.log' \
               'app/build/*' './app/build/*' '*/build/*' './.gradle/*' '*/.gradle/*' \
               '*.apk' '*.aab' '*.jks' '*.keystore' '*local.properties' '*.zip'
          BYTES="$(stat -c%s /tmp/king9924out/KING-Plus-v9.9.24-Royal-Neon-UI-Source.zip)"
          test "$BYTES" -gt 100000 && test "$BYTES" -lt 10000000
          sha256sum /tmp/king9924out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9924-Royal-Neon-TEST-APK-and-Source
          path: /tmp/king9924out/*
          retention-days: 14
          if-no-files-found: error
      - name: Release Royal UI TEST APK after all build checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v9.9.24-royal-neon-ui /tmp/king9924out/* \
            --target "$GITHUB_SHA" --prerelease \
            --title 'KING Plus v9.9.24 — Royal Neon UI TEST' \
            --notes 'NEW KING Plus original Royal Neon design, inspired by the users reference visual: dark galaxy-purple Party lobby instead of white, crown-gold branding, vivid pink-violet gradient interactive tabs, live Party hero banner with working Voice/Video/Games shortcuts, gold-bordered real room cards, royal Create Room, premium Party header/chat controls and the existing Google/Mobile/Facebook login styling. All older real Firebase Party, seats, host, Live Chess, Flying Knife, video matching and gift handlers retained. Android APK compiled and matches prior signing identity/upgrade. This is UI design work (not imported promotional mockup art) and not proof of all Bolo Hi functionality; physical phone review and separate production Firebase rules, RTC/billing providers still needed. TEST not final production.'
