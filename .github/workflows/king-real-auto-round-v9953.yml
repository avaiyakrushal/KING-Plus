name: KING v9.9.53 Auto-Finish Real Multiplayer Rounds TEST
on:
  push:
    branches: [work/king-auto-settle-multiplayer-v9953]
    paths: ['tools/auto-round-v9953/**','.github/workflows/king-real-auto-round-v9953.yml']
  pull_request:
    paths: ['tools/auto-round-v9953/**','.github/workflows/king-real-auto-round-v9953.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  compile-and-verify-real-party:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover signed complete v9.9.51 Android source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9953prev /tmp/king9953
          gh run download 38353792359 -n KING-v9952-Verified-Live-Party-Games-TEST-APK-Source -D /tmp/king9953prev
          test -s /tmp/king9953prev/KING-Plus-v9.9.52-Live-Party-Games-TEST.apk
          unzip -q /tmp/king9953prev/KING-Plus-v9.9.52-Live-Party-Games-Source.zip -d /tmp/king9953
          grep -q 'versionCode 231' /tmp/king9953/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9953/app/kingplus-ci-debug.keystore
      - name: Apply real live membership check to multiplayer RPS Dice Coin start
        run: |
          set -euo pipefail
          python3 tools/auto-round-v9953/apply.py /tmp/king9953
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9953')
          p=root/'app/src/main/java/com/kingplus/social'
          s=(p/'RoomGameActivity.java').read_text()
          assert 'else maybeAutoFinish9953();' in s
          assert 'lastAutoSettlementAttempt9953=roundId;' in s
          auto=s[s.index('    private void maybeAutoFinish9953(){'):s.index('    private void finishRound(){')]
          assert 'finishRound();' in auto and 'KingRoomAutoFinish9953.shouldFinish' in auto
          assert 'Spectating this round' in s
          finish=s[s.index('    private void finishRound(){'):s.index('    private String resultFor(')]
          assert 'Source.SERVER' in finish and 'db.runTransaction(tx->' in finish
          assert 'KingLivePartyRoster9952' in s and 'KingTttLiveRoster9951' in s
          assert 'pendingGiftEvents9944' in (p/'PartyActivity.java').read_text()
          assert 'LIVE_RECHARGE = false' in (p/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (p/'KingPremiumAccess981.java').read_text()
          assert 'versionCode 232' in (root/'app/build.gradle').read_text()
          print('PASS real automatic RPS Dice Coin results through existing SERVER transaction; gifting preserved')
          PY
      - name: Test complete, partial, cache and spectator settlement guards
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9953classes
          javac -d /tmp/king9953classes \
            /tmp/king9953/app/src/main/java/com/kingplus/social/KingRoomRoster9946.java \
            /tmp/king9953/app/src/main/java/com/kingplus/social/KingRoomAutoFinish9953.java \
            tools/auto-round-v9953/KingRoomAutoFinish9953Test.java
          java -cp /tmp/king9953classes com.kingplus.social.KingRoomAutoFinish9953Test
      - name: Install Firestore emulator test dependencies
        working-directory: /tmp/king9953/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Verify ghost Ready excluded and real-player RPS still playable
        working-directory: /tmp/king9953
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/real-game-roster-v9952/live-roster-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-live-roster-9953 --config firebase-emulator.json \
            "node tests/firestore/live-roster-firestore.test.mjs"
      - name: RPS Dice Coin move locking and host cancel/ready regression
        working-directory: /tmp/king9953
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-frozen-roster-9946 --config firebase-emulator.json \
            "node tests/firestore/frozen-ready-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-immutable-games-9943 --config firebase-emulator.json \
            "node tests/firestore/immutable-rounds-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-cancel-9947 --config firebase-emulator.json \
            "node tests/firestore/cancel-round-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-9938-live --config firebase-emulator.json \
            "node tests/firestore/room-game-gift.test.mjs"
      - name: Verify Gifting receiver receipts and anti-impersonation unchanged
        working-directory: /tmp/king9953
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-gift-receipts-9941 --config firebase-emulator.json \
            "node tests/firestore/gift-delivery-firestore.test.mjs"
      - name: Compile full Android app
        working-directory: /tmp/king9953
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify signed upgrade identity and exact version
        run: |
          set -euo pipefail
          old=/tmp/king9953prev/KING-Plus-v9.9.52-Live-Party-Games-TEST.apk
          new=/tmp/king9953/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='231'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='232'"
          "$signer" verify --print-certs "$old" >/tmp/oldcert
          "$signer" verify --print-certs "$new" >/tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package signed TEST APK and complete Android source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9953out
          cp /tmp/king9953/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9953out/KING-Plus-v9.9.53-Auto-Multiplayer-TEST.apk
          rm -f /tmp/king9953/app/kingplus-ci-debug.keystore
          cd /tmp/king9953
          zip -q -r /tmp/king9953out/KING-Plus-v9.9.53-Auto-Multiplayer-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
            './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9953out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9953-Real-Auto-Multiplayer-TEST-APK-and-Source
          path: /tmp/king9953out/*
          retention-days: 14
          if-no-files-found: error
