name: KING UX First - One-Tap Party Tools and Friends Navigation
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-ux-stage10-compile.yml'
      - 'ci/final_five/stage10_party_quick_navigation.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: king-ux-stage10-one-tap
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore full integrated KING project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-ux-app /tmp/king-ux-src
          gh run download 38132703654 -n KING-Plus-Full-Integrated-Social-Safety-Source-No-APK -D /tmp/king-ux-src
          unzip -q /tmp/king-ux-src/KING-Plus-Social-Safety-Integrated-IN-PROGRESS-source.zip -d /tmp/king-ux-app
          test -s /tmp/king-ux-app/app/src/main/java/com/kingplus/social/KingNative3DRoom.java
      - name: Add compact Party tools and simplify People screen
        run: |
          python3 -m py_compile ci/final_five/stage10_party_quick_navigation.py
          python3 ci/final_five/stage10_party_quick_navigation.py /tmp/king-ux-app
      - name: Verify all features and payment locks preserved
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king-ux-app')
          p=root/'app/src/main/java/com/kingplus/social'
          party=(p/'PartyActivity.java').read_text()
          social=(p/'SocialActivity.java').read_text()
          assert party.count('private void roomMenu()')==1
          assert party.count('private void roomMenuAll()')==1
          assert 'roomMenuAll();' in party
          for item in ['🎤 Mic ON','👥 Members','🎮 Games','💫 Interactive Emoji','🎁 Gift Wall','💬 Private chat','📹 Multi Video','🌐 3D World','🔎 Find room user','⚙ Room settings','🔗 Share room','⋯ All Tools']:
            assert item in party,item
          assert 'private void handleRoomMenuItem810(String x)' in party
          assert 'runPartyAction("quick-tool:"+item' in party
          assert 'KingNative3DRoom.open(' in party
          assert 'KingRoomDice997.open(' in party
          assert 'KingGiftSound993.setEnabled' in party
          assert 'connectionTest996' in social
          assert 'help992.setVisibility(android.view.View.GONE)' in social
          assert 'trueUid964.setVisibility(android.view.View.GONE)' in social
          assert 'set(profile, SetOptions.merge())' in (p/'CloudSync.java').read_text()
          assert 'request.resource.data.role == resource.data.role' in (root/'firestore.rules').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (p/'KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (p/'KingRecharge974Activity.java').read_text()
          print('PASS 12 fast actions, old toolbox retained, debug clutter hidden')
          PY
      - name: Build Android source without releasing an incomplete APK
        working-directory: /tmp/king-ux-app
        run: gradle :app:assembleDebug --no-daemon
      - name: Preserve patched full SOURCE only
        run: |
          set -euo pipefail
          APK=/tmp/king-ux-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep "^package:" | grep "name='com.kingplus.social'"
          cd /tmp/king-ux-app
          rm -rf .gradle build app/build
          zip -qr /tmp/KING-Plus-UX-One-Tap-Party-Source-IN-PROGRESS.zip . -x '*.apk'
          echo 'PASS: UX source built, no APK Release'
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-UX-One-Tap-Party-Source-Only
          path: /tmp/KING-Plus-UX-One-Tap-Party-Source-IN-PROGRESS.zip
          retention-days: 30
          if-no-files-found: error
      - name: Truthful UX summary
        run: |
          echo 'Quick Party action grid and Friends screen improvements compiled. All legacy tools retained. This is NOT complete Bolo Hi feature or visual parity, and not a FINAL APK.' >> "$GITHUB_STEP_SUMMARY"
