name: KING v9.9.38 Real Party Game and Gift Round Trip TEST
on:
  push:
    branches: [work/king-live-party-games-gifts-v9938]
    paths: ['tools/live-functional-v9938/**','.github/workflows/king-functional-live-9938.yml']
  pull_request:
    paths: ['tools/live-functional-v9938/**','.github/workflows/king-functional-live-9938.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  live-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exact prior v9.9.37 signed APK and full source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9938prev /tmp/king9938
          gh run download 38334461788 -n KING-v9937-Real-Room-Games-Gifts-TEST-APK-and-Source -D /tmp/king9938prev
          test -s /tmp/king9938prev/KING-Plus-v9.9.37-Real-Room-Games-Gifts-TEST.apk
          unzip -q /tmp/king9938prev/KING-Plus-v9.9.37-Real-Room-Games-Gifts-Source.zip -d /tmp/king9938
          grep -q 'versionCode 216' /tmp/king9938/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9938/app/kingplus-ci-debug.keystore
      - name: Integrate actual live membership, authoritative turns, atomic Gift synchronization
        run: |
          set -euo pipefail
          python3 tools/live-functional-v9938/apply.py /tmp/king9938
          cp tools/live-functional-v9938/room-game-gift.test.mjs /tmp/king9938/tests/firestore/
          node --check /tmp/king9938/functions/v3.js
          node --test /tmp/king9938/functions/play-purchase-service.test.js
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king9938')
          src=r/'app/src/main/java/com/kingplus/social'
          g=(src/'RoomGameActivity.java').read_text()
          p=(src/'PartyActivity.java').read_text()
          f=(r/'firestore.rules').read_text()
          assert 'MetadataChanges.INCLUDE' in g and 'membershipListener9938.remove()' in g
          assert 'collection("events").document(giftDeliveryId9937)' in p
          assert 'collection("messages").document(giftDeliveryId9937)' in p
          assert 'getAfter(' in f and "data.turnUid == playerUid" in f
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          assert 'versionCode 217' in (r/'app/build.gradle').read_text()
          print('PASS real Party/Game/Gift integration, no paid wallet')
          PY
      - name: Install Firestore emulator dependency lockfile
        working-directory: /tmp/king9938/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Test true two-user Gift/chat atomicity and Tic Tac Toe turns
        working-directory: /tmp/king9938
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-9938-live --config firebase-emulator.json \
            "node tests/firestore/room-game-gift.test.mjs"
      - name: Existing Party access and Game/Dice integrity regressions
        working-directory: /tmp/king9938
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-room-v9936 --config firebase-emulator.json \
            "node tests/firestore/functional-access.test.mjs"
          # New paired gift security supersedes the older standalone gift create test.
          # Keep the Dice controls/anti-spoof checks from last release.
          cp tests/firestore/games-gifts-firestore.test.mjs /tmp/games-gifts-9937.archived.mjs
          python3 - <<'PY'
          from pathlib import Path
          t=(Path('/tmp/games-gifts-9937.archived.mjs').read_text())
          assert "const dice=(who,value)" in t
          # The v9.9.38 paired-gift suite already tests all gift paths.
          i=t.index(" await assertSucceeds(setDoc(event(alice,'dice1')")
          pre=t[:t.index(" await assertSucceeds(setDoc(event(alice,'gift-ok')")]
          post=t[i:]
          # Defer dice events to after members have been created.
          Path('tests/firestore/dice-only-9938.test.mjs').write_text(pre+post)
          PY
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-games-gifts-9937 --config firebase-emulator.json \
            "node tests/firestore/dice-only-9938.test.mjs"
      - name: Compile full Android app (all games and features)
        working-directory: /tmp/king9938
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Check install upgrade signer, versionCode and resource preservation
        run: |
          set -euo pipefail
          old=/tmp/king9938prev/KING-Plus-v9.9.37-Real-Room-Games-Gifts-TEST.apk
          new=/tmp/king9938/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='216'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='217'"
          "$signer" verify --print-certs "$old" > /tmp/oldcert
          "$signer" verify --print-certs "$new" > /tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
          python3 - <<'PY'
          from zipfile import ZipFile
          old='/tmp/king9938prev/KING-Plus-v9.9.37-Real-Room-Games-Gifts-TEST.apk'
          new='/tmp/king9938/app/build/outputs/apk/debug/app-debug.apk'
          def count(path):
            with ZipFile(path) as f:n=set(f.namelist())
            return (sum(s.startswith('res/layout') and s.endswith('.xml') for s in n),
                    sum(s.startswith('res/drawable') and s.endswith(('.xml','.png','.webp')) for s in n))
          print('RESOURCE_COUNTS_OLD_NEW',count(old),count(new))
          assert count(old)==count(new)==(4065,8680)
          PY
      - name: Package installable test APK and full source ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9938out
          cp /tmp/king9938/app/build/outputs/apk/debug/app-debug.apk /tmp/king9938out/KING-Plus-v9.9.38-Real-Game-Gift-TEST.apk
          rm -f /tmp/king9938/app/kingplus-ci-debug.keystore
          cd /tmp/king9938
          zip -q -r /tmp/king9938out/KING-Plus-v9.9.38-Real-Game-Gift-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
               './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9938out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9938-Real-Game-Gift-TEST-APK-and-Source
          path: /tmp/king9938out/*
          retention-days: 14
          if-no-files-found: error
