name: KING v9.9.64 Real Party Game Quick Match Entry TEST
on:
  push:
    branches: [work/king-real-game-launch-v9964]
    paths: ['tools/game-launch-v9964/**', '.github/workflows/king-real-game-launch-v9964.yml']
  pull_request:
    paths: ['tools/game-launch-v9964/**', '.github/workflows/king-real-game-launch-v9964.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore complete signed v9.9.59 Party Games Gift runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9964 /tmp/king9964prev
          gh run download 38376718104 -n KING-v9963-Live-Games-Gift-Queue-TEST-APK-and-Source -D /tmp/king9964prev
          test -s /tmp/king9964prev/KING-Plus-v9.9.63-Live-Games-Gift-Queue-TEST.apk
          unzip -q /tmp/king9964prev/KING-Plus-v9.9.63-Live-Games-Gift-Queue-Source.zip -d /tmp/king9964
          grep -q 'versionCode 242' /tmp/king9964/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9964/app/kingplus-ci-debug.keystore
      - name: Replace misleading fake Game Center round with real Party entry
        run: |
          set -euo pipefail
          python3 tools/game-launch-v9964/apply.py /tmp/king9964
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9964')
          src=root/'app/src/main/java/com/kingplus/social'
          main=(src/'MainActivity.java').read_text()
          begin=main.index('    private void kingStartGame(String game,String mode){')
          end=main.index('    private void kingRecordGame(',begin)
          entry=main[begin:end]
          for token in ('KingRealGameRoute9964.route(game9964)',
                        'kingOpenGameRoom(game9964)',
                        'No match was played and no Game Points were credited'):
            assert token in entry,token
          for forbidden in ('Math.random()', 'kingRecordGame(', 'Game Points\\n', 'rival='):
            assert forbidden not in entry,forbidden
          assert 'new Intent(this,PartyActivity.class)' in main
          party=(src/'PartyActivity.java').read_text()
          game=(src/'RoomGameActivity.java').read_text()
          for token in ('KingGiftReceiptDurable9962','KingPartyMicConsent9956',
                        'KingPartyVoiceReconnect9957','KingGiftBurstBackpressure9963'):
            assert token in party,token
          assert 'KingTttFairRoster9960.pickPair' in game
          assert 'KingPartySocialRoster9959.isEligible' in game
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          assert 'versionCode 243' in (root/'app/build.gradle').read_text()
          print('PASS fake Game Center wins stopped; authenticated Party multiplayer flow retained')
          PY
      - name: Java test real Party Game Center launch decisions
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9964classes
          javac -d /tmp/king9964classes \
            /tmp/king9964/app/src/main/java/com/kingplus/social/KingRealGameRoute9964.java \
            tools/game-launch-v9964/KingRealGameRoute9964Test.java
          java -cp /tmp/king9964classes com.kingplus.social.KingRealGameRoute9964Test
      - name: Install real Firestore emulator dependencies
        working-directory: /tmp/king9964/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Firestore Party Ready true query with more than 50 stale unready
        working-directory: /tmp/king9964
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/live-party-v9963/ready-query-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-ready-filter-9963 --config firebase-emulator.json \
            "node tests/firestore/ready-query-firestore.test.mjs"
      - name: Firebase real Tic Tac Toe Ready off ghost and live pairing
        working-directory: /tmp/king9964
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/ttt-live-v9960/ttt-ready-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-ttt-9960 --config firebase-emulator.json \
            "node tests/firestore/ttt-ready-firestore.test.mjs"
      - name: Firestore emulator Host recipient-only private role and race protection
        working-directory: /tmp/king9964
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-host-role-v9961/host-role-private-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/host-role-private-firestore.test.mjs"
      - name: Regression real social game roles, privacy and simultaneous Host
        working-directory: /tmp/king9964
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-live-v9958/social-party-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/social-party-firestore.test.mjs"
      - name: Regression real Party Gift receipts and immutable game turns
        working-directory: /tmp/king9964
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          for test in gift-delivery-firestore.test.mjs immutable-rounds-firestore.test.mjs; do
            tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
              --project demo-king-live-ready-9959 --config firebase-emulator.json \
              "node tests/firestore/$test"
          done
      - name: Compile complete Android Party Games Gifting APK
        working-directory: /tmp/king9964
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify signed APK upgrade and zip integrity
        run: |
          set -euo pipefail
          old=/tmp/king9964prev/KING-Plus-v9.9.63-Live-Games-Gift-Queue-TEST.apk
          new=/tmp/king9964/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='243'"
          "$signer" verify --print-certs "$old" >/tmp/cert-old
          "$signer" verify --print-certs "$new" >/tmp/cert-new
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-old | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-new | head -1)"
          test -n "$a" && test "$a" = "$b"
          unzip -tq "$new" | tail -1
      - name: Package TEST APK and complete source, with no private signing key
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9964out
          cp /tmp/king9964/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9964out/KING-Plus-v9.9.64-Real-Party-Game-Launch-TEST.apk
          rm -f /tmp/king9964/app/kingplus-ci-debug.keystore
          cd /tmp/king9964
          zip -q -r /tmp/king9964out/KING-Plus-v9.9.64-Real-Party-Game-Launch-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
            './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9964out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9964-Real-Party-Game-Launch-TEST-APK-and-Source
          path: /tmp/king9964out/*
          retention-days: 14
          if-no-files-found: error
