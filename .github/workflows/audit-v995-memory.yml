name: Inspect 9.9.4 Party Memory and Games Lifecycle
on:
  push:
    branches: [work/reference-completion]
    paths: ['ci/v995_stability/**','.github/workflows/audit-v995-memory.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - name: Restore verified v9.9.4 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king995 /tmp/king995-art
          gh run download 38122185317 -n KING-Plus-v9.9.4-Animated-Gift-Art-Self-Gifts-Source -D /tmp/king995-art
          unzip -q /tmp/king995-art/KING-Plus-v9.9.4-Animated-Gift-Art-Self-Gifts-source.zip 'app/src/main/java/com/kingplus/social/*.java' -d /tmp/king995
      - name: Inspect Android lifecycle and unbounded media/listeners
        run: python3 ci/v995_stability/inspect_lifecycle.py
