name: Build KING Plus v9.6.3 Online Ludo Modes

on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/apk-v963-online-ludo-modes.yml'
      - 'ci/v963/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kingplus-v963-online-ludo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore successful v9.6.2 Android source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifacts /tmp/src
          if ! gh run download 37872963303 -n KING-Plus-v9.6.2-ludo-turn-guards-source -D /tmp/artifacts; then
            gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11590139515/zip > /tmp/artifacts/outer.zip
            unzip -q /tmp/artifacts/outer.zip -d /tmp/artifacts
          fi
          test -f /tmp/artifacts/KING-Plus-v9.6.2-ludo-turn-guards-source.zip
          unzip -q /tmp/artifacts/KING-Plus-v9.6.2-ludo-turn-guards-source.zip -d /tmp/src
      - name: Apply v9.6.3 Ludo functional modes
        run: python3 ci/v963/patch_v963.py /tmp/src
      - name: Validate Ludo entry flows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/src')
          pkg=root/'app/src/main/java/com/kingplus/social'
          menu=(pkg/'KingLudoLobbyActivity.java').read_text()
          ludo=(pkg/'OnlineLudoActivity.java').read_text()
          g=(root/'app/build.gradle').read_text()
          rules=(root/'firestore.rules').read_text()
          assert "versionCode 154; versionName '9.6.3-online-ludo-modes'" in g
          assert 'CREATE 1 VS 1' in menu and 'CREATE 4P' in menu
          assert 'JOIN CODE' in menu and 'RECONNECT' in menu
          assert 'this::openOffline' in menu
          assert 'ludoCreateCapacity963' in menu and 'ludoCreateCapacity963' in ludo
          assert 'ludoAutoReconnect963' in menu and 'ludoAutoReconnect963' in ludo
          assert 'createMatch(capacity963);' in ludo
          assert 'joinMatch(saved);' in ludo
          for fake in ('WACKO ITEM MODE','CHAMPIONSHIP','SHOP","RANK","PLAY","EVENT","REWARD'):
            assert fake not in menu
          assert 'KingLudoTurn962.canSkip(' in ludo
          assert "duration.value(60,'s')" in rules
          assert 'KingCrashWatch958' in ludo
          assert 'joinRoomLinkDialog959' in (pkg/'PartyActivity.java').read_text()
          print('PASS: 2/4 player create, code join, reconnect, offline, anti-spam + old features')
          PY
      - name: Compile KING Plus Android APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon
      - name: Bundle new APK and source
        run: |
          set -euo pipefail
          cp /tmp/src/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.6.3-online-ludo-modes.apk
          cd /tmp/src
          zip -qr /tmp/KING-Plus-v9.6.3-online-ludo-modes-source.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.6.3-online-ludo-modes-APK
          path: /tmp/KING-Plus-v9.6.3-online-ludo-modes.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.6.3-online-ludo-modes-source
          path: /tmp/KING-Plus-v9.6.3-online-ludo-modes-source.zip
          retention-days: 7
          if-no-files-found: error
