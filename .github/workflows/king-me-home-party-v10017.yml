name: KING v10.0.17 Me Home CP and Real Loop Mic Safety TEST APK
on:
  push:
    branches: [work/king-me-home-party-v10017]
    paths:
      - 'tools/me-home-party-v10017/**'
      - '.github/workflows/king-me-home-party-v10017.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.16 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10017prev /tmp/king10017
          gh run download 38566300998 -n KING-v10016-Me-Home-Party-TEST-APK-and-Source -D /tmp/king10017prev
          unzip -q /tmp/king10017prev/KING-Plus-v10.0.16-Me-Home-Party-TEST-Source.zip -d /tmp/king10017
          cp app/kingplus-ci-debug.keystore /tmp/king10017/app/
          python3 tools/me-home-party-v10017/apply.py /tmp/king10017
      - name: Me Home and Party v10.0.17 source regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king10017')
          me=(r/'app/src/main/java/com/kingplus/social/MainActivity.java').read_text()
          home=(r/'app/src/main/java/com/kingplus/social/CommunityHubActivity.java').read_text()
          party=(r/'app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          assert 'Hosted Party Room ID copied' in me
          assert 'setOnLongClickListener(v->' in me
          assert 'hostedRoomsCurrent10015(host,account10015,generation10015)' in me
          assert '↻ Refresh CP & Requests' in home
          assert 'cpRefreshAccount10017.equals(me.getUid())' in home
          assert 'render("Relationship")' in home
          assert 'loadRelationshipPage10016(' in home
          assert 'requestedSeat10017.intValue()!=target9913' in party
          assert 'Boolean.TRUE.equals(roomFresh9970.getBoolean("closed"))' in party
          assert 'Loop Mic requests' in party
          assert 'seatRequestDecision(request,seat.intValue(),room10017,actor10017,generation10017)' in party
          assert 'loopMicPanel700(){' in party
          assert "versionCode 296;" in (r/'app/build.gradle').read_text()
          print('PASS Me hosted room sharing, Home CP refresh and Loop Mic safety assertions')
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10017tests
          javac -d /tmp/king10017tests /tmp/king10017/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10017tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10017/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10017
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10013/role-safety.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs && node tests/firestore/role-safety.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10017
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10017prev/KING-Plus-v10.0.16-Me-Home-Party-TEST.apk
          new=/tmp/king10017/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='296'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10017out /tmp/king10017/tools/me-home-party-v10017
          cp tools/me-home-party-v10017/* /tmp/king10017/tools/me-home-party-v10017/
          cp .github/workflows/king-me-home-party-v10017.yml /tmp/king10017/.github/workflows/
          cp /tmp/king10017/app/build/outputs/apk/debug/app-debug.apk /tmp/king10017out/KING-Plus-v10.0.17-Me-Home-Party-TEST.apk
          rm -f /tmp/king10017/app/kingplus-ci-debug.keystore
          cd /tmp/king10017
          zip -qr /tmp/king10017out/KING-Plus-v10.0.17-Me-Home-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10017out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10017-Me-Home-Party-TEST-APK-and-Source
          path: /tmp/king10017out/*
          retention-days: 14
          if-no-files-found: error
