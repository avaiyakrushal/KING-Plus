name: Build KING Plus v5.3.1 Full-screen Live Emoji

on:
  push:
    branches: [ v530-build-clean ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build v5.3.1 Full-screen Realtime Live Emoji
        run: bash tools/build_v530.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v5.3.1-full-screen-live-emoji
          path: release_v531/*
          if-no-files-found: error
