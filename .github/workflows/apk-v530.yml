name: Build KING Plus v5.3.0 Live Emoji Seat Controls

on:
  push:
    branches: [ real-social-v390-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build v5.3.0 Live Emoji + Seat Controls
        run: bash tools/build_v530.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v5.3.0-live-emoji-seat-controls
          path: release_v530/*
          if-no-files-found: error
