name: Build KING Plus v9.4.3 Session Social

on:
  push:
    branches: ['build/v9.4.3-next-stage']
    paths:
      - '.github/workflows/apk-v943.yml'
      - 'ci/v943/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: king-plus-v943
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v9.4.3-next-stage

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recover verified v9.4.2 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v942 /tmp/src
          mkdir -p /tmp/v942 /tmp/src
          gh run download 37710317465 -n KING-Plus-v9.4.2-parity-runtime-source -D /tmp/v942
          unzip -q /tmp/v942/KING-Plus-v9.4.2-parity-runtime-source.zip -d /tmp/src

      - name: Apply v9.4.3 session/social patch
        run: python3 ci/v943/patch_v943.py /tmp/src

      - name: Session and social gates
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          grep -F "versionCode 142; versionName '9.4.3-session-social'" app/build.gradle
          grep -F 'currentSessionUser943' app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'Party records unavailable","Tap to retry"' app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'Recommendations unavailable • tap to retry' app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F '↻\nFollowers' app/src/main/java/com/kingplus/social/KingPublicProfileActivity.java

          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('app/src/main/java/com/kingplus/social')
          risky=[]
          for p in root.glob('*.java'):
              for n,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                  if 'getCurrentUser().getUid()' in line:
                      risky.append((p.name,n,line.strip()))
          print('DIRECT_CURRENTUSER_UID_COUNT',len(risky))
          for r in risky: print('RISK',r)
          if risky: raise SystemExit('Direct getCurrentUser().getUid() remains')
          PY

      - name: Compile v9.4.3 APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon

      - name: Route and manifest audit
        working-directory: /tmp/src
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('app/src/main')
          mt=(root/'AndroidManifest.xml').read_text(errors='ignore')
          declared=set(re.findall(r'<activity[^>]+android:name="\.([^"]+)"',mt))
          intents=set()
          for p in (root/'java/com/kingplus/social').glob('*.java'):
              t=p.read_text(errors='ignore')
              intents.update(re.findall(r'new Intent\(this,\s*([A-Za-z0-9_]+)\.class\)',t))
          missing=sorted(x for x in intents if x not in declared and x!='MainActivity')
          print('Missing manifest targets:',missing)
          if missing: raise SystemExit('Missing manifest activity targets')
          PY

      - name: Android lint
        working-directory: /tmp/src
        run: gradle :app:lintDebug --no-daemon

      - name: Package APK and source
        run: |
          set -euo pipefail
          cp /tmp/src/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.4.3-session-social.apk
          cd /tmp/src
          zip -qr /tmp/KING-Plus-v9.4.3-session-social-source.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.4.3-session-social-APK
          path: /tmp/KING-Plus-v9.4.3-session-social.apk
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.4.3-session-social-source
          path: /tmp/KING-Plus-v9.4.3-session-social-source.zip
          retention-days: 7
          if-no-files-found: error
