name: KING v9.9.61 Persistent Private Host Role in Real Party Games TEST
on:
  push:
    branches: [work/king-persistent-host-social-role-v9961]
    paths: ['tools/social-host-role-v9961/**', '.github/workflows/king-persistent-host-role-v9961.yml']
  pull_request:
    paths: ['tools/social-host-role-v9961/**', '.github/workflows/king-persistent-host-role-v9961.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore complete signed v9.9.59 Party Games Gift runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9961 /tmp/king9961prev
          gh run download 38369421215 -n KING-v9960-Fair-Real-Party-TTT-TEST-APK-and-Source -D /tmp/king9961prev
          test -s /tmp/king9961prev/KING-Plus-v9.9.60-Fair-Real-Party-TTT-TEST.apk
          unzip -q /tmp/king9961prev/KING-Plus-v9.9.60-Fair-Real-Party-TTT-Source.zip -d /tmp/king9961
          grep -q 'versionCode 239' /tmp/king9961/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9961/app/kingplus-ci-debug.keystore
      - name: Persist Host private Werewolf Spy role on the verified Party source
        run: |
          set -euo pipefail
          python3 tools/social-host-role-v9961/apply.py /tmp/king9961
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9961')
          src=root/'app/src/main/java/com/kingplus/social'
          code=(src/'RoomGameActivity.java').read_text()
          social=code[code.index('    private void startSocialRound866('):code.index('    private void startRound(String game){')]
          for k in ('KingPartySocialRoster9959.isEligible','liveUids9958.contains(hostUid9958)',
                    'KingPartySocialRoster9959.pickHiddenRole',
                    'tx.set(room().collection("room_invites")',
                    'roleDocId866(next9958,uid9958)','hostRole9958=role9958',
                    'participantUids','db.runTransaction(tx->'):
            assert k in social,k
          assert 'hostSecret9958=personal9958;\n                            continue;' not in social
          assert 'KingTttFairRoster9960.pickPair' in code
          party=(src/'PartyActivity.java').read_text()
          for k in ('KingPartyVoiceReconnect9957','KingPartyMicConsent9956','KingGiftReceiptRetry9955'):
            assert k in party,k
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'versionCode 240' in (root/'app/build.gradle').read_text()
          print('PASS verified Host role persisted with recipient-only private role documents')
          PY
      - name: Verify existing live Tic Tac Toe Ready and fair X O pairing
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9961classes
          javac -d /tmp/king9961classes \
            /tmp/king9961/app/src/main/java/com/kingplus/social/KingTttLiveRoster9951.java \
            /tmp/king9961/app/src/main/java/com/kingplus/social/KingTttFairRoster9960.java \
            tools/ttt-live-v9960/KingTttFairRoster9960Test.java
          java -cp /tmp/king9961classes com.kingplus.social.KingTttFairRoster9960Test
      - name: Install real Firestore emulator dependencies
        working-directory: /tmp/king9961/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Firebase real Tic Tac Toe Ready off ghost and live pairing
        working-directory: /tmp/king9961
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/ttt-live-v9960/ttt-ready-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-ttt-9960 --config firebase-emulator.json \
            "node tests/firestore/ttt-ready-firestore.test.mjs"
      - name: Firestore emulator Host recipient-only private role and race protection
        working-directory: /tmp/king9961
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-host-role-v9961/host-role-private-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/host-role-private-firestore.test.mjs"
      - name: Regression real social game roles, privacy and simultaneous Host
        working-directory: /tmp/king9961
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-live-v9958/social-party-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/social-party-firestore.test.mjs"
      - name: Regression real Party Gift receipts and immutable game turns
        working-directory: /tmp/king9961
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          for test in gift-delivery-firestore.test.mjs immutable-rounds-firestore.test.mjs; do
            tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
              --project demo-king-live-ready-9959 --config firebase-emulator.json \
              "node tests/firestore/$test"
          done
      - name: Compile complete Android Party Games Gifting APK
        working-directory: /tmp/king9961
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify signed APK upgrade and zip integrity
        run: |
          set -euo pipefail
          old=/tmp/king9961prev/KING-Plus-v9.9.60-Fair-Real-Party-TTT-TEST.apk
          new=/tmp/king9961/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='240'"
          "$signer" verify --print-certs "$old" >/tmp/cert-old
          "$signer" verify --print-certs "$new" >/tmp/cert-new
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-old | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-new | head -1)"
          test -n "$a" && test "$a" = "$b"
          unzip -tq "$new" | tail -1
      - name: Package TEST APK and complete source, with no private signing key
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9961out
          cp /tmp/king9961/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9961out/KING-Plus-v9.9.61-Persistent-Host-Roles-TEST.apk
          rm -f /tmp/king9961/app/kingplus-ci-debug.keystore
          cd /tmp/king9961
          zip -q -r /tmp/king9961out/KING-Plus-v9.9.61-Persistent-Host-Roles-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
            './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9961out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9961-Persistent-Host-Roles-TEST-APK-and-Source
          path: /tmp/king9961out/*
          retention-days: 14
          if-no-files-found: error
