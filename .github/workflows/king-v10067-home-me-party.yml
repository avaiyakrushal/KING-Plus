name: KING Plus v10.0.67 Bolo Home Me Party TEST
on:
  pull_request:
    paths: ['tools/home-me-party-v10067/**', '.github/workflows/king-v10067-home-me-party.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restore exact v10.0.66 source and apply Bolo reference corrections
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-prev /tmp/king-next
          gh run download 39054153231 -n KING-v10066-Cloudflare-Preparation-TEST-APK-and-Source -D /tmp/king-prev
          unzip -q /tmp/king-prev/KING-Plus-v10.0.66-Cloudflare-Preparation-TEST-Source.zip -d /tmp/king-next
          cp app/kingplus-ci-debug.keystore /tmp/king-next/app/
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(Path('tools/home-me-party-v10067/changes.patch.gz.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest()=='adc84c15c059e4574c67cdfb2eaa40502f848c067e03b94bacd09c7ae7100ce1'
          Path('/tmp/king-v10067.patch').write_bytes(raw)
          PY
          cd /tmp/king-next
          patch --batch --fuzz=0 -p1 -i /tmp/king-v10067.patch
      - name: Backend transaction regressions and XML integration
        working-directory: /tmp/king-next
        run: |
          set -euo pipefail
          python3 tools/home-me-party-v10067/check_source.py
          node --check functions/v3.js
          node --test functions/*.test.js tools/cloudflare-v10066/client.test.js
          mkdir -p /tmp/king-voice-java
          javac -d /tmp/king-voice-java app/src/main/java/com/kingplus/social/KingVoiceSession10065.java app/src/main/java/com/kingplus/social/KingGiftReply10065.java tools/voice-wallet-v10065/KingVoiceAndGift10065Test.java
          java -cp /tmp/king-voice-java com.kingplus.social.KingVoiceAndGift10065Test
          javac -d /tmp/king-voice-java app/src/main/java/com/kingplus/social/KingPagePolicy10067.java tools/home-me-party-v10067/KingPagePolicy10067Test.java
          java -cp /tmp/king-voice-java com.kingplus.social.KingPagePolicy10067Test
          python3 tools/integrated-release/check_release.py --mode test
      - name: Install emulator and backend dependencies
        working-directory: /tmp/king-next
        run: |
          npm ci --prefix tests/firestore --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Real Firestore paid gift transactions, mic seats, host and join leave regressions
        working-directory: /tmp/king-next
        env: {CI: 'true'}
        run: |
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-10067 --config firebase-emulator.json "node tests/firestore/home-me-party-v10067.test.mjs && node tests/firestore/cloudflare-voice-v10066.test.mjs && node tests/firestore/voice-wallet-lifecycle-v10065.test.mjs && node tests/firestore/paid-room-gifts-v10064.test.mjs && node tests/firestore/room-game-gift.test.mjs && node tests/firestore/mic-consent-firestore.test.mjs && node tests/firestore/room_exit_firestore.test.mjs && node tests/firestore/visitor-pages-firestore.test.mjs"
      - name: Compile full Android app
        working-directory: /tmp/king-next
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Validate version and same signing certificate
        run: |
          set -euo pipefail
          old=/tmp/king-prev/KING-Plus-v10.0.66-Cloudflare-Preparation-TEST.apk
          new=/tmp/king-next/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep '^package:' | grep "versionCode='346'" | grep "com.kingplus.social"
          "$signer" verify --print-certs "$old" >/tmp/king-old-cert
          "$signer" verify --print-certs "$new" >/tmp/king-new-cert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king-old-cert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king-new-cert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package exact source and signed TEST APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-out
          cp /tmp/king-next/app/build/outputs/apk/debug/app-debug.apk /tmp/king-out/KING-Plus-v10.0.67-Home-Me-Party-TEST.apk
          rm -f /tmp/king-next/app/kingplus-ci-debug.keystore
          cd /tmp/king-next
          zip -qr /tmp/king-out/KING-Plus-v10.0.67-Home-Me-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king-out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10067-Home-Me-Party-TEST-APK-and-Source
          path: /tmp/king-out/*
          retention-days: 30
