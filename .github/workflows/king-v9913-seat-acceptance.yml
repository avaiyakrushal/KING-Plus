name: KING Plus v9.9.13 - Complete Real Seat Approvals
on:
  push:
    branches: [work/king-bolo-seat-approval-v9913]
    paths:
      - 'tools/king_v9913_atomic_approvals.py'
      - '.github/workflows/king-v9913-seat-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore exact latest v9.9.12 verified source and signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-v9913 /tmp/king-v9913-prev
          gh release download v9.9.12-party-sync             -p 'KING-Plus-v9.9.12-Party-Live-Sync-Source.zip' -D /tmp/king-v9913-prev
          gh release download v9.9.12-party-sync             -p 'KING-Plus-v9.9.12-Party-Live-Sync-TEST.apk' -D /tmp/king-v9913-prev
          unzip -q /tmp/king-v9913-prev/KING-Plus-v9.9.12-Party-Live-Sync-Source.zip -d /tmp/king-v9913
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king-v9913/app/kingplus-ci-debug.keystore
      - name: Fix every remaining Host mic request and user seat moving path
        run: |
          set -euo pipefail
          python3 tools/king_v9913_atomic_approvals.py /tmp/king-v9913
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king-v9913')
          p=(r/'app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          assert p.count('approveOrMoveMemberSeat9913(')==4
          assert 'tx9913.delete(priorSeat9913)' in p
          assert 'tx9913.delete(request9913)' in p
          assert 'memberProfileDialog(uidV530,nameV530)' in p
          assert 'db.runTransaction(tx9912' in p
          assert 'KingNative3DRoom.open(' in p
          assert 'KingGiftSound993.setEnabled' in p
          assert 'private void openVideoRoom()' in p
          main=(r/'app/src/main/java/com/kingplus/social/MainActivity.java').read_text()
          assert 'firebaseAuth.getCurrentUser()==null' in main
          assert 'incrementMission("mission_game",1)' not in main
          assert 'LIVE_RECHARGE = false' in (r/'app/src/main/java/com/kingplus/social/KingRecharge974Activity.java').read_text()
          print('Source checks PASS. Physical voice/video, multiplayer and full visual parity remain unverified.')
          PY
      - name: Compile real Android APK
        working-directory: /tmp/king-v9913
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify safe Android upgrade from v9.9.12
        run: |
          set -euo pipefail
          OLD=/tmp/king-v9913-prev/KING-Plus-v9.9.12-Party-Live-Sync-TEST.apk
          NEW=/tmp/king-v9913/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='191'"
          "$AAPT" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='192'"
          "$SIGNER" verify --print-certs "$OLD" > /tmp/oldcert
          "$SIGNER" verify --print-certs "$NEW" > /tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1 || true)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1 || true)"
          test -n "$a" && test "$a" = "$b"
          echo 'PASS signing and version compatibility'
      - name: Package verification artifacts without publishing incomplete final release
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-v9913-artifacts
          cp /tmp/king-v9913/app/build/outputs/apk/debug/app-debug.apk              /tmp/king-v9913-artifacts/KING-Plus-v9.9.13-Mic-Approval-Verification.apk
          rm -f /tmp/king-v9913/app/kingplus-ci-debug.keystore
          cd /tmp/king-v9913
          zip -q -r /tmp/king-v9913-artifacts/KING-Plus-v9.9.13-Mic-Approval-Source.zip .             -x './app/build/*' './.gradle/*' './build/*' '*local.properties'
          sha256sum /tmp/king-v9913-artifacts/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9913-Internal-Build-Not-Final
          path: /tmp/king-v9913-artifacts/*
          retention-days: 14
          if-no-files-found: error
