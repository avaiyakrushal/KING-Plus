name: Build KING Plus v9.6.9 Party Memory Pressure Safety
on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/apk-v969-memory.yml'
      - 'ci/v969/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: kingplus-v969-party-memory
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test memory pressure behavior without Android device
        run: |
          set -euo pipefail
          mkdir -p /tmp/party-memory-test
          javac -d /tmp/party-memory-test ci/v969/KingPartyMemory969.java ci/v969/KingPartyMemory969Test.java
          java -cp /tmp/party-memory-test com.kingplus.social.KingPartyMemory969Test
      - name: Restore successfully compiled v9.6.8 Mic Seat source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/src
          gh run download 37946420471 -n KING-Plus-v9.6.8-party-mic-seat-sync-source -D /tmp/a
          test -f /tmp/a/KING-Plus-v9.6.8-party-mic-seat-sync-source.zip
          unzip -q /tmp/a/KING-Plus-v9.6.8-party-mic-seat-sync-source.zip -d /tmp/src
      - name: Apply native memory pressure protections
        run: python3 ci/v969/patch_v969.py /tmp/src
      - name: Validate safeguards and earlier features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/src')
          p=(root/'app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          m=(root/'app/src/main/java/com/kingplus/social/MainActivity.java').read_text()
          g=(root/'app/build.gradle').read_text()
          assert "versionCode 160; versionName '9.6.9-party-memory-pressure'" in g
          assert 'if(KingPartyMemory969.overEffectLimit(activeReactions560.size()))' in p
          assert 'public void onTrimMemory(int level)' in p
          assert 'public void onLowMemory()' in p
          assert 'photoCache540.evictAll();' in p
          assert 'activeReactions560.clear();' in p
          assert 'if(KingPartyMemory969.mayPauseIdleVoice(level969,micOn,inRoomVoiceJoined940))' in p
          assert 'roomVoiceOptedIn957=false;' in p
          assert 'stopInRoomVoice940(true);' in p
          assert 'KingPartyMic968.canToggle(' in p
          assert 'KingPartyMic968.requestId(' in p
          assert 'roomImageExecutor964.shutdownNow()' in p
          assert 'KingRoomPresence967.isActive(' in p
          assert 'KingPartyJoin966.current(' in p
          assert 'activeRoomForEmoji960' in p
          assert 'KingSocialIdentity965.publicId(uid)' in m
          assert 'KingCrashWatch958' in m
          print('PASS: memory pressure guards and prior Party/Mic/UID/Crash functionality')
          PY
      - name: Compile v9.6.9 Android APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon
      - name: Bundle APK and patched source
        run: |
          set -euo pipefail
          cp /tmp/src/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.6.9-party-memory-pressure.apk
          cd /tmp/src
          zip -qr /tmp/KING-Plus-v9.6.9-party-memory-pressure-source.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.6.9-party-memory-pressure-APK
          path: /tmp/KING-Plus-v9.6.9-party-memory-pressure.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.6.9-party-memory-pressure-source
          path: /tmp/KING-Plus-v9.6.9-party-memory-pressure-source.zip
          if-no-files-found: error
          retention-days: 7
