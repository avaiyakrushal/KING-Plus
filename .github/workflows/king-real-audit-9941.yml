name: KING v9.9.41 Live Gameplay and Gifting Source Audit
on:
  push:
    branches: [work/king-party-game-gift-ack-v9941]
    paths: ['tools/real-9941/audit.py', '.github/workflows/king-real-audit-9941.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified full v9.9.40 Android sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9941prev /tmp/king9941
          gh run download 38338752824 -n KING-v9940-Verified-Sheep-TEST-APK-and-Source -D /tmp/king9941prev
          unzip -q /tmp/king9941prev/KING-Plus-v9.9.40-Verified-Sheep-Source.zip -d /tmp/king9941
          grep -q 'versionCode 219' /tmp/king9941/app/build.gradle
      - name: Inspect real gift receipt and live game readiness
        run: python3 tools/real-9941/audit.py /tmp/king9941
