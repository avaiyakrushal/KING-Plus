name: Build KING Plus v9.9.2 User Follow DM Party Social
on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/apk-v992-id-follow-chat-party.yml'
      - 'ci/v992_social/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: kingplus-v992-social
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test real unique account ID/share parser without Android runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/social992
          javac -d /tmp/social992 ci/v992_social/KingSocialShare992.java ci/v992_social/KingSocialShare992Test.java
          java -cp /tmp/social992 com.kingplus.social.KingSocialShare992Test
          python3 -m py_compile ci/v992_social/patch_id_follow_chat_party_v992.py
      - name: Restore validated 9.9.1 APK and complete Android project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/project /tmp/previous /tmp/previous-apk
          gh run download 38105102100 -n KING-Plus-v9.9.1-Cinematic-Visuals-Source -D /tmp/previous
          unzip -q /tmp/previous/KING-Plus-v9.9.1-Cinematic-Visuals-Source.zip -d /tmp/project
          gh run download 38105102100 -n KING-Plus-v9.9.1-Cinematic-Visuals-APK -D /tmp/previous-apk
      - name: Integrate share APK, Search ID, real Follow/DM and verified Party Invite
        run: python3 ci/v992_social/patch_id_follow_chat_party_v992.py /tmp/project
      - name: Verify production rules, existing Firebase follow/chat, cross-account joins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/project')
          p=r/'app/src/main/java/com/kingplus/social'
          social=(p/'SocialActivity.java').read_text()
          party=(p/'PartyActivity.java').read_text()
          chat=(p/'ChatActivity.java').read_text()
          main=(p/'MainActivity.java').read_text()
          rule=(r/'firestore.rules').read_text()
          assert "versionCode 181; versionName '9.9.2-id-follow-chat-party-social'" in (r/'app/build.gradle').read_text()
          assert 'KingSocialShare992.extractAccount(' in social
          assert 'KingSocialShare992.shareKingId(' in social
          assert 'this::socialJoinParty992' in social
          assert 'whereEqualTo("publicId",raw)' in social
          assert 'db.collection("follows").document(' in social
          assert 'new Intent(this,ChatActivity.class)' in social
          assert 'mainPrefs().getString("last_live_room_id_992"' in chat
          assert 'KingRoomInvite959.parse(text)' in chat
          assert 'joinParty992.setOnClickListener' in chat
          assert 'last_live_room_account_992' in party
          assert 'if(cloudRoom&&memberSeen&&roomId!=null&&user!=null' in party
          assert 'directRoomId' in party
          assert 'checkCrowdCapacity930(' in party
          assert 'KingFirestoreRecovery986.guidance(' in party
          assert 'match /direct_threads/{threadId}' in rule
          assert 'match /follows/{followId}' in rule
          assert 'match /public_profiles/{uid}' in rule
          assert 'match /live_rooms/{roomId}' in rule
          assert 'KingLoginBackdropView' in main
          assert (p/'GiftBurstView.java').exists()
          assert (p/'KingRoomStageView.java').exists()
          assert (p/'OnlineLudoActivity.java').exists()
          assert (p/'KingConnection983Activity.java').exists()
          print('PASS all cross-device social source paths, existing Firestore privacy, cinematic visual features remain')
          PY
      - name: Compile and package v9.9.2 Android APK
        working-directory: /tmp/project
        run: gradle :app:assembleDebug --no-daemon
      - name: Require same signing certificate and higher app version than v9.9.1
        run: |
          set -euo pipefail
          OLD="$(find /tmp/previous-apk -name '*.apk' -print -quit)"
          NEW=/tmp/project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$OLD" && test -s "$NEW"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          test -n "$signer" && test -n "$aapt"
          "$signer" verify --print-certs "$OLD" > /tmp/oldsign
          "$signer" verify --print-certs "$NEW" > /tmp/newsign
          OC="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldsign | head -1)"
          NC="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newsign | head -1)"
          test -n "$OC" && test "$OC" = "$NC"
          "$aapt" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='180'"
          "$aapt" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='181'"
          echo "PASS signed v9.9.2 upgrades v9.9.1 without uninstall or account loss"
      - name: Package APK and complete source
        run: |
          set -euo pipefail
          cp /tmp/project/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.9.2-Follow-Message-Party.apk
          (cd /tmp/project && zip -qr /tmp/KING-Plus-v9.9.2-Follow-Message-Party-source.zip .)
          sha256sum /tmp/KING-Plus-v9.9.2-Follow-Message-Party.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.9.2-Follow-Message-Party-APK
          path: /tmp/KING-Plus-v9.9.2-Follow-Message-Party.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.9.2-Follow-Message-Party-Source
          path: /tmp/KING-Plus-v9.9.2-Follow-Message-Party-source.zip
          retention-days: 7
          if-no-files-found: error
      - name: Publish APK link that any phone can download from public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=/tmp/KING-Plus-v9.9.2-Follow-Message-Party.apk
          if gh release view v9.9.2 >/dev/null 2>&1; then
            gh release upload v9.9.2 "$FILE" --clobber
          else
            gh release create v9.9.2 "$FILE" \
              --target work/reference-completion \
              --title "KING Plus v9.9.2 - Follow, Message, Search ID and Join Party" \
              --notes "Public APK share link; your canonical KING ID and verified UID can be shared and searched; original Firestore Follow and private direct messaging preserved; a verified Party host/member can send an actual Room ID in private chat and friend can tap to join via full Firebase server security verification. Existing cinematic 9.9.1 visuals, Ludo, Mic/Seats and wallet safeguards retained. No billing enabled and no new Firestore rules broadening. Two-phone acceptance still required." \
              --prerelease
          fi
          gh release view v9.9.2 --json url,assets --jq '{url,assets:[.assets[]|{name,url,size}]}'
