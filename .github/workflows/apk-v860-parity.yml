name: Build KING Plus v8.6.0 party parity
on:
  push:
    branches: ['build/v8.6.0-parity-fixes']
    paths:
      - '.github/workflows/apk-v860-parity.yml'
      - 'ci/v860/patch_v860.py'
      - 'ci/v860/patch_game_codes.py'
      - 'ci/v860/LiveEmojiView.java'
      - 'ci/v860/RELEASE-NOTES.md'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v8.6.0-parity-fixes
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recover verified v8.5.3 source and apply v8.6.0 work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/base /tmp/src /tmp/release
          mkdir -p /tmp/base /tmp/src
          gh run download 37252755854 -n KING-Plus-v8.5.3-APK-and-source -D /tmp/base
          unzip -q /tmp/base/KING-Plus-v8.5.3-source.zip -d /tmp/src
          python3 ci/v860/patch_v860.py /tmp/src
          python3 ci/v860/patch_game_codes.py /tmp/src
          cp ci/v860/LiveEmojiView.java /tmp/src/app/src/main/java/com/kingplus/social/LiveEmojiView.java
          cp ci/v860/RELEASE-NOTES.md /tmp/src/RELEASE-NOTES-v8.6.0.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/app/build.gradle')
          s=p.read_text()
          old="versionCode 118; versionName '8.5.3'"
          if old not in s:
              raise SystemExit('Expected v8.5.3 version line was not found')
          p.write_text(s.replace(old,"versionCode 119; versionName '8.6.0'",1))
          PY
      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/src
          if ! gradle :app:assembleDebug --no-daemon 2>&1 | tee /tmp/build-v860.log; then
            cp /tmp/build-v860.log "$GITHUB_WORKSPACE/ci/v860/build-failure.txt"
            cd "$GITHUB_WORKSPACE"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ci/v860/build-failure.txt
            git commit -m 'Capture v8.6.0 build failure' || true
            git push origin HEAD:build/v8.6.0-parity-fixes || true
            exit 1
          fi
      - name: Package APK and source
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil,zipfile,hashlib
          out=Path('/tmp/release');out.mkdir(parents=True,exist_ok=True)
          apk=out/'KING-Plus-v8.6.0-party-parity.apk'
          shutil.copy2('app/build/outputs/apk/debug/app-debug.apk',apk)
          (out/'SHA256.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          with zipfile.ZipFile(out/'KING-Plus-v8.6.0-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('.').rglob('*'):
                  if not p.is_file() or any(v in p.parts for v in ['.git','.gradle','build','node_modules']):continue
                  if p.suffix in ['.apk','.zip','.log']:continue
                  z.write(p,p)
          shutil.copy2('RELEASE-NOTES-v8.6.0.md',out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v8.6.0-APK-and-source
          path: /tmp/release/*
          if-no-files-found: error
