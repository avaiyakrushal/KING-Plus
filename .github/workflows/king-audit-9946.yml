name: KING v9.9.46 Actual Game Result Integrity Audit
on:
  push:
    branches: [work/king-room-game-result-integrity-v9946]
    paths: ['tools/real-v9946/audit.py','.github/workflows/king-audit-9946.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Recover actual verified v9.9.45 full Android source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9946prev /tmp/king9946
          gh run download 38344970700 -n KING-v9945-Real-RPS-Dice-TEST-APK-and-Source -D /tmp/king9946prev
          unzip -q /tmp/king9946prev/KING-Plus-v9.9.45-Real-RPS-Dice-Source.zip -d /tmp/king9946
          grep -q 'versionCode 224' /tmp/king9946/app/build.gradle
      - name: Inspect room winner finalization and rules
        run: python3 tools/real-v9946/audit.py /tmp/king9946
