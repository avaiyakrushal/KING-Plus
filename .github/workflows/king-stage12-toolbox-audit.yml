name: KING Stage12 Exact Party Tools A-Z Route Audit
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-stage12-toolbox-audit.yml'
      - 'ci/final_five/stage12_exact_toolbox_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  toolbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - name: Restore LATEST integrated small-functions SOURCE (not stale app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-stage12 /tmp/king-stage12src
          gh run download 38134879626 -n KING-Plus-Small-Functions-Fix-Source-Only -D /tmp/king-stage12src
          unzip -q /tmp/king-stage12src/KING-Plus-A-to-Z-Small-Function-Fix-IN-PROGRESS-source.zip -d /tmp/king-stage12
      - name: Check every Party quick/advanced feature label maps to an actual function
        run: python3 ci/final_five/stage12_exact_toolbox_audit.py /tmp/king-stage12
