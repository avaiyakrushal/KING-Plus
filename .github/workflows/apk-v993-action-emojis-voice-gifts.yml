name: Build KING Plus v9.9.3 Action Emojis VIP Night and Sound Gifts
on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/apk-v993-action-emojis-voice-gifts.yml'
      - 'ci/v993_action/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: kingplus-v993-action-emoji-gifts
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test VIP gate and compile Python source patches first
        run: |
          set -euo pipefail
          python3 -m py_compile ci/v993_action/patch_emoji_v993.py ci/v993_action/patch_gifts_v993.py
      - name: Restore signed v9.9.2 APK and complete source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king993-archive /tmp/king993-app /tmp/king993-old
          gh run download 38106027241 -n KING-Plus-v9.9.2-Follow-Message-Party-Source -D /tmp/king993-archive
          unzip -q /tmp/king993-archive/KING-Plus-v9.9.2-Follow-Message-Party-source.zip -d /tmp/king993-app
          gh run download 38106027241 -n KING-Plus-v9.9.2-Follow-Message-Party-APK -D /tmp/king993-old
      - name: Apply new live actions, 88 gifts, audio and VIP preview guards
        run: |
          set -euo pipefail
          python3 ci/v993_action/patch_emoji_v993.py /tmp/king993-app
          python3 ci/v993_action/patch_gifts_v993.py /tmp/king993-app
          mkdir -p /tmp/v993-guard-test
          javac -d /tmp/v993-guard-test \
            ci/v993_action/KingEmojiAccess993.java \
            ci/v993_action/KingEmojiAccess993Test.java \
            /tmp/king993-app/app/src/main/java/com/kingplus/social/KingPremiumAccess981.java
          java -cp /tmp/v993-guard-test com.kingplus.social.KingEmojiAccess993Test
      - name: Assert catalog, low memory policy, VIP locks and original Firebase functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/king993-app')
          pkg=root/'app/src/main/java/com/kingplus/social'
          party=(pkg/'PartyActivity.java').read_text()
          em=(pkg/'LiveEmojiView.java').read_text()
          g=(root/'app/build.gradle').read_text()
          for name in ['KingGiftSound993.java','KingEmojiAccess993.java',
                       'KingEmojiAuraView992.java','GiftBurstView.java']:
              assert (pkg/name).exists(),name
          assert "versionCode 182; versionName '9.9.3-action-emoji-vip-voice-gifts'" in g
          assert 'KING LIVE • 120 ACTION EMOJI' in party
          assert 'private void drawAction993(' in em
          assert 'postInvalidateDelayed(66)' in em
          assert 'View.LAYER_TYPE_SOFTWARE' not in em
          assert 'KingEmojiAccess993.canSend(' in party
          assert 'previewLockedAction993(' in party
          assert 'KingPremiumAccess981.PAID_VIP_ACTIVE' in (pkg/'KingEmojiAccess993.java').read_text()
          assert 'KingGiftSound993.play(this,' in party
          assert '🔊 Gift Sound ON' in party
          assert 'VIP Night' in party
          assert 'Gift Shop • "+giftNames.length+" gifts' in party
          for name in ['giftNames','giftIcons','giftCosts','giftCategories','giftVipRequired']:
              m=re.search(r'private final (?:String|int)\[\] '+name+r'\s*=\s*\{(.*?)\};',party,re.S)
              assert m,name
              cnt=len(re.findall(r'"[^"]*"',m.group(1))) if name in (
                  'giftNames','giftIcons','giftCategories') else len(re.findall(r'\b\d+\b',m.group(1)))
              assert cnt==88,(name,cnt)
          assert 'showGiftEffect("VIP PREVIEW"' in party
          assert 'if(giftSelectedIndex>=64&&giftVipRequired[giftSelectedIndex]>0)' in party
          assert 'LIVE_RECHARGE = false' in (pkg/'KingRecharge974Activity.java').read_text()
          assert 'KingFreshHostRoom991.canWriteWithoutPreRead(' in party
          assert 'checkCrowdCapacity930(' in party
          assert 'KingFirestoreRecovery986.guidance(' in party
          assert 'KingSocialShare992' in (pkg/'SocialActivity.java').read_text()
          assert (pkg/'OnlineLudoActivity.java').exists()
          print('PASS 120 action emoji / 88 gifts / low memory / honest paid VIP and all Firebase social paths')
          PY
      - name: Build KING Plus v9.9.3 Android APK
        working-directory: /tmp/king993-app
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify update installs over 9.9.2 without deleting signed-in account
        run: |
          set -euo pipefail
          OLD="$(find /tmp/king993-old -name '*.apk' -print -quit)"
          NEW=/tmp/king993-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$OLD" && test -s "$NEW"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          "$signer" verify --print-certs "$OLD" > /tmp/old993sign
          "$signer" verify --print-certs "$NEW" > /tmp/new993sign
          O="$(grep -Eo '[[:xdigit:]]{64}' /tmp/old993sign | head -1)"
          N="$(grep -Eo '[[:xdigit:]]{64}' /tmp/new993sign | head -1)"
          test -n "$O" && test "$O" = "$N"
          "$aapt" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='181'"
          "$aapt" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='182'"
          echo "PASS same signing certificate and upgrade-safe version"
      - name: Package installable APK and buildable updated source
        run: |
          set -euo pipefail
          cp /tmp/king993-app/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.9.3-Action-Emojis-VIP-Voice-Gifts.apk
          (cd /tmp/king993-app && zip -qr /tmp/KING-Plus-v9.9.3-Action-Emojis-VIP-Voice-Gifts-source.zip .)
          sha256sum /tmp/KING-Plus-v9.9.3-Action-Emojis-VIP-Voice-Gifts.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.9.3-Action-Emojis-VIP-Voice-Gifts-APK
          path: /tmp/KING-Plus-v9.9.3-Action-Emojis-VIP-Voice-Gifts.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.9.3-Action-Emojis-VIP-Voice-Gifts-Source
          path: /tmp/KING-Plus-v9.9.3-Action-Emojis-VIP-Voice-Gifts-source.zip
          retention-days: 7
          if-no-files-found: error
      - name: Publish APK direct Chrome link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=/tmp/KING-Plus-v9.9.3-Action-Emojis-VIP-Voice-Gifts.apk
          if gh release view v9.9.3 >/dev/null 2>&1; then
            gh release upload v9.9.3 "$FILE" --clobber
          else
            gh release create v9.9.3 "$FILE" \
              --target work/reference-completion \
              --title "KING Plus v9.9.3 - 120 Action Emojis, VIP Night and Gift Sound" \
              --notes "Signed test APK. Adds 70 original KING live action effects to existing 50 (120 total), categorized 25-at-once to protect memory. Adds 24 original gifts including Kiss Sound, Flying Hearts and VIP Night (88 total) plus optional short synthetic gift audio effects. Base free gifts remain free. 10 level emojis can unlock through ordinary levels. Paid VIP emoji/gifts are only local previews, never falsely unlocked until verified VIP billing exists. Keeps Firebase Follow, Chat, Party, Mic/Seat, Ludo, themes and current rules. Not copied third-party Bolo assets, and sound is original synthesis (not actual voice recordings). Two-phone runtime/memory test still pending." \
              --prerelease
          fi
          gh release view v9.9.3 --json url,assets --jq '{url,assets:[.assets[]|{name,url,size}]}'
