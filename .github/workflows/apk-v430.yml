name: Build KING Plus v4.3.0 Real People Connect

on:
  push:
    branches: [real-social-v390-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build v4.3.0 Real People Connect
        run: bash tools/build_v430.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v4.3.0-real-people-connect
          path: |
            release_v430/KING-Plus-v4.3.0-real-people-connect-no-billing-test-otp.apk
            release_v430/KING-Plus-v4.3.0-real-people-connect-source.zip
          if-no-files-found: error
