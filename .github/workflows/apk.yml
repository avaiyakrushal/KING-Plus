name: Build KING Plus Firebase APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use Firebase v1.2 source
        run: |
          unzip -oq KING-Plus-v1.2-Firebase-source.zip -d /tmp/kingplus-v12
          cp -a /tmp/kingplus-v12/KING-Plus/. .
          printf "%s\n" "plugins { id 'com.android.application' version '8.7.3' apply false; id 'com.google.gms.google-services' version '4.5.0' apply false }" > build.gradle
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Show APK signing certificate
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APK_SIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-Firebase-v1.2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
