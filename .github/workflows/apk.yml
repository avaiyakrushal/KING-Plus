name: Build KING Plus v3.9.1 Unified Party

on:
  push:
    branches: [real-social-v390-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare v2.8 cloud, push, safety and recharge foundation
        run: python3 tools/prepare_v28_build.py

      - name: Prepare v2.9 real auth and live foundation
        run: python3 tools/prepare_v29_build.py

      - name: Prepare v3.0 security, billing and release candidate
        run: python3 tools/prepare_v30_build.py

      - name: Prepare v3.0.1 production abuse hardening
        run: python3 tools/prepare_v301_hardening.py

      - name: Switch mobile login to no-billing test OTP
        run: python3 tools/prepare_test_build.py

      - name: Prepare v3.1.1 BoloHi-style Party base
        run: python3 tools/prepare_party_v311.py

      - name: Prepare v3.1.2 complete Me profile
        run: python3 tools/prepare_me_copy_v312.py

      - name: Prepare v3.2.0 complete Party page
        run: python3 tools/prepare_party_copy_v320.py

      - name: Prepare v3.2.1 Party roles, moderation and private-room security
        run: python3 tools/prepare_party_security_v321.py

      - name: Prepare v3.2.2 password rooms and seat request flow
        run: python3 tools/prepare_party_password_v322.py

      - name: Prepare v3.3.0 complete Games Center
        run: python3 tools/prepare_games_v330.py

      - name: Prepare v3.4.0 Party complete controls
        run: python3 tools/prepare_party_complete_v340.py

      - name: Prepare v3.5.0 social discovery, friends and messages
        run: python3 tools/prepare_social_v350.py

      - name: Apply v3.6.0 room options upgrade
        run: |
          base64 -d tools/room_options_v360.patch.gz.b64 | gzip -d > /tmp/room-options.patch
          patch --dry-run -p0 < /tmp/room-options.patch
          patch -p0 < /tmp/room-options.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+;\s+versionName\s+'[^']+'", "versionCode 51; versionName '3.6.0'", s)
          p.write_text(s)
          Path('CHANGELOG-v3.6.0.txt').write_text('KING Plus v3.6.0 — Room Experience Upgrade\n\nPrivate chat, Events/Activities, emoji/reactions, gift shop with recipient/category/quantity controls, and Silver/Gold Weekly Gift Card in TEST/no-billing mode.\n')
          PY

      - name: Apply v3.7.0 live room interaction upgrade
        run: |
          base64 -d tools/room_live_v370.patch.gz.b64 | gzip -d > /tmp/room-live.patch
          patch --dry-run -p0 < /tmp/room-live.patch
          patch -p0 < /tmp/room-live.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+;\s+versionName\s+'[^']+'", "versionCode 53; versionName '3.7.0'", s)
          p.write_text(s)
          Path('CHANGELOG-v3.7.0.txt').write_text('KING Plus v3.7.0 — Live Room Interaction\n\nAdds live entrance banners, gift combo effects, top-supporter strip, realtime room-event effects, and direct private chat from seat/member profiles. Keeps no-billing TEST mode.\n')
          PY

      - name: Apply v3.8.0 real live data, music and playable games
        run: |
          base64 -d tools/room_real_v380.patch.gz.b64 | gzip -d > /tmp/room-real.patch
          patch --dry-run -p0 < /tmp/room-real.patch
          patch -p0 < /tmp/room-real.patch
          python3 - <<'PY2'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+;\s+versionName\s+'[^']+'", "versionCode 54; versionName '3.8.0'", s)
          p.write_text(s)
          PY2

      - name: Apply v3.9.0 real social and live-room grid
        run: |
          base64 -d tools/real_social_v390.patch.gz.b64 | gzip -d > /tmp/real-social.patch
          patch --dry-run -p0 < /tmp/real-social.patch
          patch -p0 < /tmp/real-social.patch
          python3 - <<'PY3'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+;\s+versionName\s+'[^']+'", "versionCode 55; versionName '3.9.0'", s)
          p.write_text(s)
          PY3

      - name: Apply v3.9.1 unified BoloHi-style Party
        run: |
          base64 -d tools/party_unified_v391.patch.gz.b64 | gzip -d > /tmp/party-unified.patch
          patch --dry-run -p0 < /tmp/party-unified.patch
          patch -p0 < /tmp/party-unified.patch
          python3 - <<'PY4'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+;\s+versionName\s+'[^']+'", "versionCode 56; versionName '3.9.1'", s)
          p.write_text(s)
          Path('CHANGELOG-v3.9.1.txt').write_text('KING Plus v3.9.1 — Unified Party\n\nRemoves the duplicate Party page, routes every Party entry to one PartyActivity, uses a BoloHi-inspired Today/Games/Party header and colorful two-column cards, and keeps only real Firebase rooms/member counts. No-billing and TEST OTP 123456 remain unchanged.\n')
          PY4

      - name: Production smoke checks
        run: |
          python3 tools/production_smoke_check.py
          node --check functions/index.js
          node --check functions/v3.js

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK and source files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/KING-Plus-v3.9.1-unified-party-no-billing-test-otp.apk
          zip -qr release/KING-Plus-v3.9.1-unified-party-source.zip . \
            -x '.git/*' 'app/build/*' 'release/*'

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v3.9.1-unified-party
          path: |
            release/KING-Plus-v3.9.1-unified-party-no-billing-test-otp.apk
            release/KING-Plus-v3.9.1-unified-party-source.zip
          if-no-files-found: error
