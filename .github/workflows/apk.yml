name: Build KING Plus APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare v2.7.1 free test build
        run: python3 tools/prepare_test_build.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Show APK signing certificate
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APK_SIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v2.7.1-login-help-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
