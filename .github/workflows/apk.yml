name: Build KING Plus v3.0.1 No Billing Test OTP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare v2.8 cloud, push, safety and recharge foundation
        run: python3 tools/prepare_v28_build.py

      - name: Prepare v2.9 real auth and live foundation
        run: python3 tools/prepare_v29_build.py

      - name: Prepare v3.0 security, billing and release candidate
        run: python3 tools/prepare_v30_build.py

      - name: Prepare v3.0.1 production abuse hardening
        run: python3 tools/prepare_v301_hardening.py

      - name: Switch mobile login to no-billing test OTP
        run: python3 tools/prepare_test_build.py

      - name: Production smoke checks
        run: |
          python3 tools/production_smoke_check.py
          node --check functions/index.js
          node --check functions/v3.js

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/KING-Plus-v3.0.1-no-billing-test-otp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v3.0.1-no-billing-test-otp-APK
          path: release/KING-Plus-v3.0.1-no-billing-test-otp.apk
          if-no-files-found: error
