name: Build KING Plus v3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare v2.8 cloud, push, safety and recharge foundation
        run: python3 tools/prepare_v28_build.py

      - name: Prepare v2.9 real auth and live foundation
        run: python3 tools/prepare_v29_build.py

      - name: Prepare v3.0 security, billing and release candidate
        run: python3 tools/prepare_v30_build.py

      - name: Build debug and release candidates
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Show release APK signing certificate
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APK_SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/KING-Plus-v3.0.0-RC.apk
          cp app/build/outputs/bundle/release/app-release.aab release/KING-Plus-v3.0.0-RC.aab
          cp app/build/outputs/apk/debug/app-debug.apk release/KING-Plus-v3.0.0-debug.apk
          zip -r KING-Plus-v3.0.0-source.zip . \
            -x '.git/*' '.gradle/*' 'app/build/*' 'release/*' 'KING-Plus-v3.0.0-source.zip' 'functions/node_modules/*'

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v3.0.0-RC-APK
          path: release/KING-Plus-v3.0.0-RC.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v3.0.0-RC-AAB
          path: release/KING-Plus-v3.0.0-RC.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v3.0.0-source-ZIP
          path: KING-Plus-v3.0.0-source.zip
          if-no-files-found: error
