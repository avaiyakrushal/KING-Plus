name: Build KING Plus v3.6.0 Economy

on:
  push:
    branches: [main, fix/family-v955-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare v2.8 cloud, push, safety and recharge foundation
        run: python3 tools/prepare_v28_build.py

      - name: Prepare v2.9 real auth and live foundation
        run: python3 tools/prepare_v29_build.py

      - name: Prepare v3.0 security, billing and release candidate
        run: python3 tools/prepare_v30_build.py

      - name: Prepare v3.0.1 production abuse hardening
        run: python3 tools/prepare_v301_hardening.py

      - name: Switch mobile login to no-billing test OTP
        run: python3 tools/prepare_test_build.py

      - name: Prepare v3.1.1 BoloHi-style Party base
        run: python3 tools/prepare_party_v311.py

      - name: Prepare v3.1.2 complete Me profile
        run: python3 tools/prepare_me_copy_v312.py

      - name: Prepare v3.2.0 complete Party page
        run: python3 tools/prepare_party_copy_v320.py

      - name: Prepare v3.2.1 Party roles, moderation and private-room security
        run: python3 tools/prepare_party_security_v321.py

      - name: Prepare v3.2.2 password rooms and seat request flow
        run: python3 tools/prepare_party_password_v322.py

      - name: Prepare v3.3.0 complete Games Center
        run: python3 tools/prepare_games_v330.py

      - name: Prepare v3.4.0 Party complete controls
        run: python3 tools/prepare_party_complete_v340.py

      - name: Prepare v3.5.0 social discovery, friends and messages
        run: python3 tools/prepare_social_v350.py

      - name: Prepare v3.6.0 gifts, wallet, levels, VIP and frames
        run: python3 tools/prepare_economy_v360.py

      - name: Ensure Party dependencies and Voice activity registration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle')
          s = gradle.read_text()
          if "firebase-firestore" not in s:
              s = s.replace("implementation 'com.google.firebase:firebase-auth'", "implementation 'com.google.firebase:firebase-auth'\n    implementation 'com.google.firebase:firebase-firestore'")
              gradle.write_text(s)
          if "firebase-messaging" not in s:
              s = s.replace("implementation 'com.google.firebase:firebase-auth'", "implementation 'com.google.firebase:firebase-auth'\n    implementation 'com.google.firebase:firebase-messaging'")
              gradle.write_text(s)
          manifest = Path('app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android:name=".VoiceWebActivity"' not in s:
              s = s.replace('<activity android:name=".PartyActivity"', '<activity android:name=".VoiceWebActivity" android:exported="false" />\n        <activity android:name=".PartyActivity"')
              manifest.write_text(s)
          PY

      - name: Production smoke checks
        run: |
          python3 tools/production_smoke_check.py
          node --check functions/index.js
          node --check functions/v3.js

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK and source files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/KING-Plus-v3.6.0-economy-no-billing-test-otp.apk
          zip -qr release/KING-Plus-v3.6.0-economy-source.zip . \
            -x '.git/*' 'app/build/*' 'release/*'

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v3.6.0-economy
          path: |
            release/KING-Plus-v3.6.0-economy-no-billing-test-otp.apk
            release/KING-Plus-v3.6.0-economy-source.zip
          if-no-files-found: error
