name: Build KING Plus APK
on:
  push:
    branches: [main, 'codex/online-2.7.2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend handlers
        run: node --test backend/functions/test/*.test.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build exact source
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK and record metadata
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APK_SIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > signing-certificate.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v2.7.2-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-certificate.txt
            apk-sha256.txt
            source-commit.txt
          if-no-files-found: error
