name: KING 9.9.38 Functional Party, Game and Gift Audit
on:
  push:
    branches: [work/king-live-party-games-gifts-v9938]
    paths: ['tools/live-functional-v9938/audit.py','.github/workflows/king-live-feature-audit-9938.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact successful v9.9.37 full source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9938prev /tmp/king9938
          gh run download 38334461788 -n KING-v9937-Real-Room-Games-Gifts-TEST-APK-and-Source -D /tmp/king9938prev
          unzip -q /tmp/king9938prev/KING-Plus-v9.9.37-Real-Room-Games-Gifts-Source.zip -d /tmp/king9938
          grep -q 'versionCode 216' /tmp/king9938/app/build.gradle
      - name: Audit real member/turn/gift behavior
        run: |
          python3 tools/live-functional-v9938/audit.py /tmp/king9938
      - uses: actions/upload-artifact@v4
        with:
          name: KING-9938-Game-Gift-Actual-Source-Audit
          path: tools/live-functional-v9938/audit.py
          retention-days: 7
