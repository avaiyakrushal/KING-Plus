name: KING v9.9.40 Sheep and Gift Function Audit
on:
  push:
    branches: [work/king-sheep-live-gift-v9940]
    paths: ['tools/king-functional-v9940/audit.py','.github/workflows/king-functional-audit-v9940.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified KING v9.9.39 full Android source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9940prev /tmp/king9940
          gh run download 38337550718 -n KING-v9939-Real-Ludo-Knife-TEST-APK-and-Source -D /tmp/king9940prev
          unzip -q /tmp/king9940prev/KING-Plus-v9.9.39-Real-Ludo-Knife-Source.zip -d /tmp/king9940
          grep -q 'versionCode 218' /tmp/king9940/app/build.gradle
      - name: Inspect real Sheep and Gift code paths
        run: python3 tools/king-functional-v9940/audit.py /tmp/king9940
