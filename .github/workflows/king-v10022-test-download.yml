name: KING v10.0.22 Downloadable Android APK and Source TEST Release
on:
  push:
    branches: [work/king-six-pages-v10022-combined]
    paths:
      - '.github/workflows/king-v10022-test-download.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download already tested/signed v10.0.22 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-release
          gh run download 38597541289 -R avaiyakrushal/KING-Plus -n KING-v10022-Six-Pages-TEST-APK-and-Source -D /tmp/king-release
          test -s /tmp/king-release/KING-Plus-v10.0.22-Six-Pages-TEST.apk
          test -s /tmp/king-release/KING-Plus-v10.0.22-Six-Pages-TEST-Source.zip
          unzip -t /tmp/king-release/KING-Plus-v10.0.22-Six-Pages-TEST.apk | tail -1
          unzip -t /tmp/king-release/KING-Plus-v10.0.22-Six-Pages-TEST-Source.zip | tail -1
          sha256sum /tmp/king-release/*
      - name: Publish mobile-friendly permanent pre-release links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create king-v10.0.22-six-pages-test \
            /tmp/king-release/KING-Plus-v10.0.22-Six-Pages-TEST.apk \
            /tmp/king-release/KING-Plus-v10.0.22-Six-Pages-TEST-Source.zip \
            -R avaiyakrushal/KING-Plus \
            --target "${{ github.sha }}" \
            --title "KING Plus v10.0.22 Me Home Party Game Discover Messages TEST" \
            --prerelease \
            --notes "One combined Android TEST APK and source ZIP from successful signed CI run 38597541289 (versionCode 301). Includes functional Me, Home, Party, Game, Discover and Messages fixes. Not a final production release. Physical two-phone RTC, complete games and gifts, production Firebase and payment tests remain release blockers."
