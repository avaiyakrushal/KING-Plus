name: KING v9.9.62 Real Party Gift ACK Survives App Process Death TEST
on:
  push:
    branches: [work/king-durable-gift-receipts-v9962]
    paths: ['tools/gift-durable-v9962/**', '.github/workflows/king-durable-gift-receipts-v9962.yml']
  pull_request:
    paths: ['tools/gift-durable-v9962/**', '.github/workflows/king-durable-gift-receipts-v9962.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore complete signed v9.9.59 Party Games Gift runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9962 /tmp/king9962prev
          gh run download 38372293823 -n KING-v9961-Persistent-Host-Roles-TEST-APK-and-Source -D /tmp/king9962prev
          test -s /tmp/king9962prev/KING-Plus-v9.9.61-Persistent-Host-Roles-TEST.apk
          unzip -q /tmp/king9962prev/KING-Plus-v9.9.61-Persistent-Host-Roles-Source.zip -d /tmp/king9962
          grep -q 'versionCode 240' /tmp/king9962/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9962/app/kingplus-ci-debug.keystore
      - name: Apply reliable Party gift ACK journal and audit actual runtime
        run: |
          set -euo pipefail
          python3 tools/gift-durable-v9962/apply.py /tmp/king9962
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9962')
          src=root/'app/src/main/java/com/kingplus/social'
          party=(src/'PartyActivity.java').read_text()
          for k in ('storeGiftReceipt9962(room.getId(),id,uid)',
                    'recoverDurableGiftReceipts9962()',
                    'getSharedPreferences(GIFT_JOURNAL9962,MODE_PRIVATE)',
                    'putStringSet(GIFT_PENDING9962,all).commit()',
                    'room9962.collection("events").document(giftId)',
                    'room9962.collection("members").document(uid9962)',
                    'Source.SERVER','confirmGiftReceived9941(room9962,event,uid9962)',
                    'removeGiftReceipt9962(job.room.getId(),job.event.getId(),job.uid)',
                    'KingGiftReceiptRetry9955',
                    'KingPartyMicConsent9956','KingPartyVoiceReconnect9957'):
              assert k in party,k
          assert 'KingTttFairRoster9960' in (src/'RoomGameActivity.java').read_text()
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          assert 'versionCode 241' in (root/'app/build.gradle').read_text()
          print('PASS durable receipt after visual playback, matching SERVER Party/Gift, no fake payment')
          PY
      - name: Java tests durable gift journal and prior recipient bounded retries
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9962classes
          javac -d /tmp/king9962classes \
            /tmp/king9962/app/src/main/java/com/kingplus/social/KingGiftReceiptDurable9962.java \
            /tmp/king9962/app/src/main/java/com/kingplus/social/KingGiftReceiptRetry9955.java \
            tools/gift-durable-v9962/KingGiftReceiptDurable9962Test.java \
            tools/gift-receipt-retry-v9955/KingGiftReceiptRetry9955Test.java
          java -cp /tmp/king9962classes com.kingplus.social.KingGiftReceiptDurable9962Test
          java -cp /tmp/king9962classes com.kingplus.social.KingGiftReceiptRetry9955Test
      - name: Install real Firestore emulator dependencies
        working-directory: /tmp/king9962/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Firebase real Tic Tac Toe Ready off ghost and live pairing
        working-directory: /tmp/king9962
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/ttt-live-v9960/ttt-ready-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-ttt-9960 --config firebase-emulator.json \
            "node tests/firestore/ttt-ready-firestore.test.mjs"
      - name: Firestore emulator Host recipient-only private role and race protection
        working-directory: /tmp/king9962
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-host-role-v9961/host-role-private-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/host-role-private-firestore.test.mjs"
      - name: Regression real social game roles, privacy and simultaneous Host
        working-directory: /tmp/king9962
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-live-v9958/social-party-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/social-party-firestore.test.mjs"
      - name: Regression real Party Gift receipts and immutable game turns
        working-directory: /tmp/king9962
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          for test in gift-delivery-firestore.test.mjs immutable-rounds-firestore.test.mjs; do
            tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
              --project demo-king-live-ready-9959 --config firebase-emulator.json \
              "node tests/firestore/$test"
          done
      - name: Compile complete Android Party Games Gifting APK
        working-directory: /tmp/king9962
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify signed APK upgrade and zip integrity
        run: |
          set -euo pipefail
          old=/tmp/king9962prev/KING-Plus-v9.9.61-Persistent-Host-Roles-TEST.apk
          new=/tmp/king9962/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='241'"
          "$signer" verify --print-certs "$old" >/tmp/cert-old
          "$signer" verify --print-certs "$new" >/tmp/cert-new
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-old | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-new | head -1)"
          test -n "$a" && test "$a" = "$b"
          unzip -tq "$new" | tail -1
      - name: Package TEST APK and complete source, with no private signing key
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9962out
          cp /tmp/king9962/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9962out/KING-Plus-v9.9.62-Durable-Gift-Delivery-TEST.apk
          rm -f /tmp/king9962/app/kingplus-ci-debug.keystore
          cd /tmp/king9962
          zip -q -r /tmp/king9962out/KING-Plus-v9.9.62-Durable-Gift-Delivery-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
            './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9962out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9962-Durable-Gift-Delivery-TEST-APK-and-Source
          path: /tmp/king9962out/*
          retention-days: 14
          if-no-files-found: error
