name: Build KING Plus v9.3.0 Crowd Room Multiplayer
on:
  push:
    branches: ['build/v9.3.0-crowd-room-multiplayer']
    paths:
      - '.github/workflows/apk-v930-crowd-room.yml'
      - 'ci/v930/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v9.3.0-crowd-room-multiplayer
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recover v9.2.1 and apply crowd-room stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/base /tmp/src /tmp/release
          mkdir -p /tmp/base /tmp/src
          gh run download 37482702997 -n KING-Plus-v9.2.1-APK-and-source -D /tmp/base
          unzip -q /tmp/base/KING-Plus-v9.2.1-source.zip -d /tmp/src
          python3 ci/v930/patch_v930.py /tmp/src
          cp ci/v930/RELEASE-NOTES.md /tmp/src/RELEASE-NOTES-v9.3.0.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/app/build.gradle');s=p.read_text()
          old="versionCode 136; versionName '9.2.1'"
          if old not in s: raise SystemExit('Expected v9.2.1 version line not found')
          p.write_text(s.replace(old,"versionCode 137; versionName '9.3.0'",1))
          PY
      - name: Verify v9.3.0 markers
        run: |
          set -euo pipefail
          P=/tmp/src/app/src/main/java/com/kingplus/social/PartyActivity.java
          G=/tmp/src/app/src/main/java/com/kingplus/social/RoomGameActivity.java
          T=/tmp/src/app/src/main/java/com/kingplus/social/KingProductionTestActivity.java
          grep -F 'maxMembers930 = 100' "$P"
          grep -F 'Up to 100 users can join' "$P"
          grep -F 'checkCrowdCapacity930' "$P"
          grep -F 'Joining shared room voice' "$P"
          grep -F 'up to 50 ready players' "$G"
          grep -F 'Crowd room capacity' "$T"
          grep -F "versionName '9.3.0'" /tmp/src/app/build.gradle
      - name: Build Android APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon
      - name: Package APK and source
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil,zipfile,hashlib
          out=Path('/tmp/release');out.mkdir(parents=True,exist_ok=True)
          apk=out/'KING-Plus-v9.3.0-crowd-room-multiplayer.apk'
          shutil.copy2('app/build/outputs/apk/debug/app-debug.apk',apk)
          (out/'SHA256.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          with zipfile.ZipFile(out/'KING-Plus-v9.3.0-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('.').rglob('*'):
                  if not p.is_file() or any(v in p.parts for v in ['.git','.gradle','build','node_modules']): continue
                  if p.suffix in ['.apk','.zip','.log']: continue
                  z.write(p,p)
          shutil.copy2('RELEASE-NOTES-v9.3.0.md',out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.3.0-APK-and-source
          path: /tmp/release/*
          if-no-files-found: error
