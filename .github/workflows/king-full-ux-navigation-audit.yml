name: KING Full UX and Back-Navigation Audit
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-full-ux-navigation-audit.yml'
      - 'ci/final_five/ui_navigation_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - name: Restore latest complete KING source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kingui /tmp/kingui-artifact
          gh run download 38132703654 -n KING-Plus-Full-Integrated-Social-Safety-Source-No-APK -D /tmp/kingui-artifact
          unzip -q /tmp/kingui-artifact/KING-Plus-Social-Safety-Integrated-IN-PROGRESS-source.zip -d /tmp/kingui
      - name: Audit existing navigation rather than adding more menus
        run: python3 ci/final_five/ui_navigation_audit.py
