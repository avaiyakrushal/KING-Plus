name: Build KING Plus v9.6.8 Party Mic and Seat Sync
on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/apk-v968-mic-seat-sync.yml'
      - 'ci/v968/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: king-plus-v968-mic-seat
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test Mic seat ownership and Firestore request identifiers
        run: |
          set -euo pipefail
          mkdir -p /tmp/tests
          javac -d /tmp/tests ci/v968/KingPartyMic968.java ci/v968/KingPartyMic968Test.java
          java -cp /tmp/tests com.kingplus.social.KingPartyMic968Test
      - name: Restore successfully built KING Plus v9.6.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/archive /tmp/src
          gh run download 37944223717 -n KING-Plus-v9.6.7-live-room-presence-source -D /tmp/archive
          test -f /tmp/archive/KING-Plus-v9.6.7-live-room-presence-source.zip
          unzip -q /tmp/archive/KING-Plus-v9.6.7-live-room-presence-source.zip -d /tmp/src
      - name: Patch real Mic state, Seat Requests, and Firestore listeners
        run: python3 ci/v968/patch_v968.py /tmp/src
      - name: Safety and feature-regression checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/src')
          pkg=root/'app/src/main/java/com/kingplus/social'
          party=(pkg/'PartyActivity.java').read_text()
          main=(pkg/'MainActivity.java').read_text()
          gradle=(root/'app/build.gradle').read_text()
          rules=(root/'firestore.rules').read_text()
          assert "versionCode 159; versionName '9.6.8-party-mic-seat-sync'" in gradle
          assert 'KingPartyMic968.requestId(requestedUid968)' in party
          assert 'KingPartyMic968.canToggle(' in party
          assert 'db.runTransaction(transaction968->' in party
          assert 'transaction968.get(seatRef968)' in party
          assert 'transaction968.update(seatRef968,"micOn",desiredMic968)' in party
          assert 'micTogglePending968=true;' in party
          assert 'if(!desiredMic968)setInlineAudioMuted940(true)' in party
          assert 'isActivePresence967(expectedRoom968,expectedUid968,expectedGeneration968)' in party
          assert 'room.getId().equals(roomId)' in party
          assert 'seatMics.put(no,Boolean.TRUE.equals(d.getBoolean("micOn")))' in party
          assert 'lockedSeats.clear();lockedSeats940.clear();' in party
          assert 'seatLocksListener940=room.collection("seat_locks").addSnapshotListener' not in party
          assert 'requestId=user.getUid()+"_"+no' not in party
          assert 'requestId == request.auth.uid' in rules
          assert 'request.resource.data.diff(resource.data).affectedKeys().hasOnly([\'micOn\'])' in rules
          assert 'KingRoomPresence967.isActive(' in party
          assert 'KingPartyJoin966.current(' in party
          assert 'KingSocialIdentity965.publicId(uid)' in main
          assert 'joinRoomByCode964(' in party
          assert 'roomImageExecutor964.shutdownNow()' in party
          assert 'activeRoomForEmoji960' in party
          assert 'KingLudoTurn962.canSkip(' in (pkg/'OnlineLudoActivity.java').read_text()
          print("PASS: mic transaction, seat requests, room session guard, memory and previous features")
          PY
      - name: Compile Android APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon
      - name: Package Android APK and patched source
        run: |
          set -euo pipefail
          cp /tmp/src/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.6.8-party-mic-seat-sync.apk
          cd /tmp/src
          zip -qr /tmp/KING-Plus-v9.6.8-party-mic-seat-sync-source.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.6.8-party-mic-seat-sync-APK
          path: /tmp/KING-Plus-v9.6.8-party-mic-seat-sync.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.6.8-party-mic-seat-sync-source
          path: /tmp/KING-Plus-v9.6.8-party-mic-seat-sync-source.zip
          if-no-files-found: error
          retention-days: 7
