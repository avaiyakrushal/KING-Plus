name: KING Plus - Two Account Party Firebase Acceptance
on:
  push:
    branches: [work/king-end-to-end-security-gate]
    paths:
      - 'tests/firestore/party-two-account.test.mjs'
      - '.github/workflows/king-party-two-account-rules-test.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  two-account-firestore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact integrated v9.9.14 live 3D + previous Party source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-party-source /tmp/king-party-build
          gh run download 38142874539 -n KING-v9914-Live3D-Internal-NotFinal -D /tmp/king-party-build
          unzip -q /tmp/king-party-build/KING-Plus-v9.9.14-3D-Live-Profile-Source.zip -d /tmp/king-party-source
          test -s /tmp/king-party-source/firestore.rules
          test -s /tmp/king-party-source/app/src/main/java/com/kingplus/social/KingNative3DRoom.java
          test -s /tmp/king-party-source/app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -q 'approveOrMoveMemberSeat9913' /tmp/king-party-source/app/src/main/java/com/kingplus/social/PartyActivity.java
          mkdir -p /tmp/king-party-source/tests/firestore
          cp tests/firestore/party-two-account.test.mjs /tmp/king-party-source/tests/firestore/
      - name: Install Firebase testing tools
        working-directory: /tmp/king-party-source/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Exercise independent two-account Firebase room and permission rules
        working-directory: /tmp/king-party-source
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-kingplus-party-parity --config firebase-emulator.json \
            "node tests/firestore/party-two-account.test.mjs"
      - name: Record scope of test rather than claiming full parity
        run: |
          echo 'Party roles, seat contention, invitation, and room ban Firestore emulator PASS.'
          echo 'NOT tested here: two physical phones, RTC audio/video, real-world latency, Bolo Hi UI, 3D walking, charging, or game UX.'
