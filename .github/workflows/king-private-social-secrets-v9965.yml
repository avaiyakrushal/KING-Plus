name: KING v9.9.65 Private Random Spy Draw Secrets in Real Party TEST
on:
  push:
    branches: [work/king-private-social-secrets-v9965]
    paths: ['tools/social-secret-v9965/**', '.github/workflows/king-private-social-secrets-v9965.yml']
  pull_request:
    paths: ['tools/social-secret-v9965/**', '.github/workflows/king-private-social-secrets-v9965.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore complete signed v9.9.59 Party Games Gift runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9965 /tmp/king9965prev
          gh run download 38379320009 -n KING-v9964-Live-Social-Vote-Integrity-TEST-APK-and-Source -D /tmp/king9965prev
          test -s /tmp/king9965prev/KING-Plus-v9.9.64-Live-Social-Vote-Integrity-TEST.apk
          unzip -q /tmp/king9965prev/KING-Plus-v9.9.64-Live-Social-Vote-Integrity-Source.zip -d /tmp/king9965
          grep -q 'versionCode 243' /tmp/king9965/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9965/app/kingplus-ci-debug.keystore
      - name: Implement unpredictably random secret Spy and Draw words in private invites
        run: |
          set -euo pipefail
          python3 tools/social-secret-v9965/apply.py /tmp/king9965
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9965')
          src=root/'app/src/main/java/com/kingplus/social'
          g=(src/'RoomGameActivity.java').read_text()
          start=g[g.index('    private void startSocialRound866('):g.index('    private void startRound(String game){')]
          for tok in ('KingPartyHiddenWord9965.spy(new java.security.SecureRandom())',
                      'KingPartyHiddenWord9965.draw(',
                      'privateWord9965.put("secret",word9965)',
                      'roleDocId866(next9958,hostUid9958)',
                      'hostSecret9958=word9965',
                      'participantUids'):
            assert tok in start,tok
          assert 'spyLocation866' not in g and 'drawWord866' not in g
          assert 'new DrawPad866(drawSketch866,drawer&&moderator' in g
          finish=g[g.index('    private void finishDraw866(){'):
                   g.index('    private void closeSocialRound866(',g.index('    private void finishDraw866(){'))]
          for tok in ('Source.SERVER','"Drawer".equals',
                      'room().collection("room_invites")',
                      'KingSocialVoteRoster9964.roster',
                      'closeSocialRound866(out)'):
            assert tok in finish,tok
          assert 'versionCode 244' in (root/'app/build.gradle').read_text()
          party=(src/'PartyActivity.java').read_text()
          for token in ('KingGiftBurstBackpressure9963','KingGiftReceiptDurable9962',
                        'KingPartyVoiceReconnect9957','KingPartyMicConsent9956'):
            assert token in party,token
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          print('PASS private server-accessible DRAW word and randomly generated Spy clue')
          PY
      - name: Java genuine random private game secret and existing fair games tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9965classes
          javac -d /tmp/king9965classes \
            /tmp/king9965/app/src/main/java/com/kingplus/social/KingPartyHiddenWord9965.java \
            /tmp/king9965/app/src/main/java/com/kingplus/social/KingSocialVoteRoster9964.java \
            tools/social-secret-v9965/KingPartyHiddenWord9965Test.java \
            tools/game-launch-v9964/KingSocialVoteRoster9964Test.java
          java -cp /tmp/king9965classes com.kingplus.social.KingPartyHiddenWord9965Test
          java -cp /tmp/king9965classes com.kingplus.social.KingSocialVoteRoster9964Test
      - name: Install real Firestore emulator dependencies
        working-directory: /tmp/king9965/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Firebase private Spy clues and persistent Draw word recipient security
        working-directory: /tmp/king9965
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-secret-v9965/private-words-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-private-words-9965 --config firebase-emulator.json \
            "node tests/firestore/private-words-firestore.test.mjs"
      - name: Firestore multiuser Werewolf Spy ballot security and no stale finish
        working-directory: /tmp/king9965
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/game-launch-v9964/social-vote-security-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-vote-integrity-9964 --config firebase-emulator.json \
            "node tests/firestore/social-vote-security-firestore.test.mjs"
      - name: Firestore Party Ready true query with more than 50 stale unready
        working-directory: /tmp/king9965
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/live-party-v9963/ready-query-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-ready-filter-9963 --config firebase-emulator.json \
            "node tests/firestore/ready-query-firestore.test.mjs"
      - name: Firebase real Tic Tac Toe Ready off ghost and live pairing
        working-directory: /tmp/king9965
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/ttt-live-v9960/ttt-ready-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-ttt-9960 --config firebase-emulator.json \
            "node tests/firestore/ttt-ready-firestore.test.mjs"
      - name: Firestore emulator Host recipient-only private role and race protection
        working-directory: /tmp/king9965
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-host-role-v9961/host-role-private-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/host-role-private-firestore.test.mjs"
      - name: Regression real social game roles, privacy and simultaneous Host
        working-directory: /tmp/king9965
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-live-v9958/social-party-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/social-party-firestore.test.mjs"
      - name: Regression real Party Gift receipts and immutable game turns
        working-directory: /tmp/king9965
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          for test in gift-delivery-firestore.test.mjs immutable-rounds-firestore.test.mjs; do
            tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
              --project demo-king-live-ready-9959 --config firebase-emulator.json \
              "node tests/firestore/$test"
          done
      - name: Compile complete Android Party Games Gifting APK
        working-directory: /tmp/king9965
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify signed APK upgrade and zip integrity
        run: |
          set -euo pipefail
          old=/tmp/king9965prev/KING-Plus-v9.9.64-Live-Social-Vote-Integrity-TEST.apk
          new=/tmp/king9965/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='244'"
          "$signer" verify --print-certs "$old" >/tmp/cert-old
          "$signer" verify --print-certs "$new" >/tmp/cert-new
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-old | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-new | head -1)"
          test -n "$a" && test "$a" = "$b"
          unzip -tq "$new" | tail -1
      - name: Package TEST APK and complete source, with no private signing key
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9965out
          cp /tmp/king9965/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9965out/KING-Plus-v9.9.65-Private-Spy-Draw-TEST.apk
          rm -f /tmp/king9965/app/kingplus-ci-debug.keystore
          cd /tmp/king9965
          zip -q -r /tmp/king9965out/KING-Plus-v9.9.65-Private-Spy-Draw-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
            './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9965out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9965-Private-Spy-Draw-TEST-APK-and-Source
          path: /tmp/king9965out/*
          retention-days: 14
          if-no-files-found: error
