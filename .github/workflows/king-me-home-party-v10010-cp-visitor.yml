name: KING v10.0.10 Me Home CP Party Profile Visitor TEST APK
on:
  push:
    branches: [work/king-me-home-party-v10010-cp-visitor]
    paths:
      - 'tools/me-home-party-v10010-cp-visitor/**'
      - '.github/workflows/king-me-home-party-v10010-cp-visitor.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover exact successfully built v10.0.9 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10010prev /tmp/king10010
          gh run download 38538522828 -n KING-v10009-Me-Home-Party-TEST-APK-and-Source -D /tmp/king10010prev
          unzip -q /tmp/king10010prev/KING-Plus-v10.0.9-Me-Home-Party-TEST-Source.zip -d /tmp/king10010
          cp app/kingplus-ci-debug.keystore /tmp/king10010/app/
          python3 tools/me-home-party-v10010-cp-visitor/apply.py /tmp/king10010
      - name: Me, Home and Party source regression checks
        run: |
          set -euo pipefail
          python3 tools/me-home-party-v10010-cp-visitor/source_checks.py /tmp/king10010
      - name: Me/Home/Party lifecycle and game-state tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10010tests
          javac -d /tmp/king10010tests /tmp/king10010/app/src/main/java/com/kingplus/social/KingMeHomePartyGuard10009.java tools/me-home-party-v10009/KingMeHomePartyGuard10009Test.java
          java -cp /tmp/king10010tests com.kingplus.social.KingMeHomePartyGuard10009Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Relationship and Family 2-account Firestore emulator acceptance
        working-directory: /tmp/king10010
        env: {CI: 'true'}
        run: |
          cd tests/firestore
          npm ci --no-audit --no-fund
          cd ../..
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-me-mutual-cp-9985 --config firebase-emulator.json "node tests/firestore/relationship-family-firestore.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10010
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify v10.0.10 app ID and unchanged signing certificate
        run: |
          set -euo pipefail
          old=/tmp/king10010prev/KING-Plus-v10.0.9-Me-Home-Party-TEST.apk
          new=/tmp/king10010/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='289'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and full updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10010out /tmp/king10010/tools/me-home-party-v10010-cp-visitor
          cp tools/me-home-party-v10010-cp-visitor/* /tmp/king10010/tools/me-home-party-v10010-cp-visitor/
          cp .github/workflows/king-me-home-party-v10010-cp-visitor.yml /tmp/king10010/.github/workflows/
          cp /tmp/king10010/app/build/outputs/apk/debug/app-debug.apk /tmp/king10010out/KING-Plus-v10.0.10-Me-Home-Party-TEST.apk
          rm -f /tmp/king10010/app/kingplus-ci-debug.keystore
          cd /tmp/king10010
          zip -qr /tmp/king10010out/KING-Plus-v10.0.10-Me-Home-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10010out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10010-CP-Visitor-TEST-APK-and-Source
          path: /tmp/king10010out/*
          retention-days: 14
          if-no-files-found: error
