name: KING Plus v9.9.31 Video Party Entry TEST
on:
  push:
    branches: [work/king-video-rooms-v9931]
    paths: ['tools/video-room-v9931/**', '.github/workflows/king-video-room-v9931.yml']
  pull_request:
    paths: ['tools/video-room-v9931/**', '.github/workflows/king-video-room-v9931.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exact successful KING v9.9.30 source and signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9931 /tmp/king9931prev
          gh run download 38271312445 -n KING-v9930-Video-Parity-TEST-APK-and-Source -D /tmp/king9931prev
          echo 'cb2834cb69bc1dadbc4484d9a9ca225640e55000e9f159c954bba8e73c7c03b2  /tmp/king9931prev/KING-Plus-v9.9.30-Video-Parity-Source.zip' | sha256sum -c -
          echo '489c0adb868e061b86ad29c961b2a470fa3071ac7587cf7f6698742ba84dfd83  /tmp/king9931prev/KING-Plus-v9.9.30-Video-Parity-TEST.apk' | sha256sum -c -
          unzip -q /tmp/king9931prev/KING-Plus-v9.9.30-Video-Parity-Source.zip -d /tmp/king9931
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9931/app/kingplus-ci-debug.keystore
      - name: Apply original Party entry rules and preserve paid billing disabled
        run: |
          set -euo pipefail
          python3 tools/video-room-v9931/apply.py /tmp/king9931
          cp tools/video-room-v9931/entrance-firestore.test.mjs /tmp/king9931/tests/firestore/
          node --check /tmp/king9931/functions/v3.js
          node --test /tmp/king9931/functions/play-purchase-service.test.js
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king9931')
          s=(r/'app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          f=(r/'firestore.rules').read_text()
          assert 'channelEntranceSettings9931()' in s
          assert 'followConnection9931(roomId)' in f
          assert "mode == 'family'" in f
          assert 'versionCode 210' in (r/'app/build.gradle').read_text()
          assert 'LIVE_RECHARGE = false' in (r/'app/src/main/java/com/kingplus/social/KingRecharge974Activity.java').read_text()
          print('PASS v9.9.31 source integrations and disabled live billing')
          PY
      - name: Install Firestore emulator dependencies
        working-directory: /tmp/king9931/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Verify Family, Follow, Password, Invite and Free room permissions
        working-directory: /tmp/king9931
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec \
            --only firestore --project demo-king-entrance-9931 --config firebase-emulator.json \
            "node tests/firestore/entrance-firestore.test.mjs"
      - name: Build full Android 9.9.31 TEST APK
        working-directory: /tmp/king9931
        run: gradle :app:assembleDebug --no-daemon
      - name: Check matching package, signer, versionCode 210
        run: |
          set -euo pipefail
          old=/tmp/king9931prev/KING-Plus-v9.9.30-Video-Parity-TEST.apk
          new=/tmp/king9931/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='209'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='210'"
          "$signer" verify --print-certs "$old" > /tmp/oldcert
          "$signer" verify --print-certs "$new" > /tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Create installable APK and clean source ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9931out
          cp /tmp/king9931/app/build/outputs/apk/debug/app-debug.apk /tmp/king9931out/KING-Plus-v9.9.31-Video-Room-TEST.apk
          rm -f /tmp/king9931/app/kingplus-ci-debug.keystore
          cd /tmp/king9931
          zip -q -r /tmp/king9931out/KING-Plus-v9.9.31-Video-Room-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' './.gradle/*' '*/.gradle/*' \
               '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9931out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9931-Video-Room-TEST-APK-and-Source
          path: /tmp/king9931out/*
          retention-days: 14
          if-no-files-found: error
