name: KING v10.0.20 Combined Me Home Party Live Safety & Mic Rules TEST APK
on:
  push:
    branches: [work/king-me-home-party-v10020-batch]
    paths:
      - 'tools/me-home-party-v10020/**'
      - '.github/workflows/king-me-home-party-v10020-batch.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.19 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10020prev /tmp/king10020
          gh run download 38579739591 -n KING-v10019-Me-Home-Party-TEST-APK-and-Source -D /tmp/king10020prev
          unzip -q /tmp/king10020prev/KING-Plus-v10.0.19-Me-Home-Party-TEST-Source.zip -d /tmp/king10020
          cp app/kingplus-ci-debug.keystore /tmp/king10020/app/
          python3 tools/me-home-party-v10020/apply.py /tmp/king10020
      - name: v10.0.20 full Me/Home/Party multi-feature source regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king10020')
          src=r/'app/src/main/java/com/kingplus/social'
          me=(src/'MainActivity.java').read_text()
          home=(src/'CommunityHubActivity.java').read_text()
          party=(src/'PartyActivity.java').read_text()
          rules=(r/'firestore.rules').read_text()
          assert 'rankingOwner10020' in me and '100-profile sample' in me
          assert 'loadVisitorPage10019(' in me
          assert 'livePost10020=tx.get(ref)' in home
          assert 'momentRoom10020' in home
          assert 'live10020.getBoolean("closed")' in home
          assert 'toggleMomentLike9990(' in home
          assert 'v.put("visitedAt",FieldValue.serverTimestamp())' in party
          assert 'allSeatRequestsDialog();' in party
          assert 'private void muteExistingRoomSeats10020(' in party
          assert 'uid10020.equals(liveSeat10020.getString("uid"))' in party
          assert 'liveRoom10020.getBoolean("muteAll")' in party
          assert 'private void closeRoom(){' in party and 'tx10020.update(ref10020,"closed",true' in party
          assert "roomData(roomId).get('muteAll',false) != true" in rules
          assert 'versionCode 299;' in (r/'app/build.gradle').read_text()
          print('PASS v10.0.20 Me/Home/Party batch source + Firestore rules assertions')
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10020tests
          javac -d /tmp/king10020tests /tmp/king10020/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10020tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10020/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10020
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10013/role-safety.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs && node tests/firestore/role-safety.test.mjs"
      - name: Combined Me/Home/Party 12 real-data security scenarios
        working-directory: /tmp/king10020
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10019/rtc-membership-current-rules.test.mjs" tests/firestore/rtc-membership-firestore.test.mjs
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10020/mute-all-contract.test.mjs" tests/firestore/mute-all-contract.test.mjs
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-10020-combined --config firebase-emulator.json "node tests/firestore/visitor-pages-firestore.test.mjs && node tests/firestore/me-gallery-live-firestore.test.mjs && node tests/firestore/moments-cross-device-firestore.test.mjs && node tests/firestore/mic-consent-firestore.test.mjs && node tests/firestore/rtc-membership-firestore.test.mjs && node tests/firestore/room-game-gift.test.mjs && node tests/firestore/host-role-private-firestore.test.mjs && node tests/firestore/party-room-vote-firestore.test.mjs && node tests/firestore/mute-all-contract.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10020
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10020prev/KING-Plus-v10.0.19-Me-Home-Party-TEST.apk
          new=/tmp/king10020/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='299'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10020out /tmp/king10020/tools/me-home-party-v10020
          cp tools/me-home-party-v10020/* /tmp/king10020/tools/me-home-party-v10020/
          cp .github/workflows/king-me-home-party-v10020-batch.yml /tmp/king10020/.github/workflows/
          cp /tmp/king10020/app/build/outputs/apk/debug/app-debug.apk /tmp/king10020out/KING-Plus-v10.0.20-Me-Home-Party-TEST.apk
          rm -f /tmp/king10020/app/kingplus-ci-debug.keystore
          cd /tmp/king10020
          zip -qr /tmp/king10020out/KING-Plus-v10.0.20-Me-Home-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10020out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10020-Me-Home-Party-TEST-APK-and-Source
          path: /tmp/king10020out/*
          retention-days: 14
          if-no-files-found: error
