name: Build MB Diamond Diary v2.0.18

on:
  push:
    branches:
      - mb-diamond-diary-v2.0.8-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct v2.0.8 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mbdd
          cat .ci/mbdd/chunk01.txt .ci/mbdd/chunk02.txt .ci/mbdd/chunk03.txt .ci/mbdd/chunk04.txt .ci/mbdd/chunk05.txt > /tmp/mbdd/source.b64
          python3 - <<'PY' >> /tmp/mbdd/source.b64
          from pathlib import Path
          print(bytes.fromhex(Path('.ci/mbdd/chunk06.hex').read_text().strip()).decode(), end='')
          PY
          base64 -d /tmp/mbdd/source.b64 > /tmp/mbdd/source.zip
          mkdir -p /tmp/mbdd/project
          unzip -q /tmp/mbdd/source.zip -d /tmp/mbdd/project

      - name: Apply v2.0.9 department and boss dashboard patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mbdd-v209/chunk01.txt .ci/mbdd-v209/chunk02.txt .ci/mbdd-v209/chunk03.txt .ci/mbdd-v209/chunk04.txt > /tmp/mbdd/v209.b64
          base64 -d /tmp/mbdd/v209.b64 | gzip -d > /tmp/mbdd/v209.patch
          patch -d /tmp/mbdd/project -p1 < /tmp/mbdd/v209.patch
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > /tmp/mbdd/project/gradle.properties

      - name: Apply v2.0.10 final flow patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mbdd-v2010/chunk01.txt .ci/mbdd-v2010/chunk02.txt .ci/mbdd-v2010/chunk03.txt .ci/mbdd-v2010/chunk04.txt .ci/mbdd-v2010/chunk05.txt > /tmp/mbdd/v2010.b64
          base64 -d /tmp/mbdd/v2010.b64 | gzip -d > /tmp/mbdd/v2010.patch
          patch -d /tmp/mbdd/project -p1 < /tmp/mbdd/v2010.patch

      - name: Apply v2.0.15 owner dashboard patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mbdd-v2015/chunk01.txt > /tmp/mbdd/v2015.b64
          base64 -d /tmp/mbdd/v2015.b64 | gzip -d > /tmp/mbdd/v2015.patch
          patch -d /tmp/mbdd/project -p1 < /tmp/mbdd/v2015.patch

      - name: Apply v2.0.16 withdrawal report patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mbdd-v2016/chunk01.txt .ci/mbdd-v2016/chunk02.txt > /tmp/mbdd/v2016.b64
          base64 -d /tmp/mbdd/v2016.b64 | gzip -d > /tmp/mbdd/v2016.patch
          patch -d /tmp/mbdd/project -p1 < /tmp/mbdd/v2016.patch

      - name: Apply v2.0.17 expense entry patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mbdd-v2017b/chunk01.txt .ci/mbdd-v2017b/chunk02.txt .ci/mbdd-v2017b/chunk03.txt .ci/mbdd-v2017b/chunk04.txt .ci/mbdd-v2017b/chunk05.txt .ci/mbdd-v2017b/chunk06.txt .ci/mbdd-v2017b/chunk07.txt .ci/mbdd-v2017b/chunk08.txt > /tmp/mbdd/v2017.b64
          base64 -d /tmp/mbdd/v2017.b64 | gzip -d > /tmp/mbdd/v2017.patch
          patch -d /tmp/mbdd/project -p1 < /tmp/mbdd/v2017.patch

      - name: Apply v2.0.18 final UI and editing patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mbdd-v2019/chunk01.txt .ci/mbdd-v2019/chunk02.txt > /tmp/mbdd/v2018.b64
          base64 -d /tmp/mbdd/v2018.b64 | gzip -d > /tmp/mbdd/v2018.patch
          patch -d /tmp/mbdd/project -p4 < /tmp/mbdd/v2018.patch
          node --check /tmp/mbdd/project/app/src/main/assets/app.js

      - name: Apply stable Google signing and branded icon
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/mbdd-signing/debug.keystore.b64 > /tmp/mbdd/project/mbdd-debug.keystore
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/mbdd/project')
          gradle = root / 'app/build.gradle'
          s = gradle.read_text()
          s = re.sub(r"versionCode\s+\d+", "versionCode 37", s)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '2.0.18'", s)
          marker = "\n}\n\ndependencies {"
          signing = '''
              signingConfigs {
                  stableDebug {
                      storeFile file("${rootProject.projectDir}/mbdd-debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableDebug
                  }
              }
          '''
          if 'stableDebug {' not in s:
              if marker not in s:
                  raise SystemExit('android block end not found')
              s = s.replace(marker, signing + marker, 1)
          gradle.write_text(s)

          manifest = root / 'app/src/main/AndroidManifest.xml'
          m = manifest.read_text()
          if 'android:icon=' not in m:
              m = m.replace('android:label="MB ડાયમંડ ડાયરી"', 'android:label="MB ડાયમંડ ડાયરી" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"')
          manifest.write_text(m)

          values = root / 'app/src/main/res/values'
          drawable = root / 'app/src/main/res/drawable'
          mipmap = root / 'app/src/main/res/mipmap-anydpi'
          adaptive_dir = root / 'app/src/main/res/mipmap-anydpi-v26'
          for d in (values, drawable, mipmap, adaptive_dir):
              d.mkdir(parents=True, exist_ok=True)
          (values / 'colors.xml').write_text('<resources>\n  <color name="mb_navy">#172A4A</color>\n</resources>\n')
          foreground = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="4" android:strokeLineJoin="round" android:pathData="M54,22 L78,39 L68,66 L54,84 L40,66 L30,39 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="3" android:strokeLineJoin="round" android:pathData="M30,39 L78,39 M40,66 L68,66 M54,22 L40,39 L54,66 L68,39 Z M30,39 L40,66 L54,84 M78,39 L68,66 L54,84"/>
            <path android:fillColor="#F4C45E" android:pathData="M81,26 L84,32 L90,35 L84,38 L81,44 L78,38 L72,35 L78,32 Z"/>
          </vector>\n'''
          (drawable / 'ic_launcher_foreground.xml').write_text(foreground)
          legacy = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#172A4A" android:pathData="M4,4 L104,4 L104,104 L4,104 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="4" android:strokeLineJoin="round" android:pathData="M54,22 L78,39 L68,66 L54,84 L40,66 L30,39 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="3" android:strokeLineJoin="round" android:pathData="M30,39 L78,39 M40,66 L68,66 M54,22 L40,39 L54,66 L68,39 Z M30,39 L40,66 L54,84 M78,39 L68,66 L54,84"/>
            <path android:fillColor="#F4C45E" android:pathData="M81,26 L84,32 L90,35 L84,38 L72,35 L78,32 Z"/>
          </vector>\n'''
          (mipmap / 'ic_launcher.xml').write_text(legacy)
          (mipmap / 'ic_launcher_round.xml').write_text(legacy)
          adaptive = '''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/mb_navy"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>\n'''
          (adaptive_dir / 'ic_launcher.xml').write_text(adaptive)
          (adaptive_dir / 'ic_launcher_round.xml').write_text(adaptive)
          PY
          keytool -list -v -keystore /tmp/mbdd/project/mbdd-debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Build APK
        working-directory: /tmp/mbdd/project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA1=$(keytool -printcert -jarfile /tmp/mbdd/project/app/build/outputs/apk/debug/app-debug.apk | awk '/SHA1:/{print $2; exit}')
          echo "APK SHA1: $APK_SHA1"
          test "$APK_SHA1" = "1C:69:20:02:92:FB:2F:5A:C7:B5:DE:22:2D:03:B1:6D:F1:3E:C8:2E"

      - name: Stage APK and source
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/mbdd/project/app/build/outputs/apk/debug/app-debug.apk MB-Diamond-Diary-v2.0.18-debug.apk
          cd /tmp/mbdd/project
          zip -qr "$GITHUB_WORKSPACE/MB-Diamond-Diary-v2.0.18-source.zip" . -x '*/build/*' '.gradle/*' 'mbdd-debug.keystore'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.18-APK
          path: MB-Diamond-Diary-v2.0.18-debug.apk
          if-no-files-found: error

      - name: Upload reconstructed source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.18-source
          path: MB-Diamond-Diary-v2.0.18-source.zip
          if-no-files-found: error
