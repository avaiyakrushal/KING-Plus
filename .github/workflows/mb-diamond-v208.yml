name: Build MB Diamond Diary v2.0.14

on:
  push:
    branches:
      - mb-diamond-diary-v2.0.8-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct v2.0.8 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mbdd
          cat .ci/mbdd/chunk01.txt .ci/mbdd/chunk02.txt .ci/mbdd/chunk03.txt .ci/mbdd/chunk04.txt .ci/mbdd/chunk05.txt > /tmp/mbdd/source.b64
          python3 - <<'PY' >> /tmp/mbdd/source.b64
          from pathlib import Path
          print(bytes.fromhex(Path('.ci/mbdd/chunk06.hex').read_text().strip()).decode(), end='')
          PY
          base64 -d /tmp/mbdd/source.b64 > /tmp/mbdd/source.zip
          mkdir -p /tmp/mbdd/project
          unzip -q /tmp/mbdd/source.zip -d /tmp/mbdd/project

      - name: Apply v2.0.9 department and boss dashboard patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mbdd-v209/chunk01.txt .ci/mbdd-v209/chunk02.txt .ci/mbdd-v209/chunk03.txt .ci/mbdd-v209/chunk04.txt > /tmp/mbdd/v209.b64
          base64 -d /tmp/mbdd/v209.b64 | gzip -d > /tmp/mbdd/v209.patch
          patch -d /tmp/mbdd/project -p1 < /tmp/mbdd/v209.patch
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > /tmp/mbdd/project/gradle.properties

      - name: Apply v2.0.10 final flow patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mbdd-v2010/chunk01.txt .ci/mbdd-v2010/chunk02.txt .ci/mbdd-v2010/chunk03.txt .ci/mbdd-v2010/chunk04.txt .ci/mbdd-v2010/chunk05.txt > /tmp/mbdd/v2010.b64
          base64 -d /tmp/mbdd/v2010.b64 | gzip -d > /tmp/mbdd/v2010.patch
          patch -d /tmp/mbdd/project -p1 < /tmp/mbdd/v2010.patch

      - name: Apply v2.0.14 stable Google login and branded icon
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/mbdd-signing/debug.keystore.b64 > /tmp/mbdd/project/mbdd-debug.keystore
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/mbdd/project')
          p = root / 'app/build.gradle'
          s = p.read_text()
          s = re.sub(r"versionCode\s+\d+", "versionCode 33", s)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '2.0.14'", s)
          marker = "\n}\n\ndependencies {"
          signing = """
              signingConfigs {
                  stableDebug {
                      storeFile file("${rootProject.projectDir}/mbdd-debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableDebug
                  }
              }
          """
          if 'stableDebug {' not in s:
              if marker not in s:
                  raise SystemExit('android block end not found')
              s = s.replace(marker, signing + marker, 1)
          p.write_text(s)
          manifest = root / 'app/src/main/AndroidManifest.xml'
          m = manifest.read_text()
          if 'android:icon=' not in m:
              m = m.replace('android:label="MB ડાયમંડ ડાયરી"', 'android:label="MB ડાયમંડ ડાયરી" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"')
          manifest.write_text(m)
          PY

          mkdir -p /tmp/mbdd/project/app/src/main/res/values
          mkdir -p /tmp/mbdd/project/app/src/main/res/drawable
          mkdir -p /tmp/mbdd/project/app/src/main/res/mipmap-anydpi
          mkdir -p /tmp/mbdd/project/app/src/main/res/mipmap-anydpi-v26
          echo 'PHJlc291cmNlcz4KICA8Y29sb3IgbmFtZT0ibWJfbmF2eSI+IzE3MkE0QTwvY29sb3I+CjwvcmVzb3VyY2VzPgo=' | base64 -d > /tmp/mbdd/project/app/src/main/res/values/colors.xml
          echo '' | base64 -d > /tmp/mbdd/project/app/src/main/res/drawable/ic_launcher_foreground.xml
          echo '' | base64 -d > /tmp/mbdd/project/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          cp /tmp/mbdd/project/app/src/main/res/mipmap-anydpi/ic_launcher.xml /tmp/mbdd/project/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          echo 'PGFkYXB0aXZlLWljb24geG1sbnM6YW5kcm9pZD0iaHR0cDovL3NjaGVtYXMuYW5kcm9pZC5jb20vYXBrL3Jlcy9hbmRyb2lkIj4KICA8YmFja2dyb3VuZCBhbmRyb2lkOmRyYXdhYmxlPSJAY29sb3IvbWJfbmF2eSIvPgogIDxmb3JlZ3JvdW5kIGFuZHJvaWQ6ZHJhd2FibGU9IkBkcmF3YWJsZS9pY19sYXVuY2hlcl9mb3JlZ3JvdW5kIi8+CjwvYWRhcHRpdmUtaWNvbj4K' | base64 -d > /tmp/mbdd/project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp /tmp/mbdd/project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml /tmp/mbdd/project/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          keytool -list -v -keystore /tmp/mbdd/project/mbdd-debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Build APK
        working-directory: /tmp/mbdd/project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA1=$(keytool -printcert -jarfile /tmp/mbdd/project/app/build/outputs/apk/debug/app-debug.apk | awk '/SHA1:/{print $2; exit}')
          echo "APK SHA1: $APK_SHA1"
          test "$APK_SHA1" = "1C:69:20:02:92:FB:2F:5A:C7:B5:DE:22:2D:03:B1:6D:F1:3E:C8:2E"

      - name: Stage APK and source
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/mbdd/project/app/build/outputs/apk/debug/app-debug.apk MB-Diamond-Diary-v2.0.14-debug.apk
          cd /tmp/mbdd/project
          zip -qr "$GITHUB_WORKSPACE/MB-Diamond-Diary-v2.0.14-source.zip" . -x '*/build/*' '.gradle/*' 'mbdd-debug.keystore'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.14-APK
          path: MB-Diamond-Diary-v2.0.14-debug.apk
          if-no-files-found: error

      - name: Upload reconstructed source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.14-source
          path: MB-Diamond-Diary-v2.0.14-source.zip
          if-no-files-found: error
