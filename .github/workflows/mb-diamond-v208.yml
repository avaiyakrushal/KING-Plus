name: Build MB Diamond Diary v2.0.11

on:
  push:
    branches:
      - mb-diamond-diary-v2.0.8-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct v2.0.8 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mbdd
          cat .ci/mbdd/chunk01.txt .ci/mbdd/chunk02.txt .ci/mbdd/chunk03.txt .ci/mbdd/chunk04.txt .ci/mbdd/chunk05.txt > /tmp/mbdd/source.b64
          python3 - <<'PY' >> /tmp/mbdd/source.b64
          from pathlib import Path
          print(bytes.fromhex(Path('.ci/mbdd/chunk06.hex').read_text().strip()).decode(), end='')
          PY
          base64 -d /tmp/mbdd/source.b64 > /tmp/mbdd/source.zip
          mkdir -p /tmp/mbdd/project
          unzip -q /tmp/mbdd/source.zip -d /tmp/mbdd/project
      - name: Apply v2.0.9 department and boss dashboard patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mbdd-v209/chunk01.txt .ci/mbdd-v209/chunk02.txt .ci/mbdd-v209/chunk03.txt .ci/mbdd-v209/chunk04.txt > /tmp/mbdd/v209.b64
          base64 -d /tmp/mbdd/v209.b64 | gzip -d > /tmp/mbdd/v209.patch
          patch -d /tmp/mbdd/project -p1 < /tmp/mbdd/v209.patch
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > /tmp/mbdd/project/gradle.properties
      - name: Apply v2.0.10 final flow patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mbdd-v2010/chunk01.txt .ci/mbdd-v2010/chunk02.txt .ci/mbdd-v2010/chunk03.txt .ci/mbdd-v2010/chunk04.txt .ci/mbdd-v2010/chunk05.txt > /tmp/mbdd/v2010.b64
          base64 -d /tmp/mbdd/v2010.b64 | gzip -d > /tmp/mbdd/v2010.patch
          patch -d /tmp/mbdd/project -p1 < /tmp/mbdd/v2010.patch
      - name: Apply v2.0.11 stable Google-login signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 -d .ci/mbdd-signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          sed -i -E "s/versionCode [0-9]+/versionCode 30/; s/versionName '[^']+'/versionName '2.0.11'/" /tmp/mbdd/project/app/build.gradle
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'
      - name: Build APK
        working-directory: /tmp/mbdd/project
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK signing certificate
        shell: bash
        run: keytool -printcert -jarfile /tmp/mbdd/project/app/build/outputs/apk/debug/app-debug.apk | grep -E 'SHA1:|SHA256:'
      - name: Stage APK and source
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/mbdd/project/app/build/outputs/apk/debug/app-debug.apk MB-Diamond-Diary-v2.0.11-debug.apk
          cd /tmp/mbdd/project
          zip -qr "$GITHUB_WORKSPACE/MB-Diamond-Diary-v2.0.11-source.zip" . -x '*/build/*' '.gradle/*'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.11-APK
          path: MB-Diamond-Diary-v2.0.11-debug.apk
          if-no-files-found: error
      - name: Upload reconstructed source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.11-source
          path: MB-Diamond-Diary-v2.0.11-source.zip
          if-no-files-found: error
