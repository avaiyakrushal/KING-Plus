name: Build KING Plus v5.1.0 Party Interaction

on:
  push:
    branches: [ real-social-v390-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build v5.1.0 Party Interaction
        run: bash tools/build_v510.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v5.1.0-party-interaction
          path: release_v510/*
          if-no-files-found: error
