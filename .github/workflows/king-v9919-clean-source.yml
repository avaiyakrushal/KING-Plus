name: KING Plus v9.9.19 - Clean Source Archive
on:
  push:
    branches: [work/king-v9919-seat-exit-fix]
    paths: ['.github/workflows/king-v9919-clean-source.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified previous complete KING source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9919-clean /tmp/king9919-clean-old
          gh release download v9.9.18-room-stability \
            -p 'KING-Plus-v9.9.18-Room-Stability-Source.zip' -D /tmp/king9919-clean-old
          unzip -q /tmp/king9919-clean-old/KING-Plus-v9.9.18-Room-Stability-Source.zip \
            -d /tmp/king9919-clean
          python3 tools/v9919/king_room_exit_cleanup.py /tmp/king9919-clean
      - name: Package source before compiling; exclude all signing/binary output
        run: |
          set -euo pipefail
          rm -f /tmp/king9919-clean/app/kingplus-ci-debug.keystore
          cd /tmp/king9919-clean
          zip -q -r /tmp/KING-Plus-v9.9.19-Room-Seat-Sync-Source.zip . \
            -x '*build/*' '*\.gradle/*' '*.apk' '*.aab' '*.jks' '*.keystore' '*local.properties' '*.zip'
          unzip -Z -1 /tmp/KING-Plus-v9.9.19-Room-Seat-Sync-Source.zip \
            | grep -q 'app/src/main/java/com/kingplus/social/PartyActivity.java'
          if unzip -Z -1 /tmp/KING-Plus-v9.9.19-Room-Seat-Sync-Source.zip \
            | grep -E '(^|/)(build|.gradle)/|\.apk$|\.keystore$|local.properties$'; then
            echo 'FAIL source ZIP includes build or signing output'; exit 1
          fi
          BYTES="$(stat -c%s /tmp/KING-Plus-v9.9.19-Room-Seat-Sync-Source.zip)"
          test "$BYTES" -gt 100000 && test "$BYTES" -lt 10000000
          echo "PASS clean source bytes=$BYTES"
      - name: Replace source asset only - do not touch verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v9.9.19-room-seat-sync \
            /tmp/KING-Plus-v9.9.19-Room-Seat-Sync-Source.zip --clobber
