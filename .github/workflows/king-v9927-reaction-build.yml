name: KING Plus v9.9.27 - Real Reaction and Party Round Safety
on:
  push:
    branches: [work/king-v9927-reaction-round-safety]
    paths:
      - 'tools/v9927/**'
      - '.github/workflows/king-v9927-reaction-build.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: king-v9927-reaction
  cancel-in-progress: false
jobs:
  actual-game-and-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore latest verified KING Plus v9.9.26 full source and signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9927 /tmp/king9927previous
          gh release download v9.9.26-voice-family-gate \
            -p 'KING-Plus-v9.9.26-Voice-Family-Gate-Source.zip' -D /tmp/king9927previous
          gh release download v9.9.26-voice-family-gate \
            -p 'KING-Plus-v9.9.26-Voice-Family-Gate-TEST.apk' -D /tmp/king9927previous
          unzip -q /tmp/king9927previous/KING-Plus-v9.9.26-Voice-Family-Gate-Source.zip -d /tmp/king9927
          test -s /tmp/king9927/app/src/main/java/com/kingplus/social/RoomGameActivity.java
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9927/app/kingplus-ci-debug.keystore
      - name: Implement fair GO-signal Reaction with legacy Firebase crash guards
        run: |
          set -euo pipefail
          python3 tools/v9927/apply_reaction_fix.py /tmp/king9927
          grep -q "versionCode 206" /tmp/king9927/app/build.gradle
          grep -q 'reactionPhase9927' /tmp/king9927/app/src/main/java/com/kingplus/social/RoomGameActivity.java
          grep -q 'storedRound9927' /tmp/king9927/app/src/main/java/com/kingplus/social/RoomGameActivity.java
      - name: Verify reaction physics, premature click and score regression in plain Java
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-reaction-classfiles
          javac -d /tmp/king-reaction-classfiles \
            tools/v9927/KingReactionRules9927.java tools/v9927/KingReactionRules9927Test.java
          java -cp /tmp/king-reaction-classfiles com.kingplus.social.KingReactionRules9927Test
      - name: Compile entire Android application including past Party and multiplayer games
        working-directory: /tmp/king9927
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify same KING package signing certificate and in-place upgrade
        run: |
          set -euo pipefail
          OLD=/tmp/king9927previous/KING-Plus-v9.9.26-Voice-Family-Gate-TEST.apk
          NEW=/tmp/king9927/app/build/outputs/apk/debug/app-debug.apk
          test -s "$OLD" && test -s "$NEW"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='205'"
          "$AAPT" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='206'"
          "$SIGNER" verify --print-certs "$OLD" > /tmp/king9927-oldcert
          "$SIGNER" verify --print-certs "$NEW" > /tmp/king9927-newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9927-oldcert | head -1 || true)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9927-newcert | head -1 || true)"
          test -n "$a" && test "$a" = "$b"
          echo "PASS Android update same app, same signer and higher versionCode"
      - name: Package actual APK and clean complete KING source ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9927out
          cp /tmp/king9927/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9927out/KING-Plus-v9.9.27-Real-Reaction-TEST.apk
          rm -f /tmp/king9927/app/kingplus-ci-debug.keystore
          cd /tmp/king9927
          zip -q -r /tmp/king9927out/KING-Plus-v9.9.27-Real-Reaction-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' '*.log' \
               'app/build/*' './app/build/*' '*/build/*' './.gradle/*' '*/.gradle/*' \
               '*.apk' '*.aab' '*.jks' '*.keystore' '*local.properties' '*.zip'
          BYTES="$(stat -c%s /tmp/king9927out/KING-Plus-v9.9.27-Real-Reaction-Source.zip)"
          test "$BYTES" -gt 100000 && test "$BYTES" -lt 10000000
          sha256sum /tmp/king9927out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9927-Actual-Reaction-APK-and-Source
          path: /tmp/king9927out/*
          retention-days: 14
          if-no-files-found: error
      - name: Release verified TEST APK only after compile and signer success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v9.9.27-real-reaction /tmp/king9927out/* \
            --target "$GITHUB_SHA" --prerelease \
            --title 'KING Plus v9.9.27 - Real Party Reaction TEST' \
            --notes 'Bolo Hi 5.30.5 vs KING Plus source comparison finds Reaction game incorrectly measured latency since initial view render without a GO signal. KING original game now uses randomized 1.5–4-second wait, real green GO, monotonic elapsed tap measurement, false-start penalty and existing authenticated Firebase Party round submissions. Also protects two malformed/legacy Firestore game_state roundId reads that could NullPointerException in game start/move submit. Pure-Java regression, full Android APK build, package and identical-signature v9.9.26 upgrade verified. Preserves KING Royal Neon screens, live multiplayer Ludo, Chess, Flying Knife, Sheep Sprint, host/admin, 6-seat video, gifting and RTC membership gating. NOT Bolo Hi 100% clone / Final. Production Firebase rules/deploy, real two-device RTC, all original games and 3D characters, mobile OTP, provider integrations, approved paid Recharge and actual device acceptance remain unverified or incomplete.'
