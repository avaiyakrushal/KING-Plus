name: Inspect KING Plus v9.6.4 Realtime Social and Room Presence

on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/inspect-v965-follow-presence.yml'
      - 'ci/v965/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - name: Recover v9.6.4 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/archive /tmp/src
          gh run download 37903811801 -n KING-Plus-v9.6.4-party-memory-social-ids-source -D /tmp/archive
          unzip -q /tmp/archive/KING-Plus-v9.6.4-party-memory-social-ids-source.zip -d /tmp/src
      - name: Print exact follow and profile lifecycle methods
        run: |
          python3 ci/v965/inspect_methods_v965.py /tmp/src | head -c 72000
