name: KING v9.9.39 Real Party Ludo and Knife Membership TEST
on:
  push:
    branches: [work/king-real-ludo-sheep-knife-v9939]
    paths: ['tools/real-games-v9939/**','.github/workflows/king-real-games-9939.yml']
  pull_request:
    paths: ['tools/real-games-v9939/**','.github/workflows/king-real-games-9939.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tested-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore actual tested v9.9.38 full source and APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9939 /tmp/king9939prev
          gh run download 38335647834 -n KING-v9938-Real-Game-Gift-TEST-APK-and-Source -D /tmp/king9939prev
          unzip -q /tmp/king9939prev/KING-Plus-v9.9.38-Real-Game-Gift-Source.zip -d /tmp/king9939
          test -s /tmp/king9939prev/KING-Plus-v9.9.38-Real-Game-Gift-TEST.apk
          grep -q "versionCode 217" /tmp/king9939/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9939/app/kingplus-ci-debug.keystore
      - name: Apply real multiplayer Ludo membership and live Knife kick revocation
        run: |
          set -euo pipefail
          python3 tools/real-games-v9939/apply.py /tmp/king9939
          cp tools/real-games-v9939/party-ludo-firestore.test.mjs /tmp/king9939/tests/firestore/
          node --check /tmp/king9939/functions/v3.js
          node --test /tmp/king9939/functions/play-purchase-service.test.js
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king9939');s=r/'app/src/main/java/com/kingplus/social'
          l=(s/'OnlineLudoActivity.java').read_text()
          k=(s/'KingKnifeArena9923Activity.java').read_text()
          f=(r/'firestore.rules').read_text()
          assert 'Source.SERVER' in l and 'openPartyMatchVerified9939' in l
          assert 'watchLiveMembership9939' in k and 'membershipListener9939.remove()' in k
          assert "roomModerator(request.resource.data.get('partyRoomKey',''))" in f
          assert 'versionCode 218' in (r/'app/build.gradle').read_text()
          assert 'LIVE_RECHARGE = false' in (s/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (s/'KingPremiumAccess981.java').read_text()
          print('PASS real Party-Ludo member gating, Knife revocation, paid billing OFF')
          PY
      - name: Install Firestore emulator dependencies
        working-directory: /tmp/king9939/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account Party Ludo access and removal tests
        working-directory: /tmp/king9939
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-party-ludo-9939 --config firebase-emulator.json \
            "node tests/firestore/party-ludo-firestore.test.mjs"
      - name: Regression real Tic Tac Toe, paired gifting and Party Room password security
        working-directory: /tmp/king9939
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-9938-live --config firebase-emulator.json \
            "node tests/firestore/room-game-gift.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-room-v9936 --config firebase-emulator.json \
            "node tests/firestore/functional-access.test.mjs"
      - name: Compile actual complete KING Android application
        working-directory: /tmp/king9939
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Check Android package signer/version and all prior UI resources
        run: |
          set -euo pipefail
          old=/tmp/king9939prev/KING-Plus-v9.9.38-Real-Game-Gift-TEST.apk
          new=/tmp/king9939/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='217'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='218'"
          "$signer" verify --print-certs "$old" > /tmp/oldcert
          "$signer" verify --print-certs "$new" > /tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
          python3 - <<'PY'
          from zipfile import ZipFile
          old='/tmp/king9939prev/KING-Plus-v9.9.38-Real-Game-Gift-TEST.apk'
          new='/tmp/king9939/app/build/outputs/apk/debug/app-debug.apk'
          def counts(p):
            with ZipFile(p) as z:names=set(z.namelist())
            return (sum(x.startswith('res/layout') and x.endswith('.xml') for x in names),
              sum(x.startswith('res/drawable') and x.endswith(('.xml','.png','.webp')) for x in names))
          print('layout_drawable',counts(old),counts(new))
          assert counts(old)==counts(new)==(4065,8680)
          PY
      - name: Package signed TEST APK and complete source ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9939out
          cp /tmp/king9939/app/build/outputs/apk/debug/app-debug.apk /tmp/king9939out/KING-Plus-v9.9.39-Real-Ludo-Knife-TEST.apk
          rm -f /tmp/king9939/app/kingplus-ci-debug.keystore
          cd /tmp/king9939
          zip -q -r /tmp/king9939out/KING-Plus-v9.9.39-Real-Ludo-Knife-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
               './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9939out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9939-Real-Ludo-Knife-TEST-APK-and-Source
          path: /tmp/king9939out/*
          retention-days: 14
          if-no-files-found: error
