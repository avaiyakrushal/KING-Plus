name: Audit KING Plus Default Firestore Database Metadata
on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/audit-v988-firestore-default.yml'
      - 'ci/v988/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: king-plus-firestore-metadata-readonly
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify project account without exposing key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | jq -e '.type=="service_account" and .project_id=="king-plus-2f365"' >/dev/null
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/metadata-readonly.json"
          chmod 600 "$RUNNER_TEMP/metadata-readonly.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/metadata-readonly.json" >> "$GITHUB_ENV"
      - name: Install already used Admin SDK and Google API client
        run: npm install --prefix functions --no-audit --no-fund
      - name: Inspect (default) Firestore database metadata only, never change data
        env:
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: |
          set -euo pipefail
          node ci/v988/firestore_default_database_metadata.cjs
      - name: Wipe read-only metadata test key
        if: always()
        run: rm -f "$RUNNER_TEMP/metadata-readonly.json"
