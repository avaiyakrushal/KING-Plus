name: Build KING Plus v9.8.7 Faster Host Room Join
on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/apk-v987-faster-host-join.yml'
      - 'ci/v991/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: kingplus-v987-faster-host-join
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify strict host new Room security guards
        run: |
          set -euo pipefail
          mkdir -p /tmp/host991-tests
          javac -d /tmp/host991-tests ci/v991/KingFreshHostRoom991.java ci/v991/KingFreshHostRoom991Test.java
          java -cp /tmp/host991-tests com.kingplus.social.KingFreshHostRoom991Test
          python3 -m py_compile ci/v991/patch_fresh_host_join_v991.py
      - name: Restore fully compiled v9.8.6 Party Android source and APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/old-source /tmp/android /tmp/old-apk
          gh run download 38074781411 -n KING-Plus-v9.8.6-Firebase-Server-Diagnosis-Source -D /tmp/old-source
          test -s /tmp/old-source/KING-Plus-v9.8.6-Firebase-Server-Diagnosis-source.zip
          unzip -q /tmp/old-source/KING-Plus-v9.8.6-Firebase-Server-Diagnosis-source.zip -d /tmp/android
          gh run download 38074781411 -n KING-Plus-v9.8.6-Firebase-Server-Diagnosis-APK -D /tmp/old-apk
      - name: Apply only server-confirmed NEW host Room join speedup
        run: |
          set -euo pipefail
          python3 ci/v991/patch_fresh_host_join_v991.py /tmp/android
      - name: Protect security, guest capacity, server-verified joining and older features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/android')
          pkg=root/'app/src/main/java/com/kingplus/social'
          p=(pkg/'PartyActivity.java').read_text()
          g=(root/'app/build.gradle').read_text()
          assert "versionCode 178; versionName '9.8.7-faster-new-host-party-join'" in g
          assert 'newlyCreatedServerRoom991=ref.getId();openCloudRoom(' in p
          assert 'KingFreshHostRoom991.canWriteWithoutPreRead(' in p
          assert 'newlyCreatedServerRoom991=null;' in p
          assert 'if(newlyCreatedHost991){' in p
          assert 'write.run();' in p
          assert 'if(isFinishing()||isDestroyed()||roomId==null||!cloudRoom||memberSeen)return;' in p
          assert 'ref.get(com.google.firebase.firestore.Source.SERVER)' in p
          assert 'checkCrowdCapacity930(requestedRoomRef966' in p
          assert 'expectedRoom966.collection("members").get(com.google.firebase.firestore.Source.SERVER)' in p
          assert 'ref.set(member,SetOptions.merge())' in p
          assert 'isCurrentPartyJoin966(' in p
          assert 'startPartyJoinTimeout977(' in p
          assert 'activeRoomCallback982(' in p
          assert 'KingPartyMic968.canToggle(' in p
          assert 'KingLudoTurn962.canSkip(' in (pkg/'OnlineLudoActivity.java').read_text()
          assert 'KingFirestoreRecovery986.guidance(' in p
          assert (pkg/'KingLiveMembers984.java').exists()
          assert (pkg/'KingConnection983Activity.java').exists()
          assert (pkg/'KingRecharge974Activity.java').exists()
          assert (pkg/'KingPhoneOtp975Activity.java').exists()
          print('PASS speed scope: only new creator fast-path; guests still server-verify member+room+capacity; no rules or billing change')
          PY
      - name: Compile v9.8.7 Android APK
        working-directory: /tmp/android
        run: gradle :app:assembleDebug --no-daemon
      - name: Require matching signature for install-over-v9.8.6 without data loss
        run: |
          set -euo pipefail
          OLD="$(find /tmp/old-apk -name '*.apk' -print -quit)"
          NEW=/tmp/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$OLD" && test -s "$NEW"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          test -n "$signer" && test -n "$aapt"
          "$signer" verify --print-certs "$OLD" >/tmp/oldcert.txt
          "$signer" verify --print-certs "$NEW" >/tmp/newcert.txt
          O="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert.txt | head -1)"
          N="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert.txt | head -1)"
          test -n "$O" && test "$O" = "$N"
          "$aapt" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='177'"
          "$aapt" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='178'"
          echo "PASS: same signing key; v9.8.7 may update installed v9.8.6"
      - name: Package installable APK and full new source
        run: |
          set -euo pipefail
          cp /tmp/android/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.8.7-Faster-Host-Party-Join.apk
          (cd /tmp/android && zip -qr /tmp/KING-Plus-v9.8.7-Faster-Host-Party-Join-source.zip .)
          sha256sum /tmp/KING-Plus-v9.8.7-Faster-Host-Party-Join.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.8.7-Faster-Host-Party-Join-APK
          path: /tmp/KING-Plus-v9.8.7-Faster-Host-Party-Join.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.8.7-Faster-Host-Party-Join-Source
          path: /tmp/KING-Plus-v9.8.7-Faster-Host-Party-Join-source.zip
          retention-days: 7
          if-no-files-found: error
      - name: Publish signed Chrome APK direct link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=/tmp/KING-Plus-v9.8.7-Faster-Host-Party-Join.apk
          if gh release view v9.8.7 >/dev/null 2>&1; then
            gh release upload v9.8.7 "$FILE" --clobber
          else
            gh release create v9.8.7 "$FILE" \
              --target work/reference-completion \
              --title "KING Plus v9.8.7 Faster New Host Party Join" \
              --notes "Incremental, signed test APK for v9.8.6. Speeds NEW host-created Party entry by skipping one redundant Firestore pre-read AFTER the Room create write was confirmed. Always waits for secure Firestore membership write success before opening Party; all guest join, room capacity, security rules, account and session checks stay unchanged. Deduplicates duplicate member-write completion in a single visit. 2-phone runtime timing still needs testing. Existing Firebase sync, chat, Mic/Seat, Ludo and gifts preserved. No billing or backend permissions changes." \
              --prerelease
          fi
          gh release view v9.8.7 --json url,assets --jq '{url,assets:[.assets[]|{name,url,size}]}'
