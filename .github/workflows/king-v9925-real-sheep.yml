name: KING Plus v9.9.25 - Genuine Sheep Sprint Game
on:
  push:
    branches: [work/king-v9925-real-sheep-sprint]
    paths:
      - 'tools/v9925/**'
      - '.github/workflows/king-v9925-real-sheep.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: king-v9925-sheep
  cancel-in-progress: false
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore exact verified KING v9.9.24 Royal Neon source and signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9925 /tmp/king9925old
          gh release download v9.9.24-royal-neon-ui -p 'KING-Plus-v9.9.24-Royal-Neon-UI-Source.zip' -D /tmp/king9925old
          gh release download v9.9.24-royal-neon-ui -p 'KING-Plus-v9.9.24-Royal-Neon-UI-TEST.apk' -D /tmp/king9925old
          unzip -q /tmp/king9925old/KING-Plus-v9.9.24-Royal-Neon-UI-Source.zip -d /tmp/king9925
          test -s /tmp/king9925/app/src/main/java/com/kingplus/social/RoomGameActivity.java
          test -s /tmp/king9925/app/src/main/java/com/kingplus/social/KingKnifeArena9923Activity.java
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9925/app/kingplus-ci-debug.keystore
      - name: Apply original timed tap-to-run Sheep game (never random scores)
        run: |
          set -euo pipefail
          base64 -d tools/v9925/real_sheep_patch.py.gz.b64 | gzip -d > /tmp/king_sheep_patch_9925.py
          echo '0bddf50c46367221e7bebf8268b47efa6e3c7f2f3381612b7dc361410c6a2acb  /tmp/king_sheep_patch_9925.py' | sha256sum -c -
          python3 /tmp/king_sheep_patch_9925.py /tmp/king9925
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/king9925/app/src/main/java/com/kingplus/social')
          game=(src/'RoomGameActivity.java').read_text()
          assert 'int score=40+(int)(Math.random()*61)' not in game
          assert 'SHEEP_RACE_MS_9925=8000L' in game
          assert 'sheepClock9925.removeCallbacks(sheepTick9925)' in game
          assert 'KingSheepRace9925.score(sheepTaps9925,SHEEP_RACE_MS_9925)' in game
          assert 'KingLiveChessActivity.class' in (src/'PartyActivity.java').read_text()
          assert 'KingKnifeArena9923Activity.class' in (src/'PartyActivity.java').read_text()
          assert 'videoMatchIncoming9922' in (src/'KingMultiVideoActivity.java').read_text()
          assert 'addRoyalHero9924(page)' in (src/'PartyActivity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'versionCode 204' in Path('/tmp/king9925/app/build.gradle').read_text()
          print('PASS real Sheep score, Royal Neon UI and preserved live Party/Chess/Knife/Video modules')
          PY
      - name: Test deterministic Sheep scoring without an Android device
        run: |
          set -euo pipefail
          mkdir -p /tmp/sheep9925java
          javac -d /tmp/sheep9925java /tmp/king9925/app/src/main/java/com/kingplus/social/KingSheepRace9925.java tools/v9925/KingSheepRace9925Test.java
          java -cp /tmp/sheep9925java com.kingplus.social.KingSheepRace9925Test
      - name: Compile entire KING Plus Android v9.9.25 APK
        working-directory: /tmp/king9925
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify release certificate, package ID and safe upgrade
        run: |
          set -euo pipefail
          OLD=/tmp/king9925old/KING-Plus-v9.9.24-Royal-Neon-UI-TEST.apk
          NEW=/tmp/king9925/app/build/outputs/apk/debug/app-debug.apk
          test -s "$OLD" && test -s "$NEW"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='203'"
          "$AAPT" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='204'"
          "$SIGNER" verify --print-certs "$OLD" > /tmp/king9925-oldcert
          "$SIGNER" verify --print-certs "$NEW" > /tmp/king9925-newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9925-oldcert | head -1 || true)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9925-newcert | head -1 || true)"
          test -n "$a" && test "$a" = "$b"
          echo 'PASS same installed Android app/signing key, higher versionCode'
      - name: Create direct TEST APK and complete source ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9925out
          cp /tmp/king9925/app/build/outputs/apk/debug/app-debug.apk /tmp/king9925out/KING-Plus-v9.9.25-Real-Sheep-Sprint-TEST.apk
          rm -f /tmp/king9925/app/kingplus-ci-debug.keystore
          cd /tmp/king9925
          zip -q -r /tmp/king9925out/KING-Plus-v9.9.25-Real-Sheep-Sprint-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' '*.log' 'app/build/*' './app/build/*' '*/build/*' \
               './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.jks' '*.keystore' '*local.properties' '*.zip'
          BYTES="$(stat -c%s /tmp/king9925out/KING-Plus-v9.9.25-Real-Sheep-Sprint-Source.zip)"
          test "$BYTES" -gt 100000 && test "$BYTES" -lt 10000000
          sha256sum /tmp/king9925out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9925-Real-Sheep-Game-TEST-and-Source
          path: /tmp/king9925out/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish verified APK as TEST, not false Final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v9.9.25-real-sheep-sprint /tmp/king9925out/* \
            --target "$GITHUB_SHA" --prerelease \
            --title 'KING Plus v9.9.25 - Playable Sheep Sprint TEST' \
            --notes 'Fixes real Bolo Hi comparison gap: previously KING Sheep Race used random score 40-100 with no gameplay. Now a real 8-second tap-to-run competition is shown to each participant, measures their actual taps, blocks premature results, and uses existing authenticated live room game_moves for host results across Party accounts. Verified deterministic Java game tests, whole Android APK compilation, signer and upgrade. Retains Royal Neon theme, live Party, Chess, Knife, 6 Video Seats, Video Match and other functions. Score is client submitted, not server anti-cheat verified, and full Bolo Hi 3D world, every game, real 2-phone RTC, providers and payment completion remain unverified. TEST NOT FINAL.'
