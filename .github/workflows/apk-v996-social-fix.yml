name: Build KING Plus v9.9.6 Cross Phone Friends Party Sound
on:
  push:
    branches: [work/reference-completion]
    paths:
      - '.github/workflows/apk-v996-social-fix.yml'
      - 'ci/v996_social/patch_main996.py'
      - 'ci/v996_social/patch_people996.py'
      - 'ci/v996_social/patch_follow996.py'
      - 'ci/v996_social/patch_room_join996.py'
      - 'ci/v996_social/patch_party996.py'
      - 'ci/v996_social/KingGiftSound993.java'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: kingplus-v996-social-fix
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check patch scripts for Python syntax
        run: |
          python3 -m py_compile \
            ci/v996_social/patch_main996.py \
            ci/v996_social/patch_people996.py \
            ci/v996_social/patch_follow996.py \
            ci/v996_social/patch_room_join996.py \
            ci/v996_social/patch_party996.py
      - name: Restore signed v9.9.5 source and APK for consistent Firebase config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king996-src /tmp/king996-app /tmp/king996-old
          gh run download 38122767701 -n KING-Plus-v9.9.5-Party-Stability-Source -D /tmp/king996-src
          unzip -q /tmp/king996-src/KING-Plus-v9.9.5-Party-Stability-source.zip -d /tmp/king996-app
          gh run download 38122767701 -n KING-Plus-v9.9.5-Party-Stability-APK -D /tmp/king996-old
      - name: Repair real ID directory, Follow and Party joining, and all gift sounds
        run: |
          set -euo pipefail
          python3 ci/v996_social/patch_main996.py /tmp/king996-app
          python3 ci/v996_social/patch_people996.py /tmp/king996-app
          python3 ci/v996_social/patch_follow996.py /tmp/king996-app
          python3 ci/v996_social/patch_room_join996.py /tmp/king996-app
          python3 ci/v996_social/patch_party996.py /tmp/king996-app
      - name: Confirm secure cross-account flows without changing Firestore permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('/tmp/king996-app')
          p=a/'app/src/main/java/com/kingplus/social'
          m=(p/'MainActivity.java').read_text()
          s=(p/'SocialActivity.java').read_text()
          r=(p/'PartyActivity.java').read_text()
          audio=(p/'KingGiftSound993.java').read_text()
          gradle=(a/'app/build.gradle').read_text()
          rules=(a/'firestore.rules').read_text()
          assert "versionCode 185; versionName '9.9.6-people-follow-room-gifts'" in gradle
          assert 'lastProfileAttempt996' in m
          assert '"king_social_sync_996"' in m
          assert 'syncPublicProfile();' in m
          assert 'verifyOwnProfile996()' in s
          assert 'connectionTest996()' in s or 'this::connectionTest996' in s
          assert 'Source.SERVER' in s
          assert 'Follow Back' in s
          assert 'KingRoomInvite959.parse(raw)' in s
          assert 'whereEqualTo("joinCode",raw)' in s
          assert 'joinFullRoom996(' in s
          assert 'shareRealRoom996()' in r
          assert 'this::shareRealRoom996' in r
          assert 'KINGROOM:' in r
          assert 'KingGiftSound993.play(this,gift)' in r
          assert 'KingSoundFx.gift(this)' not in r
          assert audio.count('case "')>=9
          assert 'signature(String gift)' in audio
          assert 'PAID_VIP_ACTIVE = false' in (p/'KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (p/'KingRecharge974Activity.java').read_text()
          assert 'KingFreeGift973.allowed(' in r
          assert 'KingEmojiAccess993.canSend(' in r
          assert 'private void clearPartyVisuals995()' in r
          assert 'match /public_profiles/{uid}' in rules
          assert 'match /follows/{followId}' in rules
          assert 'match /live_rooms/{roomId}' in rules
          assert 'match /direct_threads/{threadId}' in rules
          assert 'allow read: if signedIn();' in rules
          assert (p/'OnlineLudoActivity.java').exists()
          print('PASS: profile registration, server search, Follow Back, joining codes, 88 gift sound patterns, no billing or rules bypass')
          PY
      - name: Build installable KING Plus v9.9.6 APK
        working-directory: /tmp/king996-app
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify same signing key, app package and upgrade version
        run: |
          set -euo pipefail
          OLD="$(find /tmp/king996-old -type f -name '*.apk' -print -quit)"
          NEW=/tmp/king996-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$OLD" && test -s "$NEW"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          "$SIGNER" verify --print-certs "$OLD" >/tmp/old996sign
          "$SIGNER" verify --print-certs "$NEW" >/tmp/new996sign
          OC="$(grep -Eo '[[:xdigit:]]{64}' /tmp/old996sign | head -1)"
          NC="$(grep -Eo '[[:xdigit:]]{64}' /tmp/new996sign | head -1)"
          test -n "$OC" && test "$OC" = "$NC"
          "$AAPT" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='184'"
          "$AAPT" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='185'"
          echo "PASS: previous app and data can update without uninstall"
      - name: Package APK and complete Android source
        run: |
          set -euo pipefail
          cp /tmp/king996-app/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/KING-Plus-v9.9.6-Friends-Party-Gift-Sounds.apk
          (cd /tmp/king996-app && zip -qr /tmp/KING-Plus-v9.9.6-Friends-Party-Gift-Sounds-source.zip .)
          sha256sum /tmp/KING-Plus-v9.9.6-Friends-Party-Gift-Sounds.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.9.6-Friends-Party-Gift-Sounds-APK
          path: /tmp/KING-Plus-v9.9.6-Friends-Party-Gift-Sounds.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.9.6-Friends-Party-Gift-Sounds-Source
          path: /tmp/KING-Plus-v9.9.6-Friends-Party-Gift-Sounds-source.zip
          retention-days: 7
          if-no-files-found: error
      - name: Publish mobile APK via GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=/tmp/KING-Plus-v9.9.6-Friends-Party-Gift-Sounds.apk
          if gh release view v9.9.6 >/dev/null 2>&1; then
            gh release upload v9.9.6 "$APK" --clobber
          else
            gh release create v9.9.6 "$APK" \
              --target work/reference-completion \
              --title "KING Plus v9.9.6 - Friends, Room Code and Distinct Gift Sounds" \
              --notes "APK test release. Auto-registers public user profile on signed-in app resume with write acknowledgement. People page verifies actual SERVER profile and shows Firebase project for comparing two phones; ID/name search uses SERVER not local cache; Follow/Follow Back no longer silently disappear on read errors; 6-digit Party join codes and full KINGROOM invitations can resolve a real live Room. Existing private room security remains. 88 gifts now use unique per-name short synthesized sound patterns without duplicate generic overlay. VIP Night remains preview locked; 120 action emojis, free self-gifts, party stability, online Ludo and direct chat retained. NOTE: Firebase Rules in source MUST be deployed to actual project for cross-user operations; this APK build does not deploy them. Real two-phone acceptance testing and Google Play review/publication are NOT yet complete." \
              --prerelease
          fi
          gh release view v9.9.6 --json url,assets --jq '{url,assets:[.assets[]|{name,url,size}]}'
