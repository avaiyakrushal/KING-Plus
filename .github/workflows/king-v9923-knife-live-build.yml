name: KING Plus v9.9.23 - Playable Flying Knife Live Party TEST
on:
  push:
    branches: [work/king-v9923-live-knife-game]
    paths:
      - 'tools/v9923/**'
      - '.github/workflows/king-v9923-knife-live-build.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: king-v9923-knife
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore exact previously signed KING 9.9.22 source and APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9923 /tmp/king9923prior
          gh release download v9.9.22-video-match-consent -p 'KING-Plus-v9.9.22-Video-Match-Consent-Source.zip' -D /tmp/king9923prior
          gh release download v9.9.22-video-match-consent -p 'KING-Plus-v9.9.22-Video-Match-Consent-TEST.apk' -D /tmp/king9923prior
          unzip -q /tmp/king9923prior/KING-Plus-v9.9.22-Video-Match-Consent-Source.zip -d /tmp/king9923
          test -s /tmp/king9923/app/src/main/java/com/kingplus/social/PartyActivity.java
          test -s /tmp/king9923/app/src/main/java/com/kingplus/social/KingMultiVideoActivity.java
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9923/app/kingplus-ci-debug.keystore
      - name: Apply original KING Knife gameplay and preserve existing Party functions
        run: |
          set -euo pipefail
          python3 tools/v9923/integrate_knife.py /tmp/king9923
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9923')
          src=root/'app/src/main/java/com/kingplus/social'
          p=(src/'PartyActivity.java').read_text()
          games=(src/'RoomGameActivity.java').read_text()
          rules=(root/'firestore.rules').read_text()
          arena=(src/'KingKnifeArena9923Activity.java').read_text()
          assert 'KingKnifeArena9923Activity.class' in p
          assert 'KingKnifeArena9923Activity.class' in games
          assert 'KingKnifeRules9923.hitsBlade' in arena
          assert 'knife_duel_scores' in rules
          assert 'match /video_match_requests/{recipientUid}' in rules
          assert 'match /video_member_seats/{memberUid}' in rules
          assert 'openLiveChess9917' in p
          assert 'approveOrMoveMemberSeat9913' in p
          assert 'muteOwnedSeat9920' in p
          assert 'videoMatchIncoming9922' in (src/'KingMultiVideoActivity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert "versionCode 202" in (root/'app/build.gradle').read_text()
          print('PASS playable Knife, Party/Game catalog entry, leaderboard, Chess, 3D, Video and billing safety')
          PY
          mkdir -p /tmp/king9923/tests/firestore
          cp tools/v9923/tests/knife-firestore.test.mjs /tmp/king9923/tests/firestore/
      - name: Verify original wheel collision physics on Java 17
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-knife-unit
          javac -d /tmp/king-knife-unit tools/v9923/java/KingKnifeRules9923.java tools/v9923/tests/KingKnifeRules9923Test.java
          java -cp /tmp/king-knife-unit com.kingplus.social.KingKnifeRules9923Test
      - name: Install local Firebase Security Rules emulator dependencies
        working-directory: /tmp/king9923/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Test true two-account Knife leaderboard permissions on Firestore
        working-directory: /tmp/king9923
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec \
            --only firestore --project demo-kingplus-knife-9923 --config firebase-emulator.json \
            "node tests/firestore/knife-firestore.test.mjs"
      - name: Compile full KING Android app including playable Flying Knife game
        working-directory: /tmp/king9923
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK package, new version and identical signing key
        run: |
          set -euo pipefail
          OLD=/tmp/king9923prior/KING-Plus-v9.9.22-Video-Match-Consent-TEST.apk
          NEW=/tmp/king9923/app/build/outputs/apk/debug/app-debug.apk
          test -s "$OLD" && test -s "$NEW"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='201'"
          "$AAPT" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='202'"
          "$SIGNER" verify --print-certs "$OLD" > /tmp/king9923-oldkey
          "$SIGNER" verify --print-certs "$NEW" > /tmp/king9923-newkey
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9923-oldkey | head -1 || true)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9923-newkey | head -1 || true)"
          test -n "$a" && test "$a" = "$b"
          echo 'PASS safe update: same package, same signer, higher versionCode'
      - name: Package TEST APK and sanitized full source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9923out
          cp /tmp/king9923/app/build/outputs/apk/debug/app-debug.apk /tmp/king9923out/KING-Plus-v9.9.23-Live-Knife-Game-TEST.apk
          rm -f /tmp/king9923/app/kingplus-ci-debug.keystore
          cd /tmp/king9923
          zip -q -r /tmp/king9923out/KING-Plus-v9.9.23-Live-Knife-Game-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' '*.log' 'app/build/*' './app/build/*' '*/build/*' \
               './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.jks' '*.keystore' '*local.properties' '*.zip'
          BYTES="$(stat -c%s /tmp/king9923out/KING-Plus-v9.9.23-Live-Knife-Game-Source.zip)"
          test "$BYTES" -gt 100000 && test "$BYTES" -lt 10000000
          sha256sum /tmp/king9923out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9923-Knife-Game-Verified-TEST-APK-Source
          path: /tmp/king9923out/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish TEST release, never unverified Final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v9.9.23-flying-knife /tmp/king9923out/* \
            --target "$GITHUB_SHA" --prerelease \
            --title 'KING Plus v9.9.23 — Real Flying Knife Party Game TEST' \
            --notes 'Adds playable original touch-to-throw Flying Knife Arena (rotating wheel, seven throwing knives, collision detection, win/loss and replay) with authenticated real Firebase Party leaderboards. The reference Bolo Hi APK has a separate Flying Knife game package; KING uses independently written code and no proprietary reference assets. Real Java physics and two-account Firestore security tests, complete Android APK compile and compatible signing certificate passed. Party/Ludo/Chess and 6-seat Video, original 3D preview and gifting modules retained. Game skill result is client-submitted and is not anti-cheat-certified; production gaming needs a trusted game server. Firebase Rules are NOT auto deployed. This is an installable TEST, NOT complete Bolo Hi or production Final; full voice/video, 3D avatar, more games, OTP/Facebook, regulated paid recharge and two-physical-phone acceptance remain incomplete.'
