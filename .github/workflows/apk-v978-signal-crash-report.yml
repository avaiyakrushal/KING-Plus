name: Build KING Plus v9.7.8 Startup Signal Attribution
on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/apk-v978-signal-crash-report.yml'
      - 'ci/v978/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: king-plus-v978-signal-crash-report
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android signal crash vs normal OS kill classification
        run: |
          set -euo pipefail
          mkdir -p /tmp/exit-tests
          javac -d /tmp/exit-tests ci/v978/KingExitPolicy978.java ci/v978/KingExitPolicy978Test.java
          java -cp /tmp/exit-tests com.kingplus.social.KingExitPolicy978Test
          python3 -m py_compile ci/v978/patch_exit_signal_v978.py
      - name: Restore last successfully built KING Plus v9.7.7 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/archive /tmp/src
          gh run download 38014429612 -n KING-Plus-v9.7.7-party-connect-retry-source -D /tmp/archive
          unzip -q /tmp/archive/KING-Plus-v9.7.7-party-connect-retry-source.zip -d /tmp/src
      - name: Correct misleading startup crash report
        run: python3 ci/v978/patch_exit_signal_v978.py /tmp/src
      - name: Check genuine app crashes still reported and older features intact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pkg=Path('/tmp/src/app/src/main/java/com/kingplus/social')
          c=(pkg/'KingCrashWatch958.java').read_text()
          h=(pkg/'KingExitPolicy978.java').read_text()
          m=(pkg/'MainActivity.java').read_text()
          party=(pkg/'PartyActivity.java').read_text()
          wallet=(pkg/'KingWallet976Activity.java').read_text()
          otp=(pkg/'KingPhoneOtp975Activity.java').read_text()
          gradle=Path('/tmp/src/app/build.gradle').read_text()
          assert "versionCode 169; versionName '9.7.8-startup-signal-attribution'" in gradle
          assert 'KingExitPolicy978.showSignalAlert(' in c
          assert 'KingExitPolicy978.signalLabel(relevant.getStatus())' in c
          assert 'OS status code: ' in c
          assert 'quietExitAt978' in c
          assert 'REASON_LOW_MEMORY' in c and 'REASON_CRASH_NATIVE' in c
          assert 'REASON_ANR' in c and 'REASON_SIGNALED' in c
          assert 'case SIGKILL:' in h and 'case SIGSEGV:' in h
          assert 'KingCrashWatch958.showPreviousExit(this)' in m
          assert 'KingPartyJoinTimeout977.waiting(' in party
          assert 'KingPartyMic968.canToggle(' in party
          assert 'KingRoomPresence967.isActive(' in party
          assert 'KingPartyMemory969.overEffectLimit(' in party
          assert 'KingBackend976.fetchWallet(this,' in wallet
          assert 'FirebaseAuth.getInstance().signInWithCustomToken(signedToken)' in otp
          assert 'KingSocialRealtime970.activeAccount(' in (pkg/'SocialActivity.java').read_text()
          assert 'KingLudoTurn962.canSkip(' in (pkg/'OnlineLudoActivity.java').read_text()
          print('PASS: misleading signaled alert avoided while genuine faults remain visible')
          PY
      - name: Compile Android debug APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon
      - name: Package APK and Android source
        run: |
          set -euo pipefail
          cp /tmp/src/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.7.8-startup-signal-diagnostics.apk
          cd /tmp/src
          zip -qr /tmp/KING-Plus-v9.7.8-startup-signal-diagnostics-source.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.7.8-startup-signal-diagnostics-APK
          path: /tmp/KING-Plus-v9.7.8-startup-signal-diagnostics.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.7.8-startup-signal-diagnostics-source
          path: /tmp/KING-Plus-v9.7.8-startup-signal-diagnostics-source.zip
          retention-days: 7
          if-no-files-found: error
