name: KING v10.0.15 Me Home Party Hosted Rooms CP and Invites TEST APK
on:
  push:
    branches: [work/king-me-home-party-v10015]
    paths:
      - 'tools/me-home-party-v10015/**'
      - '.github/workflows/king-me-home-party-v10015.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.14 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10015prev /tmp/king10015
          gh run download 38561865260 -n KING-v10014-Me-Home-Party-TEST-APK-and-Source -D /tmp/king10015prev
          unzip -q /tmp/king10015prev/KING-Plus-v10.0.14-Me-Home-Party-TEST-Source.zip -d /tmp/king10015
          cp app/kingplus-ci-debug.keystore /tmp/king10015/app/
          python3 tools/me-home-party-v10015/apply.py /tmp/king10015
      - name: Me Home Party v10.0.15 source regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king10015')
          me=(r/'app/src/main/java/com/kingplus/social/MainActivity.java').read_text()
          home=(r/'app/src/main/java/com/kingplus/social/CommunityHubActivity.java').read_text()
          party=(r/'app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          assert 'loadHostedRoomsPage10015(' in me
          assert 'whereEqualTo("ownerUid",account10015).limit(30)' in me
          assert 'query10015.startAfter(cursor10015)' in me
          assert 'Load more hosted Party rooms' in me
          assert 'hostedRoomsCurrent10015(' in me
          assert 'tx10015.get(d.getReference())' in home
          assert 'java.util.Objects.equals(originallyCreated10015' in home
          assert 'tx10015.delete(d.getReference())' in home
          assert 'pendingMomentAccount10013' in home
          assert 'inviteContextCurrent10015(' in party
          assert 'roomRef10015.collection("members").document(uidV530)' in party
          assert 'roomRef10015.collection("seat_invites").document(uidV530).set(inviteV530)' in party
          assert 'kickSeatV530(seatNoV530,false,uidV530)' in party
          assert "versionCode 294;" in (r/'app/build.gradle').read_text()
          print('PASS v10.0.15 Me/Home/Party regression checks')
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10015tests
          javac -d /tmp/king10015tests /tmp/king10015/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10015tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10015/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10015
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10013/role-safety.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs && node tests/firestore/role-safety.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10015
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10015prev/KING-Plus-v10.0.14-Me-Home-Party-TEST.apk
          new=/tmp/king10015/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='294'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10015out /tmp/king10015/tools/me-home-party-v10015
          cp tools/me-home-party-v10015/* /tmp/king10015/tools/me-home-party-v10015/
          cp .github/workflows/king-me-home-party-v10015.yml /tmp/king10015/.github/workflows/
          cp /tmp/king10015/app/build/outputs/apk/debug/app-debug.apk /tmp/king10015out/KING-Plus-v10.0.15-Me-Home-Party-TEST.apk
          rm -f /tmp/king10015/app/kingplus-ci-debug.keystore
          cd /tmp/king10015
          zip -qr /tmp/king10015out/KING-Plus-v10.0.15-Me-Home-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10015out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10015-Me-Home-Party-TEST-APK-and-Source
          path: /tmp/king10015out/*
          retention-days: 14
          if-no-files-found: error
