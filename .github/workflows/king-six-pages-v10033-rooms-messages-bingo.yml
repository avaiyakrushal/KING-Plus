name: KING v10.0.33 Six-Pages Open Rooms, Safe Messages and Playable Bingo TEST APK
on:
  push:
    branches: [work/king-six-pages-v10033-rooms-messages-bingo]
    paths:
      - 'tools/six-pages-v10033/**'
      - '.github/workflows/king-six-pages-v10033-rooms-messages-bingo.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.32 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10033prev /tmp/king10033
          gh run download 38675849757 -n KING-v10032-Six-Pages-TEST-APK-and-Source -D /tmp/king10033prev
          unzip -q /tmp/king10033prev/KING-Plus-v10.0.32-Six-Pages-TEST-Source.zip -d /tmp/king10033
          cp app/kingplus-ci-debug.keystore /tmp/king10033/app/
          python3 tools/six-pages-v10033/apply.py /tmp/king10033
      - name: v10.0.33 six-section open-room and messaging regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king10033');s=r/'app/src/main/java/com/kingplus/social'
          me=(s/'MainActivity.java').read_text()
          home=(s/'CommunityHubActivity.java').read_text()
          party=(s/'PartyActivity.java').read_text()
          game=(s/'GamePlayActivity.java').read_text()
          discover=(s/'DiscoverActivity.java').read_text()
          inbox=(s/'InboxActivity.java').read_text()
          assert 'reload10016.isEnabled()' in me
          assert 'sending10033[0]=true' in home
          assert 'sendButton10033[0].setEnabled(false)' in home
          assert 'chatOwner10033' in home
          assert 'snap.getMetadata().isFromCache()' in party
          assert 'Offline/cached rooms' in party
          assert 'nums[12]=0' in game and 'marked[12]=true' in game
          assert 'for(int col10033=0;col10033<5;col10033++)' in game
          assert 'discoverSectionCurrent10033' in discover
          assert 'whereEqualTo("closed",false).limit(24)' in discover
          assert 'No open Party rooms yet' in discover
          assert 'noticeAccountCurrent10010(me.getUid())' in inbox
          assert 'This message does not contain a valid sender' in inbox
          assert 'versionCode 312;' in (r/'app/build.gradle').read_text()
          print('PASS six-page v10.0.33 source regressions')
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10033tests
          javac -d /tmp/king10033tests /tmp/king10033/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10033tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10033/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10033
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10013/role-safety.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs && node tests/firestore/role-safety.test.mjs"
      - name: Combined Me/Home/Party 12 real-data security scenarios
        working-directory: /tmp/king10033
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10019/rtc-membership-current-rules.test.mjs" tests/firestore/rtc-membership-firestore.test.mjs
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10020/mute-all-contract.test.mjs" tests/firestore/mute-all-contract.test.mjs
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-10020-combined --config firebase-emulator.json "node tests/firestore/visitor-pages-firestore.test.mjs && node tests/firestore/me-gallery-live-firestore.test.mjs && node tests/firestore/moments-cross-device-firestore.test.mjs && node tests/firestore/mic-consent-firestore.test.mjs && node tests/firestore/rtc-membership-firestore.test.mjs && node tests/firestore/room-game-gift.test.mjs && node tests/firestore/host-role-private-firestore.test.mjs && node tests/firestore/party-room-vote-firestore.test.mjs && node tests/firestore/mute-all-contract.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10033
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10033prev/KING-Plus-v10.0.32-Six-Pages-TEST.apk
          new=/tmp/king10033/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='312'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10033out /tmp/king10033/tools/six-pages-v10033
          cp tools/six-pages-v10033/* /tmp/king10033/tools/six-pages-v10033/
          cp .github/workflows/king-six-pages-v10033-rooms-messages-bingo.yml /tmp/king10033/.github/workflows/
          cp /tmp/king10033/app/build/outputs/apk/debug/app-debug.apk /tmp/king10033out/KING-Plus-v10.0.33-Six-Pages-TEST.apk
          rm -f /tmp/king10033/app/kingplus-ci-debug.keystore
          cd /tmp/king10033
          zip -qr /tmp/king10033out/KING-Plus-v10.0.33-Six-Pages-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10033out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10033-Six-Pages-TEST-APK-and-Source
          path: /tmp/king10033out/*
          retention-days: 14
          if-no-files-found: error
