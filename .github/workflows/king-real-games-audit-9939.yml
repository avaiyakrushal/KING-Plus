name: KING 9.9.39 Real Ludo Sheep Knife Audit
on:
  push:
    branches: [work/king-real-ludo-sheep-knife-v9939]
    paths: ['tools/real-games-v9939/audit.py','.github/workflows/king-real-games-audit-9939.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Recover last verified full v9.9.38 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9939prev /tmp/king9939
          gh run download 38335647834 -n KING-v9938-Real-Game-Gift-TEST-APK-and-Source -D /tmp/king9939prev
          unzip -q /tmp/king9939prev/KING-Plus-v9.9.38-Real-Game-Gift-Source.zip -d /tmp/king9939
          grep -q "versionCode 217" /tmp/king9939/app/build.gradle
      - name: Inspect real room-based games
        run: |
          python3 tools/real-games-v9939/audit.py /tmp/king9939
