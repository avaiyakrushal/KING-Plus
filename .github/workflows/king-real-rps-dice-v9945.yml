name: KING v9.9.45 Real RPS Dice and Coin Rules TEST
on:
  push:
    branches: [work/king-game-rules-parity-v9945]
    paths: ['tools/king-9945/**','.github/workflows/king-real-rps-dice-v9945.yml']
  pull_request:
    paths: ['tools/king-9945/**','.github/workflows/king-real-rps-dice-v9945.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  verify-actual-room-games:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover verified full KING v9.9.44 APK and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9945prev /tmp/king9945
          gh run download 38343934291 -n KING-v9944-Real-Gift-Playback-TEST-APK-and-Source -D /tmp/king9945prev
          test -s /tmp/king9945prev/KING-Plus-v9.9.44-Real-Gift-Playback-TEST.apk
          unzip -q /tmp/king9945prev/KING-Plus-v9.9.44-Real-Gift-Playback-Source.zip -d /tmp/king9945
          grep -q 'versionCode 223' /tmp/king9945/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9945/app/kingplus-ci-debug.keystore
      - name: Fix real RPS winner engine and reject fabricated Dice / Coin scores
        run: |
          set -euo pipefail
          python3 tools/king-9945/apply.py /tmp/king9945
          cp tools/king-9945/real-rps-dice-firestore.test.mjs /tmp/king9945/tests/firestore/
          node --check /tmp/king9945/functions/v3.js
          node --test /tmp/king9945/functions/play-purchase-service.test.js
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king9945');s=r/'app/src/main/java/com/kingplus/social'
          j=(s/'RoomGameActivity.java').read_text()
          rules=(r/'firestore.rules').read_text()
          assert 'KingRpsRules9945.result' in (s/'RoomGameActivity.java').read_text()
          assert 'pendingGiftEvents9944' in (s/'PartyActivity.java').read_text()
          assert 'match /gift_receipts/{giftId}' in rules and "request.resource.data.type != 'dice'" in rules
          assert '.data.roundId == request.resource.data.roundId' in rules
          assert 'versionCode 224' in (r/'app/build.gradle').read_text()
          assert 'LIVE_RECHARGE = false' in (s/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (s/'KingPremiumAccess981.java').read_text()
          print('PASS server-only result calculation and immutable current-game turns, wallet stays OFF')
          PY
      - name: Verify actual RPS rules and all win/draw/invalid combinations
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9945classes
          javac -d /tmp/king9945classes \
            /tmp/king9945/app/src/main/java/com/kingplus/social/KingRpsRules9945.java \
            tools/king-9945/KingRpsRules9945Test.java
          java -cp /tmp/king9945classes com.kingplus.social.KingRpsRules9945Test
      - name: Install Firestore emulation dependencies
        working-directory: /tmp/king9945/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Verify real RPS, Dice, Coin rules with two signed-in players
        working-directory: /tmp/king9945
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-rps-dice-9945 --config firebase-emulator.json \
            "node tests/firestore/real-rps-dice-firestore.test.mjs"
      - name: Verify TWO players cannot rewrite or forge Game moves
        working-directory: /tmp/king9945
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-immutable-games-9943 --config firebase-emulator.json \
            "node tests/firestore/immutable-rounds-firestore.test.mjs"
      - name: Re-run real Gift, Sheep, Ludo, Tic Tac Toe, Party rules acceptance
        working-directory: /tmp/king9945
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-gift-receipts-9941 --config firebase-emulator.json \
            "node tests/firestore/gift-delivery-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-sheep-9940 --config firebase-emulator.json \
            "node tests/firestore/sheep-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-party-ludo-9939 --config firebase-emulator.json \
            "node tests/firestore/party-ludo-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-9938-live --config firebase-emulator.json \
            "node tests/firestore/room-game-gift.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-room-v9936 --config firebase-emulator.json \
            "node tests/firestore/functional-access.test.mjs"
      - name: Compile complete KING Android app with all Party features
        working-directory: /tmp/king9945
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Confirm same Android signing identity and resource preservation
        run: |
          set -euo pipefail
          old=/tmp/king9945prev/KING-Plus-v9.9.44-Real-Gift-Playback-TEST.apk
          new=/tmp/king9945/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='223'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='224'"
          "$signer" verify --print-certs "$old" > /tmp/oldcert
          "$signer" verify --print-certs "$new" > /tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
          python3 - <<'PY'
          from zipfile import ZipFile
          old='/tmp/king9945prev/KING-Plus-v9.9.44-Real-Gift-Playback-TEST.apk'
          new='/tmp/king9945/app/build/outputs/apk/debug/app-debug.apk'
          def counts(p):
            with ZipFile(p) as z:names=set(z.namelist())
            return (sum(n.startswith('res/layout') and n.endswith('.xml') for n in names),
              sum(n.startswith('res/drawable') and n.endswith(('.xml','.png','.webp')) for n in names))
          print('RESOURCE_COUNTS',counts(old),counts(new))
          assert counts(old)==counts(new)==(4065,8680)
          PY
      - name: Package signed TEST APK plus full source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9945out
          cp /tmp/king9945/app/build/outputs/apk/debug/app-debug.apk /tmp/king9945out/KING-Plus-v9.9.45-Real-RPS-Dice-TEST.apk
          rm -f /tmp/king9945/app/kingplus-ci-debug.keystore
          cd /tmp/king9945
          zip -q -r /tmp/king9945out/KING-Plus-v9.9.45-Real-RPS-Dice-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
              './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9945out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9945-Real-RPS-Dice-TEST-APK-and-Source
          path: /tmp/king9945out/*
          retention-days: 14
          if-no-files-found: error
