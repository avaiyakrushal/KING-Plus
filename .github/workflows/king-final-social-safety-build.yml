name: KING Final - Login Family Community Notifications Security Stability
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-final-social-safety-build.yml'
      - 'ci/final_five/stage6_login_family_community.py'
      - 'ci/final_five/stages7_8_notifications_stability.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: king-final-social-safety
  cancel-in-progress: true
jobs:
  combine:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore actual integrated five-section Android project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kingfinal-social /tmp/kingfinal-socialzip
          gh run download 38130689781 \
            -n KING-Plus-Integrated-Five-Sections-In-Progress-Source \
            -D /tmp/kingfinal-socialzip
          unzip -q /tmp/kingfinal-socialzip/KING-Plus-Five-Sections-IN-PROGRESS-source.zip \
            -d /tmp/kingfinal-social
      - name: Stage 6 - Login design and Family/Community data integrity
        run: |
          python3 -m py_compile ci/final_five/stage6_login_family_community.py
          python3 ci/final_five/stage6_login_family_community.py /tmp/kingfinal-social
      - name: Stages 7 and 8 - Notifications privacy and Android stability
        run: |
          python3 -m py_compile ci/final_five/stages7_8_notifications_stability.py
          python3 ci/final_five/stages7_8_notifications_stability.py /tmp/kingfinal-social
      - name: Enforce Firebase, billing and original five stages safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/kingfinal-social')
          p=root/'app/src/main/java/com/kingplus/social'
          c=(p/'CloudSync.java').read_text()
          f=(p/'CommunityHubActivity.java').read_text()
          main=(p/'MainActivity.java').read_text()
          notif=(p/'PushNotifications.java').read_text()
          crash=(p/'KingStability.java').read_text()
          party=(p/'PartyActivity.java').read_text()
          video=(p/'KingMultiVideoActivity.java').read_text()
          scene=(p/'KingNative3DRoom.java').read_text()
          ludo=(p/'OnlineLudoActivity.java').read_text()
          assert 'set(profile, SetOptions.merge())' in c
          assert 'set(profile)\\n' not in c
          assert 'Source.SERVER' in f
          assert 'Family lookup unavailable' in f and 'Family membership unavailable' in f
          assert 'Terms of service, privacy policy, and login help' in main
          assert 'NotificationCompat.Builder' in notif
          assert 'NotificationCompat.VISIBILITY_PRIVATE' in notif
          assert 'PendingIntent.FLAG_IMMUTABLE' in notif
          assert 'catch (SecurityException ignored)' in notif
          assert 'new Notification.Builder(context, CHANNEL_ID)' not in notif
          assert 'KingStability' in crash
          assert 'KingNative3DRoom.open(' in party and 'GLES20.GL_DEPTH_TEST' in scene
          assert 'checkVideoRoomAccess998' in video
          assert 'KingLudoDiceEntropy999.dice(' in ludo
          assert 'KingGiftSound993.setEnabled' in party
          assert 'PAID_VIP_ACTIVE = false' in (p/'KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (p/'KingRecharge974Activity.java').read_text()
          assert 'allow read, write: if true' not in (root/'firestore.rules').read_text()
          print('PASS: Family/Community, Login Accessibility, Push Notification Safety, original 3D/Video/Party/Games/Gifts intact')
          PY
      - name: Compile cumulative KING Plus project (NOT a final APK release)
        working-directory: /tmp/kingfinal-social
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify installed package and preserve exact source
        run: |
          set -euo pipefail
          apk=/tmp/kingfinal-social/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$apk" | grep "^package:" | grep "name='com.kingplus.social'"
          echo 'PASS: stages 1-8 cumulative code compiled; NOT Bolo Hi complete; NO public APK'
          cd /tmp/kingfinal-social
          rm -rf .gradle app/build build
          zip -qr /tmp/KING-Plus-Social-Safety-Integrated-IN-PROGRESS-source.zip . \
            -x '**/build/*' '**/.gradle/*' '*.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-Full-Integrated-Social-Safety-Source-No-APK
          path: /tmp/KING-Plus-Social-Safety-Integrated-IN-PROGRESS-source.zip
          retention-days: 30
          if-no-files-found: error
      - name: Truthful state summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          **Passed:** All prior native 3D/video, Party, Multiplayer Ludo, Gift/VIP-safe and Friends source patches compiled with new Login Design, Family/Community, Notifications, Security and Stability corrections. Family cloud profile sync now MERGES without overwriting familyCode. Family/Community lookups use SERVER. Push notifications use backward-compatible AndroidX, private lock-screen visibility and no crash if permission denied.
          **Still not complete:** True 3D animated avatars and streaming, Facebook/WhatsApp provider auth, paid billing/Noble backend, each multiplayer game's full authoritative mechanics, device-to-device live sync and original Bolo Hi feature parity. This workflow DOES NOT create a FINAL APK release.
          EOF
