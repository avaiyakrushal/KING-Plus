name: Build KING Plus v9.4.3 Games Reconnect

on:
  push:
    branches: ['build/v9.4.3-games-reconnect']
    paths:
      - '.github/workflows/apk-v943-games.yml'
      - 'ci/v943/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: king-plus-v943-games
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v9.4.3-games-reconnect

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recover verified v9.4.1 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v941 /tmp/src
          mkdir -p /tmp/v941 /tmp/src
          gh run download 37657265816 -n KING-Plus-v9.4.1-stability-source -D /tmp/v941
          unzip -q /tmp/v941/KING-Plus-v9.4.1-stability-source.zip -d /tmp/src

      - name: Apply v9.4.2 base patch
        run: python3 ci/v942/patch_v942.py /tmp/src

      - name: Apply v9.4.3 games/reconnect patch
        run: python3 ci/v943/patch_v943.py /tmp/src

      - name: v9.4.3 feature gates
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          grep -F "versionCode 142; versionName '9.4.3-games-reconnect'" app/build.gradle
          grep -F 'Offline • Room Game will reconnect automatically' app/src/main/java/com/kingplus/social/RoomGameActivity.java
          grep -F 'Round complete • waiting for Host / Co-host rematch' app/src/main/java/com/kingplus/social/RoomGameActivity.java
          grep -F 'Moves disconnected • tap to reconnect' app/src/main/java/com/kingplus/social/RoomGameActivity.java
          grep -F '↻ Reconnect Room' app/src/main/java/com/kingplus/social/OnlineLudoActivity.java
          grep -F 'serverReady?GREEN:GOLD' app/src/main/java/com/kingplus/social/OnlineLudoActivity.java
          grep -F 'Back online • reconnecting Party room' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'KingEffectBudget.allow(this,"gift")' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'KingEffectBudget.allow(this,"emoji")' app/src/main/java/com/kingplus/social/PartyActivity.java

      - name: Compile v9.4.3 APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon

      - name: Static route and crash audit
        working-directory: /tmp/src
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('app/src/main')
          manifest=(root/'AndroidManifest.xml').read_text(errors='ignore')
          declared=set(re.findall(r'<activity[^>]+android:name=".([^"]+)"',manifest))
          intents=set()
          for p in (root/'java/com/kingplus/social').glob('*.java'):
              t=p.read_text(errors='ignore')
              intents.update(re.findall(r'new Intent(this,s*([A-Za-z0-9_]+).class)',t))
          missing=sorted(x for x in intents if x not in declared and x!='MainActivity')
          print('Missing manifest targets:',missing)
          if missing: raise SystemExit('Missing manifest Activity targets')
          rg=(root/'java/com/kingplus/social/RoomGameActivity.java').read_text()
          if 'gameNetworkCallback943' not in rg or 'detachRealtime943' not in rg:
              raise SystemExit('RoomGame reconnect hardening absent')
          lu=(root/'java/com/kingplus/social/OnlineLudoActivity.java').read_text()
          if 'Reconnect Room' not in lu:
              raise SystemExit('Ludo reconnect action absent')
          print('v9.4.3 route/reconnect audit passed')
          PY

      - name: Android lint
        working-directory: /tmp/src
        continue-on-error: true
        run: gradle :app:lintDebug --no-daemon

      - name: Package APK and source
        run: |
          set -euo pipefail
          cp /tmp/src/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.4.3-games-reconnect.apk
          cd /tmp/src
          zip -qr /tmp/KING-Plus-v9.4.3-games-reconnect-source.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.4.3-games-reconnect-APK
          path: /tmp/KING-Plus-v9.4.3-games-reconnect.apk
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.4.3-games-reconnect-source
          path: /tmp/KING-Plus-v9.4.3-games-reconnect-source.zip
          retention-days: 7
          if-no-files-found: error
