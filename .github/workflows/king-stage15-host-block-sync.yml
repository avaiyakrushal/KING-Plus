name: KING Stage15 Party Host Block Cross-Phone Sync and Security
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-stage15-host-block-sync.yml'
      - 'ci/final_five/stage15_sync_host_block.py'
      - 'ci/final_five/stage15_block_host_emulator.spec.cjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore latest Stage13 real integrated source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-stage15 /tmp/king-stage15zip
          gh run download 38136398831 -n KING-Plus-Stage13-Room-Lock-Integrated-Source-Only -D /tmp/king-stage15zip
          unzip -q /tmp/king-stage15zip/KING-Plus-Stage13-Room-Lock-Fix-IN-PROGRESS-source.zip -d /tmp/king-stage15
      - name: Fix cross-device Block Host/Private Profile block identity
        run: |
          python3 -m py_compile ci/final_five/stage15_sync_host_block.py
          python3 ci/final_five/stage15_sync_host_block.py /tmp/king-stage15
          python3 ci/final_five/stage12_exact_toolbox_audit.py /tmp/king-stage15
      - name: Check previous systems and paid operations remain safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/king-stage15')
          p=b/'app/src/main/java/com/kingplus/social'
          party=(p/'PartyActivity.java').read_text()
          profile=(p/'KingPublicProfileActivity.java').read_text()
          assert 'blockedRef.get(com.google.firebase.firestore.Source.SERVER)' in party
          assert '.document(accountUid+"_"+hostUid)' in party
          assert 'new AlertDialog.Builder(this)' in party
          assert 'm.put("targetUid",uid)' in profile
          assert 'Host blocked locally' not in party
          assert 'private void roomMenuAll()' in party
          assert 'private void roomMenu()' in party
          assert 'KingNative3DRoom.open(' in party
          assert 'KingRoomDice997.open(' in party
          assert 'KingGiftSound993.setEnabled(' in party
          assert 'collection("seat_locks")' in party
          assert 'PAID_VIP_ACTIVE = false' in (p/'KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (p/'KingRecharge974Activity.java').read_text()
          assert 'checkVideoRoomAccess998' in (p/'KingMultiVideoActivity.java').read_text()
          assert 'request.resource.data.role == resource.data.role' in (b/'firestore.rules').read_text()
          print('PASS Block Host and all 81 Party routes retained; no payment or role bypass')
          PY
      - name: Assemble Android Stage 15 internal APK, NOT final release
        working-directory: /tmp/king-stage15
        run: gradle :app:assembleDebug --no-daemon
      - name: Keep latest complete source artifact only
        run: |
          set -euo pipefail
          test -s /tmp/king-stage15/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging /tmp/king-stage15/app/build/outputs/apk/debug/app-debug.apk | grep "^package:" | grep "name='com.kingplus.social'"
          cd /tmp/king-stage15
          rm -rf .gradle app/build build
          zip -qr /tmp/KING-Plus-Stage15-CrossPhone-Host-Block-IN-PROGRESS-source.zip . -x '*.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-Stage15-Host-Block-Integrated-Source-Only
          path: /tmp/KING-Plus-Stage15-CrossPhone-Host-Block-IN-PROGRESS-source.zip
          retention-days: 30
          if-no-files-found: error
      - name: Honest milestone summary
        run: |
          echo "Stage15 Android build passed. Server-backed Party Host block list uses same schema as Public Profile. Full block enforcement, production rules deployment and two-phone tests are NOT certified. No interim APK release." >> "$GITHUB_STEP_SUMMARY"
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore production-shape rules into LOCAL TEST dir only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-stage15-rules /tmp/king-stage15-ruleszip
          gh run download 38136398831 -n KING-Plus-Stage13-Room-Lock-Integrated-Source-Only -D /tmp/king-stage15-ruleszip
          unzip -pq /tmp/king-stage15-ruleszip/KING-Plus-Stage13-Room-Lock-Fix-IN-PROGRESS-source.zip firestore.rules > /tmp/king-stage15-rules/firestore.rules
          cp ci/final_five/stage15_block_host_emulator.spec.cjs /tmp/king-stage15-rules/
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8093},"ui":{"enabled":false}}}' > /tmp/king-stage15-rules/firebase.json
      - name: Install local-only test dependencies
        working-directory: /tmp/king-stage15-rules
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock firebase-tools@14 firebase@11 @firebase/rules-unit-testing@4
      - name: Verify host block read/write/denials for three accounts
        working-directory: /tmp/king-stage15-rules
        run: |
          npx --no-install firebase emulators:exec --only firestore --config firebase.json --project demo-king-block-test "node stage15_block_host_emulator.spec.cjs"
      - name: Do not change live Firebase
        run: echo "Only synthetic local Firestore tests executed. No Firebase production writes." >> "$GITHUB_STEP_SUMMARY"
