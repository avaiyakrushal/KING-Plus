name: Build KING Plus v9.5.1 Parity Batch 2

on:
  push:
    branches: ['build/v9.5.1-parity-batch2']
    paths:
      - '.github/workflows/apk-v951-parity.yml'
      - 'ci/v951/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: king-plus-v951-parity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v9.5.1-parity-batch2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recover verified v9.4.1 source
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/base /tmp/src
          mkdir -p /tmp/base /tmp/src
          gh run download 37657265816 -n KING-Plus-v9.4.1-stability-source -D /tmp/base
          test -f /tmp/base/KING-Plus-v9.4.1-stability-source.zip
          unzip -q /tmp/base/KING-Plus-v9.4.1-stability-source.zip -d /tmp/src

      - name: Apply parity batches 1 and 2
        run: |
          python3 ci/v950/patch_v950.py /tmp/src
          python3 ci/v951/patch_v951.py /tmp/src

      - name: Parity gates
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          grep -F "versionCode 142; versionName '9.5.1-parity-batch2'" app/build.gradle
          grep -F 'KingOfflineLudoActivity' app/src/main/AndroidManifest.xml
          grep -F 'Loading KTV stage and queue' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'LIVE AUDIO PK' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'Room Gift Ranking' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'familyStat951' app/src/main/java/com/kingplus/social/CommunityHubActivity.java
          grep -F 'Family Chat unavailable right now' app/src/main/java/com/kingplus/social/CommunityHubActivity.java

      - name: Compile APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon

      - name: Runtime activity and common crash audit
        working-directory: /tmp/src
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('app/src/main')
          manifest=(root/'AndroidManifest.xml').read_text(errors='ignore')
          declared=set(re.findall(r'<activity[^>]+android:name="\.([^"]+)"',manifest))
          intents=set()
          java=list((root/'java/com/kingplus/social').glob('*.java'))
          for p in java:
              t=p.read_text(errors='ignore')
              intents.update(re.findall(r'new Intent\(this,\s*([A-Za-z0-9_]+)\.class\)',t))
          missing=sorted(x for x in intents if x not in declared and x!='MainActivity')
          print('Missing activity registrations:',missing)
          if missing: raise SystemExit('Missing Activity registrations: '+','.join(missing))
          required={
            'PartyActivity.java':['Loading KTV stage and queue','LIVE AUDIO PK','Top supporters • based on gift value'],
            'CommunityHubActivity.java':['familyStat951','Loading family messages'],
          }
          for fn,marks in required.items():
              t=(root/'java/com/kingplus/social'/fn).read_text(errors='ignore')
              for m in marks:
                  if m not in t: raise SystemExit(fn+' missing '+m)
          print('Batch 2 runtime/source audit passed')
          PY

      - name: Android lint
        working-directory: /tmp/src
        continue-on-error: true
        run: gradle :app:lintDebug --no-daemon

      - name: Package APK and source
        run: |
          set -euo pipefail
          cp /tmp/src/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.5.1-parity-batch2.apk
          cd /tmp/src
          zip -qr /tmp/KING-Plus-v9.5.1-parity-batch2-source.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.5.1-parity-batch2-APK
          path: /tmp/KING-Plus-v9.5.1-parity-batch2.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.5.1-parity-batch2-source
          path: /tmp/KING-Plus-v9.5.1-parity-batch2-source.zip
          if-no-files-found: error
          retention-days: 7
