name: KING v9.9.82 Agency Wallet Source Audit
on:
  push:
    branches: [work/king-agency-recharge-v9982]
    paths: ['.github/workflows/king-agency-audit-v9982.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest successful signed KING v9.9.81 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9982 /tmp/king9982pre
          gh run download 38424340515 -n KING-v9981-Me-Page-Full-Navigation-TEST-APK-and-Source -D /tmp/king9982pre
          unzip -q /tmp/king9982pre/KING-Plus-v9.9.81-Me-Page-Functional-TEST-Source.zip -d /tmp/king9982
          test -s /tmp/king9982/app/src/main/java/com/kingplus/social/MainActivity.java
      - name: Print exact current Wallet, Agent, Admin, Firebase code contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          r=Path('/tmp/king9982')
          s=r/'app/src/main/java/com/kingplus/social'
          names=['KingRecharge974Activity.java','KingWallet976Activity.java',
             'KingWalletVisualActivity.java','KingPremiumAccess981.java','MainActivity.java',
             'KingDeepFlowActivity.java','PartyActivity.java','CloudBackend.java',
             'KingGiftShop985Activity.java']
          print('=== FILES AGENT WALLET BILLING ===')
          print('\n'.join(p.name for p in s.glob('*.java') if re.search('agent|wallet|recharge|admin|diamond|billing|cloud',p.name,re.I)))
          for name in names:
            f=s/name
            if not f.exists():continue
            lines=f.read_text().splitlines()
            print('\nFILE',name,'LINES',len(lines))
            patterns=(['recharge','agent','diamond','superadmin','super_admin','wallet','profile_menu',
                'openDeepFlow810','admin','firebase','LIVE_RECHARGE','PAID_VIP_ACTIVE']
                if name in ('MainActivity.java','KingDeepFlowActivity.java','PartyActivity.java') else
                ['recharge','agent','diamond','wallet','grant','credit','admin','collection(',
                 'runTransaction','LIVE_RECHARGE','PAID_VIP_ACTIVE','balance','purchase','super'])
            idx=[i for i,l in enumerate(lines) if any(k.lower() in l.lower() for k in patterns)]
            if name in ('MainActivity.java','PartyActivity.java'):idx=idx[:45]
            else:idx=idx[:72]
            shown=set()
            for i in idx:
              for j in range(max(0,i-2),min(len(lines),i+4)):
                if j not in shown:
                  print(f'{j+1}: {lines[j][:230]}')
                  shown.add(j)
          f=r/'firestore.rules';lines=f.read_text().splitlines()
          print('\nRULES LINES',len(lines))
          idx=[i for i,l in enumerate(lines) if re.search('wallet|diamond|recharge|agent|admin|transaction|credit|billing|balance',l,re.I)]
          shown=set()
          for i in idx[:160]:
            for j in range(max(0,i-3),min(len(lines),i+7)):
              if j not in shown:
                print(f'{j+1}: {lines[j][:220]}');shown.add(j)
          PY
