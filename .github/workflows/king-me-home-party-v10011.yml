name: KING v10.0.11 Me Home Party Atomic Kick and Ban TEST APK
on:
  push:
    branches: [work/king-me-home-party-v10011]
    paths:
      - 'tools/me-home-party-v10011/**'
      - '.github/workflows/king-me-home-party-v10011.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover exact successfully built v10.0.9 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10011prev /tmp/king10011
          gh run download 38541876118 -n KING-v10010-Me-Home-Party-TEST-APK-and-Source -D /tmp/king10011prev
          unzip -q /tmp/king10011prev/KING-Plus-v10.0.10-Me-Home-Party-TEST-Source.zip -d /tmp/king10011
          cp app/kingplus-ci-debug.keystore /tmp/king10011/app/
          python3 tools/me-home-party-v10011/apply.py /tmp/king10011
      - name: Me Home Party v10.0.11 source regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king10011')
          p=(r/'app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          rules=(r/'firestore.rules').read_text()
          assert 'moderateMember10011(uid,name,reason,false)' in p
          assert 'moderateMember10011(uid,name,reasons[w],true)' in p
          assert 'db.runTransaction(tx->' in p and 'tx.delete(member10011)' in p
          assert 'seat10011<=12' in p and 'if(targetCoHost10011)tx.delete(role10011)' in p
          assert '&& !roomBanned(roomId,request.auth.uid)' in rules
          assert '!exists(/databases/$(database)/documents/live_rooms/$(roomId)/roles/$(memberUid))' in rules
          assert 'versionCode 290;' in (r/'app/build.gradle').read_text()
          print('PASS v10.0.11 atomic Kick Ban and no stale Co-host privileges')
          PY
      - name: Me/Home/Party lifecycle and game-state tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10011tests
          javac -d /tmp/king10011tests /tmp/king10011/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10011tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore emulator dependencies
        working-directory: /tmp/king10011/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account atomic moderation and security
        working-directory: /tmp/king10011
        env: {CI: 'true'}
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10011
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify v10.0.10 app ID and unchanged signing certificate
        run: |
          set -euo pipefail
          old=/tmp/king10011prev/KING-Plus-v10.0.10-Me-Home-Party-TEST.apk
          new=/tmp/king10011/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='290'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and full updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10011out /tmp/king10011/tools/me-home-party-v10011
          cp tools/me-home-party-v10011/* /tmp/king10011/tools/me-home-party-v10011/
          cp .github/workflows/king-me-home-party-v10011.yml /tmp/king10011/.github/workflows/
          cp /tmp/king10011/app/build/outputs/apk/debug/app-debug.apk /tmp/king10011out/KING-Plus-v10.0.11-Me-Home-Party-TEST.apk
          rm -f /tmp/king10011/app/kingplus-ci-debug.keystore
          cd /tmp/king10011
          zip -qr /tmp/king10011out/KING-Plus-v10.0.11-Me-Home-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10011out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10011-Me-Home-Party-TEST-APK-and-Source
          path: /tmp/king10011out/*
          retention-days: 14
          if-no-files-found: error
