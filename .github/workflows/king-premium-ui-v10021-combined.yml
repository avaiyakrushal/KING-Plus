name: KING v10.0.21 Combined Premium UI Cut-Off Fix and Royal K Logo TEST APK
on:
  push:
    branches: [work/king-premium-ui-v10021-combined]
    paths:
      - 'tools/premium-ui-v10021/**'
      - '.github/workflows/king-premium-ui-v10021-combined.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.20 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10021prev /tmp/king10021
          gh run download 38586066007 -n KING-v10020-Me-Home-Party-TEST-APK-and-Source -D /tmp/king10021prev
          unzip -q /tmp/king10021prev/KING-Plus-v10.0.20-Me-Home-Party-TEST-Source.zip -d /tmp/king10021
          cp app/kingplus-ci-debug.keystore /tmp/king10021/app/
          python3 tools/premium-ui-v10021/apply.py /tmp/king10021
      - name: Premium four-tab UI and unique logo regression checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('/tmp/king10021')
          src=root/'app/src/main/java/com/kingplus/social'
          main=(src/'MainActivity.java').read_text()
          discover=(src/'DiscoverActivity.java').read_text()
          inbox=(src/'InboxActivity.java').read_text()
          theme=(src/'KingRoyalTheme10021.java').read_text()
          logo=root/'app/src/main/res/drawable/king_logo_royal10021.xml'
          ET.parse(logo)
          assert 'KingRoyalTheme10021.page()' in main
          assert 'root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));' in main
          assert 'addBottomNav(root,1);setSafeContentView(root);' in main
          assert 'LinearLayout.LayoutParams(0,dp(190),1)' in main
          assert 'root.setBackground(KingRoyalTheme10021.page())' in discover
          assert 'HorizontalScrollView strip=new HorizontalScrollView(this)' in discover
          assert 'LinearLayout.LayoutParams(0,dp(246),1)' in discover
          assert 's.setMaxLines(2)' in discover
          assert 'setSafeContentView10021(root)' in inbox
          assert 'WindowInsetsCompat.Type.systemBars()' in inbox
          assert 'KingRoyalTheme10021.card(this,14)' in inbox
          assert 'new int[]{0xfffff6db,0xfffaf1fd,0xfffffaf1}' in theme
          assert 'R.drawable.king_logo_royal10021' in main
          assert 'android:icon="@drawable/king_logo_royal10021"' in (root/'app/src/main/AndroidManifest.xml').read_text()
          assert 'versionCode 300;' in (root/'app/build.gradle').read_text()
          print('PASS premium UI, proper safe system bars, scrollable shortcuts, no card clipping, royal logo')
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10021tests
          javac -d /tmp/king10021tests /tmp/king10021/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10021tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10021/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10021
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10013/role-safety.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs && node tests/firestore/role-safety.test.mjs"
      - name: Combined Me/Home/Party 12 real-data security scenarios
        working-directory: /tmp/king10021
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10019/rtc-membership-current-rules.test.mjs" tests/firestore/rtc-membership-firestore.test.mjs
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10020/mute-all-contract.test.mjs" tests/firestore/mute-all-contract.test.mjs
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-10020-combined --config firebase-emulator.json "node tests/firestore/visitor-pages-firestore.test.mjs && node tests/firestore/me-gallery-live-firestore.test.mjs && node tests/firestore/moments-cross-device-firestore.test.mjs && node tests/firestore/mic-consent-firestore.test.mjs && node tests/firestore/rtc-membership-firestore.test.mjs && node tests/firestore/room-game-gift.test.mjs && node tests/firestore/host-role-private-firestore.test.mjs && node tests/firestore/party-room-vote-firestore.test.mjs && node tests/firestore/mute-all-contract.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10021
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10021prev/KING-Plus-v10.0.20-Me-Home-Party-TEST.apk
          new=/tmp/king10021/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='300'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10021out /tmp/king10021/tools/premium-ui-v10021
          cp tools/premium-ui-v10021/* /tmp/king10021/tools/premium-ui-v10021/
          cp .github/workflows/king-premium-ui-v10021-combined.yml /tmp/king10021/.github/workflows/
          cp /tmp/king10021/app/build/outputs/apk/debug/app-debug.apk /tmp/king10021out/KING-Plus-v10.0.21-Premium-UI-TEST.apk
          rm -f /tmp/king10021/app/kingplus-ci-debug.keystore
          cd /tmp/king10021
          zip -qr /tmp/king10021out/KING-Plus-v10.0.21-Premium-UI-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10021out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10021-Premium-UI-TEST-APK-and-Source
          path: /tmp/king10021out/*
          retention-days: 14
          if-no-files-found: error
