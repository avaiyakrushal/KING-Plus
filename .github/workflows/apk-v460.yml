name: Build KING Plus v4.6.0 Discover Complete

on:
  push:
    branches: [ real-social-v390-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build v4.6.0 Discover Complete
        run: bash tools/build_v460.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v4.6.0-discover-complete
          path: release_v460/*
          if-no-files-found: error
