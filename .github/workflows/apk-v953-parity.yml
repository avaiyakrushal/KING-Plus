name: Build KING Plus v9.5.3 Parity Batch 4

on:
  push:
    branches: ['build/v9.5.3-parity-batch4']
    paths:
      - '.github/workflows/apk-v953-parity.yml'
      - 'ci/v953/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: king-plus-v953-parity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v9.5.3-parity-batch4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recover verified v9.5.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/base /tmp/src
          mkdir -p /tmp/base /tmp/src
          gh run download 37708708041 -n KING-Plus-v9.5.0-parity-batch1-source -D /tmp/base
          unzip -q /tmp/base/KING-Plus-v9.5.0-parity-batch1-source.zip -d /tmp/src

      - name: Apply parity batches 2 through 4
        run: |
          python3 ci/v951/patch_v951.py /tmp/src
          python3 ci/v952/patch_v952.py /tmp/src
          python3 ci/v953/patch_v953.py /tmp/src

      - name: Parity gates
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          grep -F "versionCode 144; versionName '9.5.3-parity-batch4'" app/build.gradle
          grep -F 'pendingCreateName953' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'renderCreateSeatPreview953' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'showPublicCollection953' app/src/main/java/com/kingplus/social/KingPublicProfileActivity.java
          grep -F 'MAX NOBLE 10' app/src/main/java/com/kingplus/social/KingDeepFlowActivity.java
          grep -F 'Open Privilege Shop' app/src/main/java/com/kingplus/social/KingDeepFlowActivity.java

      - name: Compile APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon

      - name: Common runtime audit
        working-directory: /tmp/src
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('app/src/main')
          manifest=(root/'AndroidManifest.xml').read_text(errors='ignore')
          declared=set(re.findall(r'<activity[^>]+android:name="\.([^"]+)"',manifest))
          intents=set()
          for p in (root/'java/com/kingplus/social').glob('*.java'):
              t=p.read_text(errors='ignore')
              intents.update(re.findall(r'new Intent\(this,\s*([A-Za-z0-9_]+)\.class\)',t))
          missing=sorted(x for x in intents if x not in declared and x!='MainActivity')
          print('Missing activities:',missing)
          if missing: raise SystemExit(','.join(missing))
          print('v9.5.3 activity audit passed')
          PY

      - name: Android lint
        working-directory: /tmp/src
        continue-on-error: true
        run: gradle :app:lintDebug --no-daemon

      - name: Package APK and source
        run: |
          cp /tmp/src/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.5.3-parity-batch4.apk
          cd /tmp/src
          zip -qr /tmp/KING-Plus-v9.5.3-parity-batch4-source.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.5.3-parity-batch4-APK
          path: /tmp/KING-Plus-v9.5.3-parity-batch4.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.5.3-parity-batch4-source
          path: /tmp/KING-Plus-v9.5.3-parity-batch4-source.zip
          retention-days: 7
