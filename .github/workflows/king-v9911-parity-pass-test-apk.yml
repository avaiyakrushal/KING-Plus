name: KING Plus v9.9.11 - Bolo-style Parity Pass 1 TEST APK
on:
  push:
    branches: [work/king-bolo-end-to-end-pass1]
    paths:
      - 'tools/king_v9911_parity_pass.py'
      - '.github/workflows/king-v9911-parity-pass-test-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: king-v9911-parity-pass-test
  cancel-in-progress: false
jobs:
  compile-parity-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Retrieve exact previously verified v9.9.10 Stage15 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-v9911 /tmp/king-v9911-old
          gh release download v9.9.10 -p 'KING-Plus-v9.9.10-Stage15-CURRENT-WORK-Source.zip' -D /tmp/king-v9911-old
          gh release download v9.9.10 -p 'KING-Plus-v9.9.10-Stage15-Current-Work-TEST.apk' -D /tmp/king-v9911-old
          unzip -q /tmp/king-v9911-old/KING-Plus-v9.9.10-Stage15-CURRENT-WORK-Source.zip -d /tmp/king-v9911
          test -s /tmp/king-v9911/app/src/main/java/com/kingplus/social/PartyActivity.java
          # Stable existing debug key is required for upgrade; never regenerate it here.
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king-v9911/app/kingplus-ci-debug.keystore
      - name: Apply all five-area source corrections
        run: |
          set -euo pipefail
          python3 tools/king_v9911_parity_pass.py /tmp/king-v9911
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/king-v9911/app/src/main/java/com/kingplus/social')
          main=(p/'MainActivity.java').read_text()
          party=(p/'PartyActivity.java').read_text()
          assert 'room(String name){ openPartyActivity(); }' in main
          assert 'firebaseAuth.getCurrentUser()==null)login()' in main
          assert 'incrementMission("mission_game",1)' not in main
          assert 'generation9911!=lobbyRenderGeneration9911' in party
          assert 'tv("🏠",23,Color.WHITE' in party
          assert 'PAID_VIP_ACTIVE = false' in (p/'KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (p/'KingRecharge974Activity.java').read_text()
          print('Five workstreams source smoke: PASS')
          PY
      - name: Assemble signed-debug TEST APK from corrected source
        working-directory: /tmp/king-v9911
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify package, version and upgrade signing match
        run: |
          set -euo pipefail
          NEW=/tmp/king-v9911/app/build/outputs/apk/debug/app-debug.apk
          OLD=/tmp/king-v9911-old/KING-Plus-v9.9.10-Stage15-Current-Work-TEST.apk
          test -s "$NEW" && test -s "$OLD"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='189'"
          "$AAPT" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='190'"
          "$SIGNER" verify --print-certs "$OLD" > /tmp/v9911-oldcert
          "$SIGNER" verify --print-certs "$NEW" > /tmp/v9911-newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/v9911-oldcert | head -1 || true)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/v9911-newcert | head -1 || true)"
          test -n "$a" && test "$a" = "$b" || { echo 'Signer mismatch: do not offer in-place install'; exit 1; }
          echo 'TEST APK package, version and signer: PASS'
      - name: Prepare tested APK and sanitized matching source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-v9911-release
          cp /tmp/king-v9911/app/build/outputs/apk/debug/app-debug.apk /tmp/king-v9911-release/KING-Plus-v9.9.11-Parity-Pass1-TEST.apk
          # Do not put even a debug signing key into the downloadable source archive.
          rm -f /tmp/king-v9911/app/kingplus-ci-debug.keystore
          cd /tmp/king-v9911
          zip -q -r /tmp/king-v9911-release/KING-Plus-v9.9.11-Parity-Pass1-Source.zip . -x './app/build/*' './.gradle/*' './build/*' './**/.DS_Store'
          sha256sum /tmp/king-v9911-release/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.9.11-Parity-Pass1-TEST-APK-and-Source
          path: /tmp/king-v9911-release/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish honest, explicitly incomplete test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v9.9.11-parity-pass1 /tmp/king-v9911-release/* \
            --target "$GITHUB_SHA" --prerelease \
            --title 'KING Plus v9.9.11 — Five-Area Parity Pass 1 TEST' \
            --notes 'TEST APK: fixes actual Firebase login gate, routes legacy room creation to live Party, adds royal Party lobby with home/create icon, removes fake room counts and reward-on-tab-open, displays Diamonds only from server wallet, marks local gift previews, and protects against stale Firebase lobby callbacks. All five areas touched, but full Bolo Hi design/game/audio parity and two-phone acceptance are NOT complete. VIP/paid recharge deliberately disabled. Existing v9.9.10 installs should upgrade in place, pending on-device validation.'
