name: KING Plus v9.9.29 - Safely Apply Verified Production Firestore Rules
on:
  push:
    branches: [work/king-v9929-live-avatar-motion]
    paths: ['.github/workflows/king-v9929-production-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: king-prod-firestore-deploy
  cancel-in-progress: false
jobs:
  production-firestore-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact verified KING v9.9.29 signed and tested production rule source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9929prod /tmp/king-prod-firestore-backup
          gh release download v9.9.29-live-3d-motion -p 'KING-Plus-v9.9.29-Live-3D-Motion-Source.zip' -D /tmp
          unzip -q /tmp/KING-Plus-v9.9.29-Live-3D-Motion-Source.zip -d /tmp/king9929prod
          echo '29459a61a5d14461f808570d538a484cb79030af5f027429fbf27dafbdfe3ad0  /tmp/king9929prod/firestore.rules' | sha256sum -c -
          test -s /tmp/king9929prod/tests/firestore/avatar-motion-firestore.test.mjs
          grep -q 'match /avatar_motion/{motionUid}' /tmp/king9929prod/firestore.rules
      - name: Run two authenticated avatar-motion Firebase Emulator security tests
        working-directory: /tmp/king9929prod
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          cd tests/firestore
          npm ci --no-audit --no-fund
          cd ../..
          tests/firestore/node_modules/.bin/firebase emulators:exec \
            --only firestore --project demo-king-avatar-motion-9929 --config firebase-emulator.json \
            "node tests/firestore/avatar-motion-firestore.test.mjs"
      - name: Validate configured Firebase production identity
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo 'BLOCKED: GitHub Firebase service account secret absent' && exit 1)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/king-prod-fire-auth.json"
          chmod 600 "$RUNNER_TEMP/king-prod-fire-auth.json"
          jq -e '.type=="service_account" and .project_id=="king-plus-2f365"' "$RUNNER_TEMP/king-prod-fire-auth.json" >/dev/null
      - name: Install Firebase Admin SDK, read-only HTTP authentication dependencies
        working-directory: /tmp/king9929prod/functions
        run: npm install --no-audit --no-fund
      - name: Back up existing production rules then guarded deploy with automatic verification and rollback
        working-directory: /tmp/king9929prod/functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/king-prod-fire-auth.json
          KING_VERIFIED_RULES_PATH: /tmp/king9929prod/firestore.rules
        run: node "$GITHUB_WORKSPACE/tools/v9929/deploy_live_firestore_guarded.cjs"
      - name: Upload original live rules backup and deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KING-Production-Firestore-Rule-Backup-and-Deployment-Verification
          path: /tmp/king-prod-firestore-backup/*
          retention-days: 30
          if-no-files-found: warn
      - name: Remove temporary private service account file
        if: always()
        run: rm -f "$RUNNER_TEMP/king-prod-fire-auth.json"
