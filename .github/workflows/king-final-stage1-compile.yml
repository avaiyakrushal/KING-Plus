name: KING Final Five Sections - Stage 1 3D and Video Compile Only
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-final-stage1-compile.yml'
      - 'ci/final_five/KingNative3DRoom.java'
      - 'ci/final_five/stage1_patch.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: king-final-five-stage1
  cancel-in-progress: true
jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore last signed 9.9.8 complete project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-final-source /tmp/king-final-app
          gh run download 38128027011 -n KING-Plus-v9.9.8-Real-Friends-Source -D /tmp/king-final-source
          unzip -q /tmp/king-final-source/KING-Plus-v9.9.8-Real-Friends-Server-Sync-source.zip -d /tmp/king-final-app
          test -s /tmp/king-final-app/app/src/main/java/com/kingplus/social/PartyActivity.java
      - name: Add original GLES 2.0 Party world and video bridge
        run: |
          python3 -m py_compile ci/final_five/stage1_patch.py
          python3 ci/final_five/stage1_patch.py /tmp/king-final-app
      - name: Check safety and 3D design invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king-final-app')
          app=root/'app/src/main/java/com/kingplus/social'
          renderer=(app/'KingNative3DRoom.java').read_text()
          party=(app/'PartyActivity.java').read_text()
          jitsi=(app/'KingMultiVideoActivity.java').read_text()
          assert 'GLSurfaceView' in renderer and 'GLES20.GL_DEPTH_TEST' in renderer
          assert 'Matrix.perspectiveM' in renderer and 'GLES20.GL_TRIANGLES' in renderer
          assert 'addSnapshotListener(' in renderer and 'collection("seats")' in renderer
          assert 'listener[0].remove()' in renderer and 'frames.removeCallbacks(draw[0])' in renderer
          assert 'WorldSurface' in renderer and 'requestRender()' in renderer
          assert 'new boolean[12]' in renderer # no fake fallback
          assert 'items.add("🌐 3D World")' in party
          assert 'KingNative3DRoom.open(this,db,user,roomId,this::openVideoRoom)' in party
          assert 'this::shareRealRoom996' in party
          assert 'KingRoomDice997.open(' in party
          assert 'KingGiftSound993.play(this,gift)' in party
          assert 'KingEmojiAccess993.canSend(' in party
          assert 'org.jitsi.meet.sdk.JitsiMeetView' in jitsi
          assert 'https://meet.jit.si' in jitsi
          assert 'setAudioMuted(true)' in jitsi and 'setVideoMuted(true)' in jitsi
          assert 'LIVE_RECHARGE = false' in (app/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (app/'KingPremiumAccess981.java').read_text()
          assert 'versionCode 187;' in (root/'app/build.gradle').read_text()
          assert (root/'firestore.rules').exists()
          print('PASS real native GLES renderer + Firebase seat sync, existing video, no privilege/billing changes')
          PY
      - name: Compile Stage 1 WITHOUT public release
        working-directory: /tmp/king-final-app
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify compiled activity included in APK without publishing
        run: |
          set -euo pipefail
          apk=/tmp/king-final-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          "$AAPT" dump badging "$apk" | grep "^package:" | grep "name='com.kingplus.social'"
          unzip -l "$apk" | grep -q "classes.dex"
          echo "PASS Stage 1 builds; NO release, NO APK sharing until all FIVE sections are complete"
      - name: Report stage-1 progress only
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Stage 1 of 5 — 3D World + video bridge
          - Native, original OpenGL ES 2.0 shaded Party scene compiles
          - Real Firebase occupied seats are reflected inside 3D scene
          - Gesture orbit/zoom supported; UI remains inside Party Room dialogue
          - Existing Jitsi Multi Video remains the video route; host camera permissions and actual A/B video not yet certified
          - No interim APK published; all five sections remain part of ONE final release
          - Stage 1 is **in progress**, not production completed
          EOF
