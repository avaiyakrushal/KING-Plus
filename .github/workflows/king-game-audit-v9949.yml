name: KING v9.9.49 Multiplayer RPS Fair Reveal Audit
on:
  push:
    branches: [work/king-rps-hidden-choices-v9949]
    paths: ['tools/game-rps-v9949/audit.py','.github/workflows/king-game-audit-v9949.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download verified v9.9.48 full source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9949prev /tmp/king9949
          gh run download 38348067416 -n KING-v9948-True-Gift-Sounds-TEST-APK-and-Source -D /tmp/king9949prev
          unzip -q /tmp/king9949prev/KING-Plus-v9.9.48-True-Gift-Sounds-Source.zip -d /tmp/king9949
          grep -q 'versionCode 227' /tmp/king9949/app/build.gradle
      - name: Inspect active game choices and results
        run: python3 tools/game-rps-v9949/audit.py /tmp/king9949
