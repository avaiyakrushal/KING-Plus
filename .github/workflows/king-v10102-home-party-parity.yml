name: KING Plus v10.0.104 Home and Party CI

on:
  push:
    branches:
      - work/king-v10102-home-party-parity
  pull_request:
    branches:
      - work/king-v10070-nongame-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android debug build
        run: gradle :app:assembleDebug --no-daemon

      - name: Package source ZIP
        if: success()
        run: git archive --format=zip --output=KING-Plus-v10.0.104-Source.zip HEAD

      - name: Upload APK and source ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v10.0.104-QA
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            KING-Plus-v10.0.104-Source.zip
          if-no-files-found: error
          retention-days: 14
