name: KING v9.9.29 - Register Verified APK SHA256 in Production Firebase
on:
  push:
    branches: [work/king-v9929-live-avatar-motion]
    paths: ['.github/workflows/king-v9929-register-cert.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: king-prod-auth-cert-registration
  cancel-in-progress: false
jobs:
  register-verified-signing-fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain exactly the signed APK released after game and 3D regression checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kingcert
          gh release download v9.9.29-live-3d-motion -p 'KING-Plus-v9.9.29-Live-3D-Motion-TEST.apk' -D /tmp/kingcert
          test "$(stat -c%s /tmp/kingcert/KING-Plus-v9.9.29-Live-3D-Motion-TEST.apk)" -gt 70000000
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$SIGNER"
          "$SIGNER" verify --print-certs /tmp/kingcert/KING-Plus-v9.9.29-Live-3D-Motion-TEST.apk >/tmp/kingcert/cert.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging /tmp/kingcert/KING-Plus-v9.9.29-Live-3D-Motion-TEST.apk | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='208'"
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('/tmp/kingcert/cert.txt').read_text()
          for typ,length in [('SHA-1',40),('SHA-256',64)]:
              m=re.search('certificate\\s+'+typ+'\\s+digest:\\s*([0-9A-Fa-f:]+)',s,re.I)
              if not m:raise ValueError('Missing '+typ+' from verified signed APK')
              v=m.group(1).replace(':','').lower()
              assert len(v)==length
              pathlib.Path('/tmp/kingcert/'+typ.lower().replace('-','')).write_text(v)
          print('PASS actual KING v9.9.29 installed app signer verified from published APK')
          PY
      - name: Authenticate production Firebase project, without revealing credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/kingcert-service.json"
          chmod 600 "$RUNNER_TEMP/kingcert-service.json"
          jq -e '.type=="service_account" and .project_id=="king-plus-2f365"' "$RUNNER_TEMP/kingcert-service.json" >/dev/null
          cd /tmp/kingcert
          npm init -y >/dev/null
          npm install google-auth-library@10 --no-audit --no-fund >/dev/null
      - name: Register only missing SHA256 on the existing matching Firebase Android application
        working-directory: /tmp/kingcert
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/kingcert-service.json
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {GoogleAuth}=require('google-auth-library');
          const project='king-plus-2f365',pkg='com.kingplus.social';
          (async()=>{
            const auth=new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const client=await auth.getClient();
            const call=async(opts)=>(await client.request(opts)).data;
            const registered=(await call({url:'https://firebase.googleapis.com/v1beta1/projects/'+project+'/androidApps'})).apps||[];
            const matches=registered.filter(a=>a.packageName===pkg&&a.state!=='DELETED');
            if(matches.length!==1)throw new Error('Expected exactly one active KING Plus Firebase Android app; no changes performed.');
            const app=matches[0],base='https://firebase.googleapis.com/v1beta1/'+app.name+'/sha';
            const certs=(await call({url:base})).certificates||[];
            const sha256=fs.readFileSync('/tmp/kingcert/sha256','utf8').trim().toLowerCase();
            const sha1=fs.readFileSync('/tmp/kingcert/sha1','utf8').trim().toLowerCase();
            const exists=(type,sha)=>certs.some(c=>c.certType===type&&c.shaHash?.replace(/:/g,'').toLowerCase()===sha);
            if(!exists('SHA_1',sha1))throw new Error('Published APK SHA1 no longer matches the registered app; refusing to register SHA256');
            if(!exists('SHA_256',sha256)){
              await call({url:base,method:'POST',data:{name:'',shaHash:sha256,certType:'SHA_256'}});
              console.log('FIREBASE_CERT: Existing Android app certificate SHA256 added for verified TEST APK');
            }else{
              console.log('FIREBASE_CERT: Exact TEST APK SHA256 already registered. No change.');
            }
            const check=(await call({url:base})).certificates||[];
            if(!check.some(c=>c.certType==='SHA_256'&&c.shaHash?.replace(/:/g,'').toLowerCase()===sha256))
              throw new Error('Firebase post-write certificate readback failed');
            console.log('FIREBASE_CERT: PASS verified real APK SHA256 now present on project / package');
            console.log('FIREBASE_CERT: Phone OTP still needs real phone/region policy and CAPTCHA/Integrity acceptance.');
            console.log('FIREBASE_CERT: Only fingerprint metadata changed; no customer data, rules, login provider or payments touched.');
          })().catch(e=>{console.error('FIREBASE_CERT_FAILED:',e.response?.status||e.code||e.message);process.exitCode=1});
          NODE
      - name: Securely dispose of private credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/kingcert-service.json"
