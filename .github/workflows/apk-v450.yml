name: Build KING Plus v4.5.0 Party Room Reference

on:
  push:
    branches: [real-social-v390-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build v4.5.0 Party Room Reference
        run: bash tools/build_v450.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v4.5.0-party-room-reference
          path: |
            release_v450/KING-Plus-v4.5.0-party-room-reference-no-billing-test-otp.apk
            release_v450/KING-Plus-v4.5.0-party-room-reference-source.zip
          if-no-files-found: error
