name: Audit KING Plus Firestore Server Read Only
on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/audit-v987-firestore-server.yml'
      - 'ci/v987/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: king-plus-firestore-audit-readonly
  cancel-in-progress: true
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm existing project credential without exposing it
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "RESULT: FIREBASE_CI_CREDENTIAL_MISSING"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | jq -e '.type=="service_account" and .project_id=="king-plus-2f365"' >/dev/null
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-readonly-987.json"
          chmod 600 "$RUNNER_TEMP/firebase-readonly-987.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-readonly-987.json" >> "$GITHUB_ENV"
      - name: Install already used Firebase Admin SDK
        run: npm install --prefix functions --no-audit --no-fund
      - name: Check real Firestore data API via one Admin SDK read (no writes)
        env:
          GOOGLE_CLOUD_PROJECT: king-plus-2f365
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: |
          set -euo pipefail
          node ci/v987/firestore_server_health_readonly.cjs
      - name: Wipe temporary service account after test
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-readonly-987.json"
