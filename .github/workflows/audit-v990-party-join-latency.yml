name: Audit KING Plus v9.8.6 Party Join Latency
on:
  push:
    branches: ['work/reference-completion']
    paths:
      - '.github/workflows/audit-v990-party-join-latency.yml'
      - 'ci/v990/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - name: Restore verified v9.8.6 Android source (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-v986-archive /tmp/king-v986-source
          gh run download 38074781411 -n KING-Plus-v9.8.6-Firebase-Server-Diagnosis-Source -D /tmp/king-v986-archive
          unzip -q /tmp/king-v986-archive/KING-Plus-v9.8.6-Firebase-Server-Diagnosis-source.zip 'app/src/main/java/com/kingplus/social/*' -d /tmp/king-v986-source
      - name: Inspect sequential server accesses and duplicate Join events
        run: |
          python3 ci/v990/inspect_party_join_latency_v990.py /tmp/king-v986-source
