name: KING v9.9.55 Real Visible Gift Receiver ACK Retry and Party Regression TEST
on:
  push:
    branches: [work/king-ack-retry-gifting-v9955]
    paths: ['tools/gift-receipt-retry-v9955/**','.github/workflows/king-gift-receipt-retry-v9955.yml']
  pull_request:
    paths: ['tools/gift-receipt-retry-v9955/**','.github/workflows/king-gift-receipt-retry-v9955.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  compile-and-verify-real-party:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore verified full signed v9.9.54 Android source and APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9955prev /tmp/king9955
          gh run download 38356921211 -n KING-v9954-Verified-Result-Reconnect-TEST-APK-and-Source -D /tmp/king9955prev
          test -s /tmp/king9955prev/KING-Plus-v9.9.54-Result-Reconnect-TEST.apk
          unzip -q /tmp/king9955prev/KING-Plus-v9.9.54-Result-Reconnect-Source.zip -d /tmp/king9955
          grep -q 'versionCode 233' /tmp/king9955/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9955/app/kingplus-ci-debug.keystore
      - name: Patch real visible Gift receipt reliable retry without duplicate Gift animation
        run: |
          set -euo pipefail
          python3 tools/gift-receipt-retry-v9955/apply.py /tmp/king9955
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9955')
          p=root/'app/src/main/java/com/kingplus/social'
          s=(p/'PartyActivity.java').read_text()
          assert 'retryDisplayedGiftReceipts9955();' in s
          assert 'confirmGiftReceived9941(next.room,next.event,expectedUid);' in s
          assert 'gift_receipts").document(id)' in s
          assert 'Source.SERVER' in s[s.index('    private void attemptDisplayedGiftReceipt9955('):s.index('    private void awardGiftProgress700(')]
          assert 'receiptHandler9955.postDelayed' in s
          assert 'clearDisplayedGiftReceipts9955();' in s
          assert 'pauseDisplayedGiftReceipts9955();' in s
          assert 'receiptContext9955(job)' in s
          assert 'pendingGiftEvents9944' in s
          assert 'KingGiftSound993.play' in s
          assert 'KingRoomAutoFinish9953' in (p/'RoomGameActivity.java').read_text()
          assert 'KingRoomSettleRetry9954' in (p/'RoomGameActivity.java').read_text()
          assert 'LIVE_RECHARGE = false' in (p/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (p/'KingPremiumAccess981.java').read_text()
          assert 'versionCode 234' in (root/'app/build.gradle').read_text()
          print('PASS only real visible recipient Gift gets bounded SERVER receipt ACK retry; Game logic preserved')
          PY
      - name: Unit-test exactly-once visible gift receiver acknowledgement retry policy
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9955classes
          javac -d /tmp/king9955classes \
            /tmp/king9955/app/src/main/java/com/kingplus/social/KingGiftReceiptRetry9955.java \
            tools/gift-receipt-retry-v9955/KingGiftReceiptRetry9955Test.java
          java -cp /tmp/king9955classes com.kingplus.social.KingGiftReceiptRetry9955Test
      - name: Install Firestore emulator test dependencies
        working-directory: /tmp/king9955/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Verify ghost Ready excluded and real-player RPS still playable
        working-directory: /tmp/king9955
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/real-game-roster-v9952/live-roster-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-live-roster-9955 --config firebase-emulator.json \
            "node tests/firestore/live-roster-firestore.test.mjs"
      - name: Confirm real multiplayer Party/Host Cancel unchanged
        working-directory: /tmp/king9955
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-frozen-roster-9946 --config firebase-emulator.json \
            "node tests/firestore/frozen-ready-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-immutable-games-9943 --config firebase-emulator.json \
            "node tests/firestore/immutable-rounds-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-cancel-9947 --config firebase-emulator.json \
            "node tests/firestore/cancel-round-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-9938-live --config firebase-emulator.json \
            "node tests/firestore/room-game-gift.test.mjs"
      - name: Test recipient-only Gift receipt persistence and anti-impersonation
        working-directory: /tmp/king9955
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-gift-receipts-9941 --config firebase-emulator.json \
            "node tests/firestore/gift-delivery-firestore.test.mjs"
      - name: Compile full Android app
        working-directory: /tmp/king9955
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify signed upgrade identity and exact version
        run: |
          set -euo pipefail
          old=/tmp/king9955prev/KING-Plus-v9.9.54-Result-Reconnect-TEST.apk
          new=/tmp/king9955/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='233'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='234'"
          "$signer" verify --print-certs "$old" >/tmp/oldcert
          "$signer" verify --print-certs "$new" >/tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package signed TEST APK and complete Android source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9955out
          cp /tmp/king9955/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9955out/KING-Plus-v9.9.55-Real-Gift-Receipt-TEST.apk
          rm -f /tmp/king9955/app/kingplus-ci-debug.keystore
          cd /tmp/king9955
          zip -q -r /tmp/king9955out/KING-Plus-v9.9.55-Real-Gift-Receipt-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
            './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9955out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9955-Verified-Real-Gift-Receipt-TEST-APK-and-Source
          path: /tmp/king9955out/*
          retention-days: 14
          if-no-files-found: error
