name: KING Plus v9.9.15 - Android Cold Start Crash Smoke
on:
  push:
    branches: [work/king-ref-parity-v9915]
    paths: ['.github/workflows/king-v9915-android-emulator-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-cold-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact independently built v9.9.15 release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9915smoke
          gh release download v9.9.15-reference-ui \
            -p 'KING-Plus-v9.9.15-Reference-UI-TEST.apk' -D /tmp/king9915smoke
          test -s /tmp/king9915smoke/KING-Plus-v9.9.15-Reference-UI-TEST.apk
      - name: Install and cold-start in independent clean Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r /tmp/king9915smoke/KING-Plus-v9.9.15-Reference-UI-TEST.apk
            adb shell am force-stop com.kingplus.social || true
            adb logcat -c
            adb shell am start -W -n com.kingplus.social/.MainActivity
            sleep 12
            PID="$(adb shell pidof com.kingplus.social | tr -d '\r' | tr -d ' ')"
            if [ -z "$PID" ]; then
              adb logcat -d -b crash | tail -100
              echo 'FAIL app process exited during cold-start/login'
              exit 1
            fi
            mkdir -p /tmp/king9915smoke
            adb exec-out screencap -p > /tmp/king9915smoke/cold-start-login.png
            adb logcat -d -b crash > /tmp/king9915smoke/logcat-crash.txt || true
            if grep -q 'Process: com.kingplus.social' /tmp/king9915smoke/logcat-crash.txt; then
              echo 'FAIL startup produced KING Plus crash log'
              tail -80 /tmp/king9915smoke/logcat-crash.txt
              exit 1
            fi
            echo 'PASS: installed and survived clean Android 15 cold start to login'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KING-v9915-Emulator-Startup-Log-and-Screenshot
          path: |
            /tmp/king9915smoke/cold-start-login.png
            /tmp/king9915smoke/logcat-crash.txt
          retention-days: 14
          if-no-files-found: warn
