name: KING v9.9.49 Real Party Game Move Reveal and Fair Client Dice TEST
on:
  push:
    branches: [work/king-rps-hidden-choices-v9949]
    paths: ['tools/game-rps-v9949/**','.github/workflows/king-real-game-reveal-v9949.yml']
  pull_request:
    paths: ['tools/game-rps-v9949/**','.github/workflows/king-real-game-reveal-v9949.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  verify-actual-room-games:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover verified full KING v9.9.48 APK and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9949prev /tmp/king9949
          gh run download 38348067416 -n KING-v9948-True-Gift-Sounds-TEST-APK-and-Source -D /tmp/king9949prev
          test -s /tmp/king9949prev/KING-Plus-v9.9.48-True-Gift-Sounds-TEST.apk
          unzip -q /tmp/king9949prev/KING-Plus-v9.9.48-True-Gift-Sounds-Source.zip -d /tmp/king9949
          grep -q 'versionCode 227' /tmp/king9949/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9949/app/kingplus-ci-debug.keystore
      - name: Add server-confirmed current-round move filtering and post-round RPS choice reveal
        run: |
          set -euo pipefail
          python3 tools/game-rps-v9949/apply.py /tmp/king9949
          node --check /tmp/king9949/functions/v3.js
          node --test /tmp/king9949/functions/play-purchase-service.test.js
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king9949');s=r/'app/src/main/java/com/kingplus/social'
          j=(s/'RoomGameActivity.java').read_text()
          rules=(r/'firestore.rules').read_text()
          assert 'KingPartyGameFairPlay9949' in (s/'RoomGameActivity.java').read_text()
          assert 'MetadataChanges.INCLUDE' in (s/'RoomGameActivity.java').read_text()
          assert 'SecureRandom' in (s/'KingPartyGameFairPlay9949.java').read_text()
          assert 'pendingGiftEvents9944' in (s/'PartyActivity.java').read_text()
          assert 'match /gift_receipts/{giftId}' in rules and "request.resource.data.type != 'dice'" in rules
          assert '.data.roundId == request.resource.data.roundId' in rules
          assert 'versionCode 228' in (r/'app/build.gradle').read_text()
          assert 'LIVE_RECHARGE = false' in (s/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (s/'KingPremiumAccess981.java').read_text()
          print('PASS server-only result calculation and immutable current-game turns, wallet stays OFF')
          PY
      - name: Test active hidden RPS choices, reveal after finish, honest client Dice/Wheel/Slot
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9949classes
          javac -d /tmp/king9949classes \
            /tmp/king9949/app/src/main/java/com/kingplus/social/KingPartyGameFairPlay9949.java \
            tools/game-rps-v9949/KingPartyGameFairPlay9949Test.java
          java -cp /tmp/king9949classes com.kingplus.social.KingPartyGameFairPlay9949Test
      - name: Install Firestore emulation dependencies
        working-directory: /tmp/king9949/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Verify existing real Host Cancel 3-player round remains secure
        working-directory: /tmp/king9949
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-cancel-9947 --config firebase-emulator.json \
            "node tests/firestore/cancel-round-firestore.test.mjs"
      - name: Verify frozen 3-player Ready roster regression
        working-directory: /tmp/king9949
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-frozen-roster-9946 --config firebase-emulator.json \
            "node tests/firestore/frozen-ready-firestore.test.mjs"
      - name: Verify TWO players cannot rewrite or forge Game moves
        working-directory: /tmp/king9949
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-immutable-games-9943 --config firebase-emulator.json \
            "node tests/firestore/immutable-rounds-firestore.test.mjs"
      - name: Re-run real Gift, Sheep, Ludo, Tic Tac Toe, Party rules acceptance
        working-directory: /tmp/king9949
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-gift-receipts-9941 --config firebase-emulator.json \
            "node tests/firestore/gift-delivery-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-sheep-9940 --config firebase-emulator.json \
            "node tests/firestore/sheep-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-party-ludo-9939 --config firebase-emulator.json \
            "node tests/firestore/party-ludo-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-9938-live --config firebase-emulator.json \
            "node tests/firestore/room-game-gift.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-room-v9936 --config firebase-emulator.json \
            "node tests/firestore/functional-access.test.mjs"
      - name: Compile complete KING Android app with all Party features
        working-directory: /tmp/king9949
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Confirm same Android signing identity and resource preservation
        run: |
          set -euo pipefail
          old=/tmp/king9949prev/KING-Plus-v9.9.48-True-Gift-Sounds-TEST.apk
          new=/tmp/king9949/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='227'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='228'"
          "$signer" verify --print-certs "$old" > /tmp/oldcert
          "$signer" verify --print-certs "$new" > /tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
          python3 - <<'PY'
          from zipfile import ZipFile
          old='/tmp/king9949prev/KING-Plus-v9.9.48-True-Gift-Sounds-TEST.apk'
          new='/tmp/king9949/app/build/outputs/apk/debug/app-debug.apk'
          def counts(p):
            with ZipFile(p) as z:names=set(z.namelist())
            return (sum(n.startswith('res/layout') and n.endswith('.xml') for n in names),
              sum(n.startswith('res/drawable') and n.endswith(('.xml','.png','.webp')) for n in names))
          print('RESOURCE_COUNTS',counts(old),counts(new))
          assert counts(old)==counts(new)==(4065,8680)
          PY
      - name: Package signed TEST APK plus full source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9949out
          cp /tmp/king9949/app/build/outputs/apk/debug/app-debug.apk /tmp/king9949out/KING-Plus-v9.9.49-Fair-Game-Reveal-TEST.apk
          rm -f /tmp/king9949/app/kingplus-ci-debug.keystore
          cd /tmp/king9949
          zip -q -r /tmp/king9949out/KING-Plus-v9.9.49-Fair-Game-Reveal-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
              './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9949out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9949-Fair-Game-Reveal-TEST-APK-and-Source
          path: /tmp/king9949out/*
          retention-days: 14
          if-no-files-found: error
