name: KING v9.9.50 Real Backpack-to-Party Gift Delivery TEST
on:
  push:
    branches: [work/king-backpack-real-gift-v9950]
    paths: ['tools/backpack-gift-v9950/**', '.github/workflows/king-backpack-live-gift-v9950.yml']
  pull_request:
    paths: ['tools/backpack-gift-v9950/**', '.github/workflows/king-backpack-live-gift-v9950.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build-functional-backpack-gift:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore verified signed full KING v9.9.49 source and APK
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9950 /tmp/king9950prev
          gh run download 38349470539 -n KING-v9949-Fair-Game-Reveal-TEST-APK-and-Source -D /tmp/king9950prev
          test -s /tmp/king9950prev/KING-Plus-v9.9.49-Fair-Game-Reveal-TEST.apk
          unzip -q /tmp/king9950prev/KING-Plus-v9.9.49-Fair-Game-Reveal-Source.zip -d /tmp/king9950
          grep -q 'versionCode 228' /tmp/king9950/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9950/app/kingplus-ci-debug.keystore
      - name: Apply actual Backpack free Gift delivery fix
        run: |
          set -euo pipefail
          python3 tools/backpack-gift-v9950/apply.py /tmp/king9950
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/king9950/app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          part=s[s.index('    private void backpackGiftDialog700(){'):s.index('    private void pkHistory940(){')]
          assert 'room.collection("events").add(e)' not in part
          assert 'showGiftEffect(' not in part
          assert 'sendGiftQuantityVerified9950(' in part
          assert s.index('if(onCommitted9950!=null)onCommitted9950.run();')>s.index('batch971.commit().addOnSuccessListener')
          assert 'confirmGiftReceived9941' in s and 'KingGiftSound993.stopRoomAudio()' in s
          assert 'versionCode 229' in Path('/tmp/king9950/app/build.gradle').read_text()
          print('PASS real Gift pipeline, no false sent, no inventory debit before server commit')
          PY
      - name: Unit-test Backpack commit-only local inventory
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9950classes
          javac -d /tmp/king9950classes \
            /tmp/king9950/app/src/main/java/com/kingplus/social/KingBackpackGift9950.java \
            tools/backpack-gift-v9950/KingBackpackGift9950Test.java
          java -cp /tmp/king9950classes com.kingplus.social.KingBackpackGift9950Test
      - name: Install Firebase emulator test dependencies
        working-directory: /tmp/king9950/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Verify 3-account real Gift receipt, atomic event and anti-spoof Firestore rules
        working-directory: /tmp/king9950
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-gift-receipts-9941 --config firebase-emulator.json \
            "node tests/firestore/gift-delivery-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-9938-live --config firebase-emulator.json \
            "node tests/firestore/room-game-gift.test.mjs"
      - name: Keep real RPS Dice Coin + Frozen players and Host Cancel safe
        working-directory: /tmp/king9950
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-immutable-games-9943 --config firebase-emulator.json \
            "node tests/firestore/immutable-rounds-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-frozen-roster-9946 --config firebase-emulator.json \
            "node tests/firestore/frozen-ready-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-cancel-9947 --config firebase-emulator.json \
            "node tests/firestore/cancel-round-firestore.test.mjs"
      - name: Full Android compilation and signing
        working-directory: /tmp/king9950
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify app version and unchanged signing certificate
        run: |
          set -euo pipefail
          old=/tmp/king9950prev/KING-Plus-v9.9.49-Fair-Game-Reveal-TEST.apk
          new=/tmp/king9950/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='228'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='229'"
          "$signer" verify --print-certs "$old" > /tmp/oldcert
          "$signer" verify --print-certs "$new" > /tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package full signed TEST APK and complete source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9950out
          cp /tmp/king9950/app/build/outputs/apk/debug/app-debug.apk /tmp/king9950out/KING-Plus-v9.9.50-Real-Backpack-Gift-TEST.apk
          rm -f /tmp/king9950/app/kingplus-ci-debug.keystore
          cd /tmp/king9950
          zip -q -r /tmp/king9950out/KING-Plus-v9.9.50-Real-Backpack-Gift-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
              './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9950out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9950-Real-Backpack-Gift-TEST-APK-and-Source
          path: /tmp/king9950out/*
          retention-days: 14
          if-no-files-found: error
