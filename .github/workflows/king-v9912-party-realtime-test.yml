name: KING Plus v9.9.12 - Party Realtime Parity Test
on:
  push:
    branches: [work/king-bolo-live-room-parity-v9912]
    paths:
      - 'tools/king_v9912_party_parity.py'
      - '.github/workflows/king-v9912-party-realtime-test.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: king-v9912-party
  cancel-in-progress: false
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract matching previous v9.9.11 APK and full compiled source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9912 /tmp/king9912old
          gh release download v9.9.11-parity-pass1              -p 'KING-Plus-v9.9.11-Parity-Pass1-Source.zip' -D /tmp/king9912old
          gh release download v9.9.11-parity-pass1              -p 'KING-Plus-v9.9.11-Parity-Pass1-TEST.apk' -D /tmp/king9912old
          unzip -q /tmp/king9912old/KING-Plus-v9.9.11-Parity-Pass1-Source.zip -d /tmp/king9912
          test -s /tmp/king9912/app/build.gradle
          test -s /tmp/king9912/app/src/main/java/com/kingplus/social/PartyActivity.java
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9912/app/kingplus-ci-debug.keystore
      - name: Apply transaction-backed Party and cross-phone fixes
        run: |
          set -euo pipefail
          python3 tools/king_v9912_party_parity.py /tmp/king9912
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/king9912/app/src/main/java/com/kingplus/social')
          s=(p/'PartyActivity.java').read_text()
          assert s.count('db.runTransaction(tx9912')==2
          assert 'View real profile' in s
          assert 'batch9912.commit()' in s
          assert 'isActivePresence967(boundRoom9912,boundUid9912,boundGeneration9912)' in s
          assert 'KingGiftSound993.setEnabled' in s
          assert 'private void openVideoRoom()' in s
          assert 'KingNative3DRoom.open(' in s
          assert 'PAID_VIP_ACTIVE = false' in (p/'KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (p/'KingRecharge974Activity.java').read_text()
          print('PASS: Party, safety, game/gift, 3D/video entry preservation checks')
          PY
      - name: Compile Android TEST APK
        working-directory: /tmp/king9912
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify upgradeable signed APK
        run: |
          set -euo pipefail
          NEW=/tmp/king9912/app/build/outputs/apk/debug/app-debug.apk
          OLD=/tmp/king9912old/KING-Plus-v9.9.11-Parity-Pass1-TEST.apk
          test -s "$NEW" && test -s "$OLD"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='191'"
          "$AAPT" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='190'"
          "$SIGNER" verify --print-certs "$OLD" > /tmp/old-key
          "$SIGNER" verify --print-certs "$NEW" > /tmp/new-key
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/old-key | head -1 || true)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/new-key | head -1 || true)"
          test -n "$a" && test "$a" = "$b" || { echo 'Invalid signing-key upgrade'; exit 1; }
          echo 'PASS: v9.9.11 -> v9.9.12 in-place signature and package compatibility'
      - name: Package APK and sanitized source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9912out
          cp /tmp/king9912/app/build/outputs/apk/debug/app-debug.apk              /tmp/king9912out/KING-Plus-v9.9.12-Party-Live-Sync-TEST.apk
          rm -f /tmp/king9912/app/kingplus-ci-debug.keystore
          cd /tmp/king9912
          zip -q -r /tmp/king9912out/KING-Plus-v9.9.12-Party-Live-Sync-Source.zip .              -x './app/build/*' './.gradle/*' './build/*' '*local.properties'
          sha256sum /tmp/king9912out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.9.12-Party-Sync-APK-and-Source
          path: /tmp/king9912out/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish TEST release (never call this complete parity)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v9.9.12-party-sync /tmp/king9912out/*             --target "$GITHUB_SHA" --prerelease             --title 'KING Plus v9.9.12 — Party Live Sync TEST'             --notes 'TEST APK. Real seat claiming and invitation use Firestore transactions: conflicting two-phone claims cannot overwrite seats or delete an existing seat before target admission; host/cohost can open the real member profile and kick seat/member as one batch without kicking host or self; stale role/invite listeners are ignored after switching rooms. Prior login/home, existing multiplayer games, free gifting, preview 3D, voice/video entry are retained. This is NOT copy-to-copy Bolo Hi or a final production app. Needs real two-phone acceptance, full original UI/3D avatar implementation, full RTC, game rules and billing setup.'
