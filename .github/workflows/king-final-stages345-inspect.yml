name: KING Final Five Sections - Inspect Games Gift VIP and Friends
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-final-stages345-inspect.yml'
      - 'ci/final_five/stages345_inspect.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - name: Restore latest full Android source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kinginspect /tmp/kinginspectzip
          gh run download 38128027011 -n KING-Plus-v9.9.8-Real-Friends-Source -D /tmp/kinginspectzip
          unzip -q /tmp/kinginspectzip/KING-Plus-v9.9.8-Real-Friends-Server-Sync-source.zip 'app/src/main/java/com/kingplus/social/*.java' -d /tmp/kinginspect
      - name: Inspect exact gameplay/VIP/social implementation
        run: python3 ci/final_five/stages345_inspect.py
