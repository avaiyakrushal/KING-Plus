name: KING v10.0.6 Me Home Party Visible Banners and Lifecycle Test APK
on:
  push:
    branches: [work/king-me-home-party-v10006]
    paths:
      - 'tools/me-home-party-v10006/**'
      - '.github/workflows/king-me-home-party-v10006.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover exact successfully built v10.0.5 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10006prev /tmp/king10006
          gh run download 38528187488 -n KING-v10005-Me-Home-Party-TEST-APK-and-Source -D /tmp/king10006prev
          unzip -q /tmp/king10006prev/KING-Plus-v10.0.5-Me-Home-Party-TEST-Source.zip -d /tmp/king10006
          cp app/kingplus-ci-debug.keystore /tmp/king10006/app/
          python3 tools/me-home-party-v10006/apply.py /tmp/king10006
      - name: Me, Home and Party source regression checks
        run: |
          set -euo pipefail
          python3 tools/me-home-party-v10006/source_checks.py /tmp/king10006
      - name: Banner and room-bound async callback tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10006tests
          javac -d /tmp/king10006tests /tmp/king10006/app/src/main/java/com/kingplus/social/KingRoomLifecycle10006.java tools/me-home-party-v10006/KingRoomLifecycle10006Test.java
          java -cp /tmp/king10006tests com.kingplus.social.KingRoomLifecycle10006Test
      - name: Full Android APK compile
        working-directory: /tmp/king10006
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify app ID version and unchanged signing certificate
        run: |
          set -euo pipefail
          old=/tmp/king10006prev/KING-Plus-v10.0.5-Me-Home-Party-TEST.apk
          new=/tmp/king10006/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='285'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and full updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10006out /tmp/king10006/tools/me-home-party-v10006
          cp tools/me-home-party-v10006/* /tmp/king10006/tools/me-home-party-v10006/
          cp .github/workflows/king-me-home-party-v10006.yml /tmp/king10006/.github/workflows/
          cp /tmp/king10006/app/build/outputs/apk/debug/app-debug.apk /tmp/king10006out/KING-Plus-v10.0.6-Me-Home-Party-TEST.apk
          rm -f /tmp/king10006/app/kingplus-ci-debug.keystore
          cd /tmp/king10006
          zip -qr /tmp/king10006out/KING-Plus-v10.0.6-Me-Home-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10006out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10006-Me-Home-Party-TEST-APK-and-Source
          path: /tmp/king10006out/*
          retention-days: 14
          if-no-files-found: error
