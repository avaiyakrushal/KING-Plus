name: KING v9.9.68 Real Party Gift Delivery After Network Return TEST
on:
  push:
    branches: [work/king-real-gift-reconnect-v9968]
    paths: ['tools/gift-reconnect-v9968/**', '.github/workflows/king-real-gift-reconnect-v9968.yml']
  pull_request:
    paths: ['tools/gift-reconnect-v9968/**', '.github/workflows/king-real-gift-reconnect-v9968.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore complete signed v9.9.59 Party Games Gift runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9968 /tmp/king9968prev
          gh run download 38383861125 -n KING-v9967-Live-Draw-Round-Integrity-TEST-APK-and-Source -D /tmp/king9968prev
          test -s /tmp/king9968prev/KING-Plus-v9.9.67-Live-Draw-Round-Integrity-TEST.apk
          unzip -q /tmp/king9968prev/KING-Plus-v9.9.67-Live-Draw-Round-Integrity-Source.zip -d /tmp/king9968
          grep -q 'versionCode 246' /tmp/king9968/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9968/app/kingplus-ci-debug.keystore
      - name: Recover genuine Gift burst and recipient ACK after real Party network restoration
        run: |
          set -euo pipefail
          python3 tools/gift-reconnect-v9968/apply.py /tmp/king9968
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9968')
          src=root/'app/src/main/java/com/kingplus/social'
          party=(src/'PartyActivity.java').read_text()
          for t in ('recoverGiftsAfterNetworkReturn9968()',
                    'KingGiftReturnGate9968.shouldRecover',
                    'Source.SERVER',
                    'isActivePresence967(expectedRoom,expectedUid,expectedGeneration)',
                    'retryDisplayedGiftReceipts9955()',
                    'recoverRecentGifts9942()',
                    'drainPendingGifts9944()',
                    'KingGiftReturnGate9968.validServerGift',
                    'confirmGiftReceived9941(room9962,event,uid9962)'):
            assert t in party,t
          assert party.index('// Resume truly displayed recipient ACK') > 0
          assert 'KingGiftReceiptDurable9962' in party
          assert 'KingGiftBurstBackpressure9963' in party
          assert 'KingPartyMicConsent9956' in party
          assert 'KingPartyVoiceReconnect9957' in party
          game=(src/'RoomGameActivity.java').read_text()
          for t in ('KingLiveDrawRound9967.allowed',
                    'KingPartyPrivateRoleLoad9966.needsRequest',
                    'KingTttFairRoster9960.pickPair',
                    'KingSocialVoteRoster9964.validBallot'):
            assert t in game,t
          assert 'versionCode 247' in (root/'app/build.gradle').read_text()
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          print('PASS reconnect retries actual SERVER Gift playback/ACK after live membership verification')
          PY
      - name: Pure Java tests Gift reconnection and all previous Party/Draw guards
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9968classes
          javac -d /tmp/king9968classes \
            /tmp/king9968/app/src/main/java/com/kingplus/social/KingGiftReturnGate9968.java \
            /tmp/king9968/app/src/main/java/com/kingplus/social/KingLiveDrawRound9967.java \
            /tmp/king9968/app/src/main/java/com/kingplus/social/KingPartyPrivateRoleLoad9966.java \
            /tmp/king9968/app/src/main/java/com/kingplus/social/KingPartyHiddenWord9965.java \
            /tmp/king9968/app/src/main/java/com/kingplus/social/KingSocialVoteRoster9964.java \
            tools/gift-reconnect-v9968/KingGiftReturnGate9968Test.java \
            tools/draw-integrity-v9967/KingLiveDrawRound9967Test.java \
            tools/draw-role-v9966/KingPartyPrivateRoleLoad9966Test.java \
            tools/social-secret-v9965/KingPartyHiddenWord9965Test.java \
            tools/game-launch-v9964/KingSocialVoteRoster9964Test.java
          java -cp /tmp/king9968classes com.kingplus.social.KingGiftReturnGate9968Test
          java -cp /tmp/king9968classes com.kingplus.social.KingLiveDrawRound9967Test
          java -cp /tmp/king9968classes com.kingplus.social.KingPartyPrivateRoleLoad9966Test
          java -cp /tmp/king9968classes com.kingplus.social.KingPartyHiddenWord9965Test
          java -cp /tmp/king9968classes com.kingplus.social.KingSocialVoteRoster9964Test
      - name: Install real Firestore emulator dependencies
        working-directory: /tmp/king9968/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Firebase real recipient Gift reconnect plus immutable no-fake ACK
        working-directory: /tmp/king9968
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/gift-reconnect-v9968/party-gift-after-network-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-gift-rejoin-9968 --config firebase-emulator.json \
            "node tests/firestore/party-gift-after-network-firestore.test.mjs"
      - name: Firestore two-account actual Draw canvas anti-spoof and stale round test
        working-directory: /tmp/king9968
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/draw-integrity-v9967/draw-round-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-draw-integrity-9967 --config firebase-emulator.json \
            "node tests/firestore/draw-round-firestore.test.mjs"
      - name: Firebase private Spy clues and persistent Draw word recipient security
        working-directory: /tmp/king9968
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/draw-integrity-v9967/private-words-valid-round-transition.test.mjs" tests/firestore/private-words-firestore.test.mjs
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-private-words-9965 --config firebase-emulator.json \
            "node tests/firestore/private-words-firestore.test.mjs"
      - name: Firestore multiuser Werewolf Spy ballot security and no stale finish
        working-directory: /tmp/king9968
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/game-launch-v9964/social-vote-security-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-vote-integrity-9964 --config firebase-emulator.json \
            "node tests/firestore/social-vote-security-firestore.test.mjs"
      - name: Firestore Party Ready true query with more than 50 stale unready
        working-directory: /tmp/king9968
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/live-party-v9963/ready-query-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-ready-filter-9963 --config firebase-emulator.json \
            "node tests/firestore/ready-query-firestore.test.mjs"
      - name: Firebase real Tic Tac Toe Ready off ghost and live pairing
        working-directory: /tmp/king9968
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/ttt-live-v9960/ttt-ready-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-ttt-9960 --config firebase-emulator.json \
            "node tests/firestore/ttt-ready-firestore.test.mjs"
      - name: Firestore emulator Host recipient-only private role and race protection
        working-directory: /tmp/king9968
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-host-role-v9961/host-role-private-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/host-role-private-firestore.test.mjs"
      - name: Regression real social game roles, privacy and simultaneous Host
        working-directory: /tmp/king9968
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/social-live-v9958/social-party-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-social-party-9958 --config firebase-emulator.json \
            "node tests/firestore/social-party-firestore.test.mjs"
      - name: Regression real Party Gift receipts and immutable game turns
        working-directory: /tmp/king9968
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          for test in gift-delivery-firestore.test.mjs immutable-rounds-firestore.test.mjs; do
            tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
              --project demo-king-live-ready-9959 --config firebase-emulator.json \
              "node tests/firestore/$test"
          done
      - name: Compile complete Android Party Games Gifting APK
        working-directory: /tmp/king9968
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify signed APK upgrade and zip integrity
        run: |
          set -euo pipefail
          old=/tmp/king9968prev/KING-Plus-v9.9.67-Live-Draw-Round-Integrity-TEST.apk
          new=/tmp/king9968/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='247'"
          "$signer" verify --print-certs "$old" >/tmp/cert-old
          "$signer" verify --print-certs "$new" >/tmp/cert-new
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-old | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/cert-new | head -1)"
          test -n "$a" && test "$a" = "$b"
          unzip -tq "$new" | tail -1
      - name: Package TEST APK and complete source, with no private signing key
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9968out
          cp /tmp/king9968/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9968out/KING-Plus-v9.9.68-Gift-Network-Reconnect-TEST.apk
          rm -f /tmp/king9968/app/kingplus-ci-debug.keystore
          cd /tmp/king9968
          zip -q -r /tmp/king9968out/KING-Plus-v9.9.68-Gift-Network-Reconnect-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
            './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9968out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9968-Gift-Network-Reconnect-TEST-APK-and-Source
          path: /tmp/king9968out/*
          retention-days: 14
          if-no-files-found: error
