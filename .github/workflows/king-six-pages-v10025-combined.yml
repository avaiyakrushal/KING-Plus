name: KING v10.0.25 One Combined Six-Pages Functional, Sharing and Safety TEST APK
on:
  push:
    branches: [work/king-six-pages-v10025-combined]
    paths:
      - 'tools/six-pages-v10025/**'
      - '.github/workflows/king-six-pages-v10025-combined.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.24 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10025prev /tmp/king10025
          gh run download 38615910176 -n KING-v10024-Six-Pages-TEST-APK-and-Source -D /tmp/king10025prev
          unzip -q /tmp/king10025prev/KING-Plus-v10.0.24-Six-Pages-TEST-Source.zip -d /tmp/king10025
          cp app/kingplus-ci-debug.keystore /tmp/king10025/app/
          python3 tools/six-pages-v10025/apply.py /tmp/king10025
      - name: v10.0.25 all six page feature regression checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king10025')
          src=root/'app/src/main/java/com/kingplus/social'
          me=(src/'MainActivity.java').read_text()
          home=(src/'CommunityHubActivity.java').read_text()
          party=(src/'PartyActivity.java').read_text()
          game=(src/'GamePlayActivity.java').read_text()
          discover=(src/'DiscoverActivity.java').read_text()
          inbox=(src/'InboxActivity.java').read_text()
          assert 'name.setSingleLine(false);name.setMaxLines(2)' in me
          assert 'new LinearLayout.LayoutParams(-1,dp(112))' in me
          assert 'new Intent(Intent.ACTION_SEND)' in home
          assert 'Share KING Moment' in home
          assert 'rankGeneration10025=presenceGeneration967' in party
          assert '.get(com.google.firebase.firestore.Source.SERVER)' in party
          assert '!memberSeen||user==null' in party
          assert 'New Werewolf Round' in game and 'New Spy Round' in game
          assert 'voted10025[0]=true;vote.setEnabled(false);' in game
          assert 'nextPublicProfilePage10025(' in discover
          assert 'Retry loading next 60 profiles' in discover
          assert 'pageLastServerDoc10025=snap.isEmpty()' in discover
          assert 'final DocumentSnapshot last10025=pageLastServerDoc10025;' in discover
          assert 'pageLastServerDoc10025=snap10025.getDocuments()' in discover
          assert 'No KING profile found for this UID' in inbox
          assert 'Reopen Messages with your current KING account' in inbox
          assert 'versionCode 304;' in (root/'app/build.gradle').read_text()
          assert '10.0.25-six-page-combined-test' in (root/'app/build.gradle').read_text()
          print('PASS 6-page v10.0.25 Me/Home/Party/Game/Discover/Messages acceptance')
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10025tests
          javac -d /tmp/king10025tests /tmp/king10025/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10025tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10025/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10025
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10013/role-safety.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs && node tests/firestore/role-safety.test.mjs"
      - name: Combined Me/Home/Party 12 real-data security scenarios
        working-directory: /tmp/king10025
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10019/rtc-membership-current-rules.test.mjs" tests/firestore/rtc-membership-firestore.test.mjs
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10020/mute-all-contract.test.mjs" tests/firestore/mute-all-contract.test.mjs
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-10020-combined --config firebase-emulator.json "node tests/firestore/visitor-pages-firestore.test.mjs && node tests/firestore/me-gallery-live-firestore.test.mjs && node tests/firestore/moments-cross-device-firestore.test.mjs && node tests/firestore/mic-consent-firestore.test.mjs && node tests/firestore/rtc-membership-firestore.test.mjs && node tests/firestore/room-game-gift.test.mjs && node tests/firestore/host-role-private-firestore.test.mjs && node tests/firestore/party-room-vote-firestore.test.mjs && node tests/firestore/mute-all-contract.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10025
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10025prev/KING-Plus-v10.0.24-Six-Pages-TEST.apk
          new=/tmp/king10025/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='304'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10025out /tmp/king10025/tools/six-pages-v10025
          cp tools/six-pages-v10025/* /tmp/king10025/tools/six-pages-v10025/
          cp .github/workflows/king-six-pages-v10025-combined.yml /tmp/king10025/.github/workflows/
          cp /tmp/king10025/app/build/outputs/apk/debug/app-debug.apk /tmp/king10025out/KING-Plus-v10.0.25-Six-Pages-TEST.apk
          rm -f /tmp/king10025/app/kingplus-ci-debug.keystore
          cd /tmp/king10025
          zip -qr /tmp/king10025out/KING-Plus-v10.0.25-Six-Pages-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10025out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10025-Six-Pages-TEST-APK-and-Source
          path: /tmp/king10025out/*
          retention-days: 14
          if-no-files-found: error
