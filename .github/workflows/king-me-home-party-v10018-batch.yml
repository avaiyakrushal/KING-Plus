name: KING v10.0.18 Combined Me Home Party Full Batch TEST APK
on:
  push:
    branches: [work/king-me-home-party-v10018-batch]
    paths:
      - 'tools/me-home-party-v10018/**'
      - '.github/workflows/king-me-home-party-v10018-batch.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.17 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10018prev /tmp/king10018
          gh run download 38572244385 -n KING-v10017-Me-Home-Party-TEST-APK-and-Source -D /tmp/king10018prev
          unzip -q /tmp/king10018prev/KING-Plus-v10.0.17-Me-Home-Party-TEST-Source.zip -d /tmp/king10018
          cp app/kingplus-ci-debug.keystore /tmp/king10018/app/
          python3 tools/me-home-party-v10018/apply.py /tmp/king10018
      - name: v10.0.18 full Me Home Party multi-feature regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king10018')
          src=r/'app/src/main/java/com/kingplus/social'
          me=(src/'MainActivity.java').read_text()
          social=(src/'SocialActivity.java').read_text()
          home=(src/'CommunityHubActivity.java').read_text()
          party=(src/'PartyActivity.java').read_text()
          assert me.count('initialSocialTab10018')>=2
          assert 'meHostedRoomsHost10018' in me
          assert social.count('initialSocialTab10018')>=1
          assert all('load'+n+'()' in social for n in ['Followers','Following','Friends'])
          assert 'loadOlderMoments10018(' in home
          assert '.startAfter(cursor10018).limit(80)' in home
          assert 'Load Moments older than the latest 320' in home
          assert 'topic10018.equalsIgnoreCase(topicRow10018)' in home
          assert 'uid.equals(me.getUid())&&"Moments".equals(selected)' in home
          assert 'loadGiftHistoryPage10018(' in party
          assert 'Load earlier room gift events' in party
          assert 'tx10018.delete(roleRef10018)' in party
          assert 'isActivePresence967(room10018,owner10018,generation10018)' in party
          assert 'displayNames10018.put(uid10018,n)' in party
          assert 'v==null||v<=0' in party
          assert 'limit(250)' in party
          assert 'versionCode 297;' in (r/'app/build.gradle').read_text()
          print('PASS batch Me/Home/Party source assertions and 297')
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10018tests
          javac -d /tmp/king10018tests /tmp/king10018/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10018tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10018/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10018
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10013/role-safety.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs && node tests/firestore/role-safety.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10018
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10018prev/KING-Plus-v10.0.17-Me-Home-Party-TEST.apk
          new=/tmp/king10018/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='297'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10018out /tmp/king10018/tools/me-home-party-v10018
          cp tools/me-home-party-v10018/* /tmp/king10018/tools/me-home-party-v10018/
          cp .github/workflows/king-me-home-party-v10018-batch.yml /tmp/king10018/.github/workflows/
          cp /tmp/king10018/app/build/outputs/apk/debug/app-debug.apk /tmp/king10018out/KING-Plus-v10.0.18-Me-Home-Party-TEST.apk
          rm -f /tmp/king10018/app/kingplus-ci-debug.keystore
          cd /tmp/king10018
          zip -qr /tmp/king10018out/KING-Plus-v10.0.18-Me-Home-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10018out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10018-Me-Home-Party-TEST-APK-and-Source
          path: /tmp/king10018out/*
          retention-days: 14
          if-no-files-found: error
