name: KING v10.0.19 Three-Page Integrated Acceptance Gates
on:
  push:
    branches: [work/king-me-home-party-v10019-combined]
    paths:
      - '.github/workflows/king-v10019-integrated-acceptance.yml'
      - 'tools/me-home-party-v10019/integrated-acceptance*'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  live-cloud-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Fetch exact v10.0.19 signed APK and complete source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-v10019-release /tmp/king-v10019-source
          gh run download 38579739591 -n KING-v10019-Me-Home-Party-TEST-APK-and-Source -D /tmp/king-v10019-release
          unzip -q /tmp/king-v10019-release/KING-Plus-v10.0.19-Me-Home-Party-TEST-Source.zip -d /tmp/king-v10019-source
          unzip -t /tmp/king-v10019-release/KING-Plus-v10.0.19-Me-Home-Party-TEST.apk | tail -1
          unzip -t /tmp/king-v10019-release/KING-Plus-v10.0.19-Me-Home-Party-TEST-Source.zip | tail -1
          grep -F "versionCode 298;" /tmp/king-v10019-source/app/build.gradle
      - name: Install integration test dependencies
        working-directory: /tmp/king-v10019-source/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Me Home Party multi-client Firebase contract tests
        working-directory: /tmp/king-v10019-source
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-combined-10019 --config firebase-emulator.json "node tests/firestore/visitor-pages-firestore.test.mjs && node tests/firestore/me-gallery-live-firestore.test.mjs && node tests/firestore/moments-cross-device-firestore.test.mjs && node tests/firestore/mic-consent-firestore.test.mjs && node tests/firestore/rtc-membership-firestore.test.mjs && node tests/firestore/room-game-gift.test.mjs && node tests/firestore/host-role-private-firestore.test.mjs && node tests/firestore/party-room-vote-firestore.test.mjs"
      - name: Publish functional coverage and explicit real-device blockers
        if: always()
        run: |
          mkdir -p /tmp/king-v10019-report
          cat > /tmp/king-v10019-report/README.txt <<'TXT'
          KING Plus v10.0.19 Me+Home+Party integrated acceptance
          APK and source: successful Android Build 38579739591, versionCode 298.
          Checks: visitor paging and private reads, live gallery, 2-device Moments likes,
          mic consent, membership, paired game/gift events, game privacy and voting.
          This tests emulator contracts only; it does not prove Android phone
          microphone or camera quality, production provider login, Play payments,
          UI parity, gift animations or real two-device RTC.
          Check workflow step status before treating these checks as passed.
          TXT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KING-v10019-Integrated-Acceptance-Report
          path: /tmp/king-v10019-report/README.txt
          retention-days: 14
