name: KING Final Five Sections - Stage 2 Party Room Compile Only
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-final-stage2-compile.yml'
      - 'ci/final_five/stage2_party_guard.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: king-final-five-stage2
  cancel-in-progress: true
jobs:
  stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signed stable 9.9.8 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/finalp /tmp/finalp-src
          gh run download 38128027011 -n KING-Plus-v9.9.8-Real-Friends-Source -D /tmp/finalp-src
          unzip -q /tmp/finalp-src/KING-Plus-v9.9.8-Real-Friends-Server-Sync-source.zip -d /tmp/finalp
      - name: Compose Stage 1 + Stage 2 patches IN ORDER
        run: |
          set -euo pipefail
          python3 -m py_compile ci/final_five/stage1_patch.py ci/final_five/stage1_video_guard.py ci/final_five/stage2_party_guard.py
          python3 ci/final_five/stage1_patch.py /tmp/finalp
          python3 ci/final_five/stage1_video_guard.py /tmp/finalp
          python3 ci/final_five/stage2_party_guard.py /tmp/finalp
      - name: Verify Party Room join and prior 3D/video security remain intact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/finalp/app/src/main/java/com/kingplus/social')
          party=(b/'PartyActivity.java').read_text()
          video=(b/'KingMultiVideoActivity.java').read_text()
          model=(b/'KingNative3DRoom.java').read_text()
          assert 'document(directRoomId).get(com.google.firebase.firestore.Source.SERVER)' in party
          assert 'Room invite check failed:' in party
          assert 'items.add("🌐 3D World")' in party
          assert 'checkVideoRoomAccess998(' in video
          assert 'collection("members").document(uid998)' in video
          assert 'setAudioMuted(true)' in video
          assert 'setVideoMuted(true)' in video
          assert 'GLES20.GL_DEPTH_TEST' in model
          assert 'listener[0].remove()' in model
          assert 'KingRoomDice997.open(' in party
          assert 'KingFreeGift973.allowed(' in party
          assert 'KingEmojiAccess993.canSend(' in party
          assert (b/'SocialActivity.java').exists()
          assert 'PAID_VIP_ACTIVE = false' in (b/'KingPremiumAccess981.java').read_text()
          print('PASS composable stages 1+2 and protected existing Party/Video/Gifts')
          PY
      - name: Compile BOTH stages without releasing an interim APK
        working-directory: /tmp/finalp
        run: gradle :app:assembleDebug --no-daemon
      - name: Confirm build, not final release
        run: |
          test -s /tmp/finalp/app/build/outputs/apk/debug/app-debug.apk
          echo "PASS 1+2 staged Android compilation; final 5-section APK NOT published"
      - name: Keep requirements visible
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Integrated five-section build — in progress
          - Stage 1: original native OpenGL ES 3D room + Firebase live seats; existing Multi Video guarded by real Firebase member check
          - Stage 2: direct friend Party invites query live SERVER, never trust cached/closed rooms
          - Stages 3–5: multiplayer full parity, cinematic VIP/Gifts, Login/Friends full functionality and external provider onboarding remain pending
          - Two real phones, official video provider, original 3D assets and secure billing still needed
          - **No interim APK and no claim of full completion**
          EOF
