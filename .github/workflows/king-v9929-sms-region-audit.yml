name: KING Plus v9.9.29 - India SMS Phone OTP Production Readiness
on:
  push:
    branches: [work/king-v9929-live-avatar-motion]
    paths: ['.github/workflows/king-v9929-sms-region-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-phone-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only Firebase Identity Toolkit SMS region policy and phone provider
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          mkdir -p /tmp/king-sms-policy
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/king-sms-service.json"
          jq -e '.project_id=="king-plus-2f365" and .type=="service_account"' "$RUNNER_TEMP/king-sms-service.json" >/dev/null
          cd /tmp/king-sms-policy
          npm init -y >/dev/null
          npm install google-auth-library@10 --no-audit --no-fund >/dev/null
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/king-sms-service.json" node <<'NODE'
          const {GoogleAuth}=require('google-auth-library');
          (async()=>{
            const client=await new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']}).getClient();
            const c=(await client.request({url:'https://identitytoolkit.googleapis.com/admin/v2/projects/king-plus-2f365/config'})).data;
            const policy=c.smsRegionConfig||{};
            const allow=policy.allowlistOnly?.allowedRegions;
            const denied=policy.allowByDefault?.disallowedRegions;
            const indiaEnabled=Array.isArray(allow)?allow.includes('IN'):
              Array.isArray(denied)?!denied.includes('IN'):null;
            console.log('KING_SMS_AUDIT Phone provider enabled:',c.signIn?.phoneNumber?.enabled===true);
            console.log('KING_SMS_AUDIT SMS region policy:',Array.isArray(allow)?'ALLOWLIST':Array.isArray(denied)?'DENYLIST':'UNSPECIFIED');
            console.log('KING_SMS_AUDIT India allowed by explicit SMS region policy:',indiaEnabled===null?'UNVERIFIED':indiaEnabled);
            console.log('KING_SMS_AUDIT Explicit region count:',(Array.isArray(allow)?allow:denied||[]).length);
            console.log('KING_SMS_AUDIT No SMS was sent, no test phone was signed in and no billing settings changed.');
            console.log('KING_SMS_AUDIT Real SMS cost, carrier deliverability, Play Integrity and reCAPTCHA still require production acceptance.');
          })().catch(e=>{console.error('KING_SMS_AUDIT_FAILED:',e.response?.status||e.code||e.message);process.exitCode=1});
          NODE
      - name: Remove service-account copy
        if: always()
        run: rm -f "$RUNNER_TEMP/king-sms-service.json"
