name: KING v10.0.28 One Integrated Six-Page Functional TEST APK
on:
  push:
    branches: [work/king-six-pages-v10028-integrated]
    paths:
      - 'tools/six-pages-v10028/**'
      - '.github/workflows/king-six-pages-v10028-integrated.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.27 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10028prev /tmp/king10028
          gh run download 38667516923 -n KING-v10027-Party-Room-TEST-APK-and-Source -D /tmp/king10028prev
          unzip -q /tmp/king10028prev/KING-Plus-v10.0.27-Party-Room-TEST-Source.zip -d /tmp/king10028
          cp app/kingplus-ci-debug.keystore /tmp/king10028/app/
          python3 tools/six-pages-v10028/apply.py /tmp/king10028
      - name: v10.0.28 six-page feature source regression checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king10028')
          src=r/'app/src/main/java/com/kingplus/social'
          me=(src/'MainActivity.java').read_text()
          home=(src/'CommunityHubActivity.java').read_text()
          party=(src/'PartyActivity.java').read_text()
          game=(src/'GamePlayActivity.java').read_text()
          discover=(src/'DiscoverActivity.java').read_text()
          inbox=(src/'InboxActivity.java').read_text()
          assert 'more10015.getParent()!=host' in me
          assert 'progress10015.setEnabled(false)' in me
          assert 'older10018.getParent()!=feed' in home
          assert 'if(roomId!=null)leaveRoom();' in party
          assert 'KingNav.openRoot(this,tab)' in party
          assert 'memoryTicket10028!=memoryRound10028' in game
          assert 'publicCursors10028.put(grid10025,nextDocs10025.get(nextDocs10025.size()-1))' in discover
          assert 'showDiscoverProfiles10028(' in discover
          assert 'followAccountCurrent10028(' in discover
          assert 'b.setEnabled(false);b.setText("Saving…")' in discover
          assert 'Cloud sync unavailable • tap to retry' in inbox
          assert 'if(inboxState940.contains("retry"))' in inbox
          assert 'versionCode 307;' in (r/'app/build.gradle').read_text()
          assert '10.0.28-six-pages-functional-test' in (r/'app/build.gradle').read_text()
          print('PASS Me Home Party Game Discover and Messages integrated v10.0.28 source regressions')
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10028tests
          javac -d /tmp/king10028tests /tmp/king10028/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10028tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10028/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10028
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10013/role-safety.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs && node tests/firestore/role-safety.test.mjs"
      - name: Combined Me/Home/Party 12 real-data security scenarios
        working-directory: /tmp/king10028
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10019/rtc-membership-current-rules.test.mjs" tests/firestore/rtc-membership-firestore.test.mjs
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10020/mute-all-contract.test.mjs" tests/firestore/mute-all-contract.test.mjs
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-10020-combined --config firebase-emulator.json "node tests/firestore/visitor-pages-firestore.test.mjs && node tests/firestore/me-gallery-live-firestore.test.mjs && node tests/firestore/moments-cross-device-firestore.test.mjs && node tests/firestore/mic-consent-firestore.test.mjs && node tests/firestore/rtc-membership-firestore.test.mjs && node tests/firestore/room-game-gift.test.mjs && node tests/firestore/host-role-private-firestore.test.mjs && node tests/firestore/party-room-vote-firestore.test.mjs && node tests/firestore/mute-all-contract.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10028
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10028prev/KING-Plus-v10.0.27-Party-Room-TEST.apk
          new=/tmp/king10028/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='307'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10028out /tmp/king10028/tools/six-pages-v10028
          cp tools/six-pages-v10028/* /tmp/king10028/tools/six-pages-v10028/
          cp .github/workflows/king-six-pages-v10028-integrated.yml /tmp/king10028/.github/workflows/
          cp /tmp/king10028/app/build/outputs/apk/debug/app-debug.apk /tmp/king10028out/KING-Plus-v10.0.28-Six-Pages-TEST.apk
          rm -f /tmp/king10028/app/kingplus-ci-debug.keystore
          cd /tmp/king10028
          zip -qr /tmp/king10028out/KING-Plus-v10.0.28-Six-Pages-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10028out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10028-Six-Pages-TEST-APK-and-Source
          path: /tmp/king10028out/*
          retention-days: 14
          if-no-files-found: error
