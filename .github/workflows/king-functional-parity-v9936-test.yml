name: KING v9.9.36 Real Party Room Password and Invite Behavior
on:
  push:
    branches: [work/king-functional-parity-v9936]
    paths: ['tools/functional-parity-v9936/**', '.github/workflows/king-functional-parity-v9936-test.yml']
  pull_request:
    paths: ['tools/functional-parity-v9936/**', '.github/workflows/king-functional-parity-v9936-test.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-real-functionality:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore actual signed v9.9.35 full source and APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9936 /tmp/king9936prev
          gh run download 38293584474 -n KING-v9935-8680-Drawables-TEST-APK-and-Source -D /tmp/king9936prev
          unzip -q /tmp/king9936prev/KING-Plus-v9.9.35-8680-Drawables-Source.zip -d /tmp/king9936
          test -s /tmp/king9936prev/KING-Plus-v9.9.35-8680-Drawables-TEST.apk
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9936/app/kingplus-ci-debug.keystore
      - name: Implement actual server-authoritative room access revocation
        run: |
          set -euo pipefail
          python3 tools/functional-parity-v9936/apply.py /tmp/king9936
          cp tools/functional-parity-v9936/functional-access.test.mjs /tmp/king9936/tests/firestore/
          node --check /tmp/king9936/functions/v3.js
          node --test /tmp/king9936/functions/play-purchase-service.test.js
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/king9936')
          j=(r/'app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          f=(r/'firestore.rules').read_text()
          assert 'roomEntryEpoch9936' in j
          assert 'validCurrentPasswordProof9936()' in f
          assert 'entryEpoch' in j
          assert 'versionCode 215' in (r/'app/build.gradle').read_text()
          assert 'LIVE_RECHARGE = false' in (r/'app/src/main/java/com/kingplus/social/KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (r/'app/src/main/java/com/kingplus/social/KingPremiumAccess981.java').read_text()
          print('PASS actual Party Room logic uses epoch-scoped access; paid billing remains OFF')
          PY
      - name: Install actual Firestore test runner
        working-directory: /tmp/king9936/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Run two-user Firestore password and invite acceptance
        working-directory: /tmp/king9936
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec \
            --only firestore --project demo-king-room-v9936 --config firebase-emulator.json \
            "node tests/firestore/functional-access.test.mjs"
      - name: Run existing entrance and purchase rules regressions
        working-directory: /tmp/king9936
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec \
            --only firestore --project demo-king-entrance-9931 --config firebase-emulator.json \
            "node tests/firestore/entrance-firestore.test.mjs"
      - name: Compile full KING Android app
        working-directory: /tmp/king9936
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify same signer, real version upgrade and preserved graphics
        run: |
          set -euo pipefail
          old=/tmp/king9936prev/KING-Plus-v9.9.35-8680-Drawables-TEST.apk
          new=/tmp/king9936/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='214'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='215'"
          "$signer" verify --print-certs "$old" > /tmp/oldcert
          "$signer" verify --print-certs "$new" > /tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
          python3 - <<'PY'
          from zipfile import ZipFile
          old='/tmp/king9936prev/KING-Plus-v9.9.35-8680-Drawables-TEST.apk'
          new='/tmp/king9936/app/build/outputs/apk/debug/app-debug.apk'
          def counts(p):
            with ZipFile(p) as z: names=set(z.namelist())
            return (sum(n.startswith('res/layout') and n.endswith('.xml') for n in names),
                    sum(n.startswith('res/drawable') and n.endswith(('.xml','.png','.webp')) for n in names))
          print('old:',counts(old),'new:',counts(new))
          assert counts(old)==counts(new)==(4065,8680)
          PY
      - name: Package tested APK and clean full source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9936out
          cp /tmp/king9936/app/build/outputs/apk/debug/app-debug.apk /tmp/king9936out/KING-Plus-v9.9.36-Party-Access-Fix-TEST.apk
          rm -f /tmp/king9936/app/kingplus-ci-debug.keystore
          cd /tmp/king9936
          zip -q -r /tmp/king9936out/KING-Plus-v9.9.36-Party-Access-Fix-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
               './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9936out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9936-Party-Access-TEST-APK-and-Source
          path: /tmp/king9936out/*
          retention-days: 14
          if-no-files-found: error
