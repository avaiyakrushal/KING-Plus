name: KING v10.0.31 Six Pages Live Account and Party Reliability TEST APK
on:
  push:
    branches: [work/king-six-pages-v10031-live-reliability]
    paths:
      - 'tools/six-pages-v10031/**'
      - '.github/workflows/king-six-pages-v10031-live-reliability.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.30 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10031prev /tmp/king10031
          gh run download 38673012266 -n KING-v10030-Six-Pages-TEST-APK-and-Source -D /tmp/king10031prev
          unzip -q /tmp/king10031prev/KING-Plus-v10.0.30-Six-Pages-TEST-Source.zip -d /tmp/king10031
          cp app/kingplus-ci-debug.keystore /tmp/king10031/app/
          python3 tools/six-pages-v10031/apply.py /tmp/king10031
      - name: v10.0.31 six-page runtime state and gameplay regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king10031')
          src=root/'app/src/main/java/com/kingplus/social'
          me=(src/'MainActivity.java').read_text()
          home=(src/'CommunityHubActivity.java').read_text()
          party=(src/'PartyActivity.java').read_text()
          game=(src/'GamePlayActivity.java').read_text()
          discover=(src/'DiscoverActivity.java').read_text()
          inbox=(src/'InboxActivity.java').read_text()
          assert 'ownProfileMedia10031' in me and 'currentProfileOwner10031' in me
          assert 'getString("firebase_uid","")' in me
          assert 'me=signed10031;pendingMomentAccount10013=null' in home
          assert 'momentsQueryLimit10000=80;momentsDisplayLimit10000=40;' in home
          assert 'if(isFinishing()&&roomId!=null){' in party
          assert 'clearListeners();unregisterMember();stopInRoomVoice940(true);' in party
          assert 'New Bingo Card' in game and 'New Zoo Safari' in game
          assert 'New Domino Chain' in game and 'score[0]>=5' in game
          assert 'rankingCurrent10031(' in discover
          assert '.get(com.google.firebase.firestore.Source.SERVER)' in discover
          assert 'members==null||members.size()!=2||!members.contains(me.getUid())' in inbox
          assert '++inboxListenerGeneration10030;' in inbox
          assert 'inboxStartedOnce10031' in inbox
          assert 'versionCode 310;' in (root/'app/build.gradle').read_text()
          assert '10.0.31-six-pages-live-account-reliability-test' in (root/'app/build.gradle').read_text()
          print('PASS KING v10.0.31 six-section dynamic account, room, ranking and game integrity checks')
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10031tests
          javac -d /tmp/king10031tests /tmp/king10031/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10031tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10031/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10031
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10013/role-safety.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs && node tests/firestore/role-safety.test.mjs"
      - name: Combined Me/Home/Party 12 real-data security scenarios
        working-directory: /tmp/king10031
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10019/rtc-membership-current-rules.test.mjs" tests/firestore/rtc-membership-firestore.test.mjs
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10020/mute-all-contract.test.mjs" tests/firestore/mute-all-contract.test.mjs
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-10020-combined --config firebase-emulator.json "node tests/firestore/visitor-pages-firestore.test.mjs && node tests/firestore/me-gallery-live-firestore.test.mjs && node tests/firestore/moments-cross-device-firestore.test.mjs && node tests/firestore/mic-consent-firestore.test.mjs && node tests/firestore/rtc-membership-firestore.test.mjs && node tests/firestore/room-game-gift.test.mjs && node tests/firestore/host-role-private-firestore.test.mjs && node tests/firestore/party-room-vote-firestore.test.mjs && node tests/firestore/mute-all-contract.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10031
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10031prev/KING-Plus-v10.0.30-Six-Pages-TEST.apk
          new=/tmp/king10031/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='310'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10031out /tmp/king10031/tools/six-pages-v10031
          cp tools/six-pages-v10031/* /tmp/king10031/tools/six-pages-v10031/
          cp .github/workflows/king-six-pages-v10031-live-reliability.yml /tmp/king10031/.github/workflows/
          cp /tmp/king10031/app/build/outputs/apk/debug/app-debug.apk /tmp/king10031out/KING-Plus-v10.0.31-Six-Pages-TEST.apk
          rm -f /tmp/king10031/app/kingplus-ci-debug.keystore
          cd /tmp/king10031
          zip -qr /tmp/king10031out/KING-Plus-v10.0.31-Six-Pages-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10031out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10031-Six-Pages-TEST-APK-and-Source
          path: /tmp/king10031out/*
          retention-days: 14
          if-no-files-found: error
