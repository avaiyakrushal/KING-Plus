name: Finalize KING Plus v2.2 source upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v22-upload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact ZIP
        run: |
          cat .upload_tmp/v22_part00.txt \
              .upload_tmp/v22_part01.txt \
              .upload_tmp/v22_part02.txt \
              .upload_tmp/v22_part03.txt \
              .upload_tmp/v22_part04.txt \
              .upload_tmp/v22_part05.txt \
            | base64 --decode > KING-Plus-v2.2-real-otp-source.zip
          test "$(stat -c%s KING-Plus-v2.2-real-otp-source.zip)" = "21307"
          unzip -t KING-Plus-v2.2-real-otp-source.zip
      - name: Commit ZIP and clean temporary upload files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KING-Plus-v2.2-real-otp-source.zip
          git rm -r .upload_tmp
          git rm .github/workflows/finalize-v22-upload.yml
          git commit -m "Upload KING Plus v2.2 real OTP source"
          git push origin main
