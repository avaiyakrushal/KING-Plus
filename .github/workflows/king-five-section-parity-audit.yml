name: Five-Section KING Plus Functional Parity Audit
on:
  push:
    branches: [work/reference-completion]
    paths:
      - '.github/workflows/king-five-section-parity-audit.yml'
      - 'ci/v998_integrated/**'
      - 'docs/king-plus-five-section-parity-v997.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reference-completion
      - name: Restore signed latest full Android source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-five-app /tmp/king-five-artifact
          gh run download 38124730942 -n KING-Plus-v9.9.7-Room-Admin-Profile-Games-Source -D /tmp/king-five-artifact
          unzip -q /tmp/king-five-artifact/KING-Plus-v9.9.7-Room-Admin-Profile-Games-source.zip -d /tmp/king-five-app
          test -s /tmp/king-five-app/app/src/main/java/com/kingplus/social/PartyActivity.java
      - name: Audit all five sections and produce honest report
        env:
          KING_PARITY_REPORT: /tmp/king-plus-five-section-audit.md
        run: |
          python3 -m py_compile ci/v998_integrated/feature_parity_audit.py
          python3 ci/v998_integrated/feature_parity_audit.py /tmp/king-five-app
          cat /tmp/king-plus-five-section-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep release gates independent of code presence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('/tmp/king-plus-five-section-audit.md').read_text()
          for k in ['3D','Live','Admin','Ludo','Dice','VIP','Follow','Phone OTP','Facebook','two']:
              assert k.lower() in t.lower(),k
          assert 'not verified' in t.lower()
          assert 'CODE DETECTED' in t
          print('PASS audit truthfulness: no completion claim without backend/device evidence')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-Five-Section-Functional-Parity-Audit
          path: /tmp/king-plus-five-section-audit.md
          retention-days: 30
          if-no-files-found: error
