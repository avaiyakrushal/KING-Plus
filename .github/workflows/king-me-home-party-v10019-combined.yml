name: KING v10.0.19 Combined Me Home Party Safety & Activity TEST APK
on:
  push:
    branches: [work/king-me-home-party-v10019-combined]
    paths:
      - 'tools/me-home-party-v10019/**'
      - '.github/workflows/king-me-home-party-v10019-combined.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.18 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10019prev /tmp/king10019
          gh run download 38577077302 -n KING-v10018-Me-Home-Party-TEST-APK-and-Source -D /tmp/king10019prev
          unzip -q /tmp/king10019prev/KING-Plus-v10.0.18-Me-Home-Party-TEST-Source.zip -d /tmp/king10019
          cp app/kingplus-ci-debug.keystore /tmp/king10019/app/
          python3 tools/me-home-party-v10019/apply.py /tmp/king10019
      - name: v10.0.19 combined three-page source regression gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king10019')
          src=root/'app/src/main/java/com/kingplus/social'
          me=(src/'MainActivity.java').read_text()
          home=(src/'CommunityHubActivity.java').read_text()
          party=(src/'PartyActivity.java').read_text()
          assert 'loadVisitorPage10019(' in me
          assert 'visitorsCurrent10019(' in me
          assert '↓ Next 50 visitors' in me
          assert 'q10019.startAfter(cursor10019)' in me
          assert 'deleteOwnedMoment10019(' in home
          assert 'owner10019.equals(live10019.getString("uid"))' in home
          assert 'tx10019.delete(ref10019)' in home
          assert 'history10018.removeView(more10018)' in home
          assert 'loadRoomActivityPage10019(' in party
          assert 'partyActivityCurrent10019(' in party
          assert 'loadRoomActivityPage10019(room10019,actor10019,next10019,page10019+1)' in party
          assert 'tx10019.delete(banRef10019)' in party
          assert 'java.util.Objects.equals(d.getTimestamp("createdAt"),current10019.getTimestamp("createdAt"))' in party
          assert 'setSeatLock10019(' in party
          assert 'tx10019.delete(ref10019)' in party
          assert 'isActivePresence967(room10019,actor10019,generation10019)' in party
          assert 'Gift Wall • Recent 100 events' in party
          assert 'versionCode 298;' in (root/'app/build.gradle').read_text()
          print('PASS v10.0.19 complete Me/Home/Party regression checks')
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10019tests
          javac -d /tmp/king10019tests /tmp/king10019/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10019tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10019/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10019
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10013/role-safety.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs && node tests/firestore/role-safety.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10019
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10019prev/KING-Plus-v10.0.18-Me-Home-Party-TEST.apk
          new=/tmp/king10019/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='298'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10019out /tmp/king10019/tools/me-home-party-v10019
          cp tools/me-home-party-v10019/* /tmp/king10019/tools/me-home-party-v10019/
          cp .github/workflows/king-me-home-party-v10019-combined.yml /tmp/king10019/.github/workflows/
          cp /tmp/king10019/app/build/outputs/apk/debug/app-debug.apk /tmp/king10019out/KING-Plus-v10.0.19-Me-Home-Party-TEST.apk
          rm -f /tmp/king10019/app/kingplus-ci-debug.keystore
          cd /tmp/king10019
          zip -qr /tmp/king10019out/KING-Plus-v10.0.19-Me-Home-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10019out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10019-Me-Home-Party-TEST-APK-and-Source
          path: /tmp/king10019out/*
          retention-days: 14
          if-no-files-found: error
