name: KING 16 Areas One Integrated Final Release Gate
on:
  push:
    branches: [work/king-integrated-final-release-gates]
    paths:
      - 'release/final-release-evidence.json'
      - 'tools/integrated-release/**'
      - '.github/workflows/king-integrated-final-gates.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-16-gates-and-no-false-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify every major Party Games Gifting Provider and Release requirement is tracked
        run: python3 tools/integrated-release/check_release.py --mode test
      - name: Regression check - no final release without all 16 independent proofs
        run: python3 tools/integrated-release/test_check_release.py
