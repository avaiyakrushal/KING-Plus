name: Build KING Plus v6.1.0 Party Parity APK

on:
  push:
    branches: [ 'build/v6.1.0-party-parity' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare proven v5.3.2 base
        run: bash tools/build_v530.sh

      - name: Apply v5.7.0 patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v570/patch.part00a ci/v570/patch.part00b ci/v570/patch.part00c ci/v570/patch.part01 \
            | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/v570.patch
          patch -p1 < /tmp/v570.patch
          grep -q "versionName '5.7.0'" app/build.gradle
          rm -rf app/build

      - name: Apply v6.0.0 full reference parity patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v600/patch.part00 ci/v600/patch.part01 ci/v600/patch.part02 \
            | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/v600.patch
          patch -p1 < /tmp/v600.patch
          grep -q "versionName '6.0.0'" app/build.gradle
          rm -rf app/build

      - name: Apply v6.1.0 Party parity fix
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < ci/v610/patch.b64 | base64 -d | gzip -dc > /tmp/v610.patch
          patch -p1 < /tmp/v610.patch
          grep -q "versionName '6.1.0'" app/build.gradle
          grep -q "versionCode 91" app/build.gradle
          grep -q 'Emoji & Stickers' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -q 'favorite_emojis_610' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -q 'Interactive Emoji' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -q 'Party Master Help' app/src/main/java/com/kingplus/social/PartyActivity.java
          rm -rf app/build

      - name: Build v6.1.0 debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_v610
          cp app/build/outputs/apk/debug/app-debug.apk release_v610/KING-Plus-v6.1.0-party-parity-no-billing-test-otp.apk
          sha256sum release_v610/KING-Plus-v6.1.0-party-parity-no-billing-test-otp.apk > release_v610/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v6.1.0-APK
          path: release_v610/*
          if-no-files-found: error
