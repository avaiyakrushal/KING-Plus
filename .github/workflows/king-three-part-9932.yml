name: KING Plus v9.9.32 Three-Part Feature TEST
on:
  push:
    branches: [work/king-party-3d-gifts-v9932]
    paths: ['tools/video-parity-v9932/**', '.github/workflows/king-three-part-9932.yml']
  pull_request:
    paths: ['tools/video-parity-v9932/**', '.github/workflows/king-three-part-9932.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover verified full 9.9.31 release and old signed APK
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9932 /tmp/king9932old
          gh run download 38280727873 -n KING-v9931-Video-Room-TEST-APK-and-Source -D /tmp/king9932old
          echo '63dfc8b2f264888afd09610ba23a7cba6033a0c42f232ac0023ca6dcbd4d5b62  /tmp/king9932old/KING-Plus-v9.9.31-Video-Room-Source.zip' | sha256sum -c -
          echo '4e427a8128208b59d1977ba067894309930a27d3d84a79a6a66cf36daefaf2cb  /tmp/king9932old/KING-Plus-v9.9.31-Video-Room-TEST.apk' | sha256sum -c -
          unzip -q /tmp/king9932old/KING-Plus-v9.9.31-Video-Room-Source.zip -d /tmp/king9932
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9932/app/kingplus-ci-debug.keystore
      - name: Apply all 3 original KING feature upgrades with fail-closed anchors
        run: |
          set -euo pipefail
          python3 tools/video-parity-v9932/apply.py /tmp/king9932
          node --check /tmp/king9932/functions/v3.js
          node --test /tmp/king9932/functions/play-purchase-service.test.js
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/king9932/app/src/main/java/com/kingplus/social')
          party=(src/'PartyActivity.java').read_text()
          stage=(src/'KingNative3DRoom.java').read_text()
          sound=(src/'KingGiftSound993.java').read_text()
          assert 'new KingGiftArtView' in party
          assert 'sendGiftQuantity' in party
          assert 'channelEntranceSettings9931' in party
          assert 'KingTapRace9932.score(taps[0],elapsed)' in party
          assert 'KingAvatarAnimation9932.smooth' in stage
          assert 'pending9932.pollFirst()' in sound
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'versionCode 211' in (Path('/tmp/king9932/app/build.gradle')).read_text()
          print('PASS original Party, 3D and Gift modules retained; paid wallet disabled')
          PY
      - name: Test real 3D interpolation and actual tap race rules
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9932classes
          javac -d /tmp/king9932classes \
            /tmp/king9932/app/src/main/java/com/kingplus/social/KingAvatarAnimation9932.java \
            /tmp/king9932/app/src/main/java/com/kingplus/social/KingTapRace9932.java \
            tools/video-parity-v9932/KingNewVisualAndGame9932Test.java
          java -cp /tmp/king9932classes com.kingplus.social.KingNewVisualAndGame9932Test
      - name: Compile complete Android APK
        working-directory: /tmp/king9932
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify signer and Android version upgrade
        run: |
          set -euo pipefail
          old=/tmp/king9932old/KING-Plus-v9.9.31-Video-Room-TEST.apk
          new=/tmp/king9932/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='210'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='211'"
          "$signer" verify --print-certs "$old" > /tmp/oldcert
          "$signer" verify --print-certs "$new" > /tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package TEST APK and source ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9932out
          cp /tmp/king9932/app/build/outputs/apk/debug/app-debug.apk /tmp/king9932out/KING-Plus-v9.9.32-Party-3D-Gifts-TEST.apk
          rm -f /tmp/king9932/app/kingplus-ci-debug.keystore
          cd /tmp/king9932
          zip -q -r /tmp/king9932out/KING-Plus-v9.9.32-Party-3D-Gifts-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
              './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9932out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9932-Party-3D-Gifts-TEST-APK-and-Source
          path: /tmp/king9932out/*
          retention-days: 14
          if-no-files-found: error
