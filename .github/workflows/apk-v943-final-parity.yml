name: Build KING Plus v9.4.3 Final Parity

on:
  push:
    branches: ['build/v9.4.3-final-parity']
    paths:
      - '.github/workflows/apk-v943-final-parity.yml'
      - 'ci/v943/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: king-plus-v943-final-parity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v9.4.3-final-parity

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recover verified v9.4.2 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v942 /tmp/src
          mkdir -p /tmp/v942 /tmp/src
          gh run download 37710930921 -n KING-Plus-v9.4.2-parity-runtime-source -D /tmp/v942
          test -f /tmp/v942/KING-Plus-v9.4.2-parity-runtime-source.zip
          unzip -q /tmp/v942/KING-Plus-v9.4.2-parity-runtime-source.zip -d /tmp/src

      - name: Apply v9.4.3 final-parity code pass
        run: python3 ci/v943/patch_v943.py /tmp/src

      - name: Parity stage gates
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          grep -F "versionCode 142; versionName '9.4.3-final-parity'" app/build.gradle
          grep -F 'profileUser943' app/src/main/java/com/kingplus/social/MainActivity.java
          grep -F 'requestCode==942' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'king_party_ambient_943' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'KingEffectBudget.allow(this,"gift")' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'KingEffectBudget.allow(this,"emoji")' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'openRoomGames740' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'audioPkPanel700' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'ktvQueuePanel' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -F 'KingLudoPracticeActivity' app/src/main/AndroidManifest.xml
          grep -F 'OFFLINE' app/src/main/java/com/kingplus/social/KingLudoLobbyActivity.java
          grep -F 'See More' app/src/main/java/com/kingplus/social/KingVipVisualActivity.java

      - name: Compile v9.4.3 APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon

      - name: Crash and route audit
        working-directory: /tmp/src
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('app/src/main')
          mt=(root/'AndroidManifest.xml').read_text(errors='ignore')
          declared=set(re.findall(r'<activity[^>]+android:name="\.([^"]+)"',mt))
          java=list((root/'java/com/kingplus/social').glob('*.java'))
          intents=set()
          raw=[]
          for p in java:
              t=p.read_text(errors='ignore')
              intents.update(re.findall(r'new Intent\(this,\s*([A-Za-z0-9_]+)\.class\)',t))
              for n,line in enumerate(t.splitlines(),1):
                  if 'getCurrentUser().getUid()' in line:
                      raw.append((p.name,n,line.strip()))
          missing=sorted(x for x in intents if x not in declared and x!='MainActivity')
          print('Missing manifest targets:',missing)
          print('Firebase current-user dereferences:',len(raw))
          for r in raw: print(r)
          if missing: raise SystemExit('Missing manifest targets')
          if any(f=='MainActivity.java' and n==1484 for f,n,_ in raw):
              raise SystemExit('Old unguarded MainActivity auth dereference still present')
          PY

      - name: Android lint
        working-directory: /tmp/src
        run: gradle :app:lintDebug --no-daemon

      - name: Package v9.4.3
        run: |
          set -euo pipefail
          cp /tmp/src/app/build/outputs/apk/debug/app-debug.apk /tmp/KING-Plus-v9.4.3-final-parity.apk
          cd /tmp/src
          zip -qr /tmp/KING-Plus-v9.4.3-final-parity-source.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.4.3-final-parity-APK
          path: /tmp/KING-Plus-v9.4.3-final-parity.apk
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v9.4.3-final-parity-source
          path: /tmp/KING-Plus-v9.4.3-final-parity-source.zip
          retention-days: 7
          if-no-files-found: error
