name: KING v9.9.48 Live Gift Audio Audit
on:
  push:
    branches: [work/king-live-gift-audio-v9948]
    paths: ['tools/gift-audio-v9948/audit.py','.github/workflows/king-gift-audio-audit-v9948.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download verified v9.9.47 full Android source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9948prior /tmp/king9948
          gh run download 38346929661 -n KING-v9947-Real-Round-Cancel-TEST-APK-and-Source -D /tmp/king9948prior
          unzip -q /tmp/king9948prior/KING-Plus-v9.9.47-Real-Round-Cancel-Source.zip -d /tmp/king9948
          grep -q 'versionCode 226' /tmp/king9948/app/build.gradle
      - name: Inspect original Party Gift audio code
        run: python3 tools/gift-audio-v9948/audit.py /tmp/king9948
