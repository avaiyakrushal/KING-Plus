name: Build KING Plus v8.5.2 Ludo board and emoji
on:
  push:
    branches: [ 'build/v8.5.2-ludo-board' ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recover verified v8.5.1 source and apply changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/src
          gh run download 37216336969 -n KING-Plus-v8.5.1-Online-Ludo -D /tmp/base
          unzip -q /tmp/base/KING-Plus-v8.5.1-online-ludo-source.zip -d /tmp/src
          cat ci/v852/update.part* | base64 -d > /tmp/update.zip
          unzip -qo /tmp/update.zip -d /tmp/src
          python3 ci/v852/fix_seat.py
      - name: Build Android APK
        working-directory: /tmp/src
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify and package
        working-directory: /tmp/src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, pathlib, shutil, hashlib
          root=pathlib.Path('.')
          out=pathlib.Path('/tmp/release');out.mkdir()
          apk=out/'KING-Plus-v8.5.2-ludo-board-emoji.apk'
          shutil.copy2('app/build/outputs/apk/debug/app-debug.apk',apk)
          with zipfile.ZipFile(apk) as z:
              assert len([n for n in z.namelist() if 'kp_emoji_' in n and n.endswith('.webp')])==67
          (out/'SHA256.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          with zipfile.ZipFile(out/'KING-Plus-v8.5.2-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if not p.is_file():continue
                  if any(x in p.parts for x in ['.git','.gradle','build','node_modules']):continue
                  if any(x.startswith('release') for x in p.parts):continue
                  if p.suffix in ['.apk','.zip','.log']:continue
                  z.write(p,p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v8.5.2
          path: /tmp/release/*
          if-no-files-found: error
