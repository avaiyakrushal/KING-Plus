name: KING v10.0.12 Me Home Party Live Safety TEST APK
on:
  push:
    branches: [work/king-me-home-party-v10012]
    paths:
      - 'tools/me-home-party-v10012/**'
      - '.github/workflows/king-me-home-party-v10012.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore exactly the signed v10.0.11 APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10012prev /tmp/king10012
          gh run download 38555450248 -n KING-v10011-Me-Home-Party-TEST-APK-and-Source -D /tmp/king10012prev
          unzip -q /tmp/king10012prev/KING-Plus-v10.0.11-Me-Home-Party-TEST-Source.zip -d /tmp/king10012
          cp app/kingplus-ci-debug.keystore /tmp/king10012/app/
          python3 tools/me-home-party-v10012/apply.py /tmp/king10012
      - name: Me Home Party source and version regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king10012')
          main=(root/'app/src/main/java/com/kingplus/social/MainActivity.java').read_text()
          community=(root/'app/src/main/java/com/kingplus/social/CommunityHubActivity.java').read_text()
          party=(root/'app/src/main/java/com/kingplus/social/PartyActivity.java').read_text()
          rules=(root/'firestore.rules').read_text()
          assert main.count('openVerifiedVisitors10012(account10003,visitorTicket10004)')==3
          assert 'ticket10012!=visitorDialogGeneration10004' in main
          assert 'relationshipRequestInFlight10012' in community
          assert 'if(!currentSection10003("Relationship",cpTicket10012,cpHost10012,cpAccount10012))return;' in community
          assert 'db.collection("relationships").document(pairId(a,b)).set(request10012)' in community
          assert 'The CP connection or request will be deleted for both members.' in community
          assert 'moderateMember10011(uidV530,nameV530,"Kick from mic seat "+seatNoV530,false);' in party
          assert 'Seat changed; refresh room before removing' in party
          assert 'Co-hosts cannot indirectly moderate another co-host' in rules
          assert "versionCode 291;" in (root/'app/build.gradle').read_text()
          print('PASS v10.0.12 source lifecycle and security guard checks')
          PY
      - name: Existing Me Home Party policy regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10012tests
          javac -d /tmp/king10012tests /tmp/king10012/app/src/main/java/com/kingplus/social/KingMeHomePartyPolicy10010.java tools/me-home-party-v10010/KingMeHomePartyPolicy10010Test.java
          java -cp /tmp/king10012tests com.kingplus.social.KingMeHomePartyPolicy10010Test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Firestore test dependencies
        working-directory: /tmp/king10012/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Two-account moderation and relationship security
        working-directory: /tmp/king10012
        env:
          CI: 'true'
        run: |
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10011/moderation-firestore.test.mjs" tests/firestore/
          cp "$GITHUB_WORKSPACE/tools/me-home-party-v10012/me-home-party-security.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore --project demo-king-atomic-moderation-v10011 --config firebase-emulator.json "node tests/firestore/moderation-firestore.test.mjs && node tests/firestore/me-home-party-security.test.mjs"
      - name: Full Android APK compile
        working-directory: /tmp/king10012
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify package/version and signing continuity
        run: |
          set -euo pipefail
          old=/tmp/king10012prev/KING-Plus-v10.0.11-Me-Home-Party-TEST.apk
          new=/tmp/king10012/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='291'"
          "$signer" verify --print-certs "$old" > /tmp/kingoldcert
          "$signer" verify --print-certs "$new" > /tmp/kingnewcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingoldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/kingnewcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package APK and exact updated source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king10012out /tmp/king10012/tools/me-home-party-v10012
          cp tools/me-home-party-v10012/* /tmp/king10012/tools/me-home-party-v10012/
          cp .github/workflows/king-me-home-party-v10012.yml /tmp/king10012/.github/workflows/
          cp /tmp/king10012/app/build/outputs/apk/debug/app-debug.apk /tmp/king10012out/KING-Plus-v10.0.12-Me-Home-Party-TEST.apk
          rm -f /tmp/king10012/app/kingplus-ci-debug.keystore
          cd /tmp/king10012
          zip -qr /tmp/king10012out/KING-Plus-v10.0.12-Me-Home-Party-TEST-Source.zip . -x '*node_modules/*' 'app/build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king10012out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v10012-Me-Home-Party-TEST-APK-and-Source
          path: /tmp/king10012out/*
          retention-days: 14
          if-no-files-found: error
