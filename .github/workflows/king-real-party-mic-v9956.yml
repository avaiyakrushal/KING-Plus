name: KING v9.9.56 Real Party Voice Mic Consent and Game Gift Regression TEST
on:
  push:
    branches: [work/king-party-mic-consent-v9956]
    paths: ['tools/mic-consent-v9956/**','.github/workflows/king-real-party-mic-v9956.yml']
  pull_request:
    paths: ['tools/mic-consent-v9956/**','.github/workflows/king-real-party-mic-v9956.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  compile-and-verify-real-party:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover verified complete v9.9.55 signed Android app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9956prev /tmp/king9956
          gh run download 38358528513 -n KING-v9955-Verified-Real-Gift-Receipt-TEST-APK-and-Source -D /tmp/king9956prev
          test -s /tmp/king9956prev/KING-Plus-v9.9.55-Real-Gift-Receipt-TEST.apk
          unzip -q /tmp/king9956prev/KING-Plus-v9.9.55-Real-Gift-Receipt-Source.zip -d /tmp/king9956
          grep -q 'versionCode 234' /tmp/king9956/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9956/app/kingplus-ci-debug.keystore
      - name: Fix Party Mic owner consent and Host mute-only Firestore rules
        run: |
          set -euo pipefail
          python3 tools/mic-consent-v9956/apply.py /tmp/king9956
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9956')
          p=root/'app/src/main/java/com/kingplus/social'
          s=(p/'PartyActivity.java').read_text()
          rules=(root/'firestore.rules').read_text()
          assert 'localMicConsent9956=true;' in s
          assert 'consentSeat9956=expectedSeat968;' in s
          assert 'if(!desiredMic968)revokeMicConsent9956();' in s
          assert 'setInlineAudioMuted940(!canTransmitMic9956());' in s
          assert '.setAudioMuted(!canTransmitMic9956())' in s
          assert 'boolean actualMuted9956=muted||!canTransmitMic9956();' in s
          assert 'if(onV530){toast("Only member may enable own Mic");return;}' in s
          assert 'request.resource.data.get(\'micOn\',false) == false' in rules
          assert 'request.resource.data.get(\'micOn\',false) != true' in rules
          assert 'KingGiftReceiptRetry9955' in s
          assert 'KingRoomAutoFinish9953' in (p/'RoomGameActivity.java').read_text()
          assert 'LIVE_RECHARGE = false' in (p/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (p/'KingPremiumAccess981.java').read_text()
          assert 'versionCode 235' in (root/'app/build.gradle').read_text()
          print('PASS only seat owner may activate real Jitsi Mic; Host+CoHost mute only; games/gifts preserved')
          PY
      - name: Unit-test actual mic consent including stale room/seat and Host mute
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9956classes
          javac -d /tmp/king9956classes \
            /tmp/king9956/app/src/main/java/com/kingplus/social/KingPartyMicConsent9956.java \
            tools/mic-consent-v9956/KingPartyMicConsent9956Test.java
          java -cp /tmp/king9956classes com.kingplus.social.KingPartyMicConsent9956Test
      - name: Install Firestore emulator test dependencies
        working-directory: /tmp/king9956/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Test Host, CoHost, Alice and Bob real Mic permissions with Firebase emulator
        working-directory: /tmp/king9956
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/mic-consent-v9956/mic-consent-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-mic-consent-9956 --config firebase-emulator.json \
            "node tests/firestore/mic-consent-firestore.test.mjs"
      - name: Verify ghost Ready excluded and real-player RPS still playable
        working-directory: /tmp/king9956
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/real-game-roster-v9952/live-roster-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-live-roster-9956 --config firebase-emulator.json \
            "node tests/firestore/live-roster-firestore.test.mjs"
      - name: Confirm real multiplayer Party/Host Cancel unchanged
        working-directory: /tmp/king9956
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-frozen-roster-9946 --config firebase-emulator.json \
            "node tests/firestore/frozen-ready-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-immutable-games-9943 --config firebase-emulator.json \
            "node tests/firestore/immutable-rounds-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-cancel-9947 --config firebase-emulator.json \
            "node tests/firestore/cancel-round-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-9938-live --config firebase-emulator.json \
            "node tests/firestore/room-game-gift.test.mjs"
      - name: Test recipient-only Gift receipt persistence and anti-impersonation
        working-directory: /tmp/king9956
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-gift-receipts-9941 --config firebase-emulator.json \
            "node tests/firestore/gift-delivery-firestore.test.mjs"
      - name: Compile full Android app
        working-directory: /tmp/king9956
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify signed upgrade identity and exact version
        run: |
          set -euo pipefail
          old=/tmp/king9956prev/KING-Plus-v9.9.55-Real-Gift-Receipt-TEST.apk
          new=/tmp/king9956/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='234'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='235'"
          "$signer" verify --print-certs "$old" >/tmp/oldcert
          "$signer" verify --print-certs "$new" >/tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package signed TEST APK and complete Android source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9956out
          cp /tmp/king9956/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9956out/KING-Plus-v9.9.56-Real-Party-Mic-TEST.apk
          rm -f /tmp/king9956/app/kingplus-ci-debug.keystore
          cd /tmp/king9956
          zip -q -r /tmp/king9956out/KING-Plus-v9.9.56-Real-Party-Mic-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
            './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9956out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9956-Real-Party-Mic-Consent-TEST-APK-and-Source
          path: /tmp/king9956out/*
          retention-days: 14
          if-no-files-found: error
