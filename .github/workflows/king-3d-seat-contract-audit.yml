name: KING Native 3D Real Seat Schema Audit
on:
  push:
    branches: [work/king-plus-complete-five-sections]
    paths:
      - '.github/workflows/king-3d-seat-contract-audit.yml'
      - 'ci/final_five/stage1_3d_seat_contract_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/king-plus-complete-five-sections
      - name: Restore verified integrated source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king-contract /tmp/king-contract-zip
          gh run download 38130689781 -n KING-Plus-Integrated-Five-Sections-In-Progress-Source -D /tmp/king-contract-zip
          unzip -q /tmp/king-contract-zip/KING-Plus-Five-Sections-IN-PROGRESS-source.zip -d /tmp/king-contract
      - name: Audit correct Firestore Room Seat schema
        run: python3 ci/final_five/stage1_3d_seat_contract_audit.py
