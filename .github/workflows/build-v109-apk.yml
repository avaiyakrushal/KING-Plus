name: KING Plus v10.0.109 Discover KTV APK
on:
  push:
    branches: [codex/build-v109-apk]
    paths:
      - .github/workflows/build-v109-apk.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore v10.0.107 source bundle
        run: |
          set -euo pipefail
          cat .codex-build/v107-part-* > /tmp/king-v107-source.zip
          mkdir -p /tmp/king-v108-source
          unzip -q /tmp/king-v107-source.zip -d /tmp/king-v108-source
          cp app/kingplus-ci-debug.keystore /tmp/king-v108-source/app/
      - name: Apply KTV discovery fix and verify source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king-v108-source')
          discover=root/'app/src/main/java/com/kingplus/social/DiscoverActivity.java'
          party=root/'app/src/main/java/com/kingplus/social/PartyActivity.java'
          gradle=root/'app/build.gradle'
          s=discover.read_text()
          old='addDiscoverEntrance940(row,"🎵","KTV","Sing & queue",()->startActivity(new Intent(this,PartyActivity.class)));'
          new='''addDiscoverEntrance940(row,"🎵","KTV","Sing & queue",()->{
                      Intent ktvLobby=new Intent(this,PartyActivity.class);
                      ktvLobby.putExtra("lobbyCategory","KTV");
                      startActivity(ktvLobby);
                  });'''
          assert s.count(old)==1
          discover.write_text(s.replace(old,new,1))
          s=party.read_text()
          old='        renderLobby("Hot");' + chr(10) + '        handlePartyIntent9989(getIntent());'
          new='''        String requestedLobbyCategory=safe(getIntent().getStringExtra("lobbyCategory"),"Hot");
          if(!KingPagePolicy10067.categories(requestedLobbyCategory).isEmpty())
              renderLobby(requestedLobbyCategory);
          else renderLobby("Hot");
          handlePartyIntent9989(getIntent());'''
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old='String[] names = {"Hot","Music","Chat","Love","Game","Event","Date","Video"};'
          assert s.count(old)==1
          party.write_text(s.replace(old,'String[] names = {"Hot","Music","KTV","Radio","Chat","Love","Family","Game","Event","Date","Video"};',1))
          s=gradle.read_text()
          old="versionCode 385; versionName '10.0.107-home-party-visual-polish'"
          assert s.count(old)==1
          gradle.write_text(s.replace(old,"versionCode 387; versionName '10.0.109-discover-party-categories'",1))
          assert 'ktvLobby.putExtra("lobbyCategory","KTV")' in discover.read_text()
          assert 'getStringExtra("lobbyCategory")' in party.read_text()
          assert 'String[] names = {"Hot","Music","KTV","Radio","Chat","Love","Family"' in party.read_text()
          print('PASS v10.0.109 Discover KTV route and Party lobby category')
          PY
      - name: Build Android debug APK
        run: gradle -p /tmp/king-v108-source :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify app package and version
        run: |
          set -euo pipefail
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          apk=/tmp/king-v108-source/app/build/outputs/apk/debug/app-debug.apk
          "$aapt" dump badging "$apk" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='387'" | grep "versionName='10.0.109-discover-party-categories'"
          mkdir -p /tmp/king-v109-output
          cp "$apk" /tmp/king-v109-output/KING-Plus-v10.0.109-Discover-Party.apk
          sha256sum /tmp/king-v109-output/*.apk
          rm -f /tmp/king-v108-source/app/kingplus-ci-debug.keystore
          cd /tmp/king-v108-source
          zip -qr /tmp/king-v109-output/KING-Plus-v10.0.109-Discover-Party-Source.zip . -x '*node_modules/*' '*/build/*' '*/.gradle/*' '.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v10.0.109-Discover-Party-APK
          path: /tmp/king-v109-output/*
          retention-days: 14
          if-no-files-found: error
