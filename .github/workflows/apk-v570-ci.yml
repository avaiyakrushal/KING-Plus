name: Build KING Plus v5.7.0 APK

on:
  push:
    branches: [ 'build/v5.7.0-from-v532' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare proven v5.3.2 base
        run: bash tools/build_v530.sh

      - name: Apply v5.7.0 source patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v570/patch.part00a ci/v570/patch.part00b ci/v570/patch.part00c ci/v570/patch.part01 \
            | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/v570.patch
          patch -p1 < /tmp/v570.patch
          grep -q "versionName '5.7.0'" app/build.gradle
          grep -q 'Party Master' app/src/main/java/com/kingplus/social/PartyActivity.java
          grep -q 'Multi Video' app/src/main/java/com/kingplus/social/PartyActivity.java
          rm -rf app/build

      - name: Build v5.7.0 debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_v570
          cp app/build/outputs/apk/debug/app-debug.apk release_v570/KING-Plus-v5.7.0-reference-parity-no-billing-test-otp.apk
          sha256sum release_v570/KING-Plus-v5.7.0-reference-parity-no-billing-test-otp.apk > release_v570/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v5.7.0-APK
          path: release_v570/*
          if-no-files-found: error
