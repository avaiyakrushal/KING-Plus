name: KING Plus v9.9.28 - Immersive 3D Avatar World TEST
on:
  push:
    branches: [work/king-v9928-immersive-3d-avatars]
    paths:
      - 'tools/v9928/**'
      - '.github/workflows/king-v9928-3d-world.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: king-v9928-avatar-world
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore last successfully compiled KING v9.9.27 full source and APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9928 /tmp/king9928previous
          gh release download v9.9.27-real-reaction -p 'KING-Plus-v9.9.27-Real-Reaction-Source.zip' -D /tmp/king9928previous
          gh release download v9.9.27-real-reaction -p 'KING-Plus-v9.9.27-Real-Reaction-TEST.apk' -D /tmp/king9928previous
          unzip -q /tmp/king9928previous/KING-Plus-v9.9.27-Real-Reaction-Source.zip -d /tmp/king9928
          test -s /tmp/king9928/app/src/main/java/com/kingplus/social/KingNative3DRoom.java
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9928/app/kingplus-ci-debug.keystore
      - name: Apply actual rounded procedural 3D character mesh and immersive stage
        run: |
          set -euo pipefail
          base64 -d tools/v9928/upgrade_3d_avatar.py.gz.b64 | gzip -d > /tmp/upgrade_king_3d9928.py
          echo '9e849f08a52d313ecb0da0838444d1f9d10f7f099c361b7b0868ee23e82b024c  /tmp/upgrade_king_3d9928.py' | sha256sum -c -
          python3 /tmp/upgrade_king_3d9928.py /tmp/king9928
      - name: Verify mesh geometry and all previous KING functionality retained
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import math
          root=Path('/tmp/king9928');src=root/'app/src/main/java/com/kingplus/social'
          s=(src/'KingNative3DRoom.java').read_text()
          party=(src/'PartyActivity.java').read_text()
          assert 'makeSphere9928(14,20)' in s
          assert 'sphere9928(x,head,z' in s
          assert 'sphere9928(x-.11f,head+.04f' in s
          assert s.count('dialog.setOnShowListener(')==1
          assert 'heightPixels*.94f' in s
          assert 'collection("seats")' in s
          assert 'addSnapshotListener((snapshot,error)->' in s
          assert 'requestRender()' in s
          assert 'KingPublicProfileActivity.class' in s
          assert all(k in party for k in ['openLiveKnife9923','openLiveChess9917','approveOrMoveMemberSeat9913','muteOwnedSeat9920','addRoyalHero9924(page)'])
          assert 'videoMatchIncoming9922' in (src/'KingMultiVideoActivity.java').read_text()
          assert 'KingSheepRace9925' in (src/'RoomGameActivity.java').read_text()
          assert 'KingReactionRules9927' in (src/'RoomGameActivity.java').read_text()
          assert 'NativeMeetBridge.verifyMembership' in (src/'VoiceWebActivity.java').read_text()
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          assert 'versionCode 207' in (root/'app/build.gradle').read_text()
          triangles=14*20*2
          assert triangles==560
          for a in [0,math.pi/4,math.pi/2,math.pi]:
            for phi in [0,math.pi/3,math.pi,2*math.pi]:
              x=math.sin(a)*math.cos(phi);y=math.cos(a);z=math.sin(a)*math.sin(phi)
              assert abs((x*x+y*y+z*z)-1)<1e-6
          print('PASS 3D spherical mesh, camera, Firebase seats and all KING existing features')
          PY
      - name: Build complete KING Plus 9.9.28 Android APK
        working-directory: /tmp/king9928
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK in-place upgrade signer, package and versionCode
        run: |
          set -euo pipefail
          OLD=/tmp/king9928previous/KING-Plus-v9.9.27-Real-Reaction-TEST.apk
          NEW=/tmp/king9928/app/build/outputs/apk/debug/app-debug.apk
          test -s "$OLD" && test -s "$NEW"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$OLD" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='206'"
          "$AAPT" dump badging "$NEW" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='207'"
          "$SIGNER" verify --print-certs "$OLD" >/tmp/king9928-old-cert
          "$SIGNER" verify --print-certs "$NEW" >/tmp/king9928-new-cert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9928-old-cert | head -1 || true)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/king9928-new-cert | head -1 || true)"
          test -n "$a" && test "$a" = "$b"
          echo 'PASS same signed application and safe higher version'
      - name: Package independently written APK and clean source ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9928out
          cp /tmp/king9928/app/build/outputs/apk/debug/app-debug.apk /tmp/king9928out/KING-Plus-v9.9.28-Immersive-3D-TEST.apk
          rm -f /tmp/king9928/app/kingplus-ci-debug.keystore
          cd /tmp/king9928
          zip -q -r /tmp/king9928out/KING-Plus-v9.9.28-Immersive-3D-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' '*.log' \
               'app/build/*' './app/build/*' '*/build/*' './.gradle/*' '*/.gradle/*' \
               '*.apk' '*.aab' '*.jks' '*.keystore' '*local.properties' '*.zip'
          BYTES="$(stat -c%s /tmp/king9928out/KING-Plus-v9.9.28-Immersive-3D-Source.zip)"
          test "$BYTES" -gt 100000 && test "$BYTES" -lt 10000000
          sha256sum /tmp/king9928out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9928-Immersive-3D-TEST-APK-and-Source
          path: /tmp/king9928out/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish verified 3D upgrade as TEST, not falsely as Final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v9.9.28-immersive-3d /tmp/king9928out/* \
            --target "$GITHUB_SHA" --prerelease \
            --title 'KING Plus v9.9.28 — Improved 3D Avatar World TEST' \
            --notes 'Original KING procedural 3D room upgrade: near-full-screen 3D World, 560-triangle cached sphere mesh, rounded faces/heads, hairstyle, eyes, nose, animated limbs, color-consistent user avatars and Firebase-synced real seats, profile taps, orbit/pinch gestures. Bolo Hi proprietary 3D meshes are not copied. All prior KING Royal Neon, Party Mic/Host, 6-seat Video, real Chess, Flying Knife, Sheep, Reaction, consent and RTC membership guards retained. Android compilation, prior signing certificate, package and version upgrade verified. This is NOT a fully rigged animated Bolo Hi Avatar World and NOT production Final. Production Firestore/RTC, two-device physical calls, external OTP/Meta providers and verified Play recharge remain blocked on owner/provider provisioning and test devices; no fake payment or OTP.'
