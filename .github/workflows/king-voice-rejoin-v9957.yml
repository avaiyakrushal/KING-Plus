name: KING v9.9.57 Real Two-Phone Party Voice Rejoin and Games/Gifts TEST
on:
  push:
    branches: [work/king-voice-rejoin-v9957]
    paths: ['tools/voice-rejoin-v9957/**','.github/workflows/king-voice-rejoin-v9957.yml']
  pull_request:
    paths: ['tools/voice-rejoin-v9957/**','.github/workflows/king-voice-rejoin-v9957.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  compile-and-verify-real-party:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env: {GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=1024m'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore successful full signed v9.9.56 real Party source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9957prev /tmp/king9957
          gh run download 38360058953 -n KING-v9956-Real-Party-Mic-Consent-TEST-APK-and-Source -D /tmp/king9957prev
          test -s /tmp/king9957prev/KING-Plus-v9.9.56-Real-Party-Mic-TEST.apk
          unzip -q /tmp/king9957prev/KING-Plus-v9.9.56-Real-Party-Mic-Source.zip -d /tmp/king9957
          grep -q 'versionCode 235' /tmp/king9957/app/build.gradle
          test -s app/kingplus-ci-debug.keystore
          cp app/kingplus-ci-debug.keystore /tmp/king9957/app/kingplus-ci-debug.keystore
      - name: Add real Jitsi Party Voice reconnect only for verified opted-in member
        run: |
          set -euo pipefail
          python3 tools/voice-rejoin-v9957/apply.py /tmp/king9957
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/king9957')
          src=root/'app/src/main/java/com/kingplus/social'
          game=(src/'RoomGameActivity.java').read_text()
          s=(src/'PartyActivity.java').read_text()
          assert 'verifyAndRejoinVoice9957();' in s
          assert 'voiceReconnectPending9957=true;' in s
          assert 'roomRef9957.get(com.google.firebase.firestore.Source.SERVER)' in s
          assert '.get(com.google.firebase.firestore.Source.SERVER)' in s[s.index('    private void verifyAndRejoinVoice9957()'):s.index('    @Override public void onCreate(')]
          assert 'expectedUid9957.equals(member9957.getString("uid"))' in s
          assert 'stopInRoomVoice940(true);' in s[s.index('    private void verifyAndRejoinVoice9957()'):s.index('    @Override public void onCreate(')]
          assert 'setInlineAudioMuted940(!canTransmitMic9956());' in s
          assert 'localMicConsent9956=true;' in s
          assert 'if(onV530){toast("Only member may enable own Mic");return;}' in s
          assert 'KingGiftReceiptRetry9955' in s
          assert 'KingRoomSettleRetry9954' in game
          rules=(root/'firestore.rules').read_text()
          assert "request.resource.data.get('micOn',false) == false" in rules
          assert "request.resource.data.get('micOn',false) != true" in rules
          assert 'LIVE_RECHARGE = false' in (src/'KingRecharge974Activity.java').read_text()
          assert 'PAID_VIP_ACTIVE = false' in (src/'KingPremiumAccess981.java').read_text()
          assert 'versionCode 236' in (root/'app/build.gradle').read_text()
          print('PASS Voice network reconnect gated by opted-in, SERVER member, same Party; Games/Gifts unchanged')
          PY
      - name: Unit-test opted-in real Voice reconnect and stale room/account protection
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9957classes
          javac -d /tmp/king9957classes \
            /tmp/king9957/app/src/main/java/com/kingplus/social/KingPartyVoiceReconnect9957.java \
            tools/voice-rejoin-v9957/KingPartyVoiceReconnect9957Test.java
          java -cp /tmp/king9957classes com.kingplus.social.KingPartyVoiceReconnect9957Test
      - name: Install Firestore emulator test dependencies
        working-directory: /tmp/king9957/tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Keep four-account real Party Mic owner consent security intact
        working-directory: /tmp/king9957
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/mic-consent-v9956/mic-consent-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-mic-consent-9957 --config firebase-emulator.json \
            "node tests/firestore/mic-consent-firestore.test.mjs"
      - name: Verify ghost Ready excluded and real-player RPS still playable
        working-directory: /tmp/king9957
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tools/real-game-roster-v9952/live-roster-firestore.test.mjs" tests/firestore/
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-live-roster-9957 --config firebase-emulator.json \
            "node tests/firestore/live-roster-firestore.test.mjs"
      - name: Confirm real multiplayer Party/Host Cancel unchanged
        working-directory: /tmp/king9957
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-frozen-roster-9946 --config firebase-emulator.json \
            "node tests/firestore/frozen-ready-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-immutable-games-9943 --config firebase-emulator.json \
            "node tests/firestore/immutable-rounds-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-real-cancel-9947 --config firebase-emulator.json \
            "node tests/firestore/cancel-round-firestore.test.mjs"
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-9938-live --config firebase-emulator.json \
            "node tests/firestore/room-game-gift.test.mjs"
      - name: Test recipient-only Gift receipt persistence and anti-impersonation
        working-directory: /tmp/king9957
        env: {CI: 'true'}
        run: |
          set -euo pipefail
          tests/firestore/node_modules/.bin/firebase emulators:exec --only firestore \
            --project demo-king-gift-receipts-9941 --config firebase-emulator.json \
            "node tests/firestore/gift-delivery-firestore.test.mjs"
      - name: Compile full Android app
        working-directory: /tmp/king9957
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify signed upgrade identity and exact version
        run: |
          set -euo pipefail
          old=/tmp/king9957prev/KING-Plus-v9.9.56-Real-Party-Mic-TEST.apk
          new=/tmp/king9957/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$old" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='235'"
          "$aapt" dump badging "$new" | grep "^package:" | grep "name='com.kingplus.social'" | grep "versionCode='236'"
          "$signer" verify --print-certs "$old" >/tmp/oldcert
          "$signer" verify --print-certs "$new" >/tmp/newcert
          a="$(grep -Eo '[[:xdigit:]]{64}' /tmp/oldcert | head -1)"
          b="$(grep -Eo '[[:xdigit:]]{64}' /tmp/newcert | head -1)"
          test -n "$a" && test "$a" = "$b"
      - name: Package signed TEST APK and complete Android source
        run: |
          set -euo pipefail
          mkdir -p /tmp/king9957out
          cp /tmp/king9957/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/king9957out/KING-Plus-v9.9.57-Party-Voice-Rejoin-TEST.apk
          rm -f /tmp/king9957/app/kingplus-ci-debug.keystore
          cd /tmp/king9957
          zip -q -r /tmp/king9957out/KING-Plus-v9.9.57-Party-Voice-Rejoin-Source.zip . \
            -x '*/node_modules/*' '*node_modules/*' 'app/build/*' './app/build/*' '*/build/*' \
            './.gradle/*' '*/.gradle/*' '*.apk' '*.aab' '*.keystore' '*.jks' '*.zip' '*local.properties' '*.log'
          sha256sum /tmp/king9957out/*
      - uses: actions/upload-artifact@v4
        with:
          name: KING-v9957-Real-Voice-Rejoin-TEST-APK-and-Source
          path: /tmp/king9957out/*
          retention-days: 14
          if-no-files-found: error
