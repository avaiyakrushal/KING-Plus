name: Inspect KING Plus v5.2 Party Source

on:
  workflow_dispatch:
  push:
    branches: [ real-social-v390-build ]
    paths: [ '.github/workflows/inspect-v520.yml' ]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare v5.2 transformed source
        run: bash tools/build_v520.sh
      - name: Collect transformed Party source
        run: |
          mkdir -p inspect_v520
          cp app/src/main/java/com/kingplus/social/PartyActivity.java inspect_v520/PartyActivity-v520.java
          cp firestore.rules inspect_v520/firestore-v520.rules
          grep -nE "Create|createRoomDialog|addMemberStrip|seatAction|attachCloudRoom|toggleMic|addQuick|composer.addView|Gift|Emoji|Home|Party" app/src/main/java/com/kingplus/social/PartyActivity.java > inspect_v520/anchors.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Plus-v5.2-party-source-inspect
          path: inspect_v520/*
          if-no-files-found: error
