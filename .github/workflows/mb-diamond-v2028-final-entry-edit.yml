name: Build MB Diamond Diary v2.0.28 Final Entry Edit

on:
  push:
    branches:
      - mb-diamond-diary-v2.0.8-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download v2.0.27 source baseline
        uses: actions/download-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.27-source
          path: /tmp/mbdd/source-artifact
          repository: avaiyakrushal/KING-Plus
          run-id: 36677276941
          github-token: ${{ github.token }}

      - name: Apply v2.0.28 final entry edit patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mbdd/project
          unzip -q /tmp/mbdd/source-artifact/MB-Diamond-Diary-v2.0.27-source.zip -d /tmp/mbdd/project
          cat .ci/mbdd-v2028/part00.txt .ci/mbdd-v2028/part01.txt .ci/mbdd-v2028/part02.txt .ci/mbdd-v2028/part03.txt | base64 -d | gzip -d > /tmp/mbdd/v2028.patch
          patch -d /tmp/mbdd/project -p2 < /tmp/mbdd/v2028.patch
          node --check /tmp/mbdd/project/app/src/main/assets/app.js
          grep -q 'id="diamondEditStrip"' /tmp/mbdd/project/app/src/main/assets/app.html
          grep -q 'id="hourEditStrip"' /tmp/mbdd/project/app/src/main/assets/app.html
          grep -q 'data-department="ચોકી"' /tmp/mbdd/project/app/src/main/assets/app.html
          grep -q 'data-department="પાન મારકીસ"' /tmp/mbdd/project/app/src/main/assets/app.html
          grep -q 'data-department="ફોરપી"' /tmp/mbdd/project/app/src/main/assets/app.html
          grep -q 'data-department="સરીન"' /tmp/mbdd/project/app/src/main/assets/app.html
          grep -q 'id="hourWithdrawal"' /tmp/mbdd/project/app/src/main/assets/app.html
          grep -q 'જૂની એન્ટ્રી — એડિટ કરો' /tmp/mbdd/project/app/src/main/assets/app.js
          grep -q 'આ તારીખની કલાક એન્ટ્રી પહેલેથી છે' /tmp/mbdd/project/app/src/main/assets/app.js
          grep -q 'આ તારીખ અને ડિપાર્ટમેન્ટની એન્ટ્રી પહેલેથી છે' /tmp/mbdd/project/app/src/main/assets/app.js
          ! grep -q 'data-screen="hoursList" style=' /tmp/mbdd/project/app/src/main/assets/app.html
          ! grep -q 'data-screen="diamondList" style=' /tmp/mbdd/project/app/src/main/assets/app.html

      - name: Stable signing and version
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/mbdd-signing/debug.keystore.b64 > /tmp/mbdd/project/mbdd-debug.keystore
          python3 - <<'PY2'
          from pathlib import Path
          import re
          p=Path('/tmp/mbdd/project/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+','versionCode 47',s)
          s=re.sub(r"versionName\s+'[^']+'","versionName '2.0.28'",s)
          p.write_text(s)
          PY2

      - name: Build APK
        working-directory: /tmp/mbdd/project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify signing and stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/mbdd/project/app/build/outputs/apk/debug/app-debug.apk
          SHA1=$(keytool -printcert -jarfile "$APK" | awk '/SHA1:/{print $2; exit}')
          echo "APK SHA1: $SHA1"
          test "$SHA1" = "1C:69:20:02:92:FB:2F:5A:C7:B5:DE:22:2D:03:B1:6D:F1:3E:C8:2E"
          cp "$APK" MB-Diamond-Diary-v2.0.28-debug.apk
          cd /tmp/mbdd/project
          zip -qr "$GITHUB_WORKSPACE/MB-Diamond-Diary-v2.0.28-source.zip" . -x '*/build/*' '.gradle/*' 'mbdd-debug.keystore'

      - uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.28-APK
          path: MB-Diamond-Diary-v2.0.28-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.28-source
          path: MB-Diamond-Diary-v2.0.28-source.zip
          if-no-files-found: error
